<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13213c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agenda Dr. Revelo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162238;background:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:#f4f6f9}button,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:#13213c;color:white;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px #0002}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:12px;background:white;color:#13213c;display:grid;place-items:center;font-weight:900;font-size:17px}.brand b{display:block;font-size:16px}.brand small{display:block;opacity:.76;margin-top:2px}.icon{border:1px solid #ffffff38;background:#ffffff12;color:#fff;border-radius:12px;width:42px;height:42px;font-size:21px}.wrap{max-width:1120px;margin:auto;padding:16px}.hero{display:grid;grid-template-columns:46px 1fr 46px;gap:9px;align-items:center;margin:6px 0 13px}.nav{height:44px;border:0;border-radius:13px;background:#fff;box-shadow:0 3px 12px #1d315815;font-size:26px;color:#1f3359}.nav:disabled{opacity:.2}.center{text-align:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:#738098}.center h1{font-size:22px;margin:3px 0}.sync{font-size:12px;color:#6d788c}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bdc4ce;margin-right:5px}.dot.on{background:#29a465}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.summary article{background:#fff;border-radius:14px;padding:11px;text-align:center;box-shadow:0 2px 10px #1d31580b}.summary span{display:block;font-size:11px;color:#738098}.summary strong{font-size:22px}.scroll{overflow-x:auto;border-radius:15px;box-shadow:0 3px 16px #1d315812;background:#fff}.grid{min-width:720px;display:grid;grid-template-columns:74px repeat(3,1fr)}.corner,.day{background:#eef2f7;border-bottom:1px solid #dfe5ed;min-height:58px}.day{padding:10px;text-align:center}.day b{font-size:12px;display:block}.day span{font-size:11px;color:#758196}.time{min-height:52px;padding:7px 6px;text-align:center;border-right:1px solid #e6eaf0;border-bottom:1px solid #edf0f4;background:#fafbfd;display:flex;flex-direction:column;justify-content:center}.time b{font-size:13px}.time small{font-size:9px;color:#8791a2}.slot{min-height:52px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;padding:4px}.free{display:flex;align-items:center;justify-content:center;cursor:pointer;color:#66809d;background:#fbfdff}.free:hover{background:#f1f7fd}.free div{text-align:center}.free b{display:block;font-size:11px}.free span{font-size:10px}.appt{width:100%;height:100%;border:0;border-radius:9px;padding:7px;text-align:left;background:#fff3d8;color:#24324a;cursor:pointer}.appt.confirmed{background:#def5e7}.appt.rescheduled{background:#e5eefc}.appt .name{display:block;font-weight:800;font-size:12px;line-height:1.2}.appt .st{display:block;font-size:9px;margin-top:4px;opacity:.7}.lunch-time{background:#f2f4f7}.lunch{grid-column:span 3;display:flex;align-items:center;justify-content:center;background:#f2f4f7;border-bottom:1px solid #e6eaf0;font-size:11px;font-weight:800;color:#7b8493;letter-spacing:.08em}.hint{text-align:center;color:#788397;font-size:12px;margin:13px 0 4px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#17253e;color:#fff;border-radius:12px;padding:10px 14px;z-index:50;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.back{position:fixed;inset:0;background:#09122288;display:grid;place-items:end center;z-index:40}.back.hidden{display:none}.modal{background:#fff;width:min(520px,100%);border-radius:20px 20px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0003}.modal h2{margin:3px 0 13px}.kicker{font-size:11px;color:#7d8797;font-weight:800;letter-spacing:.12em}.card{background:#f5f7fa;border-radius:13px;padding:12px;margin:11px 0}.card div{margin:5px 0}.card span{font-size:11px;color:#7c8798;display:block}.card strong{font-size:14px}.field{width:100%;border:1px solid #d8dee8;border-radius:11px;padding:12px;margin:5px 0 11px;outline:none}.actions{display:flex;gap:9px;margin-top:13px}.btn{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800}.primary{background:#1f4e83;color:#fff}.secondary{background:#edf1f6;color:#33425b}.danger{background:#fee5e5;color:#a02a2a}.readonly{background:#f0f3f7;border-radius:10px;padding:11px;color:#69768b;font-size:12px;margin-top:12px}@media(max-width:600px){.wrap{padding:12px 8px}.summary{gap:5px}.summary article{padding:9px 4px}.summary strong{font-size:19px}.center h1{font-size:19px}.grid{min-width:650px}.brand b{font-size:14px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">AR</div><div><b>Agenda Dr. Revelo</b><small id="mode">Verificando acceso…</small></div></div><button class="icon" id="refresh" aria-label="Actualizar">↻</button></header>
<main class="wrap">
<section class="hero"><button class="nav" id="prev">‹</button><div class="center"><div class="eyebrow">AGENDA SEMANAL · CLOUD</div><h1 id="week">Cargando…</h1><div class="sync"><i id="dot" class="dot"></i><span id="sync">Conectando con Neon…</span></div></div><button class="nav" id="next">›</button></section>
<section class="summary"><article><span>Citas</span><strong id="s1">0</strong></article><article><span>Confirmadas</span><strong id="s2">0</strong></article><article><span>Pendientes</span><strong id="s3">0</strong></article><article><span>Libres</span><strong id="s4">0</strong></article></section>
<div class="scroll"><div id="grid" class="grid"></div></div><p id="hint" class="hint">Preparando agenda…</p>
</main>
<div id="toast" class="toast"></div><div id="back" class="back hidden"><section id="modal" class="modal"></section></div>
<script>
(()=>{'use strict';
const AUTH='https://ep-shiny-scene-a66ta52d.neonauth.us-west-2.aws.neon.tech/neondb/auth',API='https://ep-shiny-scene-a66ta52d.apirest.us-west-2.aws.neon.tech/neondb/rest/v1';
const $=s=>document.querySelector(s),state={key:'',role:'',mon:null,rows:[],move:null,jwt:'',exp:0};
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d,12)},add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},monOf=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(12,0,0,0);return x},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getKey(){const h=new URLSearchParams(location.hash.replace(/^#/,''));state.key=h.get('token')||localStorage.getItem('revelo_agenda_cloud_key')||'';if(state.key)localStorage.setItem('revelo_agenda_cloud_key',state.key);if(state.key)history.replaceState({},'',`${location.pathname}${location.search}#token=${encodeURIComponent(state.key)}`)}
function jwtExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch{return 0}}
async function anon(force=false){if(!force&&state.jwt&&Date.now()+60000<state.exp)return state.jwt;const r=await fetch(`${AUTH}/token/anonymous`,{cache:'no-store'});if(!r.ok)throw Error('No se pudo iniciar el acceso seguro');const d=await r.json();state.jwt=d.token||'';state.exp=jwtExp(state.jwt)||Date.now()+600000;if(!state.jwt)throw Error('Neon no entregó acceso temporal');return state.jwt}
async function rpc(name,body,retry=true){const jwt=await anon();const r=await fetch(`${API}/rpc/${name}`,{method:'POST',headers:{Authorization:`Bearer ${jwt}`,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});if(r.status===401&&retry){state.jwt='';return rpc(name,body,false)}if(!r.ok){let m=`Error ${r.status}`;try{const d=await r.json();m=d.message||d.details||m}catch{}throw Error(m)}const t=await r.text();return t?JSON.parse(t):null}
function scalar(v){if(Array.isArray(v))v=v[0];if(v&&typeof v==='object'){const a=Object.values(v);return a.length===1?a[0]:v}return v}
function times(){const a=[];for(let m=480;m<=1020;m+=20){if(m<840&&m+20>750)continue;a.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`)}return a}const SLOTS=times();
function tp(s){const [h,m]=s.split(':').map(Number);return {t:`${h%12||12}:${pad(m)}`,p:h>=12?'PM':'AM'}}function fmt(d){return new Intl.DateTimeFormat('es-EC',{day:'numeric',month:'short'}).format(d).replace('.','')}function fmtLong(d){return new Intl.DateTimeFormat('es-EC',{weekday:'long',day:'numeric',month:'long'}).format(d)}function labelStatus(s){s=String(s||'PENDIENTE').toUpperCase();if(s.includes('CONFIRM'))return ['Confirmada','confirmed'];if(s==='REAGENDADA')return ['Reagendada','rescheduled'];return ['Pendiente','pending']}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}function online(t,on){$('#sync').textContent=t;$('#dot').classList.toggle('on',on)}
async function boot(){getKey();if(!state.key)return fatal('Este enlace no tiene una llave válida.');try{state.role=String(scalar(await rpc('agenda_web_role',{p_token:state.key}))||'');if(!state.role)return fatal('Este enlace ya no es válido.');$('#mode').textContent=state.role==='doctor'?'Doctor · solo lectura':'Ayudante · agenda editable';$('#hint').textContent=state.role==='doctor'?'Solo lectura · toca una cita para ver el detalle.':'Toca un horario disponible para agendar.';state.mon=monOf(new Date());await load()}catch(e){fatal(e.message)}}
function fatal(m){online('Acceso no disponible',false);$('#grid').innerHTML=`<div style="grid-column:1/-1;padding:35px;text-align:center"><b>No se pudo abrir la agenda</b><br><small>${esc(m)}</small></div>`}
async function load(){try{const from=iso(add(state.mon,3)),to=iso(add(state.mon,5));state.rows=await rpc('agenda_web_week',{p_token:state.key,p_from:from,p_to:to})||[];localStorage.setItem(`revelo_cloud_${iso(state.mon)}`,JSON.stringify(state.rows));render();online(`Actualizada ${new Intl.DateTimeFormat('es-EC',{hour:'numeric',minute:'2-digit'}).format(new Date())}`,true)}catch(e){const c=localStorage.getItem(`revelo_cloud_${iso(state.mon)}`);if(c){state.rows=JSON.parse(c);render();online('Sin conexión · mostrando copia guardada',false)}else fatal(e.message)}}
function render(){const days=[add(state.mon,3),add(state.mon,4),add(state.mon,5)],dates=days.map(iso),maps=dates.map(d=>new Map(state.rows.filter(r=>String(r.fecha).slice(0,10)===d).map(r=>[String(r.hora).slice(0,5),r])));$('#week').textContent=`${fmt(days[0])} – ${new Intl.DateTimeFormat('es-EC',{day:'numeric',month:'short',year:'numeric'}).format(days[2]).replace('.','')}`;$('#prev').disabled=iso(state.mon)===iso(monOf(new Date()));let h='<div class="corner"></div>';['JUEVES','VIERNES','SÁBADO'].forEach((n,i)=>h+=`<div class="day"><b>${n}</b><span>${fmt(days[i])}</span></div>`);let lunch=false;for(const time of SLOTS){if(!lunch&&time==='14:00'){h+='<div class="time lunch-time"><b>12:30</b><small>PM</small></div><div class="lunch">ALMUERZO · 12:30 PM – 2:00 PM</div>';lunch=true}const z=tp(time);h+=`<div class="time"><b>${z.t}</b><small>${z.p}</small></div>`;dates.forEach((d,i)=>{const r=maps[i].get(time);h+=r?appt(r):free(d,time)})}$('#grid').innerHTML=h;document.querySelectorAll('[data-free]').forEach(e=>e.onclick=()=>freeClick(e.dataset.date,e.dataset.time));document.querySelectorAll('[data-row]').forEach(e=>e.onclick=()=>detail(Number(e.dataset.row)));const total=3*SLOTS.length;$('#s1').textContent=state.rows.length;$('#s2').textContent=state.rows.filter(r=>labelStatus(r.estado)[1]==='confirmed').length;$('#s3').textContent=state.rows.filter(r=>['pending','rescheduled'].includes(labelStatus(r.estado)[1])).length;$('#s4').textContent=Math.max(0,total-state.rows.length)}
function free(d,t){const z=tp(t);return `<div class="slot free" data-free data-date="${d}" data-time="${t}"><div><b>${z.t} ${z.p}</b><span>Disponible</span></div></div>`}function appt(r){const [lab,cl]=labelStatus(r.estado),i=state.rows.indexOf(r);return `<div class="slot"><button class="appt ${cl}" data-row="${i}"><span class="name">${esc(r.patient_name)}</span><span class="st">${lab}</span></button></div>`}
function open(html){$('#modal').innerHTML=html;$('#back').classList.remove('hidden')}function close(){$('#back').classList.add('hidden')}$('#back').onclick=e=>{if(e.target===$('#back'))close()};
function freeClick(d,t){if(state.role!=='reception')return;if(state.move)return moveTo(d,t);const z=tp(t);open(`<div class="kicker">NUEVA CITA</div><h2>Agendar paciente</h2><div class="card"><b>${esc(fmtLong(parse(d)))}</b><div>${z.t} ${z.p}</div></div><label>Apellidos y nombres<input id="name" class="field" autocomplete="name"></label><label>Número de celular<input id="phone" class="field" inputmode="tel" autocomplete="tel"></label><div class="actions"><button class="btn secondary" id="no">Cancelar</button><button class="btn primary" id="yes">Guardar cita</button></div>`);$('#no').onclick=close;$('#yes').onclick=()=>create(d,t)}
async function create(d,t){const b=$('#yes');b.disabled=true;b.textContent='Guardando…';try{await rpc('agenda_web_create',{p_token:state.key,p_nombre:$('#name').value,p_celular:$('#phone').value,p_fecha:d,p_hora:t});close();toast('Cita guardada');await load()}catch(e){toast(e.message);b.disabled=false;b.textContent='Guardar cita'}}
function detail(i){const r=state.rows[i],d=String(r.fecha).slice(0,10),t=String(r.hora).slice(0,5),z=tp(t),legacy=r.source_type==='LEGACY_UNLINKED',read=state.role==='doctor'||legacy,kind=r.staged_id!=null?'staged':'linked',id=r.staged_id??r.appointment_id;open(`<div class="kicker">DETALLE DE CITA</div><h2>${esc(r.patient_name)}</h2><div class="card"><div><span>Fecha</span><strong>${esc(fmtLong(parse(d)))}</strong></div><div><span>Hora</span><strong>${z.t} ${z.p}</strong></div><div><span>Estado</span><strong>${labelStatus(r.estado)[0]}</strong></div></div>${read?`<div class="readonly">${legacy?'Cita importada · se modifica desde Recepción.':'Doctor · solo lectura.'}</div>`:`<div class="actions"><button class="btn danger" id="del">Cancelar cita</button><button class="btn primary" id="mov">Reagendar</button></div>`}<div class="actions"><button class="btn secondary" id="close">Cerrar</button></div>`);$('#close').onclick=close;if(!read){$('#del').onclick=()=>cancel(kind,id);$('#mov').onclick=()=>{state.move={kind,id,name:r.patient_name};close();toast('Toca el nuevo horario disponible')}}}
async function cancel(kind,id){if(!confirm('¿Cancelar esta cita y liberar el horario?'))return;try{await rpc('agenda_web_cancel',{p_token:state.key,p_source_type:kind,p_source_id:id});close();toast('Horario liberado');await load()}catch(e){toast(e.message)}}async function moveTo(d,t){const x=state.move,z=tp(t);if(!confirm(`¿Reagendar ${x.name} a ${fmtLong(parse(d))} · ${z.t} ${z.p}?`))return;try{await rpc('agenda_web_move',{p_token:state.key,p_source_type:x.kind,p_source_id:x.id,p_fecha:d,p_hora:t});state.move=null;toast('Cita reagendada');await load()}catch(e){toast(e.message)}}
$('#prev').onclick=()=>{const p=add(state.mon,-7),min=monOf(new Date());state.mon=p<min?min:p;state.move=null;load()};$('#next').onclick=()=>{state.mon=add(state.mon,7);state.move=null;load()};$('#refresh').onclick=load;boot();
})();
</script>
</body></html>
