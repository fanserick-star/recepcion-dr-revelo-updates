<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantalla de Turnos</title><style>
:root{--navy:#173a52;--blue:#2b83b5;--line:#d7e4ec;--green:#2d9b68}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#edf3f7;color:#173a52}.screen{position:absolute;inset:0;padding:4vh 5vw;background:radial-gradient(circle at 14% 18%,rgba(52,151,205,.08),transparent 26%),linear-gradient(180deg,#fbfdfe 0%,#edf3f7 100%)}.head{position:absolute;left:5vw;right:5vw;top:3.4vh;height:13vh}.brand{position:absolute;left:0;top:0;display:flex;align-items:center;gap:1.1vw}.brandimg{height:8vh;max-width:24vw;object-fit:contain}.brandtext{display:flex;flex-direction:column;justify-content:center;border-left:.45vw solid var(--blue);padding-left:1vw;min-height:8vh}.name{font-size:2.5vw;font-weight:900;color:#173a52;line-height:1.05}.role{font-size:1.28vw;font-weight:800;margin-top:.55vh;color:#597386;letter-spacing:.08em}.clock{position:absolute;right:0;top:.15vh;text-align:right;min-width:24vw}.time{font-size:3.9vw;font-weight:900;color:#173a52;line-height:1}.date{font-size:1.55vw;font-weight:800;margin-top:.85vh;color:#5f7585;line-height:1.2}.center{position:absolute;left:6vw;right:6vw;top:18.5vh;bottom:16vh;background:#fff;border:1px solid var(--line);border-radius:2vw;box-shadow:0 1vw 3vw rgba(26,54,74,.09);text-align:center;overflow:hidden}.center:before{content:"";position:absolute;left:0;top:0;right:0;height:.75vh;background:linear-gradient(90deg,#2b83b5,#62b7d6,#2b83b5);z-index:5}.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;opacity:.055;width:34vw;height:34vw;display:flex;align-items:center;justify-content:center}.watermark img{max-width:100%;max-height:100%;object-fit:contain}.stage{position:absolute;inset:0;padding:5vh 4vw;z-index:2}.eyebrow{font-size:2.3vw;font-weight:900;letter-spacing:.16em;color:var(--blue);margin-top:1vh}.turn{font-size:25.5vw;font-weight:900;line-height:.78;margin-top:2vh;color:#173a52;letter-spacing:-.05em}.msg{font-size:3.6vw;font-weight:900;margin-top:3vh;color:#223a4a}.hint{font-size:1.45vw;font-weight:700;margin-top:1vh;color:#667d8d}.idle{font-size:4.95vw;font-weight:900;line-height:1.08;margin-top:11vh;color:#173a52}.idle2{font-size:1.95vw;font-weight:700;margin-top:2.4vh;color:#697f8e}.current-clean{font-size:4.4vw;font-weight:900;color:#173a52;margin-top:7vh}.current-clean-num{font-size:18vw;font-weight:900;line-height:.92;margin-top:1vh}.video-stage{position:absolute;inset:.75vh 0 0 0;background:#0e161c;z-index:3;display:none}.video-stage video{width:100%;height:100%;object-fit:contain;background:#0e161c}.current-badge{position:absolute;left:1.5vw;bottom:1.5vh;z-index:5;display:flex;align-items:center;gap:1vw;background:rgba(255,255,255,.94);border:2px solid #b9d1df;border-radius:1vw;padding:.7vh 1.2vw;box-shadow:0 .5vw 1.4vw rgba(0,0,0,.18)}.current-badge span{font-size:1.1vw;font-weight:900;letter-spacing:.08em;color:#617b8d;line-height:1.05}.current-badge b{font-size:4.2vw;line-height:.92;color:#173a52}.foot{position:absolute;left:5vw;right:5vw;bottom:4vh;font-size:1.15vw;font-weight:700;color:#5d7585}.privacy{float:right}.fullbtn{position:fixed;right:1.7vw;bottom:1.5vh;z-index:20;border:1px solid #bfd3df;background:rgba(255,255,255,.92);color:#24465d;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.08)}.fullbtn.hide{display:none}.reconnect{display:none;position:absolute;z-index:40;inset:0;background:#f7fafc;text-align:center}.reconnect .box{margin:28vh auto 0;max-width:800px;padding:20px;color:#173a52}.reconnect h2{font-size:4.5vw;margin:0 0 1.5vh}.reconnect p{font-size:1.8vw;color:#6b8190;font-weight:700}.spinner{width:4vw;height:4vw;border:.45vw solid #d8e5ed;border-top-color:#2b83b5;border-radius:50%;margin:0 auto 3vh;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.callflash{animation:softFlash 1s ease-in-out 3}@keyframes softFlash{0%,100%{box-shadow:0 1vw 3vw rgba(26,54,74,.09)}50%{box-shadow:0 0 0 .55vw rgba(43,131,181,.14),0 1vw 3vw rgba(26,54,74,.09)}}.testmark{position:fixed;left:1vw;top:1vh;z-index:60;background:#8a5c00;color:#fff;border-radius:.65vw;padding:.7vh .9vw;font-size:1vw;font-weight:900;letter-spacing:.06em}
</style></head><body>
<div class="testmark" id="testMark" style="display:none">MODO PRUEBAS · NO AFECTA PACIENTES</div><div class="screen"><div class="head"><div class="brand"><img class="brandimg" src="/assets/logo-full.png" alt="Logo"><div class="brandtext"><div class="name">CONSULTORIO DR. ARMANDO REVELO</div><div class="role">CIRUJANO URÓLOGO</div></div></div><div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date">--</div></div></div>
<div class="center" id="center"><div class="watermark"><img src="/assets/logo-icon.png" alt=""></div><div class="stage" id="stage"></div><div class="video-stage" id="videoStage"><video id="infoVideo" playsinline preload="metadata"></video><div class="current-badge"><span>TURNO<br>ACTUAL</span><b id="videoTurn">--</b></div></div></div><div class="foot"><div class="privacy">Pantalla de turnos · Sin datos personales</div></div></div>
<button class="fullbtn" id="fullbtn" onclick="goFullscreen()">⛶ PANTALLA COMPLETA</button><div class="reconnect" id="reconnect"><div class="box"><div class="spinner"></div><h2 id="reconnectTitle">Reconectando…</h2><p id="reconnectText">La pantalla volverá automáticamente cuando se recupere la conexión.</p></div></div><audio id="ding" preload="auto" src="/ding.wav"></audio>
<script>
const TEST_MODE=location.pathname.toUpperCase().includes("PRUEBAS");const MODE=TEST_MODE?"test":"live",ENDPOINT=TEST_MODE?"/api/test-state":"/api/live-state";let lastEvent=0,lastSuccess=Date.now(),state=null,videoCfg={enabled:false,volume:.2,items:[]},videoIndex=0,idleIndex=0,idleAt=0,audioUnlocked=false;const idleScreens=[["En este momento no hay turnos por anunciar","La pantalla se actualizará automáticamente."],["Bienvenido al consultorio","Permanezca atento cuando corresponda su turno."],["Gracias por su visita","La pantalla mostrará el próximo llamado automáticamente."]];
function e(i){return document.getElementById(i)}function xhr(url,cb,fail){const x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=4200;x.onreadystatechange=()=>{if(x.readyState===4){if(x.status>=200&&x.status<300){try{cb(JSON.parse(x.responseText))}catch(_){fail&&fail()}}else fail&&fail()}};x.onerror=x.ontimeout=()=>fail&&fail();x.send()}
function tick(){const n=new Date(),ds=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],ms=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];e('time').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');e('date').textContent=ds[n.getDay()]+', '+String(n.getDate()).padStart(2,'0')+' de '+ms[n.getMonth()]+' de '+n.getFullYear()}
function displayTurn(v){const n=parseInt(v||0,10);return n?String(n).padStart(2,'0'):'--'}function stopVideo(){const v=e('infoVideo');try{v.pause()}catch(_){}e('videoStage').style.display='none';e('stage').style.display='block'}function startVideo(turn){if(!videoCfg.enabled||!videoCfg.items.length)return false;if(videoIndex>=videoCfg.items.length)videoIndex=0;const item=videoCfg.items[videoIndex],v=e('infoVideo');e('videoTurn').textContent=displayTurn(turn);e('stage').style.display='none';e('videoStage').style.display='block';if(v.dataset.url!==item.url){v.dataset.url=item.url;v.src=item.url}v.volume=Math.max(0,Math.min(1,Number(videoCfg.volume||0)));v.muted=!audioUnlocked;const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{})});return true}e('infoVideo').onended=()=>{videoIndex=(videoIndex+1)%Math.max(1,videoCfg.items.length);if(state&&state.advertising)startVideo(state.turn)};
function idle(force){stopVideo();const now=Date.now();if(force||now-idleAt>12000){if(!force)idleIndex=(idleIndex+1)%idleScreens.length;idleAt=now}const x=idleScreens[idleIndex];e('stage').innerHTML='<div class="eyebrow">CONSULTORIO</div><div class="idle">'+x[0]+'</div><div class="idle2">'+x[1]+'</div>'}
function render(s){state=s;const d=displayTurn(s.turn),center=e('center');center.className='center';if(s.mode==='calling'&&s.turn){stopVideo();e('stage').innerHTML='<div class="eyebrow">LLAMANDO TURNO</div><div class="turn">'+d+'</div><div class="msg">Puede ingresar al consultorio</div><div class="hint">Por favor, acérquese cuando vea su turno.</div>';center.className='center callflash'}else if(s.mode==='attending'&&s.turn){const elapsed=(Date.now()/1000)-Number(s.attention_started_epoch||0);if(elapsed<5){stopVideo();e('stage').innerHTML='<div class="eyebrow" style="color:#2d9b68">EN ATENCIÓN</div><div class="turn">'+d+'</div><div class="msg">Consulta en curso</div><div class="hint">La pantalla informativa continuará cuando haya otro paciente esperando.</div>'}else if(s.advertising&&startVideo(s.turn)){}else{stopVideo();e('stage').innerHTML='<div class="eyebrow" style="color:#2d9b68">CONSULTA EN CURSO</div><div class="current-clean">TURNO ACTUAL</div><div class="current-clean-num">'+d+'</div><div class="hint">No hay publicidad porque no existe otro turno esperando.</div>'}}else idle(false)}
function ding(s){if(!s.sound)return;const a=e('ding');try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(_){}}function poll(){xhr(ENDPOINT+'?tv=1&t='+Date.now(),s=>{lastSuccess=Date.now();e('reconnect').style.display='none';render(s);if(s.event_id&&s.event_id!==lastEvent){if((s.mode==='calling'||s.sound_test)&&s.sound)ding(s);lastEvent=s.event_id}if(MODE==='live'&&!s.history_online&&Number(s.history_age_seconds||999)>15){e('reconnectTitle').textContent='Reconectando con Historia Clínica…';e('reconnectText').textContent='No se mostrará un turno antiguo mientras la PC del doctor esté desconectada.';stopVideo();e('reconnect').style.display='block'}},()=>{if(Date.now()-lastSuccess>15000){stopVideo();e('reconnectTitle').textContent='Reconectando con Recepción…';e('reconnect').style.display='block'}})}function loadVideos(){xhr('/api/videos?t='+Date.now(),v=>{videoCfg=v||videoCfg;if(state)render(state)})}
function goFullscreen(){const d=document.documentElement,fn=d.requestFullscreen||d.webkitRequestFullscreen||d.mozRequestFullScreen||d.msRequestFullscreen;if(fn)try{fn.call(d)}catch(_){}audioUnlocked=true;const v=e('infoVideo');v.muted=false}function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement)}function fbtn(){e('fullbtn').className=isFull()?'fullbtn hide':'fullbtn'}document.addEventListener('fullscreenchange',fbtn);document.addEventListener('webkitfullscreenchange',fbtn);document.body.addEventListener('click',()=>{audioUnlocked=true},{once:true});if(TEST_MODE)e('testMark').style.display='block';tick();idle(true);loadVideos();poll();setInterval(tick,1000);setInterval(poll,900);setInterval(loadVideos,7000);
</script></body></html>
