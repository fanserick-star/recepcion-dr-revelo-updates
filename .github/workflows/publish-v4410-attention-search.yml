name: Validar y publicar v4.4.10 buscador Nueva atención

on:
  push:
    branches: [main]
    paths:
      - 'build/v4410_attention_search/**'
      - '.github/workflows/publish-v4410-attention-search.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v4410-attention-search
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construir parche mínimo desde v4.4.9 estable
        shell: pwsh
        run: python build/v4410_attention_search/build_v4410.py

      - name: Validar sintaxis y alcance del cambio
        shell: pwsh
        run: |
          node --check updates/v4_4_10_attention_search/static/app.js
          @'
          import json, subprocess
          from pathlib import Path
          root=Path('.')
          old_js=subprocess.check_output(['git','show','HEAD:updates/v4_4_9_clean_444/static/app.js']).decode('utf-8-sig')
          new_js=(root/'updates/v4_4_10_attention_search/static/app.js').read_text(encoding='utf-8-sig')
          old_index=subprocess.check_output(['git','show','HEAD:updates/v4_4_9_clean_444/static/index.html']).decode('utf-8-sig')
          new_index=(root/'updates/v4_4_10_attention_search/static/index.html').read_text(encoding='utf-8-sig')
          assert 'function attentionSearch(' not in old_js
          assert new_js.count('function attentionSearch(')==1
          assert "'/api/patients?q='+encodeURIComponent(q)+'&limit=18'" in new_js
          assert "const q=String(input.value||'').trim().toUpperCase()" in new_js
          fragment=new_js[new_js.index('function attentionSearch('):new_js.index('function attentionSearch(')+5000]
          assert 'digitsOnlyInput' not in fragment
          assert "replace(/[^0-9]/g" not in fragment
          assert new_index.replace('/static/app.js?v=4.4.10','/static/app.js?v=4.4.9',1)==old_index
          manifest=json.loads((root/'updates/v4_4_10_attention_search/update_manifest.json').read_text(encoding='utf-8'))
          assert manifest['copy']==['static/app.js','static/index.html','update_manifest.json']
          assert manifest['app_version']=='4.4.9' and manifest['runtime_version']=='4.4.9'
          print('SCOPE_AND_SYNTAX_OK')
          '@ | python -

      - name: Confirmar que el backend 4.4.9 ya soporta búsqueda general
        shell: pwsh
        run: |
          @'
          import subprocess
          text=subprocess.check_output(['git','show','HEAD:updates/v4_4_9_clean_444/app.py']).decode('utf-8-sig')
          start=text.index('def search_patients(')
          end=text.index('@app.get("/api/patients/similar")',start)
          body=text[start:end]
          for marker in ('Patient.nombre','Patient.cedula','Patient.celular','Patient.correo'):
              assert marker in body, marker
          print('BACKEND_GENERIC_PATIENT_SEARCH_OK')
          '@ | python -

      - name: Publicar payload sin mover todavía el canal
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/v4_4_10_attention_search
          git commit -m "release: payload v4.4.10 buscador Nueva atención"
          git push origin HEAD:main

      - name: Verificar payload real desde GitHub Raw
        shell: pwsh
        run: python tools/remote_payload_guard.py --manifest build/v4410_attention_search/candidate_latest.json

      - name: Mover canal a v4.4.10 solo después del guard remoto
        shell: pwsh
        run: |
          Copy-Item build/v4410_attention_search/candidate_latest.json latest-v3.json -Force
          git add latest-v3.json
          git commit -m "release: publicar v4.4.10 buscador Nueva atención"
          git push origin HEAD:main

      - name: Confirmar propagación y SHA del canal publicado
        shell: pwsh
        run: |
          @'
          import json,time,urllib.request
          url='https://raw.githubusercontent.com/fanserick-star/recepcion-dr-revelo-updates/main/latest-v3.json'
          last=''
          for i in range(18):
              try:
                  req=urllib.request.Request(url+f'?rp_ts={time.time_ns()}',headers={'Cache-Control':'no-cache','User-Agent':'RP-v4410-guard'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      data=json.loads(r.read().decode('utf-8-sig'))
                  if str(data.get('version'))=='4.4.10':
                      print('CHANNEL_4410_VISIBLE')
                      break
                  last=str(data.get('version'))
              except Exception as e:
                  last=repr(e)
              time.sleep(2)
          else:
              raise SystemExit('Canal no propagó 4.4.10; último='+last)
          '@ | python -
          python tools/remote_payload_guard.py --manifest latest-v3.json
