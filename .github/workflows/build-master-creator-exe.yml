name: Build master creator EXE

on:
  push:
    branches:
      - creator-exe-v1
      - creator-autodetect-reception
    paths:
      - "unified_installer/creator_exe.py"
      - ".github/workflows/build-master-creator-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyInstaller
        shell: powershell
        run: |
          py -3 -m pip install --disable-pip-version-check pyinstaller

      - name: Prepare portable Inno compiler
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $src = 'C:\Program Files (x86)\Inno Setup 6'
          if (-not (Test-Path (Join-Path $src 'ISCC.exe'))) { throw 'ISCC.exe not found after Chocolatey install' }
          Copy-Item $src 'unified_installer\inno_runtime' -Recurse -Force

      - name: Build one-file creator EXE
        shell: powershell
        run: |
          py -3 -m PyInstaller --onefile --console --uac-admin --add-data "unified_installer\inno_runtime;inno_runtime" --name CREAR_INSTALADOR_MAESTRO_DR_REVELO unified_installer\creator_exe.py
          $exe = "dist\CREAR_INSTALADOR_MAESTRO_DR_REVELO.exe"
          if (-not (Test-Path $exe)) { throw "Creator EXE was not produced" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "Creator EXE is unexpectedly small" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Test Reception auto-detection in built EXE
        shell: powershell
        run: |
          $r = Join-Path $env:RUNNER_TEMP 'Recepción Dr Revelo Prueba'
          New-Item -ItemType Directory -Force "$r\.venv\Scripts" | Out-Null
          'DATABASE_URL=postgresql://dummy' | Set-Content "$r\.env" -Encoding utf8
          'print("ok")' | Set-Content "$r\ABRIR_RECEPCION.py" -Encoding utf8
          'print("ok")' | Set-Content "$r\app.py" -Encoding utf8
          [IO.File]::WriteAllBytes("$r\.venv\Scripts\pythonw.exe",[byte[]](77,90,0,0))
          $env:DR_REVELO_RECEPTION_ROOT = $r
          $env:DR_REVELO_NONINTERACTIVE = '1'
          $out = & .\dist\CREAR_INSTALADOR_MAESTRO_DR_REVELO.exe --detect-only 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "Creator detect-only test failed" }
          if ($out -notmatch 'RECEPTION_DETECTION_OK') { throw "Reception auto-detection was not confirmed" }

      - name: Upload creator EXE
        uses: actions/upload-artifact@v4
        with:
          name: CREADOR_INSTALADOR_MAESTRO_DR_REVELO
          path: dist\CREAR_INSTALADOR_MAESTRO_DR_REVELO.exe
          retention-days: 7
          if-no-files-found: error
