name: Runtime Historia v1.3.8 Candidate

on:
  push:
    paths:
      - "historia-clinica/updates/v1_3_8_cloud_documents/**"
      - "historia-clinica/updates/v1_3_5_cloud_documents/**"
      - ".github/workflows/runtime-historia-v138.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble exact candidate
        shell: pwsh
        run: |
          $dst = "candidate-v138"
          New-Item -ItemType Directory -Force $dst | Out-Null
          New-Item -ItemType Directory -Force "$dst/static" | Out-Null
          $parts = @(
            "historia-clinica/updates/v1_3_8_cloud_documents/app.py.part01",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part02",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part03",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part04",
            "historia-clinica/updates/v1_3_5_launcher_v1_migration/app.py.part05",
            "historia-clinica/updates/v1_3_8_cloud_documents/app.py.part06"
          )
          [IO.File]::WriteAllText("$dst/app.py", (($parts | ForEach-Object { [IO.File]::ReadAllText($_) }) -join ""), [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText("$dst/cloud_sync.py", ([IO.File]::ReadAllText("historia-clinica/updates/v1_3_5_cloud_documents/cloud_sync.py.part01") + [IO.File]::ReadAllText("historia-clinica/updates/v1_3_5_cloud_documents/cloud_sync.py.part02")), [Text.UTF8Encoding]::new($false))
          Copy-Item "historia-clinica/updates/v1_3_5_cloud_documents/documentos_clinicos.py" "$dst/documentos_clinicos.py"
          Copy-Item "historia-clinica/updates/v1_3_2_new_patient_confirm/cloud_presence_patch.py" "$dst/cloud_presence_patch.py"
          Copy-Item "historia-clinica/updates/v1_3_2_new_patient_confirm/lan_bridge.py" "$dst/lan_bridge.py"
          Copy-Item "historia-clinica/updates/v1_1_10_full_webview/requirements.txt" "$dst/requirements.txt"
          Copy-Item "historia-clinica/updates/v1_3_1_new_patient_turn/style.css" "$dst/static/style.css"
          Copy-Item "historia-clinica/updates/v1_3_8_cloud_documents/historia-version.json" "$dst/historia-version.json"
          Copy-Item "historia-clinica/updates/v1_3_8_cloud_documents/update_manifest.json" "$dst/update_manifest.json"

      - name: Install runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r candidate-v138/requirements.txt

      - name: Import application
        shell: pwsh
        run: |
          $env:HISTORIA_DATABASE_URL = ""
          $env:DATABASE_URL = ""
          $env:HISTORIA_SYNC_ENABLED = "0"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          Set-Location candidate-v138
          python -c "import app; assert app.APP_VERSION=='1.3.8'; paths={getattr(r,'path','') for r in app.app.router.routes}; required={'/api/version','/api/v138/health','/recetas','/recetas/nueva','/certificados','/certificados/nuevo','/configuracion'}; assert not (required-paths), required-paths; print('OK runtime',app.APP_VERSION,len(paths))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sqlite3; c=sqlite3.connect('data/historia_clinica.db'); t={r[0] for r in c.execute('select name from sqlite_master where type=\'table\'')}; c.close(); req={'patients','encounters','prescriptions','certificates','clinic_settings','local_settings','sync_dirty','sync_state'}; assert not (req-t), req-t; print('OK schema',len(t))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Print SHA256
        shell: pwsh
        run: |
          Get-FileHash candidate-v138/app.py -Algorithm SHA256
          Get-FileHash candidate-v138/cloud_sync.py -Algorithm SHA256
          Get-FileHash candidate-v138/documentos_clinicos.py -Algorithm SHA256
          Get-FileHash candidate-v138/historia-version.json -Algorithm SHA256
          Get-FileHash candidate-v138/update_manifest.json -Algorithm SHA256
