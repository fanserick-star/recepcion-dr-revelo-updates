name: Gate de actualización de Recepción

on:
  push:
    branches: [main]
    paths:
      - 'release_candidate.json'
      - '.gitattributes'
      - 'tools/release_gate.py'
      - '.github/workflows/release-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

# Un solo proceso puede publicar el canal a la vez.
concurrency:
  group: recepcion-update-channel
  cancel-in-progress: false

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Preparar dependencias de prueba
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check `
            'fastapi==0.115.6' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'psycopg[binary]==3.2.3' `
            'python-dotenv==1.0.1' 'python-multipart==0.0.20'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron instalar dependencias del smoke test' }

      - name: Construir candidato y calcular hashes automáticamente
        run: python tools/release_gate.py prepare

      - name: Verificar bytes públicos y SHA reales de GitHub
        shell: powershell
        run: |
          @'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path('.release_gate/candidate_latest.json').read_text(encoding='utf-8-sig'))
          for item in manifest.get('files') or []:
              # Este archivo lo genera el gate en esta misma ejecución y se publica
              # junto con latest; los demás ya deben existir públicamente tal como
              # los descargará el launcher de la PC real.
              if item.get('path') == 'update_manifest.json':
                  continue
              urls = item.get('parts') or ([item.get('url')] if item.get('url') else [])
              if not urls:
                  raise SystemExit(f"Sin URL pública: {item.get('path')}")
              payload = b''.join(urllib.request.urlopen(url, timeout=30).read() for url in urls)
              got = hashlib.sha256(payload).hexdigest()
              expected = str(item.get('sha256') or '')
              if got != expected:
                  raise SystemExit(
                      f"SHA público inválido para {item.get('path')}: {got} != {expected}"
                  )
              print('PUBLIC_SHA_OK', item.get('path'), got)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Los bytes públicos no coinciden con el manifest candidato' }

      - name: Validar JavaScript embebido
        shell: powershell
        run: |
          if ((Test-Path '.release_gate\embedded.js') -and ((Get-Item '.release_gate\embedded.js').Length -gt 0)) {
            node --check .release_gate\embedded.js
            if ($LASTEXITCODE -ne 0) { throw 'JavaScript embebido inválido' }
          }

      - name: Arranque real en instalación temporal
        run: python tools/release_gate.py smoke

      - name: Promover únicamente si todo pasó
        run: python tools/release_gate.py promote

      - name: Publicar manifests generados por el gate
        shell: powershell
        run: |
          git config user.name 'recepcion-release-gate'
          git config user.email 'actions@users.noreply.github.com'
          git add latest-v3.json latest.json
          $folder = (Get-Content release_candidate.json -Raw | ConvertFrom-Json).folder
          git add "$folder/update_manifest.json"
          if (git diff --cached --quiet) {
            Write-Host 'No hay cambios que publicar.'
            exit 0
          }
          $version = (Get-Content release_candidate.json -Raw | ConvertFrom-Json).version
          git commit -m "release: promover v$version tras gate completo [skip ci]"

          # El candidato pudo coincidir con otro commit no relacionado. Rebasamos
          # el commit ya validado sobre el HEAD actual para no publicar por fuerza
          # ni perder cambios. El gate sigue siendo el único escritor de latest.
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo rebasar la publicación sobre main; latest queda sin cambios.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el canal; latest queda en la versión anterior.' }
