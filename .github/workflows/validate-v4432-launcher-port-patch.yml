name: Validar v4.4.32 launcher dinámico antes de publicar

on:
  push:
    branches: [main]
    paths:
      - 'build/v4432_launcher_patch/**'
      - '.github/workflows/validate-v4432-launcher-port-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1 - Construir únicamente el parche de launcher
        shell: pwsh
        run: |
          python build/v4432_launcher_patch/build_v4432.py
          $parts = Get-ChildItem updates/v4_4_32_launcher_port_patch/ABRIR_RECEPCION.part* | Sort-Object { [int]($_.Name -replace '^ABRIR_RECEPCION\.part','') }
          if($parts.Count -lt 2){ throw 'No se generaron partes del launcher' }
          $bytes = New-Object System.Collections.Generic.List[byte]
          foreach($p in $parts){ $bytes.AddRange([IO.File]::ReadAllBytes($p.FullName)) }
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'ABRIR_RECEPCION.py'), $bytes.ToArray())
          python -m py_compile $env:RUNNER_TEMP\ABRIR_RECEPCION.py

      - name: 2 - Contrato estático anti-regresiones
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import ast, json, re
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'ABRIR_RECEPCION.py'
          s=p.read_text(encoding='utf-8-sig')
          compile(s,'ABRIR_RECEPCION.py','exec')
          assert 'LAUNCHER_VERSION = "4.4.32-dynamic-port-patch-1"' in s
          assert 'def _choose_app_port(force_new: bool = False)' in s
          assert 'def _can_bind_port(port: int) -> bool' in s
          assert 'env["RP_PORT"] = str(APP_PORT)' in s
          assert 'Puerto local seleccionado' in s
          assert 'def _relaunch_updated_launcher()' in s
          assert 'URL = "http://127.0.0.1:8000"' not in s
          assert 'ABRIR_RECEPCION_base_4357' not in s
          tree=ast.parse(s)
          imports=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import): imports.update(a.name for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module: imports.add(n.module)
          banned={'ABRIR_RECEPCION_base_4357','AUTOACTUALIZAR','_AUTOACTUALIZAR_31','_ABRIR_RECEPCION_451'}
          assert not (imports & banned), imports & banned
          cand=json.loads(Path('updates/v4_4_32_launcher_port_patch/candidate_latest.json').read_text(encoding='utf-8'))
          assert cand['version']=='4.4.32'
          assert cand['app_version']=='4.4.31' == cand['runtime_version']
          paths=[x['path'] for x in cand['files']]
          assert paths==['ABRIR_RECEPCION.py','update_manifest.json'], paths
          assert not any(x in paths for x in ['app.py','.env','BASE DE DATOS 2026.xlsx'])
          assert not any(x.startswith('data/') or x.startswith('.venv/') for x in paths)
          print('STATIC_CONTRACT_OK')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\static_contract.py
          python $env:RUNNER_TEMP\static_contract.py

      - name: 3 - Self-tests históricos del updater y mutex
        shell: pwsh
        run: |
          python $env:RUNNER_TEMP\ABRIR_RECEPCION.py --self-test-core

      - name: 4 - Pruebas reales de puertos en Windows
        shell: pwsh
        run: |
          @'
          import importlib.util, json, os, socket, tempfile, threading, urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          launcher_path=Path(os.environ['RUNNER_TEMP'])/'ABRIR_RECEPCION.py'
          spec=importlib.util.spec_from_file_location('launcher4432',launcher_path)
          L=importlib.util.module_from_spec(spec); spec.loader.exec_module(L)
          original_root=L.ROOT

          class V(BaseHTTPRequestHandler):
              version='4.4.31'
              def do_GET(self):
                  if self.path.startswith('/api/version'):
                      b=json.dumps({'version':self.version}).encode()
                      self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
                  else: self.send_response(404); self.end_headers()
              def log_message(self,*a): pass

          # A. Exactamente el incidente real: 8766 guardado pero ocupado por un ajeno.
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); (root/'data').mkdir(); L.ROOT=root
              foreign=socket.socket(); foreign.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,0); foreign.bind(('127.0.0.1',8766)); foreign.listen(2)
              (root/'data'/'local_port.txt').write_text('8766',encoding='utf-8')
              chosen=L._choose_app_port()
              assert chosen != 8766, chosen
              assert L.URL == f'http://127.0.0.1:{chosen}'
              assert L.VERSION_URL == f'http://127.0.0.1:{chosen}/api/version'
              # _stop_server NO debe matar ni cerrar un proceso que no sea Recepción.
              L._set_app_port(8766)
              assert L._running_version(timeout=.2) is None
              assert L._stop_server() is None
              assert foreign.fileno() >= 0
              foreign.close()
              print('FOREIGN_8766_PRESERVED_AND_FALLBACK_OK',chosen)

          # B. Backend sano ya vivo en 8766: debe reutilizarse, no levantar otra copia.
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); (root/'data').mkdir(); L.ROOT=root
              server=ThreadingHTTPServer(('127.0.0.1',8766),V)
              th=threading.Thread(target=server.serve_forever,daemon=True); th.start()
              try:
                  (root/'data'/'local_port.txt').write_text('8766',encoding='utf-8')
                  chosen=L._choose_app_port()
                  assert chosen==8766, chosen
                  assert L._running_version(timeout=.5)=='4.4.31'
                  print('HEALTHY_8766_REUSED_OK')
              finally:
                  server.shutdown(); server.server_close()

          # C. 8000 y 8765 ocupados: debe seguir buscando sin fallar.
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); (root/'data').mkdir(); L.ROOT=root
              a=socket.socket(); a.bind(('127.0.0.1',8000)); a.listen(1)
              b=socket.socket(); b.bind(('127.0.0.1',8765)); b.listen(1)
              try:
                  chosen=L._choose_app_port()
                  assert chosen not in (8000,8765)
                  assert 1024 <= chosen <= 65535
                  print('MULTIPLE_PORTS_OCCUPIED_FALLBACK_OK',chosen)
              finally: a.close(); b.close()

          L.ROOT=original_root
          print('WINDOWS_PORT_MATRIX_OK')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\port_matrix.py
          python $env:RUNNER_TEMP\port_matrix.py

      - name: 5 - Probar app actual 4.4.31 con RP_PORT y 8000 ocupado
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check `
            'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20'
          $root=Join-Path $env:RUNNER_TEMP 'current-app-smoke'
          if(Test-Path $root){ Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item updates/v4_4_31_startup_guard/app.py (Join-Path $root 'app.py')
          Copy-Item updates/v4_4_28_overlay_hotfix/app.py (Join-Path $root 'app_base_4428.py')
          Copy-Item updates/v4_4_28_overlay_hotfix/static (Join-Path $root 'static') -Recurse
          $base=Join-Path $env:RUNNER_TEMP 'base-resources'
          Expand-Archive installer_clean/base/clean_base_resources.zip -DestinationPath $base -Force
          foreach($name in @('azur_client.py','whatsapp_client.py','remote_agenda.py')){
            $src=Get-ChildItem $base -Recurse -File -Filter $name | Select-Object -First 1
            if(-not $src){ throw "Falta $name" }
            Copy-Item $src.FullName (Join-Path $root $name)
          }
          New-Item -ItemType Directory -Force (Join-Path $root 'data') | Out-Null
          $listener=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,8000); $listener.Start()
          $env:RP_PORT='18766'; $env:RP_FORCE_OFFLINE='1'; $env:RP_DATA_DIR=(Join-Path $root 'data'); $env:DISABLE_SQLALCHEMY_CEXT_RUNTIME='1'
          $proc=Start-Process -FilePath python -ArgumentList @((Join-Path $root 'app.py')) -WorkingDirectory $root -PassThru -WindowStyle Hidden
          try {
            $ok=$false
            for($i=0;$i -lt 100;$i++){
              Start-Sleep -Milliseconds 250
              try { $v=Invoke-RestMethod 'http://127.0.0.1:18766/api/version' -TimeoutSec 1; if([string]$v.version -eq '4.4.31'){ $ok=$true; break } } catch {}
              if($proc.HasExited){ break }
            }
            if(-not $ok){ throw 'La app actual 4.4.31 no respetó RP_PORT=18766 con 8000 ocupado' }
            Write-Host 'CURRENT_APP_4431_RP_PORT_OK'
          } finally {
            if(-not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            $listener.Stop()
          }

      - name: 6 - Verificar SHA y reconstrucción exacta del payload
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json
          d=Path('updates/v4_4_32_launcher_port_patch')
          c=json.loads((d/'candidate_latest.json').read_text(encoding='utf-8'))
          parts=sorted(d.glob('ABRIR_RECEPCION.part*'),key=lambda p:int(p.name.split('part')[-1]))
          raw=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(raw).hexdigest()==c['files'][0]['sha256']
          compile(raw.decode('utf-8-sig'),'ABRIR_RECEPCION.py','exec')
          m=(d/'update_manifest.json').read_bytes()
          assert hashlib.sha256(m).hexdigest()==c['files'][1]['sha256']
          inner=json.loads(m.decode('utf-8-sig'))
          assert inner['version']=='4.4.32' and inner['app_version']=='4.4.31'
          print('PAYLOAD_BYTES_AND_SHA_OK',hashlib.sha256(raw).hexdigest())
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\sha_check.py
          python $env:RUNNER_TEMP\sha_check.py

      - name: 7 - Guardar payload validado sin mover el canal oficial
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add updates/v4_4_32_launcher_port_patch
          if(-not (git diff --cached --quiet)){
            git commit -m 'payload: v4.4.32 launcher dinámico validado en Windows'
            git pull --rebase origin main
            git push
          }
          Write-Host 'VALIDATED_PAYLOAD_COMMITTED_CHANNEL_NOT_MOVED'
