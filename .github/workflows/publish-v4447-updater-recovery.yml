name: Publish v4.4.47 updater recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4447-updater-recovery.yml"

permissions:
  contents: write

concurrency:
  group: publish-v4447-updater-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and publish v4.4.47
        shell: pwsh
        run: |
          python build/v4447_updater_recovery/publish_v4447.py
