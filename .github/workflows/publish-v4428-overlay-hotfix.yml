name: Publicar v4.4.28 hotfix arranque

on:
  push:
    branches: [main]
    paths:
      - 'build/v4428_overlay_hotfix/**'
      - '.github/workflows/publish-v4428-overlay-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v4428-overlay-hotfix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construir v4.4.28 desde v4.4.27
        shell: pwsh
        run: |
          git pull --rebase origin main
          python build/v4428_overlay_hotfix/build_release.py
          python -m py_compile updates/v4_4_28_overlay_hotfix/app.py
          node --check updates/v4_4_28_overlay_hotfix/static/app.js

      - name: Validar hotfix y ahorro Neon
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import ast,json
          root=Path('updates/v4_4_28_overlay_hotfix')
          app=(root/'app.py').read_text(encoding='utf-8-sig')
          html=(root/'static/index.html').read_text(encoding='utf-8-sig')
          channel=json.loads(Path('build/v4428_overlay_hotfix/candidate_latest.json').read_text(encoding='utf-8-sig'))
          ast.parse(app)
          assert 'APP_VERSION = "4.4.28"' in app
          assert 'CACHE_REFRESH_SECONDS = 12 * 60 * 60' in app
          assert 'AGENDA_CACHE_REFRESH_SECONDS = 30 * 60' in app
          assert 'def refresh_remote_agenda_cache(' in app
          assert 'cloud_wake_skipped' in app
          assert '/static/app.js?v=4.4.28' in html
          base=app.index('V460_OVERLAY_CSS = r"""')
          auto=app.rindex('V460_OVERLAY_CSS = (V460_OVERLAY_CSS or "") + "\\n" + V4425_AUTOBOOK_CSS')
          assert base < auto, 'AUTOAGENDADA vuelve a ejecutarse antes de definir V460'
          assert 'V460_OVERLAY_CSS = (V460_OVERLAY_CSS or "")' not in app[:base]
          assert 'V460_OVERLAY_JS = (V460_OVERLAY_JS or "")' not in app[:base]
          assert channel['version']=='4.4.28'
          assert all('/main/' in f['url'] for f in channel['files'])
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.csv','.xlsx','.xls','.db','.sqlite'}:
                  raise AssertionError(f'Dato no permitido en payload: {p}')
          print('V4428_STARTUP_ORDER_AND_NEON_OK')
          '@ | python -

      - name: Publicar payload
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch updates/v4_4_28_overlay_hotfix/__pycache__
          git add updates/v4_4_28_overlay_hotfix
          if(-not (git diff --cached --quiet)){git commit -m 'payload: v4.4.28 hotfix arranque'}
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verificar payload remoto
        shell: pwsh
        run: python tools/remote_payload_guard.py --manifest build/v4428_overlay_hotfix/candidate_latest.json

      - name: Mover canal a v4.4.28
        shell: pwsh
        run: |
          Copy-Item build/v4428_overlay_hotfix/candidate_latest.json latest-v3.json -Force
          Copy-Item build/v4428_overlay_hotfix/candidate_latest.json latest.json -Force
          git add latest-v3.json latest.json
          if(-not (git diff --cached --quiet)){git commit -m 'release: publicar v4.4.28 hotfix arranque'}
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirmar canal final
        shell: pwsh
        run: |
          @'
          import json,time,urllib.request,pathlib,os
          url='https://raw.githubusercontent.com/fanserick-star/recepcion-dr-revelo-updates/main/latest-v3.json'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'latest-v4428-remote.json'
          last=''
          for _ in range(45):
              try:
                  req=urllib.request.Request(url+'?rp_ts='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'RP-v4428-guard'})
                  with urllib.request.urlopen(req,timeout=10) as r: raw=r.read()
                  d=json.loads(raw.decode('utf-8-sig'))
                  if str(d.get('version'))=='4.4.28':
                      out.write_bytes(raw);print('CHANNEL_4428_VISIBLE');break
                  last=str(d.get('version'))
              except Exception as e:last=repr(e)
              time.sleep(1)
          else: raise SystemExit('Canal no propagó 4.4.28; último='+last)
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\wait4428.py
          python $env:RUNNER_TEMP\wait4428.py
          python tools/remote_payload_guard.py --manifest $env:RUNNER_TEMP\latest-v4428-remote.json
          Write-Host 'V4428_PUBLISHED_AND_VERIFIED'
