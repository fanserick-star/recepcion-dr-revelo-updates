name: Validar app v4.3.60

on:
  push:
    branches: [main]
    paths:
      - 'updates/v460/**'
      - '.gitattributes'
      - '.github/workflows/test-v460-app.yml'
      - 'latest.json'
      - 'latest-v3.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias mínimas
        run: python -m pip install --disable-pip-version-check fastapi sqlalchemy python-dotenv python-multipart
      - name: Reconstruir, verificar metadata y compilar app candidata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('updates/v460')
          meta=json.loads((root/'release_meta.json').read_text(encoding='utf-8'))
          if meta.get('version')!='4.3.60': raise SystemExit(f"Versión metadata inválida: {meta.get('version')}")
          parts=sorted(root.glob('app.part*'),key=lambda p:int(p.name.split('part')[-1]))
          if len(parts)!=int(meta['parts_count']): raise SystemExit(f"Partes inválidas: {len(parts)} != {meta['parts_count']}")
          raw=b''.join(p.read_bytes() for p in parts)
          if len(raw)!=int(meta['app_size']): raise SystemExit(f"Tamaño inválido: {len(raw)} != {meta['app_size']}")
          got=hashlib.sha256(raw).hexdigest()
          if got!=meta['app_sha256']: raise SystemExit(f"SHA inválido: {got} != {meta['app_sha256']}")
          manifest=(root/'update_manifest.json').read_bytes()
          msha=hashlib.sha256(manifest).hexdigest()
          if msha!=meta['manifest_sha256']: raise SystemExit(f"SHA manifest inválido: {msha} != {meta['manifest_sha256']}")
          Path('_ci_app.py').write_bytes(raw)
          print('v4.3.60 verificada desde metadata única',len(raw),got)
          PY
          python -m py_compile _ci_app.py
      - name: Validar JavaScript v4.3.60
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          t=ast.parse(Path('_ci_app.py').read_text(encoding='utf-8'))
          found=set()
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  name=n.targets[0].id
                  if name=='V459_SETTINGS_JS':
                      Path('_ci_v459.js').write_text(ast.literal_eval(n.value),encoding='utf-8');found.add(name)
                  elif name=='V460_OVERLAY_JS':
                      Path('_ci_v460.js').write_text(ast.literal_eval(n.value),encoding='utf-8');found.add(name)
          if found!={'V459_SETTINGS_JS','V460_OVERLAY_JS'}: raise SystemExit(f'JS faltante: {found}')
          PY
          node --check _ci_v459.js
          node --check _ci_v460.js
      - name: Pruebas funcionales aisladas
        run: python updates/v460/test_v460.py
