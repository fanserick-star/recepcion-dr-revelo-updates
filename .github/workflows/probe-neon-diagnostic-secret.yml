name: Probe Neon diagnostic secret

on:
  push:
    paths:
      - ".github/workflows/probe-neon-diagnostic-secret.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Check presence only
        shell: bash
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL=PRESENT"; else echo "DATABASE_URL=MISSING"; fi
          if [ -n "$NEON_DATABASE_URL" ]; then echo "NEON_DATABASE_URL=PRESENT"; else echo "NEON_DATABASE_URL=MISSING"; fi
