name: Probe Neon Historia schema

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-neon-diagnostic-secret.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read-only Neon schema probe
        shell: bash
        run: |
          set -euo pipefail
          URL="${DATABASE_URL:-${NEON_DATABASE_URL:-}}"
          mkdir -p diagnostics
          if [ -z "$URL" ]; then
            printf '%s\n' '{"connection":"missing-secret"}' > diagnostics/neon-historia-schema.json
          else
            command -v psql >/dev/null 2>&1 || {
              sudo apt-get update -qq
              sudo apt-get install -y -qq postgresql-client
            }
            export PGCONNECT_TIMEOUT=12
            psql "$URL" -X -v ON_ERROR_STOP=1 -qAt <<'SQL' > /tmp/neon_diag.json
          WITH wanted(table_name) AS (
            VALUES
              ('patients'),('encounters'),('patient_links'),('waiting_queue'),
              ('encounter_addenda'),('macros'),('prescriptions'),('certificates'),
              ('clinic_settings'),('audit_log'),('encounter_revisions'),('devices')
          ),
          tabs AS (
            SELECT w.table_name,
                   to_regclass('public.' || w.table_name) IS NOT NULL AS exists
            FROM wanted w
          ),
          cols AS (
            SELECT c.table_name,
                   jsonb_agg(
                     jsonb_build_object(
                       'name', c.column_name,
                       'type', c.data_type,
                       'nullable', c.is_nullable
                     )
                     ORDER BY c.ordinal_position
                   ) AS columns
            FROM information_schema.columns c
            JOIN wanted w ON w.table_name=c.table_name
            WHERE c.table_schema='public'
            GROUP BY c.table_name
          )
          SELECT jsonb_pretty(
            jsonb_build_object(
              'connection','ok',
              'database',current_database(),
              'tables',
                COALESCE(
                  jsonb_agg(
                    jsonb_build_object(
                      'name',t.table_name,
                      'exists',t.exists,
                      'columns',COALESCE(c.columns,'[]'::jsonb)
                    )
                    ORDER BY t.table_name
                  ),
                  '[]'::jsonb
                )
            )
          )
          FROM tabs t
          LEFT JOIN cols c USING(table_name);
          SQL
            mv /tmp/neon_diag.json diagnostics/neon-historia-schema.json
          fi

      - name: Publish sanitized diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/neon-historia-schema.json
          if git diff --cached --quiet; then
            echo "Diagnostic unchanged."
            exit 0
          fi
          git commit -m "Update sanitized Neon Historia schema diagnostic"
          git push origin HEAD:main
