name: Package v4.4.58 for installer

on:
  push:
    paths:
      - '.github/workflows/package-v4458-for-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify expected files
        shell: bash
        run: |
          set -euo pipefail
          D='updates/v4_4_58_report_turn_none_fix'
          test -f "$D/app.py"
          test -f "$D/app_base_4428.py"
          test -f "$D/ABRIR_RECEPCION.part1"
          test -f "$D/ABRIR_RECEPCION.part2"
          test -f "$D/ABRIR_RECEPCION.part3"
          test -f "$D/ABRIR_RECEPCION.part4"
          test -f "$D/update_manifest.json"
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/v4_4_58_report_turn_none_fix
          cp updates/v4_4_58_report_turn_none_fix/* out/v4_4_58_report_turn_none_fix/
          cat out/v4_4_58_report_turn_none_fix/ABRIR_RECEPCION.part{1,2,3,4} > out/v4_4_58_report_turn_none_fix/ABRIR_RECEPCION.py
          sha256sum out/v4_4_58_report_turn_none_fix/* > out/SHA256SUMS.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: recepcion-v4.4.58-exact-files
          path: out/
          if-no-files-found: error
          retention-days: 1
