name: Validate Historia 1.3.5 Runtime Import

on:
  push:
    paths:
      - "historia-clinica/updates/v1_3_5_launcher_v1_migration/**"
      - "historia-clinica/launcher-v1/HistoriaLauncher/**"
      - ".github/workflows/validate-historia-runtime-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-on-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build isolated Historia 1.3.5 trial
        shell: pwsh
        run: |
          $trial = "$env:RUNNER_TEMP\historia135"
          New-Item -ItemType Directory -Force "$trial\static" | Out-Null
          New-Item -ItemType Directory -Force "$trial\data" | Out-Null

          $parts = @(
            "historia-clinica/updates/v1_3_5_launcher_v1_migration/app.py.part01",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part02",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part03",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part04",
            "historia-clinica/updates/v1_3_5_launcher_v1_migration/app.py.part05"
          )
          $out = [IO.File]::Open("$trial\app.py", [IO.FileMode]::Create)
          foreach ($p in $parts) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $p))
            $out.Write($bytes, 0, $bytes.Length)
          }
          $out.Dispose()

          $cloudParts = @(
            "historia-clinica/updates/v1_1_3_live_sync/cloud_sync.py.part01",
            "historia-clinica/updates/v1_1_3_live_sync/cloud_sync.py.part02"
          )
          $cloud = [IO.File]::Open("$trial\cloud_sync.py", [IO.FileMode]::Create)
          foreach ($p in $cloudParts) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $p))
            $cloud.Write($bytes, 0, $bytes.Length)
          }
          $cloud.Dispose()

          Copy-Item "historia-clinica/updates/v1_3_2_new_patient_confirm/cloud_presence_patch.py" "$trial\cloud_presence_patch.py"
          Copy-Item "historia-clinica/updates/v1_3_2_new_patient_confirm/lan_bridge.py" "$trial\lan_bridge.py"
          Copy-Item "historia-clinica/updates/v1_1_10_full_webview/requirements.txt" "$trial\requirements.txt"
          Copy-Item "historia-clinica/updates/v1_3_1_new_patient_turn/style.css" "$trial\static\style.css"
          Copy-Item "historia-clinica/updates/v1_3_5_launcher_v1_migration/historia-version.json" "$trial\historia-version.json"

          Add-Content -Path $env:GITHUB_ENV -Value "TRIAL=$trial"

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r "$env:TRIAL\requirements.txt"

      - name: Compile and import app explicitly
        shell: pwsh
        env:
          HC_PREFLIGHT: "1"
          DATABASE_URL: ""
          HISTORIA_DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile "$env:TRIAL\app.py"
          Push-Location $env:TRIAL
          python -c "import sys; sys.path.insert(0,'.'); import app; print('IMPORT_OK', app.APP_VERSION); assert app.APP_VERSION == '1.3.5'"
          Pop-Location

      - name: Start isolated Uvicorn and probe version
        shell: pwsh
        env:
          HC_PREFLIGHT: "1"
          DATABASE_URL: ""
          HISTORIA_DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $code = @'
          import sys, threading, time, urllib.request, json, uvicorn
          sys.path.insert(0, r"__TRIAL__")
          import app
          config = uvicorn.Config(app.app, host="127.0.0.1", port=18787, access_log=False, log_level="warning")
          server = uvicorn.Server(config)
          t = threading.Thread(target=server.run, daemon=True)
          t.start()
          deadline=time.time()+20
          ok=False
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18787/api/version", timeout=1) as r:
                      d=json.loads(r.read().decode())
                  assert d["product"]=="historia-clinica-dr-revelo", d
                  assert d["version"]=="1.3.5", d
                  ok=True
                  break
              except Exception:
                  time.sleep(.25)
          server.should_exit=True
          t.join(timeout=5)
          assert ok, "Historia 1.3.5 no respondió correctamente"
          print("RUNTIME_OK")
          '@
          $code = $code.Replace("__TRIAL__", ($env:TRIAL -replace '\\','\\'))
          $code | Set-Content "$env:RUNNER_TEMP\probe.py" -Encoding utf8
          python "$env:RUNNER_TEMP\probe.py"
