name: Validate Historia Active Runtime Import

on:
  push:
    branches: [main]
    paths:
      - "historia-clinica/app/**"
      - "historia-clinica/launcher-v1/app-channel-source.json"
      - ".github/workflows/validate-historia-runtime-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-on-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build isolated trial from canonical runtime manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $source = Get-Content "historia-clinica/launcher-v1/app-channel-source.json" -Raw | ConvertFrom-Json
          if ($source.sourceRoot -ne "historia-clinica/app") { throw "sourceRoot no canónico: $($source.sourceRoot)" }
          $appRoot = Join-Path $root $source.sourceRoot
          $manifest = Get-Content (Join-Path $appRoot "update_manifest.json") -Raw | ConvertFrom-Json
          $version = (Get-Content (Join-Path $appRoot "historia-version.json") -Raw | ConvertFrom-Json).version
          if ($manifest.version -ne $version -or $manifest.app_version -ne $version -or $manifest.runtime_version -ne $version) {
            throw "Versiones del manifiesto no coinciden con historia-version.json"
          }

          $trial = Join-Path $env:RUNNER_TEMP "historia_active_runtime"
          Remove-Item $trial -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $trial | Out-Null

          foreach ($rel in $manifest.copy) {
            $src = Join-Path $appRoot ($rel -replace '/','\')
            $dest = Join-Path $trial ($rel -replace '/','\')
            if (-not (Test-Path $src -PathType Leaf)) { throw "Falta origen canónico: $rel" }
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force $parent | Out-Null }
            Copy-Item $src $dest -Force
          }
          New-Item -ItemType Directory -Force "$trial\data" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TRIAL=$trial"
          Add-Content -Path $env:GITHUB_ENV -Value "EXPECTED_VERSION=$version"

      - name: Validate payload essentials
        shell: pwsh
        run: |
          $required = @(
            "app.py","cloud_sync.py","cloud_presence_patch.py","lan_bridge.py",
            "documentos_clinicos.py","requirements.txt","historia-version.json","update_manifest.json"
          )
          foreach($name in $required) {
            if(-not (Test-Path (Join-Path $env:TRIAL $name))) { throw "Falta $name" }
          }
          $v=(Get-Content "$env:TRIAL\historia-version.json" -Raw | ConvertFrom-Json).version
          if($v -ne $env:EXPECTED_VERSION){ throw "Version $v != $env:EXPECTED_VERSION" }

      - name: Install exact runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r "$env:TRIAL\requirements.txt"

      - name: Compile and import actual runtime
        shell: pwsh
        env:
          HC_PREFLIGHT: "1"
          DATABASE_URL: ""
          HISTORIA_DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          Get-ChildItem $env:TRIAL -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }
          Push-Location $env:TRIAL
          python -c "import app; from collections import Counter; assert app.APP_VERSION == '$env:EXPECTED_VERSION', app.APP_VERSION; pairs=[(m,r.path) for r in app.app.router.routes for m in (getattr(r,'methods',set()) or set())]; dup=[k for k,v in Counter(pairs).items() if v>1]; assert not dup,dup; print('IMPORT_OK',app.APP_VERSION,'ROUTES',len(pairs))"
          Pop-Location

      - name: Start isolated Uvicorn and probe canonical version
        shell: pwsh
        env:
          HC_PREFLIGHT: "1"
          DATABASE_URL: ""
          HISTORIA_DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $code = @'
          import sys, threading, time, urllib.request, json, uvicorn
          sys.path.insert(0, r"__TRIAL__")
          import app
          config=uvicorn.Config(app.app,host="127.0.0.1",port=18787,access_log=False,log_level="warning")
          server=uvicorn.Server(config)
          t=threading.Thread(target=server.run,daemon=True); t.start()
          deadline=time.time()+25; data=None
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18787/api/version",timeout=1) as r:
                      data=json.loads(r.read().decode())
                  break
              except Exception:
                  time.sleep(.25)
          assert data,data
          assert data["product"]=="historia-clinica-dr-revelo",data
          assert data["version"]=="__VERSION__",data
          server.should_exit=True; t.join(timeout=5)
          print("RUNTIME_OK",data["version"])
          '@
          $code=$code.Replace("__TRIAL__",($env:TRIAL -replace '\\','\\')).Replace("__VERSION__",$env:EXPECTED_VERSION)
          $code | Set-Content "$env:RUNNER_TEMP\probe_active_historia.py" -Encoding utf8
          python "$env:RUNNER_TEMP\probe_active_historia.py"
