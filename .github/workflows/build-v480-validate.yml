name: Validar y publicar v4.3.80
on:
  push:
    branches: [main]
    paths:
      - 'build/v480/**'
      - '.github/workflows/build-v480-validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir paquete candidato
        run: python build/v480/build_v480.py
      - name: Validar Python, JS, UI y paquete
        run: |
          cat updates/v480/app.part* > _ci_app.py
          cat updates/v480/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
          python _ci_launcher.py --self-test-core
          python - <<'PY'
          import ast,json,hashlib
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src); js=css=None
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  names=[t.id for t in node.targets if isinstance(t,ast.Name)]
                  if 'V480_POLISH_JS' in names: js=ast.literal_eval(node.value)
                  if 'V480_POLISH_CSS' in names: css=ast.literal_eval(node.value)
          assert js and css
          for token in ['data-v480-zero-rejected','MutationObserver','extractCount','v480-two-cards','Resumen semanal','renderWeekCards']:
              assert token in js, token
          assert ':scope > button' not in js
          for token in ['#inicio .v480-week-summary','grid-template-columns:repeat(3','font-size:13.5px','data-v480-zero-rejected="1"']:
              assert token in css, token
          assert 'V479_POLISH_JS' in src and 'V478_REMIX_JS' in src
          assert 'MAÑANA' in src and 'TARDE' in src
          assert 'V476_JS' in src and 'b.estado = "EMITIDA"' in src
          assert 'APP_VERSION = "4.3.80"' in src
          Path('_ci_v480.js').write_text(js,encoding='utf-8')
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.80'
          ai=next(x for x in latest['files'] if x['path']=='app.py')
          li=next(x for x in latest['files'] if x['path']=='ABRIR_RECEPCION.py')
          assert hashlib.sha256(Path('_ci_app.py').read_bytes()).hexdigest()==ai['sha256']
          assert hashlib.sha256(Path('_ci_launcher.py').read_bytes()).hexdigest()==li['sha256']
          print('VALIDACION V4.3.80 OK')
          PY
          node --check _ci_v480.js
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v480 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.80 pulido Inicio y Facturación'
          git pull --rebase origin main
          git push
