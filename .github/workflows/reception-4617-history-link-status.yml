name: Reception 4.6.17 History Link Status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reception-4617-history-link-status.yml"

permissions:
  contents: write

concurrency:
  group: reception-4617-history-link-status
  cancel-in-progress: false

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch canonical Reception runtime only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('recepcion/app')
          source_path = root / 'reception_history_identity_consolidated.py'
          version_path = root / 'recepcion-version.json'
          manifest_path = root / 'update_manifest.json'

          version_doc = json.loads(version_path.read_text(encoding='utf-8-sig'))
          current = str(version_doc.get('version') or '').strip()
          assert current == '4.6.16', f'Expected 4.6.16, found {current}; refusing to overwrite a newer release.'

          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          for key in ('version', 'app_version', 'runtime_version'):
              assert str(manifest.get(key) or '').strip() == '4.6.16', (key, manifest.get(key))

          text = source_path.read_text(encoding='utf-8-sig')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              assert count == 1, f'{label}: expected exactly one match, found {count}'
              text = text.replace(old, new, 1)

          replace_once(
              "for(const el of document.querySelectorAll('#modal .patient-profile-modal,.modal .patient-profile-modal,.patient-profile-modal,#modal .attention-form,#modal .modal-content,.modal .attention-form')){",
              "for(const el of document.querySelectorAll('#modal .patient-profile-modal,.modal .patient-profile-modal,.patient-profile-modal,#modal .attention-form-modal,.modal .attention-form-modal,#modal .attention-form,#modal .modal-content,.modal .attention-form')){",
              'attention modal selector',
          )
          replace_once(
              "  function place(host,card){\n    const continueWrap=host.querySelector('.v4417-continue-wrap');",
              "  function place(host,card){\n    const attentionStatus=host.querySelector('#attentionStatus');\n    if(host.matches('.attention-form-modal')&&attentionStatus){attentionStatus.insertAdjacentElement('afterend',card);return}\n    const continueWrap=host.querySelector('.v4417-continue-wrap');",
              'attention status placement',
          )
          replace_once(
              "  async function renderHost(host,force=false){\n    const pid=pidFrom(host);if(!pid)return;\n    let card=host.querySelector(':scope > .v4613-history-card');",
              "  async function renderHost(host,force=false){\n    const pid=pidFrom(host);if(!pid)return;\n    const attentionModal=host.matches('.attention-form-modal');\n    const attentionIsSubsequent=attentionModal&&norm(host.querySelector('#attentionStatus')?.textContent||'').includes('SUBSECUENTE');\n    if(attentionModal&&!attentionIsSubsequent){host.querySelector(':scope > .v4613-history-card')?.remove();return}\n    let card=host.querySelector(':scope > .v4613-history-card');",
              'subsequent-only attention status',
          )
          replace_once(
              "      const d=await status(pid,force);",
              "      const d=attentionIsSubsequent?await prepare(pid,true):await status(pid,force);",
              'subsequent identity preflight',
          )
          replace_once(
              "      if(linked){\n        card.innerHTML=`<div class=\"v4613-history-copy\"><b>Historia clínica vinculada</b>",
              "      if(linked){\n        const linkedTitle=attentionModal?'✓ Vinculado con Historia Clínica':'Historia clínica vinculada';\n        card.innerHTML=`<div class=\"v4613-history-copy\"><b>${linkedTitle}</b>",
              'linked wording',
          )
          replace_once(
              "      }else{\n        card.classList.add('warn');\n        card.innerHTML='<div class=\"v4613-history-copy\"><b>Historia clínica · SIN VÍNCULO</b><small>Busque la ficha correcta antes de guardar una consulta subsecuente.</small></div><div class=\"v4613-history-actions\"><button type=\"button\" class=\"v4613-btn\">🔗 Buscar y vincular ficha</button></div>';",
              "      }else{\n        card.classList.add('warn');\n        const unlinkedTitle=attentionModal?'⚠ Sin vincular con Historia Clínica':'Historia clínica · SIN VÍNCULO';\n        const linkButton=attentionModal?'Vincular con Historia Clínica':'🔗 Buscar y vincular ficha';\n        card.innerHTML=`<div class=\"v4613-history-copy\"><b>${unlinkedTitle}</b><small>Busque la ficha correcta antes de guardar una consulta subsecuente.</small></div><div class=\"v4613-history-actions\"><button type=\"button\" class=\"v4613-btn\">${linkButton}</button></div>`;",
              'unlinked wording',
          )

          source_path.write_text(text, encoding='utf-8', newline='\n')

          version_doc['version'] = '4.6.17'
          version_path.write_text(json.dumps(version_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          manifest['version'] = '4.6.17'
          manifest['app_version'] = '4.6.17'
          manifest['runtime_version'] = '4.6.17'
          notes = manifest.setdefault('notes', {})
          notes['purpose'] = 'Muestra y resuelve desde Nueva atención de Recepción el vínculo con Historia Clínica para pacientes subsecuentes antiguos.'
          notes['previous_version'] = '4.6.16'
          notes['history_link_status_visible_in_new_attention'] = True
          notes['history_link_status_only_for_subsequent'] = True
          notes['history_link_status_position_below_attention_type'] = True
          notes['history_exact_id_preflight_on_subsequent_open'] = True
          notes['history_manual_link_from_reception'] = True
          notes['history_unlinked_button_in_new_attention'] = True
          notes['history_linked_confirmation_in_new_attention'] = True
          notes['waiting_queue_logic_changes'] = False
          notes['billing_logic_changes'] = False
          notes['procedure_logic_changes'] = False
          notes['printing_changes'] = False
          notes['database_schema_changes'] = False
          notes['patient_data_destructive_changes'] = False
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Validate canonical runtime and UI scope
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python -m py_compile recepcion/app/reception_history_identity_consolidated.py recepcion/app/features_runtime.py recepcion/app/app.py
          git diff --check
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          source = Path('recepcion/app/reception_history_identity_consolidated.py').read_text(encoding='utf-8-sig')
          assert '#modal .attention-form-modal' in source
          assert "host.querySelector('#attentionStatus')" in source
          assert "attentionStatus.insertAdjacentElement('afterend',card)" in source
          assert "attentionIsSubsequent?await prepare(pid,true):await status(pid,force)" in source
          assert '✓ Vinculado con Historia Clínica' in source
          assert '⚠ Sin vincular con Historia Clínica' in source
          assert "'Vincular con Historia Clínica'" in source
          assert "if(attentionModal&&!attentionIsSubsequent)" in source

          tree = ast.parse(source)
          js = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'V4613_JS' for t in node.targets):
                  js = ast.literal_eval(node.value)
                  break
          assert js, 'V4613_JS not found'
          Path('/tmp/reception_identity_ui.js').write_text(js, encoding='utf-8')

          changed = set(Path(x) for x in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              Path('recepcion/app/reception_history_identity_consolidated.py'),
              Path('recepcion/app/recepcion-version.json'),
              Path('recepcion/app/update_manifest.json'),
          }
          assert changed == expected, (changed, expected)
          print('SCOPE_OK: only Reception history-link UI/version/manifest changed')
          PY
          node --check /tmp/reception_identity_ui.js

      - name: Commit validated Reception 4.6.17 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepcion/app/reception_history_identity_consolidated.py recepcion/app/recepcion-version.json recepcion/app/update_manifest.json
          git rm .github/workflows/reception-4617-history-link-status.yml
          git commit -m "Reception 4.6.17: show Historia link status in subsequent attention"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Generate stable channel from exact release commit
        run: |
          python tools/build_reception_app_channel.py --commit "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Verify exact published payload bytes
        env:
          VERIFY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import urllib.request

          channel = json.loads(pathlib.Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          assert channel['appVersion'] == '4.6.17', channel.get('appVersion')
          out = pathlib.Path('channel_verify_reception_4617')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          nonce = os.environ.get('VERIFY_NONCE', 'verify')
          for item in channel['files']:
              rel = str(item['path']).replace('\\', '/')
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              url = item['url'] + ('&' if '?' in item['url'] else '?') + 'verify=' + nonce
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
              got = hashlib.sha256(payload).hexdigest()
              assert got == item['sha256'], (rel, got, item['sha256'])
              dest.write_bytes(payload)
              print('RAW OK', rel, got)
          PY
          python tools/validate_reception_runtime_layout.py channel_verify_reception_4617

      - name: Publish stable Reception 4.6.17 channel
        run: |
          git add launcher-v1/app-channel.json
          if git diff --cached --quiet; then
            echo "Channel already matches validated 4.6.17 release."
            exit 0
          fi
          git commit -m "Publish validated Reception 4.6.17 channel"
          git push origin HEAD:main
