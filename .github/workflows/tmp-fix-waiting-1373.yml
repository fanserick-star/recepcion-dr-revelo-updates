name: TEMP Fix Waiting 1373

on:
  push:
    branches:
      - feat/waiting-room-1373-procedure-names
    paths:
      - tools/tmp_fix_waiting_1373.py
      - .github/workflows/tmp-fix-waiting-1373.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and compile fix
        run: python tools/tmp_fix_waiting_1373.py
      - name: Commit fixed candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/updates/v1_3_73_waiting_room_remaster/app.py
          if (git diff --cached --quiet) { Write-Host "No changes"; exit 0 }
          git commit -m "fix: conservar detección de procedimientos legacy"
          git push
