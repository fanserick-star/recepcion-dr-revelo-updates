name: Repair Historia 1.3.67 cloud backfill v2

on:
  push:
    branches: ["repair/historia-1.3.66"]
    paths:
      - ".github/workflows/repair-historia-1367-cloud-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build 1.3.67 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil, textwrap
          root=Path('.')
          src=root/'historia-clinica/updates/v1_3_66_consolidated_runtime'
          out=root/'historia-clinica/updates/v1_3_67_cloud_optional_backfill'
          if out.exists(): shutil.rmtree(out)
          shutil.copytree(src,out)
          cloud=(out/'cloud_sync.py').read_text(encoding='utf-8-sig')
          marker='    def _cycle(self):\n'
          assert cloud.count(marker)==1
          helper=textwrap.dedent('''
              def _queue_missing_optional_rows(self, pg) -> int:
                  tables = ("prescriptions", "certificates", "clinic_settings")
                  available = set(getattr(self, "_remote_available_tables", set()) or set())
                  if not set(tables).issubset(available):
                      return 0
                  sconn = sqlite3.connect(self.db_path, timeout=20)
                  try:
                      if self._get_state(sconn, "optional_cloud_backfill_v1", "0") == "1":
                          return 0
                      queued = 0
                      stamp = _now_iso()
                      for table in tables:
                          pk = BIDIRECTIONAL_TABLES[table]
                          try:
                              local_rows = sconn.execute(
                                  f"SELECT CAST({pk} AS TEXT) FROM {table}"
                              ).fetchall()
                          except sqlite3.Error:
                              local_rows = []
                          remote_cols = self._remote_columns(pg, CLOUD_SCHEMA, table)
                          if pk not in remote_cols:
                              return 0
                          cur = pg.cursor()
                          cur.execute(
                              f'SELECT CAST("{pk}" AS TEXT) FROM "{CLOUD_SCHEMA}"."{table}"'
                          )
                          remote_ids = {str(row[0]) for row in (cur.fetchall() or [])}
                          missing = [
                              str(row[0]) for row in local_rows
                              if row and row[0] is not None and str(row[0]) not in remote_ids
                          ]
                          if missing:
                              sconn.executemany(
                                  "INSERT OR IGNORE INTO sync_dirty(table_name,row_key,changed_at) VALUES(?,?,?)",
                                  [(table, key, stamp) for key in missing],
                              )
                              queued += len(missing)
                      self._set_state(sconn, "optional_cloud_backfill_v1", "1")
                      self._set_state(sconn, "optional_cloud_backfill_completed_at", stamp)
                      sconn.commit()
                      return queued
                  finally:
                      sconn.close()

          ''').replace('\ndef _queue_missing_optional_rows','\n    def _queue_missing_optional_rows')
          cloud=cloud.replace(marker,helper+marker,1)
          call='            self._ensure_remote_extension_schema(pg)\n'
          assert cloud.count(call)==1
          cloud=cloud.replace(call,call+'            optional_backfill_queued = self._queue_missing_optional_rows(pg)\n',1)
          status='                missing_local_rows_queued=missing_queued,\n'
          assert cloud.count(status)==1
          cloud=cloud.replace(status,status+'                optional_cloud_backfill_queued=optional_backfill_queued,\n',1)
          compile(cloud,'cloud_sync.py','exec')
          (out/'cloud_sync.py').write_text(cloud,encoding='utf-8',newline='\n')
          (out/'historia-version.json').write_text(json.dumps({'version':'1.3.67'},indent=2)+'\n',encoding='utf-8')
          manifest=json.loads((out/'update_manifest.json').read_text(encoding='utf-8'))
          for key in ('version','app_version','runtime_version'): manifest[key]='1.3.67'
          notes=manifest.setdefault('notes',{})
          notes.update({
            'purpose':'Runtime consolidado con backfill seguro de tablas cloud opcionales.',
            'previous_version':'1.3.66','functional_changes':True,'database_schema_changes':False,
            'source_behavior_equivalent_to':'1.3.66+optional_cloud_backfill',
            'optional_cloud_backfill':True,
            'optional_cloud_backfill_tables':['prescriptions','certificates','clinic_settings'],
            'optional_cloud_backfill_only_missing_remote_keys':True,
            'optional_cloud_backfill_idempotent':True,
            'patient_data_destructive_changes':False
          })
          (out/'update_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('BUILD_1367_OK')
          PY

      - name: Unit test backfill logic
        shell: bash
        env:
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,sqlite3,tempfile
          from pathlib import Path
          p=Path('historia-clinica/updates/v1_3_67_cloud_optional_backfill/cloud_sync.py').resolve()
          spec=importlib.util.spec_from_file_location('cs',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          td=Path(tempfile.mkdtemp());db=td/'x.db'
          c=sqlite3.connect(db);c.executescript("""
          CREATE TABLE meta(key TEXT PRIMARY KEY,value TEXT);
          CREATE TABLE sync_dirty(table_name TEXT,row_key TEXT,changed_at TEXT,PRIMARY KEY(table_name,row_key));
          CREATE TABLE prescriptions(id TEXT PRIMARY KEY);
          CREATE TABLE certificates(id TEXT PRIMARY KEY);
          CREATE TABLE clinic_settings(setting_key TEXT PRIMARY KEY);
          INSERT INTO prescriptions VALUES('rx1');
          INSERT INTO certificates VALUES('cert1');
          INSERT INTO clinic_settings VALUES('setting1');
          """);c.commit();c.close()
          class Cur:
              def __init__(self): self.rows=[]
              def execute(self,sql,*args): self.rows=[]
              def fetchall(self): return self.rows
          class PG:
              def cursor(self): return Cur()
          s=object.__new__(m.CloudSyncService);s.db_path=db
          s._remote_available_tables={'prescriptions','certificates','clinic_settings'}
          s._remote_columns=lambda pg,schema,table:{m.BIDIRECTIONAL_TABLES[table],'cloud_updated_at','deleted_at'}
          assert s._queue_missing_optional_rows(PG())==3
          c=sqlite3.connect(db);rows=set(c.execute('SELECT table_name,row_key FROM sync_dirty').fetchall());flag=c.execute("SELECT value FROM meta WHERE key='optional_cloud_backfill_v1'").fetchone();c.close()
          assert rows=={('prescriptions','rx1'),('certificates','cert1'),('clinic_settings','setting1')},rows
          assert flag and flag[0]=='1'
          assert s._queue_missing_optional_rows(PG())==0
          print('BACKFILL_IDEMPOTENT_OK')
          PY

      - name: Prove clinical app core unchanged
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('historia-clinica/updates/v1_3_66_consolidated_runtime');b=Path('historia-clinica/updates/v1_3_67_cloud_optional_backfill')
          for rel in ['app.py','cloud_presence_patch.py','lan_bridge.py','documentos_clinicos.py','requirements.txt','static/style.css','static/doctor_icon.b64']:
              assert (a/rel).read_bytes()==(b/rel).read_bytes(),rel
          print('CLINICAL_CORE_UNCHANGED_OK')
          PY

      - name: Import complete 1.3.67 runtime
        shell: bash
        env:
          HC_PREFLIGHT: "1"
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r historia-clinica/updates/v1_3_67_cloud_optional_backfill/requirements.txt
          cd historia-clinica/updates/v1_3_67_cloud_optional_backfill
          mkdir -p data
          python - <<'PY'
          import app
          from collections import Counter
          assert app.APP_VERSION=='1.3.67',app.APP_VERSION
          pairs=[(m,r.path) for r in app.app.router.routes for m in (getattr(r,'methods',set()) or set())]
          assert not [k for k,v in Counter(pairs).items() if v>1]
          print('IMPORT_1367_OK',len(pairs))
          PY

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/updates/v1_3_67_cloud_optional_backfill
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Historia 1.3.67: backfill seguro de documentos cloud"
          git push origin HEAD:repair/historia-1.3.66
