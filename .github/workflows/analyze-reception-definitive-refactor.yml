name: Analyze Reception Definitive Refactor

on:
  push:
    branches:
      - refactor/reception-definitive-runtime
    paths:
      - tools/analyze_reception_definitive_refactor.py
      - tools/analyze_reception_patch_patterns.py
      - .github/workflows/analyze-reception-definitive-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet fastapi uvicorn sqlalchemy python-dotenv pg8000 python-multipart requests openpyxl

      - name: Build static + runtime inventory
        shell: pwsh
        run: |
          python tools/analyze_reception_definitive_refactor.py
          python tools/analyze_reception_patch_patterns.py

      - name: Commit inventory only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refactor/reception_definitive_inventory.json refactor/reception_definitive_inventory.md refactor/reception_patch_patterns.json
          if git diff --cached --quiet; then
            echo "Inventory already current"
            exit 0
          fi
          git commit -m "refactor: inventario definitivo del runtime de Recepción"
          git push origin HEAD:refactor/reception-definitive-runtime
