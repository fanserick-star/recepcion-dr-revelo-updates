name: Reception configuration cleanup candidate

on:
  push:
    branches:
      - audit-config-cleanup-4628
    paths:
      - tools/patch_config_cleanup_4628.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: audit-config-cleanup-4628
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply configuration consolidation
        run: python tools/patch_config_cleanup_4628.py

      - name: Validate Python syntax
        run: |
          python -m py_compile recepcion/app/core_runtime.py recepcion/app/features_runtime.py
          python -m py_compile recepcion/app/reception_system_status.py recepcion/app/reception_payment_terminal_config.py

      - name: Validate frontend syntax
        run: |
          node --check recepcion/app/static/app.js
          node --check recepcion/app/static/configuration.js

      - name: Validate canonical Reception source
        run: python tools/test_reception_canonical_source.py

      - name: Validate runtime layout
        run: python tools/validate_reception_runtime_layout.py recepcion/app

      - name: Validate reports regression guard
        run: |
          if [ -f tools/test_reception_reports.py ]; then python tools/test_reception_reports.py; fi

      - name: Validate configuration contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('recepcion/app')
          ver=json.loads((root/'recepcion-version.json').read_text(encoding='utf-8-sig'))['version']
          assert ver=='4.6.28', ver
          html=(root/'static/index.html').read_text(encoding='utf-8')
          js=(root/'static/configuration.js').read_text(encoding='utf-8')
          app=(root/'static/app.js').read_text(encoding='utf-8')
          feat=(root/'features_runtime.py').read_text(encoding='utf-8')
          core=(root/'core_runtime.py').read_text(encoding='utf-8')
          for label in ['Recepción','Agenda y WhatsApp','Servicios y precios','Facturación y cobros','Sistema']:
              assert label in html, label
          assert 'data-config-tab="actualizaciones"' not in html
          assert 'autoLoginToggle' not in html
          assert 'confirmDeleteToggle' not in html
          assert '/v458/settings.js' not in feat and '/v459/settings.js' not in feat
          assert '/static/configuration.js' in feat and '/static/configuration.css' in feat
          assert 'window.confirmDeletion=message=>window.confirm(message)' in js
          assert "for(const endpoint of ['/api/backup/now','/api/data-protection/backup'])" not in app
          assert 'app_settings.json' in core
          assert 'encoding="utf-8-sig"' in core
          assert 'factureromovil.com' not in core
          assert 'El valor del procedimiento no puede ser negativo' in core
          print('CONFIGURATION CONTRACT OK', ver)
          PY

      - name: Commit candidate changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recepcion/app
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Consolidate Reception configuration 4.6.28'
            git push origin HEAD:audit-config-cleanup-4628
          fi
