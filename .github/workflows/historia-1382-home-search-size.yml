name: Historia 1.3.82 Home Search Readability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historia-1382-home-search-size.yml"

permissions:
  contents: write

concurrency:
  group: historia-1382-home-search-size
  cancel-in-progress: false

jobs:
  patch-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch only Inicio live search sizing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('historia-clinica/app')
          version_path = root / 'historia-version.json'
          manifest_path = root / 'update_manifest.json'
          css_path = root / 'static/style.css'

          version_doc = json.loads(version_path.read_text(encoding='utf-8-sig'))
          current = str(version_doc.get('version', '')).strip()
          assert current == '1.3.81', f'Expected 1.3.81, found {current}; refusing to overwrite a newer release.'

          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          for key in ('version', 'app_version', 'runtime_version'):
              assert str(manifest.get(key, '')).strip() == '1.3.81', (key, manifest.get(key))

          css = css_path.read_text(encoding='utf-8-sig')
          marker = '/* v1.3.82 · buscador de Inicio más legible (solo búsqueda en vivo) */'
          assert marker not in css, 'v1.3.82 CSS block already present'
          block = r'''

/* v1.3.82 · buscador de Inicio más legible (solo búsqueda en vivo) */
.cp-remaster-app .home-search .searchbox input{
  font-size:17px!important;
}
.cp-remaster-app .home-search .live-search-results>a{
  min-height:54px!important;
  padding:12px 14px!important;
}
.cp-remaster-app .home-search .live-copy b{
  font-size:14px!important;
}
.cp-remaster-app .home-search .live-copy small{
  font-size:11.5px!important;
}
.cp-remaster-app .home-search .live-count{
  font-size:10.5px!important;
}
'''
          assert 'queue' not in block.lower(), 'The UI patch must not touch the waiting queue.'
          css_path.write_text(css.rstrip() + block + '\n', encoding='utf-8', newline='\n')

          version_doc['version'] = '1.3.82'
          version_path.write_text(json.dumps(version_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          manifest['version'] = '1.3.82'
          manifest['app_version'] = '1.3.82'
          manifest['runtime_version'] = '1.3.82'
          notes = manifest.setdefault('notes', {})
          notes['purpose'] = 'Buscador de Inicio más legible: texto escrito y lista desplegable de pacientes ligeramente más grandes, sin modificar Pacientes en espera.'
          notes['previous_version'] = '1.3.81'
          notes['ui_only_release'] = True
          notes['clinical_data_changes'] = False
          notes['database_schema_changes'] = False
          notes['cloud_logic_changes'] = False
          notes['printing_changes'] = False
          notes['home_live_search_size_improved'] = True
          notes['home_search_input_font_px'] = 17
          notes['home_live_search_name_font_px'] = 14
          notes['home_live_search_secondary_font_px'] = 11.5
          notes['home_live_search_row_min_height_px'] = 54
          notes['waiting_queue_unchanged'] = True
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Verify scope and canonical runtime
        run: |
          python tools/test_historia_canonical_source.py
          python tools/validate_historia_runtime.py historia-clinica/app
          git diff --check
          python - <<'PY'
          from pathlib import Path
          css = Path('historia-clinica/app/static/style.css').read_text(encoding='utf-8-sig')
          marker = '/* v1.3.82 · buscador de Inicio más legible (solo búsqueda en vivo) */'
          block = css.split(marker, 1)[1]
          assert '.home-search .searchbox input' in block
          assert '.home-search .live-search-results>a' in block
          assert '.home-search .live-copy b' in block
          assert '.home-search .live-copy small' in block
          assert 'home-queue' not in block.lower()
          assert 'queue-row' not in block.lower()
          print('SCOPE_OK: only Inicio live-search selectors were added')
          PY

      - name: Commit canonical 1.3.82 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/static/style.css historia-clinica/app/historia-version.json historia-clinica/app/update_manifest.json
          git commit -m "Historia 1.3.82: enlarge Inicio live search"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Generate channel from exact 1.3.82 commit
        run: |
          python tools/build_historia_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY"

      - name: Verify exact published payload bytes
        env:
          VERIFY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, urllib.request

          channel = json.loads(pathlib.Path('historia-clinica/launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          assert channel['appVersion'] == '1.3.82'
          out = pathlib.Path('channel_verify_historia_1382')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          nonce = os.environ.get('VERIFY_NONCE', 'verify')

          for item in channel['files']:
              rel = str(item['path']).replace('\\', '/')
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              url = item['url'] + ('&' if '?' in item['url'] else '?') + 'verify=' + nonce
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
              got = hashlib.sha256(payload).hexdigest()
              assert got == item['sha256'], (rel, got, item['sha256'])
              dest.write_bytes(payload)
              print('RAW OK', rel, got)
          PY
          python tools/validate_historia_runtime.py channel_verify_historia_1382

      - name: Publish stable channel and remove one-shot workflow
        run: |
          git add historia-clinica/launcher-v1/app-channel.json
          git rm .github/workflows/historia-1382-home-search-size.yml
          git commit -m "Publish validated Historia 1.3.82 channel"
          git push origin HEAD:main
