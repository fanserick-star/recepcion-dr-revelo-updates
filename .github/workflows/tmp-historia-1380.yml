name: TEMP Historia 1.3.80 Waiting Cards
on:
  push:
    branches:
      - historia-1.3.80-waiting-cards
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate
        run: python .github/scripts/tmp_historia_1380.py
      - name: Validate
        shell: bash
        run: |
          python -m py_compile historia-clinica/app/app.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('historia-clinica/app')
          css=(root/'static/style.css').read_text(encoding='utf-8')
          version=json.loads((root/'historia-version.json').read_text(encoding='utf-8-sig'))['version']
          manifest=json.loads((root/'update_manifest.json').read_text(encoding='utf-8-sig'))
          assert version == '1.3.80'
          assert manifest['version'] == manifest['app_version'] == manifest['runtime_version'] == '1.3.80'
          assert 'v1.3.80 · sala de espera en tarjetas clínicas' in css
          assert "content:'SIGUIENTE PACIENTE'" in css
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in css
          assert manifest['notes']['waiting_room_queue_logic_unchanged'] is True
          print('Historia 1.3.80 UI candidate OK')
          PY
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/static/style.css historia-clinica/app/historia-version.json historia-clinica/app/update_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Historia 1.3.80: pacientes en espera en tarjetas"
          git push
