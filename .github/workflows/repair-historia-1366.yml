name: Repair Historia 1.3.66 candidate

on:
  push:
    branches: ["repair/historia-1.3.66"]
    paths:
      - ".github/workflows/repair-historia-1366.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exact consolidated candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          root=Path('.')
          out=root/'historia-clinica/updates/v1_3_66_consolidated_runtime'
          (out/'static').mkdir(parents=True, exist_ok=True)

          app_parts=[
            'historia-clinica/updates/v1_3_63_save_autosave_repair/app.py.part01',
            'historia-clinica/updates/v1_3_56_system_tools_options/app.py.part02',
            'historia-clinica/updates/v1_3_62_reliable_print_buttons/app.py.part03',
            'historia-clinica/updates/v1_3_64_save_core_isolated/app.py.part04',
            'historia-clinica/updates/v1_3_21_single_new_patient/app.py.part05',
            'historia-clinica/updates/v1_3_63_save_autosave_repair/app.py.part06',
          ]
          cloud_parts=[
            'historia-clinica/updates/v1_3_43_legacy_column_intersection/cloud_sync.py.part01',
            'historia-clinica/updates/v1_3_65_revision_conflict/cloud_sync.py.part02',
          ]

          app=b''.join((root/p).read_bytes() for p in app_parts)
          cloud=b''.join((root/p).read_bytes() for p in cloud_parts)
          (out/'app.py').write_bytes(app)
          (out/'cloud_sync.py').write_bytes(cloud)

          copies={
            'cloud_presence_patch.py':'historia-clinica/updates/v1_3_2_new_patient_confirm/cloud_presence_patch.py',
            'lan_bridge.py':'historia-clinica/updates/v1_3_37_reception_turn_force/lan_bridge.py',
            'documentos_clinicos.py':'historia-clinica/updates/v1_3_62_reliable_print_buttons/documentos_clinicos.py',
            'requirements.txt':'historia-clinica/updates/v1_1_10_full_webview/requirements.txt',
            'static/style.css':'historia-clinica/updates/v1_3_1_new_patient_turn/style.css',
            'static/doctor_icon.b64':'historia-clinica/updates/v1_1_5_shortcut_branding/doctor_icon.b64',
          }
          for target,src in copies.items():
            dst=out/target
            dst.parent.mkdir(parents=True, exist_ok=True)
            dst.write_bytes((root/src).read_bytes())

          (out/'historia-version.json').write_text(json.dumps({'version':'1.3.66'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest={
            'product':'historia-clinica-dr-revelo','version':'1.3.66','app_version':'1.3.66','runtime_version':'1.3.66',
            'mandatory':True,'launcher_version':'historia-launcher-v1.0.7','updater_version':'historia-launcher-v1',
            'version_source':'historia-version.json','compatibility_version_aliases':True,'launcher_minimum':'1.0.6',
            'required_dependencies':['app.py','cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','documentos_clinicos.py','requirements.txt','static/style.css','static/doctor_icon.b64'],
            'required_python_packages':[{'import':'fastapi','pip':'fastapi==0.128.2'},{'import':'uvicorn','pip':'uvicorn==0.48.0'},{'import':'pg8000','pip':'pg8000==1.31.2'},{'import':'webview','pip':'pywebview==6.2.1'}],
            'copy':['app.py','cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','documentos_clinicos.py','requirements.txt','static/style.css','static/doctor_icon.b64','historia-version.json','update_manifest.json'],
            'notes':{
              'purpose':'Consolidar exactamente el runtime activo 1.3.65 en fuentes únicas y paquete autosuficiente.',
              'previous_version':'1.3.65','functional_changes':False,'database_schema_changes':False,
              'patient_data_destructive_changes':False,'signed_history_protected':True,
              'runtime_consolidated':True,'external_historical_parts_required':False,'self_contained_update':True,
              'source_behavior_equivalent_to':'1.3.65','protected_data':True,'protected_env':True,
              'transactional_updater':True,'sha256_required':True,'isolated_preflight':True,'rollback':True,
              'cloud_schema':'public','public_schema_canonical':True,'cloud_schema_isolated_from_reception':True,
              'env_preferred_key':'HISTORIA_DATABASE_URL','neon_reception_env_fallback':False,'reception_neon_fallback':False,
              'neon_dedicated_endpoint_guard':True,'neon_expected_endpoint_id':'ep-sweet-mud-arlsk7qa',
              'neon_cloud_identity':'historia-clinica-dr-revelo','no_remote_ddl':True,
              'prescriptions':True,'certificates':True,'emergency_local_draft_backup':True,
              'server_autosave_preserved':True,'consultation_save_core_preserved':True,
              'print_flows_preserved':True,'lan_handoff_preserved':True,'new_patient_confirmation_flow_preserved':True,
              'revision_conflict_fix_preserved':True,'encounter_revision_conflict_policy':'ON CONFLICT DO NOTHING'
            }
          }
          (out/'update_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('APP_SHA256',hashlib.sha256(app).hexdigest())
          print('CLOUD_SHA256',hashlib.sha256(cloud).hexdigest())
          PY

      - name: Validate source equivalence and dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, json, re, hashlib
          from collections import Counter

          root=Path('.')
          out=root/'historia-clinica/updates/v1_3_66_consolidated_runtime'
          app_parts=[
            root/'historia-clinica/updates/v1_3_63_save_autosave_repair/app.py.part01',
            root/'historia-clinica/updates/v1_3_56_system_tools_options/app.py.part02',
            root/'historia-clinica/updates/v1_3_62_reliable_print_buttons/app.py.part03',
            root/'historia-clinica/updates/v1_3_64_save_core_isolated/app.py.part04',
            root/'historia-clinica/updates/v1_3_21_single_new_patient/app.py.part05',
            root/'historia-clinica/updates/v1_3_63_save_autosave_repair/app.py.part06',
          ]
          cloud_parts=[
            root/'historia-clinica/updates/v1_3_43_legacy_column_intersection/cloud_sync.py.part01',
            root/'historia-clinica/updates/v1_3_65_revision_conflict/cloud_sync.py.part02',
          ]
          assert (out/'app.py').read_bytes()==b''.join(p.read_bytes() for p in app_parts)
          assert (out/'cloud_sync.py').read_bytes()==b''.join(p.read_bytes() for p in cloud_parts)

          manifest=json.loads((out/'update_manifest.json').read_text(encoding='utf-8'))
          required=set(manifest['required_dependencies'])
          missing=[x for x in required if not (out/x).is_file()]
          assert not missing,missing
          assert json.loads((out/'historia-version.json').read_text())['version']=='1.3.66'

          py=['app.py','cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','documentos_clinicos.py']
          for rel in py:
            src=(out/rel).read_text(encoding='utf-8-sig')
            compile(src,rel,'exec')

          app=(out/'app.py').read_text(encoding='utf-8-sig')
          assert 'VERSION_PATH = ROOT / "historia-version.json"' in app
          cloud=(out/'cloud_sync.py').read_text(encoding='utf-8-sig')
          assert 'CLOUD_SCHEMA = "public"' in cloud
          assert 'HISTORIA_NEON_ENDPOINT_ID = "ep-sweet-mud-arlsk7qa"' in cloud
          assert 'HISTORIA_DATABASE_URL' in cloud
          loader=cloud.split('def _load_env',1)[1].split('\ndef ',1)[0]
          assert 'DATABASE_URL' not in loader

          local={'cloud_sync','cloud_presence_patch','lan_bridge','documentos_clinicos'}
          for rel in py:
            tree=ast.parse((out/rel).read_text(encoding='utf-8-sig'))
            for node in ast.walk(tree):
              names=[]
              if isinstance(node,ast.Import): names=[a.name.split('.')[0] for a in node.names]
              elif isinstance(node,ast.ImportFrom) and node.module: names=[node.module.split('.')[0]]
              for n in names:
                if n in local:
                  assert (out/(n+'.py')).is_file(),f'{rel} -> {n}.py'

          events=[]
          for m in re.finditer(r'@app\.(get|post|put|delete|patch)\(\s*["\']([^"\']+)["\']',app):
            events.append((m.start(),'add',m.group(1).upper(),m.group(2)))
          for m in re.finditer(r'for\s+_path\s*,\s*_method\s+in\s*\(([\s\S]*?)\):\s*\n\s*_v132_remove_route\(_path,\s*_method\)',app):
            for t in re.finditer(r'\(\s*["\']([^"\']+)["\']\s*,\s*["\'](GET|POST|PUT|DELETE|PATCH)["\']\s*\)',m.group(1)):
              events.append((m.end(),'remove',t.group(2),t.group(1)))
          active=[]
          for _,kind,method,path in sorted(events):
            if kind=='add': active.append((method,path))
            else: active=[x for x in active if x!=(method,path)]
          dup=[k for k,v in Counter(active).items() if v>1]
          assert not dup,dup

          print('OK exact 1.3.65 behavior bytes')
          print('OK dependency closure')
          print('OK zero duplicate active method/path routes')
          print('APP_SHA256',hashlib.sha256((out/'app.py').read_bytes()).hexdigest())
          PY

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r historia-clinica/updates/v1_3_66_consolidated_runtime/requirements.txt

      - name: Isolated import smoke test
        shell: bash
        env:
          HC_PREFLIGHT: "1"
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          trial="$RUNNER_TEMP/historia1366"
          rm -rf "$trial"
          mkdir -p "$trial/data"
          cp -a historia-clinica/updates/v1_3_66_consolidated_runtime/. "$trial/"
          cd "$trial"
          python - <<'PY'
          import app
          from collections import Counter
          assert app.APP_VERSION=='1.3.66',app.APP_VERSION
          pairs=[]
          for r in app.app.router.routes:
            for m in (getattr(r,'methods',set()) or set()): pairs.append((m,r.path))
          dup=[k for k,v in Counter(pairs).items() if v>1]
          assert not dup,dup
          print('IMPORT_OK',app.APP_VERSION,'ROUTES',len(pairs))
          PY

      - name: Commit validated candidate files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/updates/v1_3_66_consolidated_runtime
          if git diff --cached --quiet; then
            echo "Candidate already generated."
            exit 0
          fi
          git commit -m "Historia 1.3.66: runtime consolidado autosuficiente"
          git push origin HEAD:repair/historia-1.3.66
