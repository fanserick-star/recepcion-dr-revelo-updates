name: Audit Reception Functional and Performance

on:
  push:
    branches:
      - reception-audit-functional-performance
    paths:
      - ".github/workflows/audit-reception-functional-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "fastapi==0.128.2" \
            "uvicorn==0.48.0" \
            "sqlalchemy>=2,<3" \
            "python-dotenv>=1,<2" \
            "pg8000>=1.31,<2" \
            "python-multipart>=0.0.20,<1" \
            "pydantic>=2,<3" \
            "anyio>=4,<5"

      - name: Audit active runtime
        shell: bash
        env:
          RP_DATA_DIR: ${{ runner.temp }}/reception-audit-data
          RP_FORCE_OFFLINE: "1"
          FORCE_OFFLINE: "1"
          WHATSAPP_ENABLED: "0"
          WHATSAPP_CLOUD_MODE: "1"
          AZUR_LIVE_EMISSION: "0"
        run: |
          set -euo pipefail
          cd updates/v4_6_2_embedded_helpers
          python - <<'PY'
          import collections
          import inspect
          import json
          import os
          import re
          import threading
          import time

          import app

          assert app.APP_VERSION == "4.6.2", app.APP_VERSION
          assert app.RUNTIME_CONSOLIDATED is True

          # ----- Active route map -----
          entries = []
          for route in app.app.router.routes:
              path = getattr(route, "path", None)
              methods = sorted(getattr(route, "methods", None) or [])
              name = getattr(route, "name", "")
              endpoint = getattr(route, "endpoint", None)
              if not path:
                  continue
              if not methods:
                  methods = ["<MOUNT>"]
              for method in methods:
                  entries.append((method, path, name, getattr(endpoint, "__module__", ""), getattr(endpoint, "__name__", "")))

          dup = collections.defaultdict(list)
          for row in entries:
              dup[(row[0], row[1])].append(row)
          duplicate_pairs = {k:v for k,v in dup.items() if len(v) > 1}

          api_paths = sorted({row[1] for row in entries if row[1].startswith("/api/")})
          print("AUDIT_VERSION", app.APP_VERSION)
          print("ACTIVE_ROUTE_METHOD_PAIRS", len(entries))
          print("ACTIVE_UNIQUE_PATHS", len({row[1] for row in entries}))
          print("ACTIVE_API_PATHS", len(api_paths))
          print("DUPLICATE_METHOD_PATH_COUNT", len(duplicate_pairs))
          for key, rows in sorted(duplicate_pairs.items()):
              print("DUP_ROUTE", key, [(r[2], r[3], r[4]) for r in rows])

          # Key functional families must remain represented.
          families = {
              "patients": ("/api/patients",),
              "visits": ("/api/visits",),
              "appointments": ("/api/appointments", "/api/agenda"),
              "billing": ("/api/billing",),
              "azur": ("/api/billing/azur",),
              "whatsapp": ("/api/whatsapp",),
              "printing": ("/api/print", "/api/printing", "/api/receipt"),
              "historia": ("/api/historia",),
              "procedures": ("/api/procedures",),
          }
          for name, prefixes in families.items():
              hits = [p for p in api_paths if any(p.startswith(prefix) for prefix in prefixes)]
              print("ROUTE_FAMILY", name, len(hits), hits[:20])

          forbidden = {
              "/api/mobile/remote/status",
              "/api/mobile/remote/quick/start",
              "/api/mobile/remote/stable/restart",
              "/api/mobile/remote/stop",
              "/api/update/apply",
          }
          leaked = sorted(forbidden & set(api_paths))
          assert not leaked, f"Legacy routes active: {leaked}"

          # ----- Front-end active overlay, not the historical source archive -----
          core = app.core
          js = str(getattr(core, "V460_OVERLAY_JS", "") or "")
          css = str(getattr(core, "V460_OVERLAY_CSS", "") or "")
          print("ACTIVE_OVERLAY_JS_BYTES", len(js.encode("utf-8")))
          print("ACTIVE_OVERLAY_CSS_BYTES", len(css.encode("utf-8")))
          for needle in ("setInterval(", "setTimeout(", "MutationObserver(", "addEventListener("):
              print("ACTIVE_JS_TOKEN", needle, js.count(needle))

          # Report interval values in active JS to identify aggressive polling.
          intervals = re.findall(r"setInterval\s*\([^,]+,\s*(\d+)\s*\)", js)
          print("ACTIVE_INTERVAL_LITERAL_MS", intervals)

          # ----- Python runtime threads after import -----
          threads = [(t.name, t.daemon, t.is_alive()) for t in threading.enumerate()]
          print("THREADS_AFTER_IMPORT", threads)

          # ----- SQLAlchemy/local cache characteristics -----
          for name in sorted(dir(core)):
              if "engine" not in name.lower():
                  continue
              obj = getattr(core, name, None)
              if obj is None or not hasattr(obj, "pool"):
                  continue
              pool = obj.pool
              info = {
                  "name": name,
                  "engine": type(obj).__name__,
                  "pool": type(pool).__name__,
              }
              for attr in ("size", "overflow", "checkedin", "checkedout"):
                  try:
                      value = getattr(pool, attr)
                      info[attr] = value() if callable(value) else value
                  except Exception:
                      pass
              print("ENGINE", json.dumps(info, sort_keys=True))

          # ----- Procedure regression: editable procedures must not become $0 -----
          SessionLocal = getattr(core, "LocalSessionLocal", None)
          Procedure = getattr(core, "Procedure", None)
          assert SessionLocal is not None and Procedure is not None
          with SessionLocal() as db:
              rows = db.query(Procedure).all()
              proc = {str(x.nombre).upper(): (None if x.valor_default is None else float(x.valor_default)) for x in rows}
          print("PROCEDURE_DEFAULTS", json.dumps(proc, sort_keys=True))
          assert "FULGURACION" in proc
          assert proc["FULGURACION"] is None, proc["FULGURACION"]
          for editable in ("CISTOSCOPIA", "DILATACION", "CIRCUNSICION"):
              assert editable in proc
              assert proc[editable] is None, (editable, proc[editable])
          assert proc.get("INSTILACION") == 80.0

          # ----- Embedded helper closure -----
          embedded = getattr(app, "_EMBEDDED_RUNTIME_SOURCES", {})
          for helper in ("azur_client", "whatsapp_client", "remote_agenda"):
              assert helper in embedded
              mod = __import__(helper)
              print("HELPER_ORIGIN", helper, getattr(getattr(mod, "__spec__", None), "origin", None))

          print("AUDIT_ACTIVE_RUNTIME_OK")
          PY

      - name: Static scan for cloud probes and background workers
        shell: python
        run: |
          import ast
          import pathlib
          import re

          p = pathlib.Path("updates/v4_6_2_embedded_helpers/app.py")
          source = p.read_text(encoding="utf-8-sig")
          tree = ast.parse(source)

          # Extract embedded modules and scan each independently.
          embedded = {}
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "_EMBEDDED_RUNTIME_SOURCES":
                          embedded = ast.literal_eval(node.value)

          print("EMBEDDED_MODULE_COUNT", len(embedded))
          for name, text in sorted(embedded.items()):
              metrics = {
                  "threads": text.count("threading.Thread("),
                  "timers": text.count("threading.Timer("),
                  "while_true": text.count("while True"),
                  "sleep": text.count("time.sleep("),
                  "check_cloud": text.count("check_cloud("),
                  "setInterval": text.count("setInterval("),
                  "MutationObserver": text.count("MutationObserver("),
              }
              if any(metrics.values()):
                  print("MODULE_ACTIVITY", name, metrics)

          # Final top-level candidate code outside embedded strings.
          print("FULL_SOURCE_BYTES", len(source.encode("utf-8")))
          print("APP_PATCH_TEXT_OCCURRENCES", source.count("app_patch_"))
          print("STATIC_SCAN_OK")
