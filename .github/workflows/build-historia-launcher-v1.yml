name: Build Historia Launcher v1 Package
# final-release-v1.0.0

on:
  push:
    paths:
      - "historia-clinica/launcher-v1/HistoriaLauncher/**"
      - "historia-clinica/launcher-v1/LauncherUpdater/**"
      - "historia-clinica/launcher-v1/Uninstaller/**"
      - "historia-clinica/launcher-v1/installer/**"
      - ".github/workflows/build-historia-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate distinct Historia icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeIconHistoria {
              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool DestroyIcon(IntPtr hIcon);
          }
          "@
          function Add-RoundedRect([System.Drawing.Drawing2D.GraphicsPath]$path,[float]$x,[float]$y,[float]$w,[float]$h,[float]$r) {
            $d = $r * 2
            $path.AddArc($x,$y,$d,$d,180,90)
            $path.AddArc($x+$w-$d,$y,$d,$d,270,90)
            $path.AddArc($x+$w-$d,$y+$h-$d,$d,$d,0,90)
            $path.AddArc($x,$y+$h-$d,$d,$d,90,90)
            $path.CloseFigure()
          }
          $bmp = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $bgPath = New-Object System.Drawing.Drawing2D.GraphicsPath
          Add-RoundedRect $bgPath 2 2 60 60 14
          $bg = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(27,61,91))
          $g.FillPath($bg,$bgPath)
          $cardPath = New-Object System.Drawing.Drawing2D.GraphicsPath
          Add-RoundedRect $cardPath 11 10 42 44 8
          $card = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(252,250,244))
          $g.FillPath($card,$cardPath)
          $font = New-Object System.Drawing.Font("Segoe UI",26,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $letter = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(27,61,91))
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = [System.Drawing.StringAlignment]::Center
          $fmt.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString("H",$font,$letter,[System.Drawing.RectangleF]::new(11,9,42,42),$fmt)
          $badge = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(28,143,99))
          $g.FillEllipse($badge,39,39,21,21)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White,3.2)
          $pen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $pen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawLine($pen,49.5,44,49.5,56)
          $g.DrawLine($pen,43.5,50,55.5,50)
          New-Item -ItemType Directory -Force "historia-clinica/launcher-v1/installer/build" | Out-Null
          $h = $bmp.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($h)
          foreach($dst in @("historia-clinica/launcher-v1/HistoriaLauncher/doctor_icon.ico","historia-clinica/launcher-v1/Uninstaller/doctor_icon.ico","historia-clinica/launcher-v1/installer/build/doctor_icon.ico")) {
            $fs=[IO.File]::Create($dst); try { $ico.Save($fs) } finally { $fs.Dispose() }
          }
          $ico.Dispose(); [NativeIconHistoria]::DestroyIcon($h) | Out-Null
          $pen.Dispose(); $badge.Dispose(); $fmt.Dispose(); $letter.Dispose(); $font.Dispose(); $card.Dispose(); $cardPath.Dispose(); $bg.Dispose(); $bgPath.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Publish Historia launcher
        shell: pwsh
        run: |
          dotnet publish "historia-clinica/launcher-v1/HistoriaLauncher/HistoriaLauncher.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish hidden updater
        shell: pwsh
        run: |
          dotnet publish "historia-clinica/launcher-v1/LauncherUpdater/LauncherUpdater.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Historia uninstaller
        shell: pwsh
        run: |
          dotnet publish "historia-clinica/launcher-v1/Uninstaller/Uninstaller.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect binaries
        shell: pwsh
        run: |
          $launcher = Get-Item "historia-clinica/launcher-v1/HistoriaLauncher/bin/Release/net8.0-windows/win-x64/publish/HistoriaClinicaLauncher.exe"
          $updater = Get-Item "historia-clinica/launcher-v1/LauncherUpdater/bin/Release/net8.0-windows/win-x64/publish/HistoriaLauncherUpdater.exe"
          $uninstaller = Get-Item "historia-clinica/launcher-v1/Uninstaller/bin/Release/net8.0-windows/win-x64/publish/Desinstalar_Historia_Clinica_Dr_Revelo.exe"
          if (-not $launcher -or -not $updater -or -not $uninstaller) { throw "No se generaron los binarios esperados." }
          Copy-Item $launcher.FullName "historia-clinica/launcher-v1/installer/build/HistoriaClinicaLauncher.exe" -Force
          Copy-Item $updater.FullName "historia-clinica/launcher-v1/installer/build/HistoriaLauncherUpdater.exe" -Force
          Copy-Item $uninstaller.FullName "historia-clinica/launcher-v1/installer/build/Desinstalar_Historia_Clinica_Dr_Revelo.exe" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build migration installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe no encontrado." }
          & $iscc "historia-clinica/launcher-v1/installer/LauncherV1.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build final package
        shell: pwsh
        run: |
          $out = "historia-clinica/launcher-v1/package"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "historia-clinica/launcher-v1/installer/output/INSTALAR_LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_7.exe" $out -Force
          Copy-Item "historia-clinica/launcher-v1/installer/build/HistoriaClinicaLauncher.exe" $out -Force
          Copy-Item "historia-clinica/launcher-v1/installer/build/HistoriaLauncherUpdater.exe" $out -Force
          Copy-Item "historia-clinica/launcher-v1/installer/build/Desinstalar_Historia_Clinica_Dr_Revelo.exe" $out -Force
          Copy-Item "historia-clinica/launcher-v1/README.txt" $out -Force
          $hashLines = @()
          Get-ChildItem $out -File | Where-Object { $_.Extension -eq ".exe" } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$h  $($_.Name)"
          }
          $hashLines | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$out/*" -DestinationPath "LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_7_COMPLETO.zip" -Force
          Get-Content "$out/SHA256SUMS.txt"

      - name: Publish permanent Historia launcher release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "historia-launcher-v1.0.7"
          $installer = "historia-clinica/launcher-v1/package/INSTALAR_LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_7.exe"
          $zip = "LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_7_COMPLETO.zip"
          $launcher = "historia-clinica/launcher-v1/package/HistoriaClinicaLauncher.exe"
          $updater = "historia-clinica/launcher-v1/package/HistoriaLauncherUpdater.exe"
          $uninstaller = "historia-clinica/launcher-v1/package/Desinstalar_Historia_Clinica_Dr_Revelo.exe"
          $sums = "historia-clinica/launcher-v1/package/SHA256SUMS.txt"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Launcher Historia Clínica v1.0.7" --notes "Launcher nativo v1.0.7: corrige de forma definitiva los scripts de preprueba aislada de app.py y conserva WebView2, instancia única, actualización obligatoria, SHA-256 y rollback."
          }
          gh release upload $tag $installer $zip $launcher $updater $uninstaller $sums --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-historia-v1-completo
          path: |
            LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_7_COMPLETO.zip
            historia-clinica/launcher-v1/package/INSTALAR_LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_7.exe
            historia-clinica/launcher-v1/package/HistoriaClinicaLauncher.exe
            historia-clinica/launcher-v1/package/HistoriaLauncherUpdater.exe
            historia-clinica/launcher-v1/package/Desinstalar_Historia_Clinica_Dr_Revelo.exe
            historia-clinica/launcher-v1/package/README.txt
            historia-clinica/launcher-v1/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
