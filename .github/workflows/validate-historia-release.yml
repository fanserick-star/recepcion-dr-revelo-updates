name: Validate Historia Canonical Source

on:
  push:
    branches: [main, cleanup/historia-canonical-source]
    paths:
      - "historia-clinica/app/**"
      - "historia-clinica/updates/**"
      - "historia-clinica/launcher-v1/app-channel-source.json"
      - "releases/historia/**"
      - "tools/test_historia_canonical_source.py"
      - "tools/validate_historia_runtime.py"
      - "tools/build_historia_app_channel.py"
      - ".github/workflows/validate-historia-release.yml"
  pull_request:
    paths:
      - "historia-clinica/app/**"
      - "historia-clinica/updates/**"
      - "historia-clinica/launcher-v1/app-channel-source.json"
      - "releases/historia/**"
      - "tools/test_historia_canonical_source.py"
      - "tools/validate_historia_runtime.py"
      - "tools/build_historia_app_channel.py"
      - ".github/workflows/validate-historia-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce canonical source and frozen history
        run: |
          python tools/test_historia_canonical_source.py

      - name: Validate current clinical runtime
        run: |
          python tools/validate_historia_runtime.py historia-clinica/app

      - name: Dry-run canonical channel generation
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cp historia-clinica/launcher-v1/app-channel.json /tmp/historia-channel-before.json
          python tools/build_historia_app_channel.py --commit "$RELEASE_SHA" --repository "$REPOSITORY"
          python - <<'PY'
          import json
          from pathlib import Path
          channel=json.loads(Path('historia-clinica/launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          source=json.loads(Path('historia-clinica/launcher-v1/app-channel-source.json').read_text(encoding='utf-8-sig'))
          version=json.loads(Path('historia-clinica/app/historia-version.json').read_text(encoding='utf-8-sig'))['version']
          assert channel['product']==source['product']=='historia-clinica-dr-revelo'
          assert str(channel['appVersion'])==str(version)
          assert channel['mandatory'] is True
          assert all('/historia-clinica/app/' in item['url'] for item in channel['files'])
          assert all('/historia-clinica/updates/' not in item['url'] for item in channel['files'])
          print('CANONICAL_CHANNEL_DRY_RUN_OK',version,'files',len(channel['files']))
          PY
