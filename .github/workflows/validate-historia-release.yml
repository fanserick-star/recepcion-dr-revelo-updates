name: Validate Historia release

on:
  push:
    paths:
      - "historia-clinica/updates/**"
      - "latest-historia*.json"
      - ".github/workflows/validate-historia-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launcher syntax
        shell: pwsh
        run: |
          python -m py_compile "historia-clinica/updates/v1_1_13_launcher_rescue/ABRIR_HISTORIA_CLINICA.py"
      - name: Assemble and validate Historia v1.2.1
        shell: pwsh
        run: |
          $parts = @(
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part01",
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part02",
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part03",
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part04"
          )
          $bytes = New-Object System.Collections.Generic.List[byte]
          foreach($p in $parts){ $bytes.AddRange([IO.File]::ReadAllBytes($p)) }
          [IO.File]::WriteAllBytes("$env:TEMP\historia_app_124.py",$bytes.ToArray())
          python -m py_compile "$env:TEMP\historia_app_124.py"
          python -m py_compile "historia-clinica/updates/v1_2_0_lan_hybrid/lan_bridge.py"
          python -m py_compile "historia-clinica/updates/v1_2_4_edit_afk/cloud_presence_patch.py"
          python -m py_compile "updates/v4_5_21_historia_attention_type/app_patch_4521.py"
          python -m py_compile "updates/v4_5_21_historia_attention_type/app.py"
      - name: Validate CSS structure
        shell: pwsh
        run: |
          $css = Get-Content "historia-clinica/updates/v1_2_4_edit_afk/style.css" -Raw
          $opens = ([regex]::Matches($css,[regex]::Escape("/*"))).Count
          $closes = ([regex]::Matches($css,[regex]::Escape("*/"))).Count
          if($opens -ne $closes){ throw "CSS comments unbalanced: $opens / $closes" }
          $bo = ([regex]::Matches($css,[regex]::Escape("{"))).Count
          $bc = ([regex]::Matches($css,[regex]::Escape("}"))).Count
          if($bo -ne $bc){ throw "CSS braces unbalanced: $bo / $bc" }
          if(-not $css.Contains(".home-workspace")){ throw "Missing home-workspace styles" }
          if(-not $css.Contains(".system-status-grid")){ throw "Missing system-status-grid styles" }

      - name: Smoke test real app startup
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0 pg8000==1.31.2
          $root = Join-Path $env:TEMP "hc_smoke"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "data") | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "static") | Out-Null

          $parts = @(
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part01",
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part02",
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part03",
            "historia-clinica/updates/v1_2_4_edit_afk/app.py.part04"
          )
          $bytes = New-Object System.Collections.Generic.List[byte]
          foreach($p in $parts){ $bytes.AddRange([IO.File]::ReadAllBytes($p)) }
          [IO.File]::WriteAllBytes((Join-Path $root "app.py"),$bytes.ToArray())
          Copy-Item "historia-clinica/updates/v1_1_3_live_sync/cloud_sync.py.part01" "$root\cloud_sync.py.p1"
          Copy-Item "historia-clinica/updates/v1_1_3_live_sync/cloud_sync.py.part02" "$root\cloud_sync.py.p2"
          $syncBytes = New-Object System.Collections.Generic.List[byte]
          $syncBytes.AddRange([IO.File]::ReadAllBytes("$root\cloud_sync.py.p1"))
          $syncBytes.AddRange([IO.File]::ReadAllBytes("$root\cloud_sync.py.p2"))
          [IO.File]::WriteAllBytes("$root\cloud_sync.py",$syncBytes.ToArray())
          Copy-Item "historia-clinica/updates/v1_2_4_edit_afk/cloud_presence_patch.py" "$root\cloud_presence_patch.py"
          Copy-Item "historia-clinica/updates/v1_2_0_lan_hybrid/lan_bridge.py" "$root\lan_bridge.py"

          @'
import sqlite3, pathlib
root = pathlib.Path(r"__ROOT__")
db = root / "data" / "historia_clinica.db"
c = sqlite3.connect(db)
c.executescript("""
CREATE TABLE meta(key TEXT PRIMARY KEY,value TEXT);
CREATE TABLE patients(
 id TEXT PRIMARY KEY, legacy_patient_id INTEGER, name TEXT, name_search TEXT,
 birth_date TEXT, sex TEXT, civil_status TEXT, address TEXT, phone TEXT,
 next_appointment_legacy TEXT, national_id TEXT, national_id_search TEXT,
 legacy_notes TEXT, legacy_photo BLOB, legacy_alert TEXT, email TEXT, insurer TEXT,
 legacy_no_depurable INTEGER DEFAULT 0, source TEXT, source_record_hash TEXT,
 created_at TEXT, updated_at TEXT, deleted_at TEXT
);
CREATE TABLE encounters(
 id TEXT PRIMARY KEY, patient_id TEXT, legacy_history_id INTEGER, legacy_patient_id INTEGER,
 encounter_date TEXT, encounter_time TEXT, clinical_note TEXT, diagnosis TEXT, treatment TEXT,
 source TEXT, source_record_hash TEXT, is_legacy_locked INTEGER DEFAULT 0,
 created_at TEXT, updated_at TEXT, deleted_at TEXT
);
CREATE TABLE patient_links(
 reception_patient_id TEXT PRIMARY KEY, clinical_patient_id TEXT, matched_by TEXT,
 verified INTEGER, verified_at TEXT, created_at TEXT, updated_at TEXT
);
CREATE TABLE waiting_queue(
 id TEXT PRIMARY KEY, reception_event_id TEXT UNIQUE, reception_patient_id TEXT,
 clinical_patient_id TEXT, display_name TEXT, identification TEXT, attention_type TEXT,
 queued_at TEXT, status TEXT, source TEXT, created_at TEXT, updated_at TEXT, deleted_at TEXT
);
CREATE TABLE audit_log(
 id INTEGER PRIMARY KEY AUTOINCREMENT, occurred_at TEXT, actor TEXT, action TEXT,
 entity_type TEXT, entity_id TEXT, details_json TEXT
);
CREATE TABLE encounter_addenda(
 id TEXT PRIMARY KEY, encounter_id TEXT, text TEXT, created_at TEXT, actor TEXT
);
CREATE TABLE macros(
 id TEXT PRIMARY KEY, label TEXT UNIQUE, text TEXT, created_at TEXT, updated_at TEXT
);
""")
c.commit()
c.close()
'@.Replace("__ROOT__",$root.Replace("\","\\")) | Set-Content "$root\make_db.py" -Encoding UTF8

          python "$root\make_db.py"
          Push-Location $root
          python -c "import app; print(app.APP_VERSION); assert app.APP_VERSION == '1.2.4'; print('APP_IMPORT_OK')"
          Pop-Location
