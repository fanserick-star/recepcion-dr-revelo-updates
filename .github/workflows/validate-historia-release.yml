name: Validate Historia Active Release Sources

on:
  push:
    branches: [main]
    paths:
      - "historia-clinica/launcher-v1/app-channel-source.json"
      - "historia-clinica/updates/**"
      - ".github/workflows/validate-historia-release.yml"
  pull_request:
    paths:
      - "historia-clinica/launcher-v1/app-channel-source.json"
      - "historia-clinica/updates/**"
      - ".github/workflows/validate-historia-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate active release source and clinical guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast,json,re

          root=Path('.')
          src=json.loads((root/'historia-clinica/launcher-v1/app-channel-source.json').read_text(encoding='utf-8'))
          version=str(src['appVersion']).strip()
          assert src['product']=='historia-clinica-dr-revelo'
          assert src['mandatory'] is True

          payload={}
          for item in src['files']:
            paths=item.get('sourcePaths') or [item['sourcePath']]
            data=b''.join((root/p).read_bytes() for p in paths)
            payload[item['path']]=data

          ver=json.loads(payload['historia-version.json'].decode('utf-8-sig'))['version']
          manifest=json.loads(payload['update_manifest.json'].decode('utf-8-sig'))
          assert str(ver)==version
          for key in ('version','app_version','runtime_version'):
            assert str(manifest[key])==version,(key,manifest[key],version)
          assert manifest['version_source']=='historia-version.json'
          assert manifest['mandatory'] is True
          assert set(manifest.get('required_dependencies') or []) <= set(payload)

          for name,data in payload.items():
            if name.endswith('.py'):
              compile(data.decode('utf-8-sig'),name,'exec')

          app=payload['app.py'].decode('utf-8-sig')
          cloud=payload['cloud_sync.py'].decode('utf-8-sig')
          docs=payload['documentos_clinicos.py'].decode('utf-8-sig')
          assert 'VERSION_PATH = ROOT / "historia-version.json"' in app
          assert 'HISTORIA_DATABASE_URL' in cloud
          assert 'HISTORIA_NEON_ENDPOINT_ID = "ep-sweet-mud-arlsk7qa"' in cloud
          assert 'HISTORIA_CLOUD_IDENTITY = "historia-clinica-dr-revelo"' in cloud
          assert 'CLOUD_SCHEMA = "public"' in cloud
          assert 'ON CONFLICT DO NOTHING' in cloud
          assert 'conn.commit()' in app
          assert 'cleanup_cancelled_queue_drafts' in app
          assert 'merge_safe_duplicate_patients' in app
          assert '_ensure_official_doctor_logo' in docs

          if 'static/style.css' in payload:
            css=payload['static/style.css'].decode('utf-8-sig')
            assert css.count('/*')==css.count('*/')
            assert css.count('{')==css.count('}')

          def vt(v):
            nums=[int(x) for x in re.findall(r'\d+',v)[:3]]
            return tuple((nums+[0,0,0])[:3])
          if vt(version)>=(1,3,66):
            notes=manifest.get('notes') or {}
            assert notes.get('runtime_consolidated') is True
            assert notes.get('self_contained_update') is True
            assert notes.get('external_historical_parts_required') is False
            assert all(not item.get('sourcePaths') for item in src['files'])

          print('ACTIVE_RELEASE_OK',version)
          print('CLINICAL_GUARDS_OK')
          print('NEON_ISOLATION_OK')
          PY
