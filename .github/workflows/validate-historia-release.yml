name: Validate Historia release

on:
  push:
    paths:
      - "historia-clinica/updates/**"
      - "historia-clinica/tests/**"
      - "updates/v4_5_22_historia_delete_sync/**"
      - "latest-historia*.json"
      - "latest-v4*.json"
      - "latest-v3.json"
      - ".github/workflows/validate-historia-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate launcher syntax
        shell: pwsh
        run: |
          python -m py_compile "historia-clinica/updates/v1_1_13_launcher_rescue/ABRIR_HISTORIA_CLINICA.py"

      - name: Assemble and validate Historia v1.3.0
        shell: pwsh
        run: |
          $parts = @(
            "historia-clinica/updates/v1_3_0_doctor_safety/app.py.part01",
            "historia-clinica/updates/v1_3_0_doctor_safety/app.py.part02",
            "historia-clinica/updates/v1_3_0_doctor_safety/app.py.part03",
            "historia-clinica/updates/v1_3_0_doctor_safety/app.py.part04"
          )
          $bytes = New-Object System.Collections.Generic.List[byte]
          foreach($p in $parts){ $bytes.AddRange([IO.File]::ReadAllBytes($p)) }
          [IO.File]::WriteAllBytes("$env:TEMP\historia_app_130.py",$bytes.ToArray())
          python -m py_compile "$env:TEMP\historia_app_130.py"
          python -m py_compile "historia-clinica/updates/v1_2_0_lan_hybrid/lan_bridge.py"
          python -m py_compile "historia-clinica/updates/v1_3_0_doctor_safety/cloud_presence_patch.py"
          python -m py_compile "updates/v4_5_22_historia_delete_sync/historia_bridge.py"
          python -m py_compile "updates/v4_5_22_historia_delete_sync/historia_lan_transport.py"
          python -m py_compile "updates/v4_5_22_historia_delete_sync/app_patch_4522.py"
          python -m py_compile "updates/v4_5_22_historia_delete_sync/app.py"

      - name: Validate CSS structure
        shell: pwsh
        run: |
          $css = Get-Content "historia-clinica/updates/v1_3_0_doctor_safety/style.css" -Raw
          $opens = ([regex]::Matches($css,[regex]::Escape("/*"))).Count
          $closes = ([regex]::Matches($css,[regex]::Escape("*/"))).Count
          if($opens -ne $closes){ throw "CSS comments unbalanced: $opens / $closes" }
          $bo = ([regex]::Matches($css,[regex]::Escape("{"))).Count
          $bc = ([regex]::Matches($css,[regex]::Escape("}"))).Count
          if($bo -ne $bc){ throw "CSS braces unbalanced: $bo / $bc" }
          if(-not $css.Contains(".home-workspace")){ throw "Missing home-workspace styles" }
          if(-not $css.Contains(".system-status-grid")){ throw "Missing system-status-grid styles" }

      - name: Install smoke-test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0 pg8000==1.31.2

      - name: Smoke test real Historia import
        shell: pwsh
        run: |
          python "historia-clinica/tests/smoke_runtime_130.py"
          python "updates/v4_5_22_historia_delete_sync/smoke_bridge_cancel.py"
