name: Publicar v4.3.60 validada (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aviso de rollback manual
        run: |
          echo 'Este workflow histórico ya no se ejecuta automáticamente.'
          echo 'Solo debe usarse manualmente para un rollback intencional a v4.3.60.'
      - name: Generar canal desde metadata única
        run: >-
          python tools/publish_release_from_meta.py
          --release-dir updates/v460
          --message "v4.3.60: prueba WhatsApp por Cloud sin tokens locales, Estado de servicios en pestaña, línea de tiempo por cita, versión junto a Nube y estados de Agenda con mayor contraste. Integridad SHA automatizada."
      - name: Verificar manifests idénticos
        run: |
          cmp latest-v3.json latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('latest-v3.json').read_text(encoding='utf-8'))
          assert a['version']=='4.3.60'
          print('CHANNEL_V460_OK')
          PY
      - name: Publicar rollback manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-v3.json latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'rollback manual: v4.3.60'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
