name: Publish v4.4.54 slot event capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4454-slot-event-capture.yml"
      - "build/v4454_slot_event_capture/**"

permissions:
  contents: write

concurrency:
  group: publish-v4454-slot-event-capture
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and publish v4.4.54
        shell: pwsh
        run: |
          python build/v4454_slot_event_capture/publish_v4454.py
