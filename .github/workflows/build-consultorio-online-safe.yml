name: Validate clean one-click consultorio master (no credentials)

on:
  push:
    branches:
      - feature/instalador-online-seguro-20261017
    paths:
      - "installer-online/**"
      - ".github/workflows/build-consultorio-online-safe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse source PowerShell with strict syntax
        shell: pwsh
        run: |
          foreach ($file in @(
            'installer-online/bootstrap.ps1',
            'installer-online/auto_enroll_install.ps1',
            'installer-online/provision_once_reception.ps1'
          )) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw "Error de sintaxis en $file" }
          }
      - name: Read public enrollment health with Windows-client-like UA (no secrets)
        run: |
          set -euo pipefail
          url="https://dr-revelo-enrollment.drrevelo.workers.dev/health"
          status=$(curl --silent --show-error --location --max-time 25 --retry 2 \
            --user-agent 'ConsultorioDrRevelo-Installer/1.0' \
            -o /tmp/revelo-health.json -w '%{http_code}' "$url")
          echo "ENROLLMENT_HTTP_STATUS=$status"
          if [ "$status" != "200" ]; then
            # No secrets. The generic API response is excluded from GitHub logs.
            echo "ENROLLMENT_HEALTH_NOT_REACHABLE: no credential delivery allowed."
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/revelo-health.json','r',encoding='utf-8') as f:d=json.load(f)
          assert d.get('service')=='consultorio-enrollment'
          assert d.get('ok') is True
          print("ENROLLMENT_HEALTH_OK")
          print("CREDENTIAL_PROVISIONING_COMPLETE=" + str(bool(d.get("configured"))).lower())
          PY
      - name: Test isolated Cloudflare approval and cryptography with dummy values
        run: |
          node --check installer-online/enrollment_worker.mjs
          node installer-online/test_enrollment.mjs
      - name: Test non-destructive clinical restoration and identical embedded source
        run: |
          python3 -m py_compile installer-online/restore_historia_initial.py
          python3 installer-online/test_restore_guards.py
          python3 - <<'PY'
          from pathlib import Path
          canonical=Path('installer-online/restore_historia_initial.py').read_text().strip()
          bootstrap=Path('installer-online/bootstrap.ps1').read_text()
          embedded=bootstrap.split("    $scriptSource = @'\n",1)[1].split("\n'@\n",1)[0].strip()
          assert canonical == embedded, 'Embedded clinical restoration is stale'
          for check in ('BEGIN READ ONLY',
                        'HISTORIA_FIRST_BOOT_RESTORE_OK',
                        'LOCAL_CLINICAL_EDITS_DETECTED_RESTORE_ABORTED',
                        'EXISTING_CLINICAL_DATA_NOT_VERIFIED_NO_AUTO_OVERWRITE'):
              assert check in embedded,check
          assert 'Reset-HistoriaBootstrap' not in bootstrap
          print('CLINICAL_RESTORE_READ_ONLY_GUARDS_OK')
          PY
      - name: Verify no private credentials or obsolete key-sealing in one-click source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('installer-online/consultorio_oneclick.c').read_text()
          assert 'prepare_ps.h' not in code
          assert 'seal_private_installer' not in code
          assert 'g_master_key' not in code
          assert 'auto_enroll_ps.h' in code
          assert 'bootstrap_ps.h' in code
          assert code.count('INSTALAR_CONSULTORIO_PRIVADO')==0
          print('ONE_CLICK_NO_EMBEDDED_SECRETS_OR_LEGACY_PATH_OK')
          PY

  windows-crypto:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Windows PowerShell 5.1 RSA-OAEP256 and AES
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rsa = New-Object System.Security.Cryptography.RSACng -ArgumentList @(2048)
          try {
            $bytes = [byte[]](0..63)
            $encrypted = $rsa.Encrypt($bytes,[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
            $result = $rsa.Decrypt($encrypted,[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
            if($result.Length -ne 64 -or $result[63] -ne 63) { throw 'RSA-OAEP256 falló' }
            $aes = [Security.Cryptography.Aes]::Create()
            try {
              $aes.Key = [byte[]](0..31); $aes.GenerateIV()
              $enc = $aes.CreateEncryptor()
              try { $cipher = $enc.TransformFinalBlock($bytes,0,64) }
              finally { $enc.Dispose() }
              $dec = $aes.CreateDecryptor()
              try { $plain = $dec.TransformFinalBlock($cipher,0,$cipher.Length) }
              finally { $dec.Dispose() }
              if($plain.Length -ne 64 -or $plain[42] -ne 42) { throw 'AES-CBC falló' }
            } finally { $aes.Dispose() }
          } finally { $rsa.Dispose() }
          Write-Host 'WINDOWS_CRYPT_TEST_OK'
      - name: Validate both clinic configuration roles with synthetic offline env files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $rec=Join-Path $env:RUNNER_TEMP 'reception-config-dummy.env'
          $hist=Join-Path $env:RUNNER_TEMP 'historia-config-dummy.env'
          [IO.File]::WriteAllText($rec, @'
          DATABASE_URL=postgresql://rec:test@ep-reception-testing.us-west-2.aws.neon.tech/neondb?sslmode=require
          HISTORIA_DATABASE_URL=postgresql://bridge:test@ep-sweet-mud-arlsk7qa-pooler.c-4.us-west-2.aws.neon.tech/neondb?sslmode=require
          AZUR_BASE_URL=https://billing.example.invalid
          AZUR_API_KEY=DUMMY_LOCAL_ONLY
          MOBILE_DOCTOR_TOKEN=DUMMY_LOCAL_ONLY
          MOBILE_RECEPTION_TOKEN=DUMMY_LOCAL_ONLY
          '@.Trim())
          [IO.File]::WriteAllText($hist, @'
          HISTORIA_SYNC_ENABLED=1
          HISTORIA_DATABASE_URL=postgresql://clinician:test@ep-sweet-mud-arlsk7qa-pooler.c-4.us-west-2.aws.neon.tech/neondb?sslmode=require
          '@.Trim())
          & '.\\installer-online\\provision_once_reception.ps1' -ReceptionEnv $rec -HistoriaEnv $hist -ValidateOnly
          if(-not $?) { throw 'One-time activation configuration did not validate.' }
          Write-Host 'TWO_ENV_OFFLINE_VALIDATION_OK'

      - name: Regression test DPAPI admin password with Windows CRLF and repeat runs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $filename=Join-Path $env:RUNNER_TEMP 'dpapi-instalador-test.txt'
          $expected='CI-TEST-ONLY-PERMANENT-ADMIN-'+[guid]::NewGuid().ToString('N')
          try {
            $secure=ConvertTo-SecureString $expected -AsPlainText -Force
            ($secure|ConvertFrom-SecureString)|Set-Content -LiteralPath $filename -Encoding ASCII
            for($iteration=1;$iteration -le 3;$iteration++){
              $cipher=(Get-Content -LiteralPath $filename -Raw -ErrorAction Stop).Trim()
              if(-not $cipher -or $cipher -notmatch '^[0-9a-fA-F]+
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'installer-online/auto_enroll_install.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){ throw 'PowerShell de autorización inválido' }

  build:
    needs: [validate-source, windows-crypto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows x64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Embed ONLY two credential-free first-install scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name,filename,array in (
             ('BOOTSTRAP_PS','bootstrap.ps1','bootstrap_ps1'),
             ('AUTO_ENROLL_PS','auto_enroll_install.ps1','auto_enroll_ps1')
          ):
             data=(Path('installer-online')/filename).read_bytes()
             head=Path('installer-online')/(array.replace('_ps1','') + '_ps.h')
             # Output filenames exactly as native includes.
             head=Path('installer-online')/(
                'bootstrap_ps.h' if filename=='bootstrap.ps1' else 'auto_enroll_ps.h'
             )
             with head.open('w',encoding='ascii') as out:
                out.write(f'#ifndef {name}_H\n#define {name}_H\n')
                out.write(f'static const unsigned char {array}[] = {{\n')
                for i in range(0,len(data),16):
                    out.write('  '+','.join(f'0x{v:02x}' for v in data[i:i+16])+',\n')
                out.write('};\n')
                out.write(f'static const unsigned long {array}_len = {len(data)}UL;\n#endif\n')
          PY
      - name: Compile ONE Windows executable without keys
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc installer-online/consultorio_oneclick.c \
            -o dist/INSTALADOR_MAESTRO_DR_REVELO_NO_PUBLICAR.exe \
            -std=c11 -O2 -s -municode -mwindows -static-libgcc \
            -lcomctl32 -lshell32 -ladvapi32
          file dist/*.exe
          test "$(wc -c < dist/INSTALADOR_MAESTRO_DR_REVELO_NO_PUBLICAR.exe)" -lt 2097152
          python3 - <<'PY'
          from pathlib import Path
          exe=Path('dist/INSTALADOR_MAESTRO_DR_REVELO_NO_PUBLICAR.exe').read_bytes()
          assert exe[:2]==b'MZ'
          assert b'DR_REVELO_ADMIN_TOKEN=' not in exe
          assert b'AZUR_API_KEY=' not in exe
          print('COMPILED_ONE_CLICK_NO_CREDENTIALS_OK')
          PY
          sha256sum dist/*.exe > dist/SHA256SUMS.txt
      - name: Retain internal candidate only; NOT a clinic release
        uses: actions/upload-artifact@v4
        with:
          name: internal-oneclick-unconfigured
          path: |
            dist/INSTALADOR_MAESTRO_DR_REVELO_NO_PUBLICAR.exe
            dist/SHA256SUMS.txt
          retention-days: 5
          if-no-files-found: error
){throw 'Stored DPAPI format invalid'}
              $restored=ConvertTo-SecureString -String $cipher -ErrorAction Stop
              $p=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($restored)
              try { $decoded=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($p) }
              finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($p) }
              if($decoded -cne $expected) { throw 'DPAPI restore mismatch' }
            }
            $script=[IO.File]::ReadAllText('installer-online/provision_once_reception.ps1')
            if(-not $script.Contains('(Get-Content -LiteralPath $adminFile -Raw -ErrorAction Stop).Trim()')){
              throw 'Provisioning script lost DPAPI CRLF correction'
            }
            Write-Host 'WINDOWS_DPAPI_REPEAT_ACTIVATION_OK_DUMMY_ONLY'
          } finally {
            Remove-Item -LiteralPath $filename -Force -ErrorAction SilentlyContinue
          }
      - name: Verify client syntax in native Windows PowerShell
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'installer-online/auto_enroll_install.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){ throw 'PowerShell de autorización inválido' }

