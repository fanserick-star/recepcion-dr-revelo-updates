name: Test and build consultorio online bootstrap (no secrets)

on:
  push:
    branches:
      - feature/instalador-online-seguro-20261017
    paths:
      - "installer-online/**"
      - ".github/workflows/build-consultorio-online-safe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell safely
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer-online/bootstrap.ps1"),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Parse private-preparation PowerShell helper
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer-online/create_private_installer.ps1"),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Parse embedded one-EXE preparation script
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer-online/prepare_embedded.ps1"),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Verify enrollment client PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer-online/auto_enroll_install.ps1"),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Test isolated enrollment worker with dummy secrets only
        run: |
          node --check installer-online/enrollment_worker.mjs
          node installer-online/test_enrollment.mjs
      - name: Check that clinical SQLite is not reset
        run: |
          if grep -q 'Reset-HistoriaBootstrap\|INSERT OR REPLACE INTO sync_state' installer-online/bootstrap.ps1; then
            echo "Clinical sync state mutation detected"; exit 1
          fi
      - name: Offline unit tests (dummy configuration only)
        run: |
          python3 installer-online/test_sealer.py
          python3 -m py_compile installer-online/seal_private_installer.py
          if grep -R -n 'DR_REVELO_PRIVATE_CONFIG_B64=' installer-online/; then
            echo "Unexpected embedded configuration assignment"; exit 1
          fi
      - name: Prepare Windows cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Embed secret-free PowerShell script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("installer-online/bootstrap.ps1").read_bytes()
          out = Path("installer-online/bootstrap_ps.h")
          with out.open("w", encoding="ascii") as f:
              f.write("#ifndef DR_REVELO_BOOTSTRAP_PS_H\n#define DR_REVELO_BOOTSTRAP_PS_H\n")
              f.write("static const unsigned char bootstrap_ps1[] = {\n")
              for i in range(0, len(src), 16):
                  f.write("  "+",".join(f"0x{x:02x}" for x in src[i:i+16])+",\n")
              f.write("};\n")
              f.write(f"static const unsigned long bootstrap_ps1_len = {len(src)}UL;\n#endif\n")
          PY
      - name: Embed self-preparation PowerShell (source-PC only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("installer-online/prepare_embedded.ps1").read_bytes()
          out = Path("installer-online/prepare_ps.h")
          with out.open("w", encoding="ascii") as f:
              f.write("#ifndef DR_REVELO_PREPARE_PS_H\n#define DR_REVELO_PREPARE_PS_H\n")
              f.write("static const unsigned char prepare_ps1[] = {\n")
              for i in range(0, len(src), 16):
                  f.write("  "+",".join(f"0x{x:02x}" for x in src[i:i+16])+",\n")
              f.write("};\n")
              f.write(f"static const unsigned long prepare_ps1_len = {len(src)}UL;\n#endif\n")
          PY
      - name: Embed automatic secure enrollment client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("installer-online/auto_enroll_install.ps1").read_bytes()
          out = Path("installer-online/auto_enroll_ps.h")
          with out.open("w", encoding="ascii") as f:
              f.write("#ifndef DR_REVELO_AUTO_ENROLL_PS_H\n#define DR_REVELO_AUTO_ENROLL_PS_H\n")
              f.write("static const unsigned char auto_enroll_ps1[] = {\n")
              for i in range(0, len(src), 16):
                  f.write("  "+",".join(f"0x{x:02x}" for x in src[i:i+16])+",\n")
              f.write("};\n")
              f.write(f"static const unsigned long auto_enroll_ps1_len = {len(src)}UL;\n#endif\n")
          PY
      - name: Compile credential-free EXE
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc installer-online/consultorio_bootstrap.c \
            -o dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe \
            -std=c11 -O2 -s -mwindows -municode -static-libgcc \
            -lbcrypt -lcrypt32 -lshell32 -lcomctl32 -ladvapi32
          file dist/*.exe
          test "$(wc -c < dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe)" -lt 12582912
          # The stub must never contain private URLs, even encrypted production secrets.
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "installer-online")
          from seal_private_installer import MARKER, seal
          exe = Path("dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe").read_bytes()
          assert exe.count(MARKER) == 1, "Compiler changed key layout: fail closed"
          fake = b"DR_REVELO_CONFIG_V2\n[RECEPTION]\nDATABASE_URL=fake-a\n[HISTORIA]\nHISTORIA_DATABASE_URL=fake-b\n"
          sealed = seal(exe, fake)
          assert len(sealed) > len(exe)
          assert fake not in sealed
          assert b"fake-a" not in sealed
          PY
          sha256sum dist/*.exe > dist/SHA256SUMS.txt
      - name: Smoke-test private EXE preparation with FAKE local configs
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'dr-revelo-fake-seal'
          New-Item -ItemType Directory -Force $work | Out-Null
          $rec = Join-Path $work 'rec.env'
          $hist = Join-Path $work 'hist.env'
          $out = Join-Path $work 'TEST_PRIVADO_NO_PUBLICAR.exe'
          [IO.File]::WriteAllText($rec,("DATABASE_URL=postgresql://dummy.invalid/fake-reception" + [Environment]::NewLine + "HISTORIA_DATABASE_URL=postgresql://dummy.invalid/fake-history" + [Environment]::NewLine + "AZUR_BASE_URL=https://billing.invalid" + [Environment]::NewLine + "AZUR_API_KEY=dummy-ci-key" + [Environment]::NewLine + "MOBILE_DOCTOR_TOKEN=dummy-doctor-ci-key" + [Environment]::NewLine + "MOBILE_RECEPTION_TOKEN=dummy-reception-ci-key" + [Environment]::NewLine + "RP_WORKSTATION_NAME=OLD-RECEPTION-PC" + [Environment]::NewLine + "RP_FORCE_OFFLINE=1" + [Environment]::NewLine + "WHATSAPP_CLOUD_MODE=0" + [Environment]::NewLine + "WHATSAPP_ENABLED=1" + [Environment]::NewLine))
          [IO.File]::WriteAllText($hist,("HISTORIA_DATABASE_URL=postgresql://dummy.invalid/fake-history" + [Environment]::NewLine))
          $python = (Get-Command python3 -ErrorAction Stop).Source
          New-Item -ItemType SymbolicLink -Path (Join-Path $work 'python.exe') -Target $python -Force | Out-Null
          $env:PATH = $work + [IO.Path]::PathSeparator + $env:PATH
          & ./installer-online/create_private_installer.ps1 -BaseExe './dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe' -ReceptionEnv $rec -HistoriaEnv $hist -OutputExe $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'Falló el sellado privado con datos ficticios.' }
          $printable = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($out))
          if ($printable.Contains('dummy-ci-key') -or $printable.Contains('dummy.invalid')) {
            throw 'Datos privados ficticios visibles sin cifrar en el EXE.'
          }
          Remove-Item $out,$rec,$hist -Force

      - name: Smoke-test embedded one-EXE private preparation with FAKE configs
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'dr-revelo-internal-seal'
          New-Item -ItemType Directory -Force $work | Out-Null
          $rec = Join-Path $work 'rec.env'
          $hist = Join-Path $work 'hist.env'
          $out = Join-Path $work 'TEST_PRIVADO_NO_PUBLICAR.exe'
          [IO.File]::WriteAllText($rec,("DATABASE_URL=postgresql://dummy.invalid/fake-reception" + [Environment]::NewLine + "HISTORIA_DATABASE_URL=postgresql://dummy.invalid/fake-history" + [Environment]::NewLine + "AZUR_BASE_URL=https://billing.invalid" + [Environment]::NewLine + "AZUR_API_KEY=dummy-ci-key" + [Environment]::NewLine + "MOBILE_DOCTOR_TOKEN=dummy-doctor-ci-key" + [Environment]::NewLine + "MOBILE_RECEPTION_TOKEN=dummy-reception-ci-key" + [Environment]::NewLine + "RP_WORKSTATION_NAME=OLD-PC" + [Environment]::NewLine + "WHATSAPP_ENABLED=1" + [Environment]::NewLine))
          [IO.File]::WriteAllText($hist,("HISTORIA_DATABASE_URL=postgresql://dummy.invalid/fake-history" + [Environment]::NewLine))
          & ./installer-online/prepare_embedded.ps1 -BaseExe './dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe' -ReceptionEnv $rec -HistoriaEnv $hist -OutputExe $out
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw 'Falló la preparación privada interna.' }
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($out))
          if ($txt.Contains('dummy-ci-key') -or $txt.Contains('dummy.invalid')) { throw 'Secretos de prueba expuestos.' }
      - name: Decrypt test payload (fake keys only) to verify native compatibility
        run: |
          python3 - <<'PY'
          import hashlib, hmac, struct, pathlib, os, sys
          sys.path.insert(0,'installer-online')
          from seal_private_installer import MARKER
          base=pathlib.Path('dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe').read_bytes()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'dr-revelo-internal-seal'
          sealed=(root/'TEST_PRIVADO_NO_PUBLICAR.exe').read_bytes()
          key=sealed[base.index(MARKER):base.index(MARKER)+64]
          assert key!=MARKER
          magic,version,length,nonce,mac=struct.unpack('<16sII16s32s',sealed[-72:])
          assert magic==b'DRRV2CFGFOOTER!!' and version==2
          cipher=sealed[-72-length:-72]
          assert hmac.compare_digest(hmac.new(key[32:],struct.pack('<II',2,length)+nonce+cipher,hashlib.sha256).digest(),mac)
          plain=bytearray()
          for count,p in enumerate(range(0,length,32)):
              stream=hashlib.sha256(key[:32]+nonce+struct.pack('<I',count)).digest()
              plain+=bytes(x^y for x,y in zip(cipher[p:p+32],stream))
          assert b'AZUR_API_KEY=dummy-ci-key' in plain
          assert b'MOBILE_DOCTOR_TOKEN=dummy-doctor-ci-key' in plain
          assert b'RP_WORKSTATION_NAME=' not in plain
          assert b'WHATSAPP_ENABLED=0' in plain
          assert b'WHATSAPP_CLOUD_MODE=1' in plain
          print('ONE_EXE_PRIVATE_PREPARATION_OK_DUMMY_ONLY')
          PY
      - name: Upload PUBLIC-SAFE BASE ONLY
        uses: actions/upload-artifact@v4
        with:
          name: instalador-base-sin-credenciales
          path: |
            dist/INSTALADOR_CONSULTORIO_BASE_SIN_CREDENCIALES.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
