name: Validar y publicar v4.3.79
on:
  push:
    branches: [main]
    paths:
      - 'build/v479/**'
      - '.github/workflows/build-v479-validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir paquete candidato
        run: python build/v479/build_v479.py
      - name: Validar Python, JS y paquete
        run: |
          cat updates/v479/app.part* > _ci_app.py
          cat updates/v479/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
          python _ci_launcher.py --self-test-core
          python - <<'PY'
          import ast,json,hashlib
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src); js=None
          for node in tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='V479_POLISH_JS' for t in node.targets):
                  js=ast.literal_eval(node.value);break
          assert js
          for token in ['Agenda de hoy','v479-no-reject','count<=0','renderAttentionWeek','loadBilling']:
              assert token in js, token
          Path('_ci_v479.js').write_text(js,encoding='utf-8')
          assert 'V478_REMIX_JS' in src and 'MAÑANA' in src and 'TARDE' in src
          assert 'V476_JS' in src and 'b.estado = "EMITIDA"' in src
          assert 'APP_VERSION = "4.3.79"' in src
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.79'
          ai=next(x for x in latest['files'] if x['path']=='app.py')
          li=next(x for x in latest['files'] if x['path']=='ABRIR_RECEPCION.py')
          assert hashlib.sha256(Path('_ci_app.py').read_bytes()).hexdigest()==ai['sha256']
          assert hashlib.sha256(Path('_ci_launcher.py').read_bytes()).hexdigest()==li['sha256']
          print('VALIDACION V4.3.79 OK')
          PY
          node --check _ci_v479.js
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v479 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.79 pulido Agenda y Facturación'
          git pull --rebase origin main
          git push
