name: Construir candidata v4.3.66
on:
  push:
    branches: [main]
    paths:
      - 'build/v466/**'
      - '.github/workflows/build-v466-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guardar huella de Agenda web
        run: git rev-parse HEAD:agenda > _agenda_tree_before.txt
      - name: Construir candidata exacta
        run: python build/v466/build_v466.py
      - name: Compilar y validar
        run: |
          cat updates/v466/app.part* > _ci_app.py
          python -m py_compile _ci_app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          t=ast.parse(Path('_ci_app.py').read_text(encoding='utf-8'))
          wanted={'V458_SETTINGS_JS':'_ci_v458.js','V459_SETTINGS_JS':'_ci_v459.js','V460_OVERLAY_JS':'_ci_v460.js'}
          found={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in wanted:
                  found[n.targets[0].id]=ast.literal_eval(n.value)
          if set(found)!=set(wanted): raise SystemExit('Faltan bloques JS a validar')
          for name,value in found.items(): Path(wanted[name]).write_text(value,encoding='utf-8')
          PY
          node --check _ci_v458.js
          node --check _ci_v459.js
          node --check _ci_v460.js
          python build/v466/test_v466.py
      - name: Verificar que Agenda web quedó intacta
        run: |
          test "$(cat _agenda_tree_before.txt)" = "$(git rev-parse HEAD:agenda)"
          git diff --exit-code -- agenda
      - name: Publicar candidata sin mover canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v466
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'candidate: construir v4.3.66 verificada'; git pull --rebase origin main; git push; fi
