name: Validate v4.5.4 release

on:
  push:
    branches: [ main ]
    paths:
      - 'updates/v4_5_04_dataphone_ready/**'
      - '.github/workflows/validate-v4504.yml'
  pull_request:
    paths:
      - 'updates/v4_5_04_dataphone_ready/**'
      - '.github/workflows/validate-v4504.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile v4.5.4 Python files
        run: |
          python -m py_compile updates/v4_5_04_dataphone_ready/app_patch_4504.py
          if [ -f updates/v4_5_04_dataphone_ready/app.py ]; then
            python -m py_compile updates/v4_5_04_dataphone_ready/app.py
          fi
      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('updates/v4_5_04_dataphone_ready/app_patch_4504.py')
          s=p.read_text(encoding='utf-8')
          checks={
            'version':'APP_VERSION = "4.5.4"' in s,
            'mixed':'"MIXTO": -442999' in s,
            'debit':'"TARJETA_DEBITO": -442916' in s,
            'credit':'"TARJETA_CREDITO": -442919' in s,
            'no_pan':'No se guarda tarjeta ni CVV' in s,
            'azur':'core._azur_payload_for_group' in s and 'v4504_azur_payload_for_group' in s,
            'no_schema':'database_schema_changes": False' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
            raise SystemExit('Missing safety checks: '+', '.join(bad))
          print('v4.5.4 static checks OK')
          PY
