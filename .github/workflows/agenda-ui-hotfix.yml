name: Ajustar Agenda web

on:
  push:
    paths:
      - 'agenda-ui-hotfix.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar mejoras visuales y de acceso
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('agenda/index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('No se encontró patrón esperado:\n'+old[:180])
              s=s.replace(old,new,1)

          rep('.brand-mark{width:52px;height:52px;border-radius:14px;background:#fff;color:#173153;display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:-1px;box-shadow:0 4px 14px #0003}.brand-copy',
              '.brand-logo{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:contain;padding:4px;box-shadow:0 4px 14px #0003}.brand-copy')
          rep('.brand-copy span{display:block;font-size:12px;color:#c9d6e8;margin-top:2px}.icon{',
              '.brand-copy span{display:block;font-size:12px;color:#c9d6e8;margin-top:2px}.top-actions{display:flex;align-items:center;gap:7px}.mode-switch{display:none;border:1px solid #ffffff26;background:#ffffff0f;color:#e8eff9;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.mode-switch.show{display:block}.icon{')
          rep('.appt .time-mini{display:block;font-size:9px;margin-top:4px;color:#6c7c90}.lunch-time',
              '.appt .time-mini{display:block;font-size:9px;margin-top:4px;color:#6c7c90}.appt .note{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:10px;line-height:1.2;margin-top:4px;color:#245d70;font-weight:750}.lunch-time')
          rep('.moving{background:#fff8db;border:1px solid #eedb83;border-radius:12px;padding:10px 12px;margin:10px 0;color:#6c5b16;font-size:12px}@media',
              '.moving{background:#fff8db;border:1px solid #eedb83;border-radius:12px;padding:10px 12px;margin:10px 0;color:#6c5b16;font-size:12px}.mode-help{font-size:12px;color:#68778c;line-height:1.45;margin:8px 0 13px}@media')
          rep('@media(max-width:600px){.top{padding:8px 10px}.brand-mark{width:46px;height:46px;font-size:17px}.brand-copy',
              '@media(max-width:600px){.top{padding:8px 10px}.brand-logo{width:46px;height:46px}.brand-copy')
          rep('.brand-copy span{font-size:11px}.wrap{',
              '.brand-copy span{font-size:11px}.mode-switch{padding:7px 8px;font-size:10px}.wrap{')

          rep('<header class="top"><div class="brand"><div class="brand-mark" aria-hidden="true">AR</div><div class="brand-copy"><b>Agenda Dr. Armando Revelo</b><span id="mode">Verificando acceso…</span></div></div><button class="icon" id="refresh" aria-label="Actualizar">↻</button></header>',
              '<header class="top"><div class="brand"><img class="brand-logo" src="logo.svg" alt="Logo Dr. Armando Revelo"><div class="brand-copy"><b>Agenda Dr. Armando Revelo</b><span id="mode">Verificando acceso…</span></div></div><div class="top-actions"><button class="mode-switch" id="modeSwitch" type="button"></button><button class="icon" id="refresh" aria-label="Actualizar">↻</button></div></header>')

          rep("function getKey(){const h=new URLSearchParams(location.hash.replace(/^#/,''));state.key=h.get('token')||localStorage.getItem('revelo_agenda_cloud_key')||'';if(state.key)localStorage.setItem('revelo_agenda_cloud_key',state.key);if(state.key)history.replaceState({},'',`${location.pathname}${location.search}#token=${encodeURIComponent(state.key)}`)}",
              "function tokenFromText(raw){let v=String(raw||'').trim();if(!v)return'';try{const u=new URL(v);const h=new URLSearchParams(u.hash.replace(/^#/,''));return h.get('token')||v}catch{}const m=v.match(/(?:^|[#?&])token=([^&\\s]+)/i);if(m)return decodeURIComponent(m[1]);return v}\nfunction setHash(key){history.replaceState({},'',`${location.pathname}${location.search}#token=${encodeURIComponent(key)}`)}\nfunction getKey(){const h=new URLSearchParams(location.hash.replace(/^#/,''));state.key=h.get('token')||localStorage.getItem('revelo_agenda_cloud_key')||'';if(state.key){localStorage.setItem('revelo_agenda_cloud_key',state.key);setHash(state.key)}}\nfunction rememberRoleKey(){if(state.role==='doctor')localStorage.setItem('revelo_agenda_doctor_key',state.key);if(state.role==='reception')localStorage.setItem('revelo_agenda_reception_key',state.key)}")

          old="function rowKind(r){const s=String(r.source_type||'');if(s==='PATIENT_APPOINTMENT')return {type:'linked',id:Number(r.appointment_id||r.source_id),editable:true};if(s==='MOBILE_UNLINKED')return {type:'staged',id:Number(r.staged_id||r.source_id),editable:true};return {type:'staged',id:Number(r.staged_id||r.source_id),editable:false}}\nasync function boot(){getKey();if(!state.key)return fatal('Este enlace no tiene una llave válida.');try{state.role=String(scalar(await rpc('agenda_web_role',{p_token:state.key}))||'');if(!state.role)return fatal('Este enlace ya no es válido.');$('#mode').textContent=state.role==='doctor'?'Doctor · solo lectura':'Ayudante · agenda editable';$('#hint').textContent=state.role==='doctor'?'Toca una cita para ver el detalle.':'Toca un horario disponible para agendar.';state.mon=monOf(new Date());await load()}catch(e){fatal(e.message)}}"
          new="function rowKind(r){const s=String(r.source_type||'');if(s==='PATIENT_APPOINTMENT')return {type:'linked',id:Number(r.appointment_id||r.source_id),editable:true};if(s==='MOBILE_UNLINKED')return {type:'staged',id:Number(r.staged_id||r.source_id),editable:true};return {type:'staged',id:Number(r.staged_id||r.source_id),editable:false}}\nfunction renderModeSwitch(){const b=$('#modeSwitch');b.classList.remove('show');if(state.role==='doctor'){b.textContent='✎ Agendar';b.title='Cambiar al acceso editable de recepción';b.classList.add('show')}else{const d=localStorage.getItem('revelo_agenda_doctor_key');if(d){b.textContent='👁 Solo lectura';b.title='Volver al acceso del doctor';b.classList.add('show')}}}\nasync function activateKey(key){key=tokenFromText(key);if(!key)return false;const oldKey=state.key,oldRole=state.role;state.key=key;state.jwt='';state.exp=0;try{const role=String(scalar(await rpc('agenda_web_role',{p_token:key}))||'');if(!role)throw Error('El enlace no tiene acceso válido');state.role=role;localStorage.setItem('revelo_agenda_cloud_key',key);rememberRoleKey();setHash(key);$('#mode').textContent=role==='doctor'?'Doctor · solo lectura':'Recepción · agenda editable';$('#hint').textContent=role==='doctor'?'Toca una cita para ver el detalle.':'Toca un horario disponible para agendar.';renderModeSwitch();state.move=null;await load();return true}catch(e){state.key=oldKey;state.role=oldRole;state.jwt='';toast(e.message||'No se pudo cambiar el acceso');return false}}\nasync function boot(){getKey();if(!state.key)return fatal('Este enlace no tiene una llave válida.');try{state.role=String(scalar(await rpc('agenda_web_role',{p_token:state.key}))||'');if(!state.role)return fatal('Este enlace ya no es válido.');rememberRoleKey();$('#mode').textContent=state.role==='doctor'?'Doctor · solo lectura':'Recepción · agenda editable';$('#hint').textContent=state.role==='doctor'?'Toca una cita para ver el detalle.':'Toca un horario disponible para agendar.';renderModeSwitch();state.mon=monOf(new Date());await load()}catch(e){fatal(e.message)}}"
          rep(old,new)

          rep("function appt(r){const i=state.rows.indexOf(r),z=tp(String(r.hora).slice(0,5));return `<div class=\"slot\"><button class=\"appt\" data-row=\"${i}\"><span class=\"name\">${esc(r.patient_name)}</span><span class=\"time-mini\">${z.t} ${z.p}</span></button></div>`}",
              "function appt(r){const i=state.rows.indexOf(r),z=tp(String(r.hora).slice(0,5)),note=String(r.nota||'').trim();return `<div class=\"slot\"><button class=\"appt\" data-row=\"${i}\"><span class=\"name\">${esc(r.patient_name)}</span><span class=\"time-mini\">${z.t} ${z.p}</span>${note?`<span class=\"note\">${esc(note)}</span>`:''}</button></div>`}")
          rep('<div><span>Nota</span><strong>${esc(r.nota)}</strong></div>', '<div><span>Nota / procedimiento</span><strong>${esc(r.nota)}</strong></div>')

          marker="async function cancelRow(i){const r=state.rows[i],k=rowKind(r);if(!r||state.role!=='reception'||!k.editable)return;if(!confirm(`¿Cancelar la cita de ${r.patient_name} y liberar el horario?`))return;try{await rpc('agenda_web_cancel',{p_token:state.key,p_source_type:k.type,p_source_id:k.id});closeModal();toast('Horario liberado');await load()}catch(e){toast(e.message)}}\n"
          insert="""async function cancelRow(i){const r=state.rows[i],k=rowKind(r);if(!r||state.role!=='reception'||!k.editable)return;if(!confirm(`¿Cancelar la cita de ${r.patient_name} y liberar el horario?`))return;try{await rpc('agenda_web_cancel',{p_token:state.key,p_source_type:k.type,p_source_id:k.id});closeModal();toast('Horario liberado');await load()}catch(e){toast(e.message)}}
async function switchMode(){if(state.role==='doctor'){const saved=localStorage.getItem('revelo_agenda_reception_key');if(saved){await activateKey(saved);return}openModal(`<div class=\"kicker\">MODO RECEPCIÓN</div><h2>Habilitar agenda editable</h2><p class=\"mode-help\">Para mantener el acceso seguro, pega una sola vez el enlace de <b>Recepción / Agenda editable</b> que genera el programa del consultorio. Después este botón cambiará de modo con un toque.</p><label>Enlace de recepción<input id=\"accessLink\" class=\"field\" autocomplete=\"off\" placeholder=\"Pega aquí el enlace editable\"></label><div class=\"actions\"><button class=\"btn secondary\" onclick=\"window.agClose()\">Cancelar</button><button class=\"btn primary\" onclick=\"window.agUseReception()\">Usar acceso editable</button></div>`)}else{const doc=localStorage.getItem('revelo_agenda_doctor_key');if(doc)await activateKey(doc)}}
async function useReception(){const key=tokenFromText($('#accessLink')?.value||'');if(!key)return toast('Pega el enlace de recepción');try{const role=String(scalar(await rpc('agenda_web_role',{p_token:key}))||'');if(role!=='reception')return toast('Ese enlace no es el acceso editable de recepción');closeModal();await activateKey(key)}catch(e){toast(e.message||'No se pudo validar el enlace')}}
"""
          rep(marker,insert)

          rep("window.agClose=closeModal;window.agCreate=create;window.agMove=startMove;window.agCancel=cancelRow;$('#refresh').onclick=()=>load();$('#prev').onclick=()=>{state.mon=add(state.mon,-7);state.move=null;load()};$('#next').onclick=()=>{state.mon=add(state.mon,7);state.move=null;load()};$('#today').onclick=()=>{state.mon=monOf(new Date());state.move=null;load()};boot();",
              "window.agClose=closeModal;window.agCreate=create;window.agMove=startMove;window.agCancel=cancelRow;window.agUseReception=useReception;$('#refresh').onclick=()=>load();$('#prev').onclick=()=>{state.mon=add(state.mon,-7);state.move=null;load()};$('#next').onclick=()=>{state.mon=add(state.mon,7);state.move=null;load()};$('#today').onclick=()=>{state.mon=monOf(new Date());state.move=null;load()};$('#modeSwitch').onclick=switchMode;boot();")

          p.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('agenda/index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8; b=s.index('</script>')
          Path('/tmp/agenda.js').write_text(s[a:b],encoding='utf-8')
          for needle in ('logo.svg','class="note"','id="modeSwitch"','agUseReception'):
              if needle not in s: raise SystemExit('Falta '+needle)
          PY
          node --check /tmp/agenda.js

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda/index.html
          git diff --cached --quiet || git commit -m "Agenda web: notas, logo y cambio seguro a recepción"
          git push
