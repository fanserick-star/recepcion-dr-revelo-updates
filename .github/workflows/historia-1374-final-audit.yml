name: Historia 1.3.74 Final Audit

on:
  push:
    branches: [historia-1.3.74-final-audit]
    paths:
      - "historia-clinica/**"
      - ".github/workflows/historia-1374-final-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historia-1.3.74-final-audit
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply 1.3.74 closure patch
        shell: pwsh
        run: python historia-clinica/tools/apply_1374_final_audit.py

      - name: Compile canonical runtime
        shell: pwsh
        run: |
          python -m py_compile historia-clinica/app/app.py
          python -m py_compile historia-clinica/app/cloud_sync.py
          python -m py_compile historia-clinica/app/documentos_clinicos.py
          python -m py_compile historia-clinica/app/lan_bridge.py
          python -m py_compile historia-clinica/app/cloud_presence_patch.py

      - name: Install smoke dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check fastapi==0.128.2 uvicorn==0.48.0 pg8000==1.31.2

      - name: Run current functional smoke
        shell: pwsh
        run: python historia-clinica/tests/smoke_runtime_1374.py

      - name: Verify no historical patch chain reappeared
        shell: python
        run: |
          import pathlib,re,json
          root=pathlib.Path('historia-clinica/app')
          app=(root/'app.py').read_text(encoding='utf-8-sig')
          assert not re.search(r'import\s+app_patch_',app)
          assert not re.search(r'from\s+app_patch_',app)
          assert 'FROM historia.{table}' not in app
          cloud=(root/'cloud_sync.py').read_text(encoding='utf-8-sig')
          assert 'pushed = self._push(pg)' in cloud
          assert 'sync_conflicts' in cloud
          docs=(root/'documentos_clinicos.py').read_text(encoding='utf-8-sig')
          assert 'Letter portrait' not in docs
          assert 'Carta vertical' not in docs
          version=json.loads((root/'historia-version.json').read_text(encoding='utf-8-sig'))['version']
          assert version=='1.3.74'
          print('CANONICAL_RUNTIME_OK',version)

      - name: Commit validated 1.3.74 source to branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app historia-clinica/tests/smoke_runtime_1374.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "Historia 1.3.74: cierre funcional auditado"
            git push origin HEAD:historia-1.3.74-final-audit
          } else {
            Write-Host "Sin cambios pendientes de commit"
          }
