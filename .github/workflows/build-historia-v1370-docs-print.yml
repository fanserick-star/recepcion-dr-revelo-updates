name: Build Historia 1.3.70 Linked Documents

on:
  push:
    branches:
      - feature/historia-1370-docs-print
    paths:
      - tools/build_historia_1370.py
      - tools/patch_build_historia_1370.py
      - .github/workflows/build-historia-v1370-docs-print.yml

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/historia-1370-docs-print
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 1.3.70 candidate
        shell: pwsh
        run: |
          python tools/patch_build_historia_1370.py
          python tools/build_historia_1370.py

      - name: Verify source package
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, py_compile
          root=Path.cwd()
          dst=root/'historia-clinica/updates/v1_3_70_linked_documents'
          required=['app.py','cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','documentos_clinicos.py','requirements.txt','static/style.css','static/doctor_icon.b64','historia-version.json','update_manifest.json']
          missing=[p for p in required if not (dst/p).is_file()]
          assert not missing, missing
          assert json.loads((dst/'historia-version.json').read_text(encoding='utf-8'))['version']=='1.3.70'
          m=json.loads((dst/'update_manifest.json').read_text(encoding='utf-8'))
          assert m['notes']['documents_linked_to_encounter'] is True
          assert m['notes']['prescription_save_does_not_print'] is True
          assert m['notes']['prescription_reprint_no_duplicate'] is True
          assert m['notes']['certificate_reprint_no_duplicate'] is True
          assert m['notes']['auto_print_hardened'] is True
          app=(dst/'app.py').read_text(encoding='utf-8')
          docs=(dst/'documentos_clinicos.py').read_text(encoding='utf-8')
          assert 'DOCUMENTOS DE ESTA CONSULTA' in app
          assert 'documentActivity' in app
          assert 'signed_document_only' in app
          assert "id='rx-save'" in docs
          assert 'prescription_id:prescriptionId' in docs
          assert "rx-print').onclick=()=>openPreview('print')" in docs
          assert "rx-pdf').onclick=()=>openPreview('pdf')" in docs
          assert 'setTimeout(()=>window.print(),250)' not in docs
          py_compile.compile(str(dst/'app.py'), doraise=True)
          py_compile.compile(str(dst/'documentos_clinicos.py'), doraise=True)
          print('1.3.70 source verification OK')
          '@ | python -

      - name: Verify unchanged infrastructure blobs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root=Path.cwd()/'historia-clinica/updates'
          old=root/'v1_3_69_professional_ui'; new=root/'v1_3_70_linked_documents'
          unchanged=['cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','requirements.txt','static/doctor_icon.b64']
          for rel in unchanged:
              a=(old/rel).read_bytes(); b=(new/rel).read_bytes()
              assert a==b, f'{rel} changed unexpectedly'
          print('Infrastructure byte contract OK')
          '@ | python -

      - name: Remove generated bytecode
        shell: pwsh
        run: |
          Get-ChildItem -Path historia-clinica/updates/v1_3_70_linked_documents -Directory -Recurse -Filter __pycache__ | Remove-Item -Recurse -Force

      - name: Commit candidate
        shell: pwsh
        run: |
          git config user.name "fanserick-star"
          git config user.email "fanserick@hotmail.com"
          git checkout -- tools/build_historia_1370.py
          git add historia-clinica/updates/v1_3_70_linked_documents historia-clinica/launcher-v1/app-channel-source.json
          git diff --cached --quiet && exit 0
          git commit -m "Generar Historia 1.3.70 documentos ligados y flujo de impresión"
          git push origin HEAD:feature/historia-1370-docs-print
