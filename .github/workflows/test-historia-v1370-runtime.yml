name: Test Historia 1.3.70 Runtime

on:
  push:
    branches:
      - feature/historia-1370-docs-print
    paths:
      - .github/workflows/test-historia-v1370-runtime.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/historia-1370-docs-print
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r historia-clinica/updates/v1_3_70_linked_documents/requirements.txt httpx
      - name: Exercise linked-document workflow
        shell: pwsh
        run: |
          @'
          import os, sys, sqlite3, json
          from pathlib import Path
          root=Path.cwd()/"historia-clinica/updates/v1_3_70_linked_documents"
          data=root/"data"
          data.mkdir(exist_ok=True)
          dbfile=data/"historia_clinica.db"
          if dbfile.exists(): dbfile.unlink()
          os.environ.pop("HISTORIA_DATABASE_URL",None)
          os.environ.pop("DATABASE_URL",None)
          sys.path.insert(0,str(root))
          import app as mod
          from fastapi.testclient import TestClient
          client=TestClient(mod.app)

          pid="test-patient-1370"
          qid="test-queue-1370"
          stamp=mod.now_iso()
          with mod.db() as c:
              c.execute("""INSERT INTO patients(id,name,name_search,birth_date,sex,national_id,national_id_search,phone,source,source_record_hash,created_at,updated_at,deleted_at)
                           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,NULL)""",
                        (pid,"PACIENTE PRUEBA","PACIENTE PRUEBA","1980-01-01","F","TEST1370","TEST1370","0990000000","test","test",stamp,stamp))
              c.execute("""INSERT INTO waiting_queue(id,reception_event_id,reception_patient_id,clinical_patient_id,display_name,identification,attention_type,queued_at,status,source,created_at,updated_at,deleted_at)
                           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,NULL)""",
                        (qid,"evt1370","rp1370",pid,"PACIENTE PRUEBA","TEST1370","Consulta",stamp,"waiting","test",stamp,stamp))
              c.commit()

          # Abrir la receta sin guardar no crea encuentro ni documento.
          r=client.get(f"/recetas/nueva?patient_id={pid}&queue_id={qid}&from_consultation=1&encounter_date=2026-09-26&encounter_time=10:30")
          assert r.status_code==200, r.text
          with mod.db() as c:
              assert c.execute("SELECT COUNT(*) FROM encounters WHERE patient_id=?",(pid,)).fetchone()[0]==0
              assert c.execute("SELECT COUNT(*) FROM prescriptions WHERE patient_id=?",(pid,)).fetchone()[0]==0

          payload={
            "patient_id":pid,"queue_id":qid,"from_consultation":True,
            "encounter_date":"2026-09-26","encounter_time":"10:30","issued_date":"2026-09-26",
            "series_no":"999","diagnosis":"PRUEBA","cie10":"Z00","allergies":"NO",
            "allergies_detail":"","items":[{"medication":"MEDICAMENTO PRUEBA","dose":"1 CADA 12 HORAS","frequency":"","duration":""}],
            "instructions":"PRUEBA"
          }
          r=client.post("/api/recetas",json=payload); assert r.status_code==200,r.text
          rx=r.json(); assert rx["ok"] and rx["encounter_id"] and rx["id"]
          enc=rx["encounter_id"]; rid=rx["id"]
          with mod.db() as c:
              assert c.execute("SELECT COUNT(*) FROM encounters WHERE patient_id=?",(pid,)).fetchone()[0]==1
              er=c.execute("SELECT note_status,clinical_note,queue_id FROM encounters WHERE id=?",(enc,)).fetchone()
              assert er["note_status"]=="draft" and (er["clinical_note"] or "")=="" and er["queue_id"]==qid
              assert c.execute("SELECT COUNT(*) FROM prescriptions WHERE patient_id=?",(pid,)).fetchone()[0]==1
              assert c.execute("SELECT encounter_id FROM prescriptions WHERE id=?",(rid,)).fetchone()[0]==enc
              assert c.execute("SELECT status FROM waiting_queue WHERE id=?",(qid,)).fetchone()[0]=="in_consultation"

          # Segundo Guardar actualiza la MISMA receta, no duplica.
          payload.update({"prescription_id":rid,"encounter_id":enc,"instructions":"CAMBIO SIN DUPLICAR"})
          r=client.post("/api/recetas",json=payload); assert r.status_code==200,r.text
          assert r.json()["id"]==rid and r.json()["encounter_id"]==enc
          with mod.db() as c:
              assert c.execute("SELECT COUNT(*) FROM prescriptions WHERE patient_id=?",(pid,)).fetchone()[0]==1
              assert c.execute("SELECT instructions FROM prescriptions WHERE id=?",(rid,)).fetchone()[0]=="CAMBIO SIN DUPLICAR"

          # Una consulta sin texto pero con receta sí puede finalizarse.
          r=client.post(f"/api/encounters/{enc}/sign"); assert r.status_code==200,r.text
          with mod.db() as c:
              assert c.execute("SELECT note_status FROM encounters WHERE id=?",(enc,)).fetchone()[0]=="signed"
              assert c.execute("SELECT status FROM waiting_queue WHERE id=?",(qid,)).fetchone()[0]=="completed"

          # La historia muestra el documento ligado.
          r=client.get(f"/paciente/{pid}"); assert r.status_code==200,r.text
          assert "DOCUMENTOS DE ESTA CONSULTA" in r.text
          assert "Receta médica" in r.text
          assert rid in r.text

          # Vista previa no fuerza auto-print; Imprimir sí usa el hook robusto.
          r=client.get(f"/recetas/{rid}/vista"); assert r.status_code==200
          assert "window.focus()" not in r.text
          r=client.get(f"/recetas/{rid}/vista?print_now=1"); assert r.status_code==200
          assert "window.focus()" in r.text and "window.print()" in r.text

          # Certificado: guardar y volver a guardar usa el mismo ID.
          cp={
            "patient_id":pid,"encounter_id":enc,"issued_date":"2026-09-26",
            "diagnosis":"PRUEBA CERT","cie10":"Z00","additional_diagnoses":[],
            "procedure_text":"","rest_days":0,"rest_from":"2026-09-26","rest_to":"2026-09-26",
            "body_text":"CERTIFICADO DE PRUEBA"
          }
          r=client.post("/api/certificados",json=cp); assert r.status_code==200,r.text
          cert=r.json(); cid=cert["id"]; assert cert["encounter_id"]==enc
          cp["certificate_id"]=cid; cp["body_text"]="CERTIFICADO ACTUALIZADO"
          r=client.post("/api/certificados",json=cp); assert r.status_code==200,r.text
          assert r.json()["id"]==cid
          with mod.db() as c:
              assert c.execute("SELECT COUNT(*) FROM certificates WHERE patient_id=?",(pid,)).fetchone()[0]==1
              assert c.execute("SELECT body_text FROM certificates WHERE id=?",(cid,)).fetchone()[0]=="CERTIFICADO ACTUALIZADO"

          r=client.get(f"/paciente/{pid}"); assert "Certificado médico" in r.text
          print("RUNTIME 1.3.70 OK: linked docs, no duplicates, document-only signing, history rendering, auto-print hook")
          '@ | python -
