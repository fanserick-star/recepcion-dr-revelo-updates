name: Test Historia DPAPI Windows
on:
  pull_request:
    paths:
      - 'historia-clinica/app/firma_electronica.py'
      - 'tools/test_historia_dpapi_windows_native.py'
      - '.github/workflows/test-historia-dpapi-windows.yml'
  workflow_dispatch:
jobs:
  windows-dpapi:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install fastapi==0.128.2
      - name: Test genuine user-scope DPAPI
        shell: pwsh
        run: |
          $env:PYTHONPATH = "historia-clinica/app"
          python tools/test_historia_dpapi_windows_native.py
