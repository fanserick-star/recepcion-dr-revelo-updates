name: Hotfix Historia 1.3.87 Base Rendering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-historia-1387-base-render.yml"

permissions:
  contents: write

concurrency:
  group: hotfix-historia-1387-base-render
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix f-string JavaScript braces and bump version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app_path=Path('historia-clinica/app/app.py')
          app=app_path.read_text(encoding='utf-8-sig')
          bad="else if(window.appNotice)window.appNotice(err&&err.message?err.message:'No se pudo imprimir.',{title:'Impresión'});"
          good="else if(window.appNotice)window.appNotice(err&&err.message?err.message:'No se pudo imprimir.',{{title:'Impresión'}});"
          assert app.count(bad)==1, app.count(bad)
          app=app.replace(bad,good,1)
          app_path.write_text(app,encoding='utf-8',newline='\n')

          vp=Path('historia-clinica/app/historia-version.json')
          v=json.loads(vp.read_text(encoding='utf-8-sig'))
          assert v['version']=='1.3.86',v
          v['version']='1.3.87'
          vp.write_text(json.dumps(v,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8',newline='\n')

          mp=Path('historia-clinica/app/update_manifest.json')
          m=json.loads(mp.read_text(encoding='utf-8-sig'))
          for key in ('version','app_version','runtime_version'):
              m[key]='1.3.87'
          n=m.setdefault('notes',{})
          n['purpose']='Hotfix de renderizado: corrige el error 500 introducido por el modal profesional de 1.3.86 sin cambiar la lógica clínica ni la cola.'
          n['previous_version']='1.3.86'
          n['ui_only_release']=True
          n['base_render_runtime_error_fixed']=True
          n['professional_dialogs_preserved']=True
          n['waiting_room_avatar_removed']=True
          n['procedure_proc_box_removed']=True
          n['consultation_turn_number_preserved']=True
          n['procedure_turn_consumption']=False
          n['waiting_room_queue_logic_unchanged']=True
          n['clinical_data_changes']=False
          n['cloud_logic_changes']=False
          n['lan_logic_changes']=False
          n['database_schema_changes']=False
          n['patient_data_destructive_changes']=False
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY

      - name: Validate canonical runtime
        run: |
          python tools/test_historia_canonical_source.py
          python tools/validate_historia_runtime.py historia-clinica/app
          python -m py_compile historia-clinica/app/app.py
          git diff --check

      - name: Render real base HTML chain smoke test
        run: |
          python - <<'PY'
          import ast
          import html as html_module
          from pathlib import Path

          path=Path('historia-clinica/app/app.py')
          src=path.read_text(encoding='utf-8-sig')
          tree=ast.parse(src)
          wanted=[]
          allowed_assigns={'APP_DIALOG_HTML','_V135_BASE_ORIGINAL','_V135_STYLE'}
          for node in tree.body:
              if isinstance(node,ast.FunctionDef) and node.name in {'e','base'}:
                  wanted.append(node)
              elif isinstance(node,ast.Assign):
                  names={t.id for t in node.targets if isinstance(t,ast.Name)}
                  if names & allowed_assigns:
                      wanted.append(node)
          mod=ast.Module(body=wanted,type_ignores=[])
          ast.fix_missing_locations(mod)
          ns={'APP_VERSION':'1.3.87','html':html_module}
          exec(compile(mod,str(path),'exec'),ns)
          rendered=ns['base']('Prueba','<main>OK</main>')
          assert '<main>OK</main>' in rendered
          assert "{title:'Impresión'}" in rendered
          assert 'appDialogBackdrop' in rendered
          assert "else if(window.appNotice)window.appNotice" in rendered
          assert '<style>' in rendered
          print('REAL_BASE_RENDER_OK',len(rendered))
          PY

      - name: Validate requested UI contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          app=Path('historia-clinica/app/app.py').read_text(encoding='utf-8-sig')
          man=json.loads(Path('historia-clinica/app/update_manifest.json').read_text(encoding='utf-8-sig'))
          ver=json.loads(Path('historia-clinica/app/historia-version.json').read_text(encoding='utf-8-sig'))['version']
          assert ver=='1.3.87'
          assert 'APP_DIALOG_HTML =' in app
          assert 'window.appConfirm=' in app
          assert 'if(!confirm(' not in app
          assert 'return confirm(' not in app
          assert 'PROC.</b>' not in app
          assert "class='queue-avatar'" not in app
          assert '<span>TURNO</span>' in app
          assert man['notes']['consultation_turn_number_preserved'] is True
          assert man['notes']['procedure_turn_consumption'] is False
          print('HOTFIX_CONTRACT_OK')
          PY

      - name: Commit canonical hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/app.py historia-clinica/app/historia-version.json historia-clinica/app/update_manifest.json
          git rm .github/workflows/hotfix-historia-1387-base-render.yml
          git commit -m "Historia 1.3.87: fix base render after professional dialog"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build stable channel
        run: |
          python tools/build_historia_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY"

      - name: Verify exact channel bytes
        env:
          VERIFY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,urllib.request
          channel=json.loads(pathlib.Path('historia-clinica/launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          assert channel['appVersion']=='1.3.87'
          assert channel['mandatory'] is True
          out=pathlib.Path('channel_verify_historia_1387')
          shutil.rmtree(out,ignore_errors=True)
          out.mkdir(parents=True)
          nonce=os.environ.get('VERIFY_NONCE','verify')
          for item in channel['files']:
              rel=str(item['path']).replace('\\','/')
              url=item['url']+('&' if '?' in item['url'] else '?')+'verify='+nonce
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  payload=response.read()
              assert hashlib.sha256(payload).hexdigest()==item['sha256'],rel
              dest=out/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(payload)
          PY
          python tools/validate_historia_runtime.py channel_verify_historia_1387

      - name: Publish stable channel
        run: |
          git add historia-clinica/launcher-v1/app-channel.json
          git commit -m "Publish validated Historia 1.3.87 channel"
          git pull --rebase origin main
          git push origin HEAD:main
