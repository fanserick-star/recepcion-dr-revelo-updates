name: Deploy Cloudflare diagnostics v2.6.16

on:
  push:
    paths:
      - "build/v4441_diag_reader/build_worker_v2616_export.py"
      - ".github/workflows/deploy-cloudflare-diagnostics-v2616.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: dr-revelo-whatsapp-cloud
      WORKER_URL: https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and validate encrypted Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python build/v4441_diag_reader/build_worker_v2616_export.py
          cp cloudflare/WHATSAPP_WORKER_v2_6_16_DIAGNOSTICS_EXPORT_STANDALONE.js /tmp/worker-v2616.js
          python - <<'PY'
          import os, pathlib, re
          p=pathlib.Path('/tmp/worker-v2616.js')
          s=p.read_text(encoding='utf-8')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          assert re.fullmatch(r'[0-9a-fA-F]{32}', account), 'account id inválido'
          assert s.count('__CF_ACCOUNT_ID__') == 1
          s=s.replace('__CF_ACCOUNT_ID__', account)
          p.write_text(s, encoding='utf-8')
          assert 'worker_version: "2.6.16"' in s
          assert 'AES-GCM' in s and '/diagnostics/internal/export' in s
          print('WORKER_V2616_PATCHED_OK')
          PY
          cp /tmp/worker-v2616.js /tmp/worker-v2616.mjs
          node --check /tmp/worker-v2616.mjs
      - name: Dry-run v2.6.16
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy /tmp/worker-v2616.js --name "$WORKER_NAME" --compatibility-date 2026-09-01 --keep-vars --dry-run --outdir /tmp/cf-v2616-dry
          test -n "$(find /tmp/cf-v2616-dry -type f -print -quit)"
      - name: Deploy v2.6.16 preserving variables
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy /tmp/worker-v2616.js --name "$WORKER_NAME" --compatibility-date 2026-09-01 --keep-vars
      - name: Verify live health and encrypted export
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "$WORKER_URL/health" -o /tmp/health.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json','r',encoding='utf-8'))
          assert d.get('worker_version') == '2.6.16', d
          assert d.get('diagnostics_read') == 'capability_v1', d
          assert d.get('diagnostics_export') == 'cf_token_aesgcm_v1', d
          print('HEALTH_V2616_OK')
          PY
              then OK=1; break; fi
            fi
            sleep 5
          done
          test "$OK" = "1"
          curl -fsS --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$WORKER_URL/diagnostics/internal/export" -o /tmp/export.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/export.json','r',encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('format') == 'rp_diag_aesgcm_v1'
          entries=d.get('entries') or []
          assert len(entries) <= 5
          for x in entries:
              assert set(x) == {'incident_hash','iv_b64','ciphertext_b64'}
              assert len(x['incident_hash']) == 64
              assert x['iv_b64'] and x['ciphertext_b64']
          print('ENCRYPTED_EXPORT_V2616_OK entries=', len(entries))
          PY
