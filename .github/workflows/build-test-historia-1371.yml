name: Build Test Historia 1.3.71 Document UI Native Print

on:
  push:
    branches:
      - feature/historia-1371-document-ui-native-print
    paths:
      - tools/build_historia_1371.py
      - .github/workflows/build-test-historia-1371.yml

permissions:
  contents: write

jobs:
  build-runtime-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/historia-1371-document-ui-native-print
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate candidate
        shell: pwsh
        run: python tools/build_historia_1371.py

      - name: Verify byte contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          root=Path.cwd()/ 'historia-clinica/updates'
          old=root/'v1_3_70_linked_documents'; new=root/'v1_3_71_document_ui_native_print'
          unchanged=['cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','requirements.txt','static/doctor_icon.b64']
          for rel in unchanged:
              assert (old/rel).read_bytes()==(new/rel).read_bytes(), rel
          app=(new/'app.py').read_text(encoding='utf-8')
          docs=(new/'documentos_clinicos.py').read_text(encoding='utf-8')
          css=(new/'static/style.css').read_text(encoding='utf-8')
          assert 'style.css?v={e(APP_VERSION)}' in app
          assert 'historiaNativePrint' in app and 'historia-print-url' in app
          assert 'encounter-document-actions' in app
          assert 'about:blank' not in docs
          assert '/api/documentos/impresora' in docs
          assert "await window.historiaNativePrint(j.preview_url,'recipe')" in docs
          assert docs.count("await window.historiaNativePrint(j.preview_url,'certificate')") == 2
          assert 'v1.3.71' in css
          ch=json.loads((Path.cwd()/'historia-clinica/launcher-v1/app-channel-source.json').read_text(encoding='utf-8'))
          assert ch['appVersion']=='1.3.71' and ch['minimumLauncher']=='1.0.8' and ch['mandatory'] is True
          assert all('v1_3_71_document_ui_native_print' in x['sourcePath'] for x in ch['files'])
          print('1.3.71 byte/static contract OK')
          '@ | python -

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r historia-clinica/updates/v1_3_71_document_ui_native_print/requirements.txt httpx

      - name: Runtime document workflow
        shell: pwsh
        run: |
          @'
          import os,sys
          from pathlib import Path
          root=Path.cwd()/ 'historia-clinica/updates/v1_3_71_document_ui_native_print'
          data=root/'data'; data.mkdir(exist_ok=True)
          dbfile=data/'historia_clinica.db'
          if dbfile.exists(): dbfile.unlink()
          os.environ.pop('HISTORIA_DATABASE_URL',None); os.environ.pop('DATABASE_URL',None)
          sys.path.insert(0,str(root))
          import app as mod
          from fastapi.testclient import TestClient
          client=TestClient(mod.app)
          pid='ui1371-patient'; eid='ui1371-encounter'; now=mod.now_iso()
          with mod.db() as c:
              c.execute("""INSERT INTO patients(id,name,name_search,birth_date,sex,source,source_record_hash,created_at,updated_at,deleted_at)
                           VALUES(?,?,?,?,?,?,?,?,?,NULL)""",(pid,'PACIENTE UI 1371','PACIENTE UI 1371','1980-01-01','F','test','ui1371',now,now))
              c.execute("""INSERT INTO encounters(id,patient_id,encounter_date,encounter_time,clinical_note,diagnosis,treatment,source,source_record_hash,is_legacy_locked,created_at,updated_at,deleted_at,note_status,signed_at,signed_by,queue_id,created_by)
                           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",(eid,pid,'2026-09-26','12:39','PRUEBA','','','historia_clinica','ui1371e',0,now,now,None,'signed',now,mod.DOCTOR_NAME,None,mod.DOCTOR_NAME))
              c.execute("""INSERT INTO prescriptions(id,patient_id,encounter_id,issued_at,series_no,diagnosis,cie10,allergies,allergies_detail,items_json,instructions,created_at,updated_at,deleted_at)
                           VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,NULL)""",('rx-ui1371',pid,eid,'2026-09-26T12:39:00','00104','','','NO','','[]','',now,now))
              c.commit()
          r=client.get(f'/paciente/{pid}'); assert r.status_code==200,r.text
          assert '/static/style.css?v=1.3.71' in r.text
          assert 'DOCUMENTOS DE ESTA CONSULTA' in r.text
          assert 'encounter-document-actions' in r.text
          assert 'data-print-url=' in r.text and 'data-print-kind=' in r.text
          assert 'historiaNativePrint(this.dataset.printUrl,this.dataset.printKind)' in r.text
          assert '/recetas/rx-ui1371/vista?print_now=1' not in r.text
          r=client.get('/api/documentos/impresora?kind=recipe'); assert r.status_code==200 and r.json()['printer']==''
          r=client.get(f'/recetas/nueva?patient_id={pid}&encounter_id={eid}'); assert r.status_code==200
          assert 'about:blank' not in r.text and "historiaNativePrint(j.preview_url,'recipe')" in r.text
          r=client.get(f'/certificados/nuevo?patient_id={pid}&encounter_id={eid}'); assert r.status_code==200
          assert 'about:blank' not in r.text and "historiaNativePrint(j.preview_url,'certificate')" in r.text
          print('RUNTIME 1.3.71 OK: cache bust, professional cards, native print bridge, no about blank')
          '@ | python -

      - name: Remove generated runtime artifacts
        shell: pwsh
        run: |
          $dst='historia-clinica/updates/v1_3_71_document_ui_native_print'
          Get-ChildItem -Path $dst -Directory -Recurse -Filter __pycache__ -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          if (Test-Path "$dst/data") { Remove-Item "$dst/data" -Recurse -Force }

      - name: Commit candidate
        shell: pwsh
        run: |
          git config user.name "fanserick-star"
          git config user.email "fanserick@hotmail.com"
          git add historia-clinica/updates/v1_3_71_document_ui_native_print historia-clinica/launcher-v1/app-channel-source.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Generar Historia 1.3.71 documentos profesionales e impresión nativa"
            git push origin HEAD:feature/historia-1371-document-ui-native-print
          }
