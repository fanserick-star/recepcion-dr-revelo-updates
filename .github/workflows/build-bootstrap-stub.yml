name: Build consultorio lightweight bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap-clean-installer-v1
    paths:
      - 'master-installer/bootstrap.ps1'
      - 'master-installer/native/**'
      - '.github/workflows/build-bootstrap-stub.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'master-installer/bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell syntax OK'

      - name: Install MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Embed PowerShell bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('master-installer/bootstrap.ps1').read_bytes()
          out = Path('master-installer/native/bootstrap_ps.h')
          with out.open('w', encoding='ascii') as f:
              f.write('#ifndef DR_REVELO_BOOTSTRAP_PS_H\n#define DR_REVELO_BOOTSTRAP_PS_H\n')
              f.write('static const unsigned char bootstrap_ps1[] = {\n')
              for i in range(0, len(src), 16):
                  chunk = src[i:i+16]
                  f.write('  ' + ','.join(f'0x{x:02x}' for x in chunk) + ',\n')
              f.write('};\n')
              f.write(f'static const unsigned long bootstrap_ps1_len = {len(src)}UL;\n')
              f.write('#endif\n')
          PY

      - name: Compile Windows x64 bootstrap
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc \
            master-installer/native/consultorio_bootstrap.c \
            -o dist/CONSULTORIO_BOOTSTRAP_STUB.exe \
            -std=c11 -O2 -s -mwindows -municode -static-libgcc \
            -lbcrypt -lcrypt32 -lshell32 -lcomctl32 -ladvapi32
          file dist/CONSULTORIO_BOOTSTRAP_STUB.exe
          sha256sum dist/CONSULTORIO_BOOTSTRAP_STUB.exe > dist/SHA256SUMS_STUB.txt

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: consultorio-bootstrap-stub
          path: dist/*
          if-no-files-found: error
          retention-days: 7
