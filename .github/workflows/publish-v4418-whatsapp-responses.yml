name: Validar y publicar v4.4.18 respuestas WhatsApp

on:
  push:
    branches: [main]
    paths:
      - 'build/v4418_whatsapp_responses/**'
      - '.github/workflows/publish-v4418-whatsapp-responses.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v4418-whatsapp-responses
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar base antes de construir
        shell: pwsh
        run: git pull --rebase origin main

      - name: Reconstruir payload validado
        shell: pwsh
        run: |
          python build/v4418_whatsapp_responses/build_release.py
          python build/v4418_whatsapp_responses/post_build_safety.py
          python build/v4418_whatsapp_responses/fix_channel_manifest.py
          python tools/release_guard.py --app updates/v4_4_18_whatsapp_responses/app.py --manifest updates/v4_4_18_whatsapp_responses/update_manifest.json --version 4.4.18
          python -m py_compile updates/v4_4_18_whatsapp_responses/app.py
          node --check updates/v4_4_18_whatsapp_responses/static/app.js
          python build/v4418_whatsapp_responses/fix_channel_manifest.py

      - name: Confirmar funciones críticas heredadas y nuevas
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          root=Path('updates/v4_4_18_whatsapp_responses')
          app=(root/'app.py').read_text(encoding='utf-8-sig')
          js=(root/'static/app.js').read_text(encoding='utf-8-sig')
          html=(root/'static/index.html').read_text(encoding='utf-8-sig')
          channel=json.loads(Path('build/v4418_whatsapp_responses/candidate_latest.json').read_text(encoding='utf-8-sig'))
          assert channel['product']=='recepcion-pacientes'
          assert channel['version']=='4.4.18'
          assert len(channel['files'])==4
          assert '@app.get("/api/whatsapp-responses/count")' in app
          assert '@app.post("/api/whatsapp-responses/{response_id}/resolve")' in app
          assert 'La cita cambió desde que llegó este mensaje' in app
          assert 'current_date != stored_date or current_time != stored_time' in app
          assert 'data-section="whatsappRespuestas"' in html
          assert 'homeWhatsappReviewStrip' in html
          assert 'resolveWhatsappResponse' in js
          assert 'data-continue-attention="1"' in js
          assert 'data-historical-import="1"' in js
          assert not list(root.rglob('__pycache__'))
          print('V4418_RECHECK_OK')
          '@ | python -

      - name: Publicar payload y fijar SHA inmutable
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v4_4_18_whatsapp_responses
          if(-not (git diff --cached --quiet)){git commit -m 'payload: v4.4.18 respuestas WhatsApp seguro'}
          git pull --rebase origin main
          git push origin HEAD:main
          $payloadSha=(git rev-parse HEAD).Trim()
          if($payloadSha -notmatch '^[0-9a-f]{40}$'){throw 'No pude fijar SHA del payload'}
          $env:RP_PAYLOAD_SHA=$payloadSha
          python build/v4418_whatsapp_responses/fix_channel_manifest.py
          python tools/remote_payload_guard.py --manifest build/v4418_whatsapp_responses/candidate_latest.json --require-immutable
          "PAYLOAD_SHA=$payloadSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PAYLOAD_IMMUTABLE_OK $payloadSha"

      - name: Mover canal a v4.4.18
        shell: pwsh
        run: |
          $env:RP_PAYLOAD_SHA=$env:PAYLOAD_SHA
          python build/v4418_whatsapp_responses/fix_channel_manifest.py
          Copy-Item build/v4418_whatsapp_responses/candidate_latest.json latest-v3.json -Force
          Copy-Item build/v4418_whatsapp_responses/candidate_latest.json latest.json -Force
          git add latest-v3.json latest.json
          git commit -m 'release: publicar v4.4.18 respuestas WhatsApp'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirmar canal remoto
        shell: pwsh
        run: |
          @'
          import json,time,urllib.request,pathlib,os
          url='https://raw.githubusercontent.com/fanserick-star/recepcion-dr-revelo-updates/main/latest-v3.json'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'latest-v4418-remote.json'
          last=''
          for _ in range(45):
              try:
                  req=urllib.request.Request(url+'?rp_ts='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'RP-v4418-guard'})
                  with urllib.request.urlopen(req,timeout=10) as r: raw=r.read()
                  d=json.loads(raw.decode('utf-8-sig'))
                  if str(d.get('version'))=='4.4.18':
                      out.write_bytes(raw);print('CHANNEL_4418_VISIBLE');break
                  last=str(d.get('version'))
              except Exception as e:last=repr(e)
              time.sleep(1)
          else: raise SystemExit('Canal no propagó 4.4.18; último='+last)
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\wait4418.py
          python $env:RUNNER_TEMP\wait4418.py
          python tools/remote_payload_guard.py --manifest $env:RUNNER_TEMP\latest-v4418-remote.json --require-immutable
          Write-Host 'V4418_PUBLISHED_AND_REMOTE_VERIFIED'
