name: Stage billing cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-billing-cleanup.yml
      - tools/stage_billing_cleanup.py

permissions:
  contents: write

jobs:
  stage:
    if: contains(github.event.head_commit.message, 'stage billing cleanup workflow')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create candidate branch
        run: git checkout -B billing-cleanup-20260930

      - name: Normalize staging script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/stage_billing_cleanup.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("discard = r'''", 'discard = r"""', 1)
          s=s.replace("\n'''\nwrite(APP / \"reception_billing_discard.py\", discard)", "\n\"\"\"\nwrite(APP / \"reception_billing_discard.py\", discard)", 1)
          s=s.replace("interface_cleanup = r'''", 'interface_cleanup = r"""', 1)
          s=s.replace("\n'''\nwrite(APP / \"reception_interface_cleanup.py\", interface_cleanup)", "\n\"\"\"\nwrite(APP / \"reception_interface_cleanup.py\", interface_cleanup)", 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply billing consolidation
        run: python tools/stage_billing_cleanup.py

      - name: Remove stale import dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('recepcion/app')
          replacements={
            'reception_payment_proof.py':(
              "import reception_billing_optional_email as _dep_billing_optional_email\nimport os as _os\nimport re as _re\nfrom datetime import date as _date, datetime as _datetime\ncore = _dep_billing_optional_email.core\napp = _dep_billing_optional_email.app\nAPP_VERSION = '4.4.85'\ncore.APP_VERSION = APP_VERSION",
              "import core_runtime as core\nimport os as _os\nimport re as _re\nfrom datetime import date as _date, datetime as _datetime\napp = core.app\nAPP_VERSION = getattr(core, 'APP_VERSION', '')"
            ),
            'reception_update_restart.py':(
              "import reception_billing_modal_cleanup as _dep_billing_modal_cleanup\nimport os as _os\nimport re as _re\nimport subprocess as _subprocess\nimport sys as _sys\nfrom pathlib import Path as _Path\ncore = _dep_billing_modal_cleanup.core\napp = _dep_billing_modal_cleanup.app\nAPP_VERSION = '4.4.82'\ncore.APP_VERSION = APP_VERSION",
              "import core_runtime as core\nimport os as _os\nimport re as _re\nimport subprocess as _subprocess\nimport sys as _sys\nfrom pathlib import Path as _Path\napp = core.app\nAPP_VERSION = getattr(core, 'APP_VERSION', '')"
            ),
          }
          for name,(old,new) in replacements.items():
            p=app/name;s=p.read_text(encoding='utf-8')
            if s.count(old)!=1: raise SystemExit(f'{name}: stale dependency header count={s.count(old)}')
            p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('STALE_DEPENDENCIES_REMOVED')
          PY

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          for path in Path('recepcion/app').rglob('*.py'):
              py_compile.compile(str(path), doraise=True)
          print('PYTHON_COMPILE_OK')
          PY

      - name: Validate JavaScript syntax
        run: node --check recepcion/app/static/app.js

      - name: Validate canonical reception source
        run: python tools/test_reception_canonical_source.py

      - name: Validate runtime layout
        run: python tools/validate_reception_runtime_layout.py recepcion/app

      - name: Validate billing cleanup invariants
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          app = Path('recepcion/app')
          obsolete = {
              'reception_billing_actions.py',
              'reception_billing_issued_filters.py',
              'reception_billing_modal_cleanup.py',
              'reception_billing_optional_email.py',
              'reception_billing_data_form.py',
              'reception_billing_data_form_compact.py',
          }
          for name in obsolete:
              assert not (app / name).exists(), name
          features = (app/'features_runtime.py').read_text(encoding='utf-8')
          for name in obsolete:
              module=name[:-3]
              assert not re.search(rf'^import\s+{re.escape(module)}\s*$', features, re.M), name
              assert not re.search(rf'^\s*{re.escape(module)},\s*$', features, re.M), name
          js = (app/'static/app.js').read_text(encoding='utf-8')
          assert 'factureromovil' not in js.lower()
          assert "if(email&&!email.includes('@'))" in js
          assert "billingViewState='PENDIENTE'" in js
          assert '/api/billing/print-data-form' in js
          assert 'discardPendingBilling' in js
          manifest = json.loads((app/'update_manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '4.6.26'
          assert manifest['notes']['candidate_only'] is True
          assert manifest['notes']['database_schema_changes'] is False
          assert manifest['notes']['azur_logic_changes'] is False
          print('BILLING_INVARIANTS_OK')
          PY

      - name: Remove generated Python caches
        run: |
          find recepcion/app -type d -name __pycache__ -prune -exec rm -rf {} +
          if find recepcion/app -type f \( -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then
            echo 'Compiled Python artifacts remain in runtime tree' >&2
            exit 1
          fi
          echo 'PYTHON_CACHE_CLEAN'

      - name: Commit candidate cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A recepcion/app
          git commit -m "refactor: consolidate reception billing runtime"
          git push origin HEAD:billing-cleanup-20260930 --force-with-lease
