name: Release Reception 4.6.21 Manual History Link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-reception-4621-manual-history-link.yml"

permissions:
  contents: write

concurrency:
  group: release-reception-4621-manual-history-link
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require receptionist confirmation before linking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('recepcion/app')
          src = root / 'reception_history_identity_consolidated.py'
          ver = root / 'recepcion-version.json'
          man = root / 'update_manifest.json'

          vdoc = json.loads(ver.read_text(encoding='utf-8-sig'))
          assert str(vdoc.get('version')) == '4.6.20', vdoc
          text = src.read_text(encoding='utf-8-sig')

          old_default = 'def _prepare_identity(db, reception_patient_id, *, auto_link=True, sync=True):'
          new_default = 'def _prepare_identity(db, reception_patient_id, *, auto_link=False, sync=True):'
          assert text.count(old_default) == 1
          text = text.replace(old_default, new_default, 1)

          old_prepare = 'db, reception_patient_id, auto_link=True, sync=True'
          new_prepare = 'db, reception_patient_id, auto_link=False, sync=True'
          assert text.count(old_prepare) == 1
          text = text.replace(old_prepare, new_prepare, 1)
          src.write_text(text, encoding='utf-8', newline='\n')

          vdoc['version'] = '4.6.21'
          ver.write_text(json.dumps(vdoc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          mdoc = json.loads(man.read_text(encoding='utf-8-sig'))
          for key in ('version','app_version','runtime_version'):
              if key in mdoc:
                  mdoc[key] = '4.6.21'
          notes = mdoc.setdefault('notes', {})
          notes['purpose'] = 'Todo vínculo nuevo con Historia Clínica requiere confirmación explícita desde Recepción; Neon solo consulta y propone candidatos. LAN sigue reservado para Pacientes en espera.'
          notes['previous_version'] = '4.6.20'
          notes['history_identity_transport'] = 'neon_only'
          notes['history_auto_link_exact_identification'] = False
          notes['history_manual_link_required'] = True
          notes['waiting_queue_transport'] = 'lan_only'
          notes['waiting_queue_cloud_write'] = False
          notes['new_patient_history_link_hidden'] = True
          notes['normal_subsequent_history_link_visible'] = True
          notes['manual_legacy_subsequent_history_link_visible'] = True
          man.write_text(json.dumps(mdoc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Validate runtime and manual-link contract
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python -m py_compile recepcion/app/reception_history_identity_consolidated.py
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('recepcion/app/reception_history_identity_consolidated.py').read_text(encoding='utf-8-sig')
          assert 'def _prepare_identity(db, reception_patient_id, *, auto_link=False, sync=True):' in src
          assert 'db, reception_patient_id, auto_link=False, sync=True' in src
          assert 'db, reception_patient_id, auto_link=True, sync=True' not in src
          assert "typeof currentDetectedStatus==='function'&&norm(currentDetectedStatus())==='S'" in src
          assert 'historia_lan.identity_' not in src
          manifest = json.loads(Path('recepcion/app/update_manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest['version'] == '4.6.21'
          assert manifest['notes']['history_manual_link_required'] is True
          assert manifest['notes']['waiting_queue_transport'] == 'lan_only'
          print('MANUAL_LINK_OK')
          PY

      - name: Commit canonical 4.6.21 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepcion/app/reception_history_identity_consolidated.py recepcion/app/recepcion-version.json recepcion/app/update_manifest.json
          git rm .github/workflows/release-reception-4621-manual-history-link.yml
          git commit -m "Reception 4.6.21: require manual history link confirmation"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build exact 4.6.21 channel
        run: |
          python tools/build_reception_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY"

      - name: Verify exact payload bytes
        env:
          VERIFY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, urllib.request
          channel = json.loads(pathlib.Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          assert channel['appVersion'] == '4.6.21'
          assert channel['mandatory'] is True
          out = pathlib.Path('channel_verify_4621')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          nonce = os.environ.get('VERIFY_NONCE','verify')
          for item in channel['files']:
              rel = str(item['path']).replace('\\','/')
              url = item['url'] + ('&' if '?' in item['url'] else '?') + 'verify=' + nonce
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
              assert hashlib.sha256(payload).hexdigest() == item['sha256'], rel
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(payload)
          PY
          python tools/validate_reception_runtime_layout.py channel_verify_4621

      - name: Publish stable 4.6.21 channel
        run: |
          git add launcher-v1/app-channel.json
          git commit -m "Publish validated Reception 4.6.21 channel"
          git pull --rebase origin main
          git push origin HEAD:main
