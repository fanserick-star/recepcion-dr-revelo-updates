name: Validate v4.4.41 private diagnostics

on:
  push:
    paths:
      - "build/v4441_diag_reader/**"
      - ".github/workflows/validate-v4441-diag-reader.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate launcher and diagnostic bridge
        shell: pwsh
        run: |
          python build/v4441_diag_reader/validate_v4441.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4441-private-diagnostics
          path: |
            updates/v4_4_41_diag_reader
            cloudflare/WHATSAPP_WORKER_v2_6_15_DIAGNOSTICS_STANDALONE.js
