name: Reparar SHA canal automático

on:
  push:
    branches: [main]
    paths:
      - 'updates/v451/bootstrap_app.py'
      - 'updates/v451/update_manifest.json'
      - '.github/workflows/fix-v449-sha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular SHA reales y corregir manifests
        shell: bash
        run: |
          APP_SHA=$(sha256sum updates/v451/bootstrap_app.py | awk '{print $1}')
          MAN_SHA=$(sha256sum updates/v451/update_manifest.json | awk '{print $1}')
          echo "APP_SHA=$APP_SHA"
          echo "MAN_SHA=$MAN_SHA"
          python - "$APP_SHA" "$MAN_SHA" <<'PY'
          import json, sys
          app_sha, man_sha = sys.argv[1], sys.argv[2]
          for fn in ('latest-v3.json', 'latest.json'):
              with open(fn, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              for item in data.get('files', []):
                  if item.get('path') == 'app.py':
                      parts = item.get('parts') or []
                      if any('updates/v451/bootstrap_app.py' in p for p in parts):
                          item['sha256'] = app_sha
                  elif item.get('path') == 'update_manifest.json' and 'updates/v451/update_manifest.json' in item.get('url', ''):
                      item['sha256'] = man_sha
              with open(fn, 'w', encoding='utf-8', newline='\n') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')
          PY
      - name: Publicar corrección
        shell: bash
        run: |
          if git diff --quiet -- latest-v3.json latest.json; then
            echo "Los SHA ya eran correctos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-v3.json latest.json
          git commit -m "fix: corregir SHA reales v4.3.51"
          git push
