name: Diagnosticar pantalla blanca v4.4.31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v4432-ui-blank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar runtime
        shell: pwsh
        run: |
          python -m venv .ui-venv
          .\.ui-venv\Scripts\python.exe -m pip install --disable-pip-version-check `
            'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20' `
            'playwright==1.55.0'
          .\.ui-venv\Scripts\python.exe -m playwright install chromium

      - name: Preparar instalación exacta y prueba de aislamiento
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Recepcion-ui-isolate'
          if(Test-Path $root){ Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root 'data') | Out-Null
          Copy-Item updates/v4_4_31_startup_guard/app.py (Join-Path $root 'app.py')
          Copy-Item updates/v4_4_28_overlay_hotfix/app.py (Join-Path $root 'app_base_4428.py')
          Copy-Item updates/v4_4_28_overlay_hotfix/static (Join-Path $root 'static') -Recurse
          $base = Join-Path $env:RUNNER_TEMP 'rp-ui-base'
          if(Test-Path $base){ Remove-Item $base -Recurse -Force }
          Expand-Archive installer_clean/base/clean_base_resources.zip -DestinationPath $base -Force
          foreach($name in @('azur_client.py','whatsapp_client.py','remote_agenda.py')){
            $src=Get-ChildItem $base -Recurse -File -Filter $name | Select-Object -First 1
            if(-not $src){ throw "Falta $name" }
            Copy-Item $src.FullName (Join-Path $root $name)
          }
          $mobile=Get-ChildItem $base -Recurse -Directory -Filter mobile | Select-Object -First 1
          if($mobile){ Copy-Item $mobile.FullName (Join-Path $root 'mobile') -Recurse }
          "UI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @'
          import json, os, pathlib, subprocess, time, urllib.request
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout

          root=pathlib.Path(os.environ['UI_ROOT'])
          py=pathlib.Path.cwd()/'.ui-venv'/'Scripts'/'python.exe'
          diag=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-isolate'
          diag.mkdir(parents=True,exist_ok=True)
          env=os.environ.copy(); env['RP_FORCE_OFFLINE']='1'; env['RP_DATA_DIR']=str(root/'data'); env['RP_PORT']='18766'; env['DISABLE_SQLALCHEMY_CEXT_RUNTIME']='1'

          def http(url,timeout=4):
              with urllib.request.urlopen(url,timeout=timeout) as r:return r.status,r.read()

          log=(diag/'backend.log').open('w',encoding='utf-8')
          proc=subprocess.Popen([str(py),str(root/'app.py')],cwd=str(root),env=env,stdout=log,stderr=log)
          try:
              end=time.time()+35
              while time.time()<end:
                  if proc.poll() is not None: raise SystemExit('BACKEND_EXIT_'+str(proc.returncode))
                  try:
                      s,b=http('http://127.0.0.1:18766/api/version',1)
                      if json.loads(b).get('version')=='4.4.31':break
                  except Exception:time.sleep(.2)
              else:raise SystemExit('BACKEND_TIMEOUT')

              for path in ['/', '/static/style.css?v=4.4.28','/static/app.js?v=4.4.28','/v458/settings.css?v=4.3.58','/v458/settings.js?v=4.3.58','/v459/settings.css?v=4.3.59','/v459/settings.js?v=4.3.59','/v460/overlay.css?v=4.3.72','/v460/overlay.js?v=4.3.72']:
                  t=time.perf_counter(); s,b=http('http://127.0.0.1:18766'+path,8); dt=time.perf_counter()-t
                  print('ASSET',path,'status',s,'bytes',len(b),'seconds',round(dt,3),flush=True)

              def browser_case(p,name,block=None,dom_timeout=10000):
                  page=p.chromium.launch(headless=True).new_page(viewport={'width':1360,'height':840})
                  events=[]
                  page.on('request',lambda r:events.append(['request',r.url,time.time()]))
                  page.on('response',lambda r:events.append(['response',r.status,r.url,time.time()]))
                  page.on('requestfinished',lambda r:events.append(['finished',r.url,time.time()]))
                  page.on('requestfailed',lambda r:events.append(['failed',r.url,str(r.failure),time.time()]))
                  page.on('pageerror',lambda e:events.append(['pageerror',str(e),time.time()]))
                  page.on('console',lambda m: events.append(['console-'+m.type,m.text,time.time()]) if m.type in ('error','warning') else None)
                  if block:
                      for pattern in block:
                          page.route(pattern,lambda route:route.fulfill(status=200,content_type='application/javascript',body='/* isolated */'))
                  ok=True;err=''
                  try:
                      page.goto('http://127.0.0.1:18766/?case='+name,wait_until='domcontentloaded',timeout=dom_timeout)
                  except Exception as e:
                      ok=False;err=repr(e)
                  # No evaluamos JS si el hilo principal puede estar bloqueado.
                  report={'name':name,'domcontentloaded':ok,'error':err,'events':events}
                  (diag/(name+'.json')).write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
                  print('CASE',name,'DOM',ok,'ERR',err[:220],flush=True)
                  for ev in events[-40:]:print(' EVT',ev,flush=True)
                  try:page.context.browser.close()
                  except Exception:pass
                  return ok,events

              with sync_playwright() as p:
                  normal,_=browser_case(p,'normal',None,8000)
                  no460,_=browser_case(p,'no_v460',['**/v460/overlay.js*'],8000)
                  no459,_=browser_case(p,'no_v459',['**/v459/settings.js*'],8000)
                  no458,_=browser_case(p,'no_v458',['**/v458/settings.js*'],8000)
                  noaddons,_=browser_case(p,'no_addon_js',['**/v458/settings.js*','**/v459/settings.js*','**/v460/overlay.js*'],8000)
              print('RESULTS',json.dumps({'normal':normal,'no_v460':no460,'no_v459':no459,'no_v458':no458,'no_addon_js':noaddons}),flush=True)
              if normal:
                  raise SystemExit('NORMAL_DID_NOT_REPRODUCE')
              if not no460 and not noaddons:
                  raise SystemExit('NO_SINGLE_ADDON_ISOLATED')
              print('ISOLATION_OK')
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:proc.wait(5)
                  except Exception:proc.kill()
              log.close()
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\isolate_ui.py
          .\.ui-venv\Scripts\python.exe $env:RUNNER_TEMP\isolate_ui.py

      - name: Diagnóstico
        if: always()
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'ui-isolate'
          if(Test-Path $d){ Get-ChildItem $d -File | ForEach-Object { Write-Host "--- $($_.Name) ---"; if($_.Extension -eq '.json'){Get-Content $_.FullName -Raw}else{Get-Content $_.FullName -Tail 120} } }
