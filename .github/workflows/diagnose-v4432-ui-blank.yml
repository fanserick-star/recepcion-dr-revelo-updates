name: Diagnosticar pantalla blanca v4.4.31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v4432-ui-blank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar runtime del consultorio
        shell: pwsh
        run: |
          python -m venv .ui-venv
          .\.ui-venv\Scripts\python.exe -m pip install --disable-pip-version-check `
            'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20' `
            'playwright==1.55.0'
          .\.ui-venv\Scripts\python.exe -m playwright install chromium

      - name: Crear instalación exacta 4.4.31
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Recepcion-v4431-ui'
          if(Test-Path $root){ Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $root 'data') | Out-Null
          Copy-Item updates/v4_4_31_startup_guard/app.py (Join-Path $root 'app.py')
          Copy-Item updates/v4_4_28_overlay_hotfix/app.py (Join-Path $root 'app_base_4428.py')
          Copy-Item updates/v4_4_28_overlay_hotfix/static (Join-Path $root 'static') -Recurse

          $base = Join-Path $env:RUNNER_TEMP 'rp-ui-base'
          if(Test-Path $base){ Remove-Item $base -Recurse -Force }
          Expand-Archive installer_clean/base/clean_base_resources.zip -DestinationPath $base -Force
          foreach($name in @('azur_client.py','whatsapp_client.py','remote_agenda.py')){
            $src = Get-ChildItem $base -Recurse -File -Filter $name | Select-Object -First 1
            if(-not $src){ throw "Falta $name en base limpia" }
            Copy-Item $src.FullName (Join-Path $root $name)
          }
          $mobile = Get-ChildItem $base -Recurse -Directory -Filter mobile | Select-Object -First 1
          if($mobile){ Copy-Item $mobile.FullName (Join-Path $root 'mobile') -Recurse }
          "UI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Arrancar backend 4.4.31
        shell: pwsh
        run: |
          $env:RP_FORCE_OFFLINE='1'
          $env:RP_DATA_DIR=(Join-Path $env:UI_ROOT 'data')
          $env:RP_PORT='18766'
          $env:DISABLE_SQLALCHEMY_CEXT_RUNTIME='1'
          $py=(Resolve-Path '.ui-venv\Scripts\python.exe').Path
          $outlog=Join-Path $env:RUNNER_TEMP 'v4431-ui.stdout.log'
          $errlog=Join-Path $env:RUNNER_TEMP 'v4431-ui.stderr.log'
          $proc=Start-Process -FilePath $py -ArgumentList @((Join-Path $env:UI_ROOT 'app.py')) -WorkingDirectory $env:UI_ROOT -RedirectStandardOutput $outlog -RedirectStandardError $errlog -PassThru -WindowStyle Hidden
          $proc.Id | Out-File (Join-Path $env:RUNNER_TEMP 'v4431-ui.pid') -Encoding ascii
          $ok=$false
          for($i=0;$i -lt 120;$i++){
            Start-Sleep -Milliseconds 250
            try {
              $v=Invoke-RestMethod 'http://127.0.0.1:18766/api/version' -TimeoutSec 1
              if([string]$v.version -eq '4.4.31'){ $ok=$true; break }
            } catch {}
            if($proc.HasExited){ break }
          }
          if(-not $ok){
            if(Test-Path $outlog){ Get-Content $outlog -Tail 200 }
            if(Test-Path $errlog){ Get-Content $errlog -Tail 200 }
            throw 'Backend 4.4.31 no arrancó'
          }
          $homeResp=Invoke-WebRequest 'http://127.0.0.1:18766/' -UseBasicParsing -TimeoutSec 5
          Write-Host "HOME_HTTP=$($homeResp.StatusCode) bytes=$($homeResp.RawContentLength)"
          if($homeResp.StatusCode -ne 200 -or $homeResp.RawContentLength -lt 500){ throw 'HTML principal inválido' }
          $jsResp=Invoke-WebRequest 'http://127.0.0.1:18766/static/app.js?v=4.4.28' -UseBasicParsing -TimeoutSec 5
          Write-Host "APP_JS_HTTP=$($jsResp.StatusCode) bytes=$($jsResp.RawContentLength)"
          if($jsResp.StatusCode -ne 200 -or $jsResp.RawContentLength -lt 10000){ throw 'app.js no se sirve correctamente' }

      - name: Abrir interfaz con navegador real y capturar errores JS
        shell: pwsh
        run: |
          @'
          import json, os, pathlib
          from playwright.sync_api import sync_playwright

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'v4431-ui-browser'
          out.mkdir(parents=True, exist_ok=True)
          console=[]
          page_errors=[]
          requests_failed=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1360,"height":840})
              page.on('console', lambda msg: console.append({"type":msg.type,"text":msg.text}))
              page.on('pageerror', lambda exc: page_errors.append(str(exc)))
              page.on('requestfailed', lambda req: requests_failed.append({"url":req.url,"failure":req.failure}))
              response=page.goto('http://127.0.0.1:18766/', wait_until='domcontentloaded', timeout=30000)
              page.wait_for_timeout(3500)
              title=page.title()
              body_text=page.locator('body').inner_text(timeout=5000)
              html=page.content()
              metrics=page.evaluate('''() => ({
                ready: document.readyState,
                bodyChildren: document.body ? document.body.children.length : -1,
                bodyTextLength: document.body ? document.body.innerText.length : -1,
                app: !!document.querySelector('#app'),
                appChildren: document.querySelector('#app') ? document.querySelector('#app').children.length : -1,
                scripts: [...document.scripts].map(s=>s.src || '[inline]'),
              })''')
              page.screenshot(path=str(out/'screen.png'), full_page=True)
              (out/'page.html').write_text(html,encoding='utf-8')
              (out/'body.txt').write_text(body_text,encoding='utf-8')
              (out/'diagnostic.json').write_text(json.dumps({
                'status': response.status if response else None,
                'title': title,
                'metrics': metrics,
                'console': console,
                'page_errors': page_errors,
                'request_failed': requests_failed,
              },ensure_ascii=False,indent=2),encoding='utf-8')
              print('TITLE',title)
              print('METRICS',json.dumps(metrics,ensure_ascii=False))
              print('BODY_START',repr(body_text[:500]))
              print('PAGE_ERRORS',json.dumps(page_errors,ensure_ascii=False))
              print('FAILED_REQ',json.dumps(requests_failed,ensure_ascii=False))
              print('CONSOLE_ERRORS',json.dumps([x for x in console if x['type'] in ('error','warning')],ensure_ascii=False))
              browser.close()

          if page_errors:
              raise SystemExit('UI_BLANK_REPRODUCED: JavaScript lanzó excepción')
          if requests_failed:
              raise SystemExit('UI_BLANK_REPRODUCED: fallaron recursos del navegador')
          if metrics['bodyTextLength'] < 120:
              raise SystemExit(f"UI_BLANK_REPRODUCED: bodyTextLength={metrics['bodyTextLength']}")
          print('BROWSER_UI_SMOKE_OK')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\ui_smoke.py
          .\.ui-venv\Scripts\python.exe $env:RUNNER_TEMP\ui_smoke.py

      - name: Mostrar diagnóstico siempre
        if: always()
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'v4431-ui-browser\diagnostic.json'
          if(Test-Path $d){ Get-Content $d -Raw }
          $outlog=Join-Path $env:RUNNER_TEMP 'v4431-ui.stdout.log'
          $errlog=Join-Path $env:RUNNER_TEMP 'v4431-ui.stderr.log'
          if(Test-Path $outlog){ Write-Host '--- backend stdout ---'; Get-Content $outlog -Tail 200 }
          if(Test-Path $errlog){ Write-Host '--- backend stderr ---'; Get-Content $errlog -Tail 200 }
          $pidfile=Join-Path $env:RUNNER_TEMP 'v4431-ui.pid'
          if(Test-Path $pidfile){
            $p=[int](Get-Content $pidfile -Raw)
            Stop-Process -Id $p -Force -ErrorAction SilentlyContinue
          }
