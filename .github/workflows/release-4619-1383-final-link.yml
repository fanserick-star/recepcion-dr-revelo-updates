name: Finalize Reception 4.6.19 and Historia 1.3.83

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-4619-1383-final-link.yml"

permissions:
  contents: write

concurrency:
  group: final-4619-1383-link
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix normal and manual subsequent detection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('recepcion/app')
          src = root / 'reception_history_identity_consolidated.py'
          ver = root / 'recepcion-version.json'
          man = root / 'update_manifest.json'

          vdoc = json.loads(ver.read_text(encoding='utf-8-sig'))
          assert str(vdoc.get('version')) == '4.6.18', vdoc
          mdoc = json.loads(man.read_text(encoding='utf-8-sig'))

          text = src.read_text(encoding='utf-8-sig')
          old = "const attentionIsSubsequent=attentionModal&&(()=>{try{return typeof attentionContext!=='undefined'&&!!attentionContext?.manualSubsequent}catch(_e){return false}})();"
          new = "const attentionIsSubsequent=attentionModal&&(()=>{try{return typeof currentDetectedStatus==='function'&&norm(currentDetectedStatus())==='S'}catch(_e){return false}})();"
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          src.write_text(text, encoding='utf-8', newline='\n')

          vdoc['version'] = '4.6.19'
          ver.write_text(json.dumps(vdoc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          for key in ('version','app_version','runtime_version'):
              if key in mdoc:
                  mdoc[key] = '4.6.19'
          notes = mdoc.setdefault('notes', {})
          notes['purpose'] = 'Vinculación con Historia desde Recepción para todo paciente subsecuente real: normal detectado o antiguo marcado manualmente; pacientes nuevos no muestran el panel.'
          notes['previous_version'] = '4.6.18'
          notes['normal_subsequent_history_link_visible'] = True
          notes['manual_legacy_subsequent_history_link_visible'] = True
          notes['new_patient_history_link_hidden'] = True
          notes['history_identity_transport_lan_fallback'] = True
          notes['waiting_queue_logic_changes'] = False
          notes['database_schema_changes'] = False
          man.write_text(json.dumps(mdoc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Validate both canonical runtimes
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python tools/test_historia_canonical_source.py
          python tools/validate_historia_runtime.py historia-clinica/app
          python -m py_compile recepcion/app/reception_history_identity_consolidated.py recepcion/app/historia_lan_transport.py historia-clinica/app/lan_bridge.py
          git diff --check

      - name: Validate exact behavior and JavaScript
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          r = Path('recepcion/app/reception_history_identity_consolidated.py').read_text(encoding='utf-8-sig')
          assert "typeof currentDetectedStatus==='function'&&norm(currentDetectedStatus())==='S'" in r
          assert "!!attentionContext?.manualSubsequent" not in r
          assert 'historia_lan.identity_prepare' in r
          assert 'historia_lan.identity_search' in r
          assert 'historia_lan.identity_link' in r
          assert 'Historia Clínica no está disponible en la red local' in r

          tree = ast.parse(r)
          js = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'V4613_JS' for t in node.targets):
                  js = ast.literal_eval(node.value)
                  break
          assert js
          Path('/tmp/reception_history_link.js').write_text(js, encoding='utf-8')

          h = Path('historia-clinica/app/lan_bridge.py').read_text(encoding='utf-8-sig')
          for path in ('/identity/status','/identity/prepare','/identity/search','/identity/link'):
              assert path in h
          assert json.loads(Path('historia-clinica/app/historia-version.json').read_text(encoding='utf-8-sig'))['version'] == '1.3.83'
          print('FLOW_OK: normal S + manual S link in Reception; N hidden; LAN identity available')
          PY
          node --check /tmp/reception_history_link.js

      - name: Commit final canonical sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepcion/app/reception_history_identity_consolidated.py recepcion/app/recepcion-version.json recepcion/app/update_manifest.json
          git rm -f tools/patch_4618_1383_history_link_lan.py || true
          git rm .github/workflows/release-4619-1383-final-link.yml
          git commit -m "Reception 4.6.19: link every subsequent from Reception"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Build both stable channels from exact commit
        run: |
          python tools/build_reception_app_channel.py --commit "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY"
          python tools/build_historia_app_channel.py --commit "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Verify generated channel versions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          h = json.loads(Path('historia-clinica/launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          assert r['appVersion'] == '4.6.19', r.get('appVersion')
          assert h['appVersion'] == '1.3.83', h.get('appVersion')
          assert r.get('mandatory') is True
          assert h.get('mandatory') is True
          print('CHANNELS_OK', r['appVersion'], h['appVersion'])
          PY

      - name: Publish both stable channels
        run: |
          git add launcher-v1/app-channel.json historia-clinica/launcher-v1/app-channel.json
          git commit -m "Publish Reception 4.6.19 and Historia 1.3.83 channels"
          git push origin HEAD:main
