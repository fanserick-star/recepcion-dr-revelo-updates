name: Recover Reception UI

on:
  push:
    branches:
      - recover-reception-ui
    paths:
      - .github/workflows/recover-reception-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-reception-ui
          fetch-depth: 1
      - name: List historical ZIP contents
        run: |
          set -e
          : > reception_zip_listing.txt
          find updates releases -type f -iname '*.zip' -print0 2>/dev/null | while IFS= read -r -d '' z; do
            echo "===== $z =====" >> reception_zip_listing.txt
            unzip -l "$z" >> reception_zip_listing.txt || true
            echo >> reception_zip_listing.txt
          done
      - name: Commit listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reception_zip_listing.txt
          git commit -m "audit: listar contenido de paquetes históricos" || exit 0
          git push origin HEAD:recover-reception-ui
