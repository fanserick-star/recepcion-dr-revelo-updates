name: Recover Reception UI

on:
  push:
    branches:
      - recover-reception-ui
    paths:
      - .github/workflows/recover-reception-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-reception-ui
          fetch-depth: 0
      - name: Scan every branch for HTML or UI assets
        run: |
          set -e
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          : > reception_ui_candidates.txt
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -v '/HEAD$'); do
            echo "===== $ref =====" >> reception_ui_candidates.txt
            git ls-tree -r --name-only "$ref" | grep -Ei '(^|/)(index\.html|.*\.html|static/|templates?/|frontend/|ui/)' >> reception_ui_candidates.txt || true
          done
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reception_ui_candidates.txt
          git commit -m "audit: localizar interfaz de Recepción en historial" || exit 0
          git push origin HEAD:recover-reception-ui
