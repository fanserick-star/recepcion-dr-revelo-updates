name: Publish v4.4.44 fast verified release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4444-release-fast.yml"

permissions:
  contents: write

concurrency:
  group: publish-v4444-fast-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused validation runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install chromium
      - name: Validate focused contracts and publish v4.4.44
        shell: pwsh
        run: |
          python build/v4444_weekly_appointment_guard/publish_v4444_release_fast.py
