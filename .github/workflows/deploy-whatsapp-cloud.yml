name: Deploy WhatsApp Cloud Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/whatsapp_worker_v2_6_STANDALONE.js'
      - 'cloudflare/wrangler.whatsapp.jsonc'
      - '.github/workflows/deploy-whatsapp-cloud.yml'

permissions:
  contents: read

concurrency:
  group: deploy-whatsapp-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar autorización de Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Falta CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Falta CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Validar Worker v2.6.1 antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          FILE='cloudflare/whatsapp_worker_v2_6_STANDALONE.js'
          test -s "$FILE"
          grep -q '2.6.1' "$FILE"
          grep -q 'recordatorio_cita_only' "$FILE"
          grep -q 'automaticAssistantNotice' "$FILE"
          grep -q 'DOCTOR_CONTACT_PHONE' "$FILE"
          grep -q 'whisper-large-v3-turbo' "$FILE"
      - name: Desplegar en dr-revelo-whatsapp-cloud
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.whatsapp.jsonc --keep-vars
      - name: Verificar versión y política publicada
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev/health'
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "$URL?ci=$(date +%s%N)" || true)"
            if BODY="$BODY" node - <<'NODE'
          try {
            const d = JSON.parse(process.env.BODY || '{}');
            if (d.ok === true && d.service === 'dr-revelo-whatsapp-cloud' && d.worker_version === '2.6.1' && d.inbound_policy === 'recordatorio_cita_only') process.exit(0);
          } catch {}
          process.exit(1);
          NODE
            then
              echo 'WHATSAPP_WORKER_V261_LIVE_OK'
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 2
          done
          echo 'El despliegue terminó, pero /health no confirmó v2.6.1 a tiempo.'
          exit 1
