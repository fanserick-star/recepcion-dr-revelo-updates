name: Deploy WhatsApp Worker v2.6.14 optimizacion Neon

on:
  push:
    branches: [main]
    paths:
      - 'build/whatsapp_v2614/**'
      - '.github/workflows/deploy-whatsapp-v2614-neon-optimization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-whatsapp-v2614-neon-optimization
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sincronizar y parchear v2.6.14
        run: |
          git pull --rebase origin main
          python build/whatsapp_v2614/patch_worker.py
          node --check cloudflare/whatsapp_worker_v2_6_responses.js

      - name: Validar optimizacion Neon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('cloudflare/whatsapp_worker_v2_6_responses.js').read_text(encoding='utf-8')
          cfg=json.loads(Path('cloudflare/wrangler.whatsapp.jsonc').read_text(encoding='utf-8'))
          for m in [
              'worker_version:"2.6.14"',
              'scheduler:"business_window_30m"',
              'neon_optimization:"v1"',
              'status_persistence:"failed_only"',
              'direct_message_fast_path:true',
              'booking_confirmation:"cita_agendada_immediate"',
              'whatsapp_direct_fast_notice_failed',
              "a.fecha >= ((now() AT TIME ZONE 'America/Guayaquil')::date - 1)",
              'ctx.waitUntil(runScheduler(env)'
          ]: assert m in s,m
          assert cfg['triggers']['crons']==['*/30 11-22 * * 4-6','*/30 13-22 * * 3']
          print('WHATSAPP_V2614_NEON_OPTIMIZATION_OK')
          PY

      - name: Generar standalone
        run: |
          npm install --no-save esbuild @neondatabase/serverless
          npx esbuild cloudflare/whatsapp_worker_v2_6_responses.js --bundle --format=esm --platform=browser --target=es2022 --outfile=cloudflare/whatsapp_worker_v2_6_STANDALONE.js --banner:js='// Dr. Revelo WhatsApp Cloud Worker v2.6.14 — Neon optimized'
          cp cloudflare/whatsapp_worker_v2_6_STANDALONE.js cloudflare/WHATSAPP_WORKER_v2_6_STANDALONE.txt
          node --check cloudflare/whatsapp_worker_v2_6_STANDALONE.js

      - name: Desplegar en Cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.whatsapp.jsonc --keep-vars

      - name: Verificar produccion
        run: |
          set -euo pipefail
          URL='https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev/health'
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "$URL?ci=$(date +%s%N)" || true)"
            if BODY="$BODY" node - <<'NODE'
          try {
            const d=JSON.parse(process.env.BODY||'{}');
            if(d.ok===true && d.worker_version==='2.6.14' && d.scheduler==='business_window_30m' && d.neon_optimization==='v1' && d.status_persistence==='failed_only' && d.direct_message_fast_path===true && d.booking_confirmation==='cita_agendada_immediate') process.exit(0);
          } catch {}
          process.exit(1);
          NODE
            then
              echo 'WHATSAPP_WORKER_V2614_LIVE_OK'
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Guardar fuente, cron y bundle validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/whatsapp_worker_v2_6_responses.js cloudflare/whatsapp_worker_v2_6_STANDALONE.js cloudflare/WHATSAPP_WORKER_v2_6_STANDALONE.txt cloudflare/wrangler.whatsapp.jsonc
          if git diff --cached --quiet; then
            echo 'Worker v2.6.14 ya estaba guardado.'
          else
            git commit -m 'build: Worker v2.6.14 optimiza consumo Neon'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
