name: Export encrypted diagnostics on demand

on:
  push:
    paths:
      - ".github/diagnostic-export-trigger.txt"
      - ".github/workflows/export-encrypted-diagnostics.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev
    steps:
      - name: Fetch encrypted diagnostic export only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          OK=0
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$WORKER_URL/diagnostics/internal/export" -o "$RUNNER_TEMP/diagnostic-export.json"; then
              if python - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'diagnostic-export.json')
          d=json.load(open(p,'r',encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('format') == 'rp_diag_aesgcm_v1'
          entries=d.get('entries') or []
          assert len(entries) <= 5
          for x in entries:
              assert set(x) == {'incident_hash','iv_b64','ciphertext_b64'}
              assert len(x['incident_hash']) == 64
              assert x['iv_b64'] and x['ciphertext_b64']
          print('ENCRYPTED_DIAGNOSTICS_READY count=',len(entries))
          PY
              then OK=1; break; fi
            fi
            sleep 5
          done
          test "$OK" = "1"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-diagnostics
          path: ${{ runner.temp }}/diagnostic-export.json
          retention-days: 1
