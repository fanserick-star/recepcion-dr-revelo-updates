name: Build Reception 4.6.6 Candidate

on:
  push:
    branches:
      - fix/reception-466-fast-attention-save
    paths:
      - tools/build_reception_466.py
      - .github/workflows/build-reception-466-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate exact 4.6.6 candidate
        shell: pwsh
        run: python tools/build_reception_466.py

      - name: Static safety and behavior contracts
        shell: python
        run: |
          import json, pathlib, py_compile
          base = pathlib.Path('updates/v4_6_5_historia_procedure_names')
          out = pathlib.Path('updates/v4_6_6_fast_attention_save')
          app = (out/'app.py').read_text(encoding='utf-8-sig')
          py_compile.compile(str(out/'app.py'), doraise=True)

          assert '_v466_local_attention_db' in app
          assert 'db.info["offline"] = True' in app
          assert '_v466_sync_attention_queue_later' in app
          assert 'core.process_offline_queue()' in app
          assert 'time.sleep(1.0)' in app
          assert 'v466_print_visit_local_first' in app
          assert 'procedure_auto_print": False' in app
          assert 'consultation_auto_print": True' in app
          assert 'Guardando atención…' in app
          assert 'Guardando atención e imprimiendo recibo…' in app

          # Existing offline sync is the durability contract used by 4.6.6.
          assert 'visit.create' in app
          assert 'BillingRecord(visit_id=v.id' in app
          assert '_v4451_sync_one_operation' in app
          assert 'source_row' in app

          manifest = json.loads((out/'update_manifest.json').read_text(encoding='utf-8-sig'))
          version = json.loads((out/'recepcion-version.json').read_text(encoding='utf-8-sig'))['version']
          assert version == '4.6.6'
          assert all(manifest[k] == version for k in ('version','app_version','runtime_version'))
          assert manifest['notes']['database_schema_changes'] is False
          assert manifest['notes']['billing_logic_changes'] is False
          assert manifest['notes']['azur_logic_changes'] is False
          assert manifest['notes']['whatsapp_logic_changes'] is False

          for rel in ('historia_bridge.py','historia_lan_transport.py','static/runtime_keep.txt'):
              assert (base/rel).read_bytes() == (out/rel).read_bytes(), rel
          print('4.6.6 contracts OK')

      - name: Install runtime dependencies for import smoke test
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet fastapi uvicorn sqlalchemy python-dotenv pg8000 python-multipart requests openpyxl

      - name: Import exact runtime and verify final active routes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:RP_DATA_DIR = Join-Path $env:RUNNER_TEMP "rp466_data"
          $env:RP_FORCE_OFFLINE = "1"
          $env:DATABASE_URL = ""
          $env:HISTORIA_DATABASE_URL = ""
          $env:REMOTE_AGENDA_AUTOSTART = "0"
          $env:WHATSAPP_ENABLED = "0"
          Push-Location "updates/v4_6_6_fast_attention_save"
          @'
          import app
          assert app.APP_VERSION == '4.6.6', app.APP_VERSION
          routes = list(app.app.router.routes)
          batch = [r for r in routes if getattr(r,'path',None)=='/api/visits/batch-payment' and 'POST' in (getattr(r,'methods',set()) or set())]
          printing = [r for r in routes if getattr(r,'path',None)=='/api/v4470/print-visit/{visit_id}' and 'POST' in (getattr(r,'methods',set()) or set())]
          assert len(batch) == 1, len(batch)
          assert len(printing) == 1, len(printing)
          assert batch[0].endpoint.__name__ == 'v466_fast_local_attention_save', batch[0].endpoint.__name__
          assert printing[0].endpoint.__name__ == 'v466_print_visit_local_first', printing[0].endpoint.__name__
          assert app._V466_BUSY_REPLACEMENTS >= 1
          assert 'Guardando atención…' in app.core.V460_OVERLAY_JS
          assert app._V466_OLD_BUSY not in app.core.V460_OVERLAY_JS
          gen = app._v466_local_attention_db()
          db = next(gen)
          try:
              assert db.info.get('offline') is True
              assert db.info.get('local_first') is True
              assert app.core.is_offline_db(db) is True
          finally:
              try: next(gen)
              except StopIteration: pass
          print('RUNTIME IMPORT OK 4.6.6')
          print('batch route', batch[0].endpoint.__name__)
          print('print route', printing[0].endpoint.__name__)
          '@ | Set-Content -Encoding utf8 _runtime_test.py
          python _runtime_test.py
          Remove-Item _runtime_test.py -Force
          Pop-Location

      - name: Remove test artifacts
        shell: bash
        run: |
          find updates/v4_6_6_fast_attention_save -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find updates/v4_6_6_fast_attention_save -type f -name '*.pyc' -delete || true
          find updates/v4_6_6_fast_attention_save -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -delete || true

      - name: Ensure only intended candidate/channel changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -f updates/v4_6_6_fast_attention_save/app.py
          test -f launcher-v1/app-channel-source.json
          ! find updates/v4_6_6_fast_attention_save -type f | grep -E '(\.pyc$|\.db$|\.sqlite|\.env$)'

      - name: Commit generated candidate to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/v4_6_6_fast_attention_save launcher-v1/app-channel-source.json
          if git diff --cached --quiet; then
            echo "Candidate already current"
            exit 0
          fi
          git commit -m "Recepción 4.6.6 fast attention save candidate"
          git push origin HEAD:fix/reception-466-fast-attention-save
