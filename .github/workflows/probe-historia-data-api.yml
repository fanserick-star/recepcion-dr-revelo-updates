name: Probe Historia Data API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-historia-data-api.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe public endpoints
        shell: bash
        run: |
          set -euo pipefail
          API='https://ep-sweet-mud-arlsk7qa.apirest.us-west-2.aws.neon.tech/neondb/rest/v1/'
          AUTH='https://ep-sweet-mud-arlsk7qa.neonauth.us-west-2.aws.neon.tech/neondb/auth/token/anonymous'
          api_code="$(curl -L -sS -o /tmp/api.out -w '%{http_code}' --max-time 20 "$API" || true)"
          auth_code="$(curl -L -sS -o /tmp/auth.out -w '%{http_code}' --max-time 20 "$AUTH" || true)"
          api_ct="$(file -b --mime-type /tmp/api.out 2>/dev/null || true)"
          auth_ct="$(file -b --mime-type /tmp/auth.out 2>/dev/null || true)"
          mkdir -p diagnostics
          printf '{"api_http":"%s","auth_http":"%s","api_body_bytes":%s,"auth_body_bytes":%s}\n'             "$api_code" "$auth_code" "$(wc -c </tmp/api.out 2>/dev/null || echo 0)" "$(wc -c </tmp/auth.out 2>/dev/null || echo 0)"             > diagnostics/historia-data-api-probe.json
      - name: Publish sanitized result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/historia-data-api-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe Historia Data API availability"
          git push origin HEAD:main
