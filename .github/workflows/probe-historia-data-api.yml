name: Probe Historia Data API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-historia-data-api.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe public endpoints
        shell: bash
        run: |
          set -euo pipefail
          API='https://ep-sweet-mud-arlsk7qa.apirest.us-west-2.aws.neon.tech/neondb/rest/v1/'
          AUTH='https://ep-sweet-mud-arlsk7qa.neonauth.us-west-2.aws.neon.tech/neondb/auth/token/anonymous'
          curl -L -sS -o /tmp/api.out -w '%{http_code}' --max-time 20 "$API" >/tmp/api.code || true
          curl -L -sS -o /tmp/auth.out -w '%{http_code}' --max-time 20 "$AUTH" >/tmp/auth.code || true
          mkdir -p diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          def read(path, limit=600):
              try:
                  return Path(path).read_text(encoding='utf-8',errors='replace')[:limit]
              except Exception:
                  return ''
          doc={
              'api_http':read('/tmp/api.code',20).strip(),
              'auth_http':read('/tmp/auth.code',20).strip(),
              'api_body':read('/tmp/api.out'),
              'auth_body':read('/tmp/auth.out'),
          }
          Path('diagnostics/historia-data-api-probe.json').write_text(json.dumps(doc,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Publish sanitized result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/historia-data-api-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe Historia Data API availability"
          git push origin HEAD:main
