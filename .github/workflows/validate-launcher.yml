name: Validate launcher

on:
  push:
    branches: [ main ]
    paths:
      - 'updates/**/ABRIR_RECEPCION.py'
      - '.github/workflows/validate-launcher.yml'
  pull_request:
    paths:
      - 'updates/**/ABRIR_RECEPCION.py'
      - '.github/workflows/validate-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select latest launcher
        shell: bash
        run: |
          set -euo pipefail
          LAUNCHER="$(find updates -type f -name ABRIR_RECEPCION.py | sort | tail -n 1)"
          test -n "$LAUNCHER"
          echo "LAUNCHER=$LAUNCHER" >> "$GITHUB_ENV"
          echo "Validating $LAUNCHER"
      - name: Compile
        run: python -m py_compile "$LAUNCHER"
      - name: Launcher self-tests
        run: python "$LAUNCHER" --self-test-core
