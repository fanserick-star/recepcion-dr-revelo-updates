name: Validar candidata v4.4.9 limpia desde v4.4.4

on:
  push:
    branches: [candidate-v4.4.9-clean-444]
    paths:
      - 'build/v449_candidate/**'
      - '.github/workflows/validate-v449-clean-444.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruir candidata desde la v4.4.4 real
        shell: pwsh
        run: python build/v449_candidate/build_v449_candidate.py

      - name: Contrato de dependencias y archivos protegidos
        shell: pwsh
        run: >-
          python tools/release_guard.py
          --app candidates/v4_4_9_clean_444/app.py
          --manifest candidates/v4_4_9_clean_444/update_manifest.json
          --version 4.4.9

      - name: Validar frontend único y sintaxis JavaScript
        shell: pwsh
        run: |
          node --check candidates/v4_4_9_clean_444/static/app.js
          if(Test-Path candidates/v4_4_9_clean_444/static/app_base.js){ throw 'REGRESIÓN: volvió app_base.js' }
          if(Select-String -Path candidates/v4_4_9_clean_444/static/app.js -SimpleMatch 'loadStableBase' -Quiet){ throw 'REGRESIÓN: volvió el wrapper dinámico' }
          if(-not (Select-String -Path candidates/v4_4_9_clean_444/static/app.js -SimpleMatch 'v449SearchNormalized' -Quiet)){ throw 'Falta hotfix 4.4.4 integrado' }
          foreach($m in @('id="agenda"','id="facturacion"','id="reportes"','id="pacientes"','Agenda y WhatsApp','Facturación AZUR')){
            if(-not (Select-String -Path candidates/v4_4_9_clean_444/static/index.html -SimpleMatch $m -Quiet)){ throw "Falta interfaz: $m" }
          }
          Write-Host 'FRONTEND_444_FOLDED_OK'

      - name: Crear runtime igual al consultorio y sin psycopg
        shell: pwsh
        run: |
          python -m venv .release-venv
          .\.release-venv\Scripts\python.exe -m pip install --disable-pip-version-check `
            'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20'
          .\.release-venv\Scripts\python.exe -c "import fastapi,pydantic,uvicorn,sqlalchemy,pg8000,dotenv,multipart; print('RUNTIME_OK')"
          $hasPsycopg = & .\.release-venv\Scripts\python.exe -c "import importlib.util; print('1' if importlib.util.find_spec('psycopg') else '0')"
          if($hasPsycopg.Trim() -ne '0'){ throw 'El smoke test debe correr sin psycopg' }

      - name: Preparar instalación simulada completa
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Recepcion-v449-smoke'
          if(Test-Path $root){ Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force $root | Out-Null

          $base = Join-Path $env:RUNNER_TEMP 'rp-base-v449'
          if(Test-Path $base){ Remove-Item $base -Recurse -Force }
          Expand-Archive installer_clean/base/clean_base_resources.zip -DestinationPath $base -Force

          foreach($name in @('azur_client.py','whatsapp_client.py','remote_agenda.py')){
            $src = Get-ChildItem $base -Recurse -File -Filter $name | Select-Object -First 1
            if(-not $src){ throw "Falta $name en base limpia" }
            Copy-Item $src.FullName (Join-Path $root $name)
          }
          $static = Get-ChildItem $base -Recurse -Directory -Filter static | Select-Object -First 1
          if(-not $static){ throw 'Falta static en base limpia' }
          Copy-Item $static.FullName (Join-Path $root 'static') -Recurse
          $mobile = Get-ChildItem $base -Recurse -Directory -Filter mobile | Select-Object -First 1
          if($mobile){ Copy-Item $mobile.FullName (Join-Path $root 'mobile') -Recurse }

          Copy-Item candidates/v4_4_9_clean_444/app.py (Join-Path $root 'app.py') -Force
          Copy-Item candidates/v4_4_9_clean_444/update_manifest.json (Join-Path $root 'update_manifest.json') -Force
          Copy-Item candidates/v4_4_9_clean_444/static/index.html (Join-Path $root 'static\index.html') -Force
          Copy-Item candidates/v4_4_9_clean_444/static/app.js (Join-Path $root 'static\app.js') -Force
          if(Test-Path (Join-Path $root 'static\app_base.js')){ Remove-Item (Join-Path $root 'static\app_base.js') -Force }
          New-Item -ItemType Directory -Force (Join-Path $root 'data') | Out-Null
          "SMOKE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke real - 8000 ocupado, RP_PORT 8766 y frontend 4.4.4
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,8000)
          $listener.Start()
          $env:RP_PORT='8766'
          $env:RP_FORCE_OFFLINE='1'
          $env:RP_DATA_DIR=(Join-Path $env:SMOKE_ROOT 'data')
          $env:DISABLE_SQLALCHEMY_CEXT_RUNTIME='1'
          $py=(Resolve-Path '.release-venv\Scripts\python.exe').Path
          $outlog=Join-Path $env:RUNNER_TEMP 'v449.stdout.log'
          $errlog=Join-Path $env:RUNNER_TEMP 'v449.stderr.log'
          $proc=Start-Process -FilePath $py -ArgumentList @((Join-Path $env:SMOKE_ROOT 'app.py')) -WorkingDirectory $env:SMOKE_ROOT -RedirectStandardOutput $outlog -RedirectStandardError $errlog -PassThru -WindowStyle Hidden
          try {
            $ok=$false
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Milliseconds 250
              try {
                $v=Invoke-RestMethod 'http://127.0.0.1:8766/api/version' -TimeoutSec 1
                if([string]$v.version -eq '4.4.9'){ $ok=$true; break }
              } catch {}
              if($proc.HasExited){ break }
            }
            if(-not $ok){
              if(Test-Path $outlog){ Get-Content $outlog -Tail 200 }
              if(Test-Path $errlog){ Get-Content $errlog -Tail 200 }
              throw 'Backend candidato no arrancó en 8766'
            }

            $page=(Invoke-WebRequest 'http://127.0.0.1:8766/' -UseBasicParsing -TimeoutSec 4).Content
            foreach($m in @('id="agenda"','id="facturacion"','id="reportes"','id="pacientes"')){
              if(-not $page.Contains($m)){ throw "La página servida perdió $m" }
            }
            $js=(Invoke-WebRequest 'http://127.0.0.1:8766/static/app.js?v=4.4.9' -UseBasicParsing -TimeoutSec 4).Content
            if(-not $js.Contains('v449SearchNormalized')){ throw 'El servidor no está entregando el hotfix integrado' }
            if($js.Contains('app_base.js') -or $js.Contains('loadStableBase')){ throw 'El servidor volvió a entregar frontend por capas' }
            Write-Host 'V449_RUNTIME_AND_FRONTEND_SMOKE_OK'
          } finally {
            if(-not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            $listener.Stop()
          }

      - name: Verificar que nada se publique accidentalmente
        shell: pwsh
        run: |
          $meta = Get-Content candidates/v4_4_9_clean_444/candidate_meta.json -Raw | ConvertFrom-Json
          if($meta.published -ne $false){ throw 'La candidata se marcó como publicada' }
          $changed = @(git diff --name-only origin/main...HEAD --)
          if($LASTEXITCODE -ne 0){ throw 'No se pudo comparar la rama candidata contra origin/main' }
          if($changed -match '^latest(-v3)?\.json$'){ throw 'La rama candidata no puede tocar el canal latest' }
          Write-Host 'CHANNEL_UNTOUCHED_OK'

      - uses: actions/upload-artifact@v4
        with:
          name: recepcion-v4.4.9-candidate-clean-444
          path: candidates/v4_4_9_clean_444
          if-no-files-found: error
