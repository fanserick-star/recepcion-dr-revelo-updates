name: Validar y publicar v4.3.103
on:
  push:
    branches: [main]
    paths:
      - 'build/v43103/**'
      - '.github/workflows/build-v43103-validate.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir candidato
        run: python build/v43103/build_v43103.py
      - name: Reconstruir y validar archivos
        run: |
          cat updates/v43103/app.part* > _ci_app.py
          cat updates/v43103/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          app=Path('_ci_app.py').read_text(encoding='utf-8')
          js=Path('updates/v43103/static/app.js').read_text(encoding='utf-8')
          for token in ['APP_VERSION = "4.3.103"',"const groups=box.querySelector('.service-groups')","price.textContent='$40.00'","procHeading.textContent='Procedimientos y servicios'",'V43103_SERVICES_CSS','replace(_legacy_services_js, "")','overflow-x:hidden']:
              assert token in app, token
          for token in ['data-service="CONSULTA"',"toggleService('CONSULTA')",'<span class="service-price">$40.00</span>','<b>Procedimientos y servicios</b>']:
              assert token in js, token
          assert '$40 fijo' not in js
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.103'
          assert any(x['path']=='static/app.js' for x in latest['files'])
          for path,real in [('app.py',Path('_ci_app.py').read_bytes()),('ABRIR_RECEPCION.py',Path('_ci_launcher.py').read_bytes()),('static/app.js',Path('updates/v43103/static/app.js').read_bytes())]:
              item=next(x for x in latest['files'] if x['path']==path)
              assert hashlib.sha256(real).hexdigest()==item['sha256'],path
          print('STATIC_V43103_OK')
          PY
      - name: Extraer remaster de atención y CSS final
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src)
          vals={}
          for n in tree.body:
              if isinstance(n,ast.Assign):
                  for t in n.targets:
                      if isinstance(t,ast.Name) and t.id in {'V492_ATTENTION_JS','V43103_SERVICES_CSS'}:
                          vals[t.id]=ast.literal_eval(n.value)
          assert 'V492_ATTENTION_JS' in vals and 'V43103_SERVICES_CSS' in vals
          Path('_v492.js').write_text(vals['V492_ATTENTION_JS'],encoding='utf-8')
          Path('_v43103.css').write_text(vals['V43103_SERVICES_CSS'],encoding='utf-8')
          css=vals['V43103_SERVICES_CSS']
          for token in ['.consultation-service-section','.consultation-grid','grid-template-columns:1fr!important','.procedures-service-section','repeat(3,minmax(0,1fr))','service-title.enhanced{display:none']:
              assert token in css,token
          print('EXTRACT_V43103_OK')
          PY
      - name: Probar DOM real sin proxy ni grilla artificial
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@26 >/dev/null 2>&1
          cat > _dom_test.mjs <<'JS'
          import fs from 'node:fs';
          import {JSDOM} from 'jsdom';
          const proc=['FULGURACIÓN','CISTOSCOPIA','DILATACIÓN','CIRCUNSICIÓN','INSTILACIÓN','LAVADO','CAMBIO DE SONDA','CISTO Y DILATACIÓN','SERVICIO DE UROLOGÍA'];
          const buttons=proc.map((n,i)=>`<button type="button" class="service-card procedure-card" data-service="${n}"><span class="service-icon">▣</span><strong>${n}</strong><span class="service-price">${i===4?'$80.00':'Valor editable'}</span><span class="service-check">✓</span></button>`).join('');
          const html=`<!doctype html><html><body><div id="modal"><div class="modalbox"><div class="modal-form-heading"><h2>Nueva atención</h2><p>x</p></div><div class="service-title enhanced"><div><b>Selecciona la atención</b><small>Elige consulta o procedimiento</small></div><span>0 seleccionadas</span></div><div class="service-groups"><div class="service-section consultation-service-section"><div class="service-group-heading"><div><b>Consulta</b><span>Atención médica</span></div></div><div class="service-grid consultation-grid"><button type="button" class="service-card consultation-card" data-service="CONSULTA"><span class="service-icon">✚</span><strong>CONSULTA</strong><span class="service-price">$40.00</span><span class="service-check">✓</span></button></div></div><div class="service-section procedures-service-section"><div class="service-group-heading"><div><b>Procedimientos y servicios</b><span>Selecciona uno o varios si corresponde</span></div></div><div class="service-grid">${buttons}</div></div></div><div class="actions form-actions"><button>Cancelar</button><button>Guardar atención</button></div></div></div></body></html>`;
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true});
          const {window}=dom;
          window.eval(fs.readFileSync('_v492.js','utf8'));
          window.document.dispatchEvent(new window.Event('DOMContentLoaded',{bubbles:true}));
          window.document.dispatchEvent(new window.MouseEvent('click',{bubbles:true}));
          await new Promise(r=>setTimeout(r,350));
          const box=window.document.querySelector('#modal .modalbox');
          if(box.querySelector('.v492-services-grid'))throw new Error('Se creó una grilla artificial');
          if(box.querySelector('.v495-consult-card,.v494-consult-proxy'))throw new Error('Apareció proxy de Consulta');
          const consult=box.querySelector('.consultation-grid > button[data-service="CONSULTA"]');
          if(!consult)throw new Error('Consulta nativa no está en su sección');
          if(!consult.textContent.includes('CONSULTA')||!consult.textContent.includes('$40.00'))throw new Error('Contenido de Consulta incorrecto');
          const heading=box.querySelector('.procedures-service-section .service-group-heading b');
          if(heading?.textContent!=='Procedimientos y servicios')throw new Error('Título procedimientos incorrecto');
          if(box.querySelectorAll('.procedures-service-section button.service-card').length!==9)throw new Error('Procedimientos incompletos');
          console.log('DOM_NATIVE_SERVICES_V43103_OK');
          JS
          node _dom_test.mjs
      - name: Probar backend portable
        run: |
          python -m pip install --disable-pip-version-check 'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' 'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20'
          rm -rf _smoke_root _smoke_data
          mkdir -p _smoke_root _smoke_data
          unzip -q installer_clean/base/clean_base_resources.zip -d _smoke_root
          cp _ci_app.py _smoke_root/app.py
          cp updates/v43103/static/index.html _smoke_root/static/index.html
          cp updates/v43103/static/app.js _smoke_root/static/app.js
          (cd _smoke_root && RP_FORCE_OFFLINE=1 RP_PORT=8765 RP_DATA_DIR="$PWD/../_smoke_data" DISABLE_SQLALCHEMY_CEXT_RUNTIME=1 python app.py > ../_smoke.log 2>&1 & echo $! > ../_smoke.pid)
          python - <<'PY'
          import json,time,urllib.request
          ok=False
          for _ in range(100):
              time.sleep(.25)
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/api/version',timeout=1) as r:d=json.loads(r.read().decode())
                  if d.get('version')=='4.3.103':ok=True;break
              except Exception:pass
          if not ok:
              print(open('_smoke.log',encoding='utf-8',errors='replace').read())
              raise SystemExit('backend portable no arrancó')
          print('PORTABLE_BACKEND_V43103_OK')
          PY
          kill "$(cat _smoke.pid)" || true
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v43103 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.103 servicios nativos'
          git pull --rebase origin main
          git push
