name: Recepcion 4.6.8 Identity Audit

on:
  push:
    branches: [recepcion-4.6.8-identidad-historia]
    paths:
      - ".github/workflows/recepcion-468-identity-audit.yml"
      - "recepcion/app/reception_history_identity_authority.py"
      - "recepcion/app/features_runtime.py"
      - "recepcion/app/recepcion-version.json"
      - "recepcion/app/update_manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recepcion-4.6.8-identidad-historia

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: |
          python -m py_compile recepcion/app/reception_history_identity_authority.py recepcion/app/features_runtime.py

      - name: Validate contracts
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          p = Path('recepcion/app/reception_history_identity_authority.py')
          src = p.read_text(encoding='utf-8')
          tree = ast.parse(src)
          js = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'V468_JS' for t in node.targets):
                  js = ast.literal_eval(node.value)
                  break
          assert js, 'V468_JS missing'
          Path('/tmp/v468.js').write_text(js, encoding='utf-8')

          required = [
              'public.patient_links', 'public.waiting_queue', 'public.patients', 'public.encounters',
              '/api/historia-identity/status/', '/api/historia-identity/prepare/',
              '/api/historia-identity/search', '/api/historia-identity/link',
              'COUNT(DISTINCT CASE', 'history_date_count', 'reception_manual_verified',
              "if(isSub&&pre&&pre.ok!==false&&!pre.linked)",
              "TRANSLATE(UPPER(COALESCE(p.name_search,p.name,'')),'ÁÉÍÓÚÜÑ','AEIOUUN') LIKE %s",
              'offline_historia_fallback_preserved": True',
              'public_bridge_column_guard": True',
              'history_clinical_notes_exposed_to_reception": False',
          ]
          for marker in required:
              assert marker in src, marker

          # Recepción sólo obtiene datos administrativos + conteos; no devuelve texto clínico.
          assert 'SELECT p.id,p.name,p.national_id,p.birth_date,p.phone,p.email,p.address' in src
          search_section = src[src.index('@app.get("/api/historia-identity/search")'):src.index('@app.post("/api/historia-identity/link")')]
          assert 'clinical_note' not in search_section
          assert 'diagnosis' not in search_section
          assert 'treatment' not in search_section

          version = json.loads(Path('recepcion/app/recepcion-version.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('recepcion/app/update_manifest.json').read_text(encoding='utf-8'))
          features = Path('recepcion/app/features_runtime.py').read_text(encoding='utf-8')
          assert version['version'] == '4.6.8'
          assert manifest['version'] == manifest['app_version'] == manifest['runtime_version'] == '4.6.8'
          assert 'reception_history_identity_authority.py' in manifest['copy']
          assert 'reception_history_identity_authority.py' in manifest['required_dependencies']
          assert 'import reception_history_identity_authority' in features
          assert manifest['notes']['external_patch_chain_required'] is False
          assert manifest['notes']['patient_data_destructive_changes'] is False
          assert manifest['notes']['history_clinical_notes_exposed_to_reception'] is False
          assert manifest['notes']['demographics_blank_never_overwrites'] is True
          assert manifest['notes']['identification_conflict_guard'] is True
          print('RECEPCION_468_IDENTITY_CONTRACT_OK')
          PY
          node --check /tmp/v468.js
