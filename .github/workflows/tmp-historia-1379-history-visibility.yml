name: TEMP Historia 1.3.79 History Visibility
on:
  push:
    branches:
      - historia-1.3.79-history-visibility
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate
        shell: python {0}
        run: |
          from pathlib import Path
          import json

          root = Path('historia-clinica/app')
          version_path = root / 'historia-version.json'
          manifest_path = root / 'update_manifest.json'
          app_path = root / 'app.py'
          css_path = root / 'static/style.css'

          current = json.loads(version_path.read_text(encoding='utf-8-sig'))
          if str(current.get('version')) == '1.3.79':
              print('candidate already applied')
              raise SystemExit(0)

          app = app_path.read_text(encoding='utf-8')
          old = '''            open_attr = " open" if index == 0 else ""

            previous_cards.append(f"""
            <details class='previous-record'{open_attr}>
              <summary>
                <span class='previous-record-date'><b>{e(date_label)}</b>{f"<time>{e(time_label)}</time>" if time_label else ""}</span>
                <span class='previous-record-summary'><strong>{e(title)}</strong><small>{origin}</small></span>
                <span class='previous-record-chevron'>⌄</span>
              </summary>
              <div class='previous-record-body'>{record_body}</div>
            </details>
            """)'''
          new = '''            previous_cards.append(f"""
            <section class='previous-record previous-record-flat'>
              <div class='previous-record-flat-head'>
                <span class='previous-record-date'><b>{e(date_label)}</b>{f"<time>{e(time_label)}</time>" if time_label else ""}</span>
                <span class='previous-record-summary'><strong>{e(title)}</strong><small>{origin}</small></span>
              </div>
              <div class='previous-record-body'>{record_body}</div>
            </section>
            """)'''
          if old not in app:
              raise SystemExit('No se encontro el bloque de Historial anterior esperado')
          app = app.replace(old, new, 1)
          app_path.write_text(app, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* v1.3.79 · historial amplio y referencia plana durante consulta */'
          addition = r'''

/* v1.3.79 · historial amplio y referencia plana durante consulta */
@media (min-width: 1000px){
  body.cp-remaster-app main:has(.cp-history-window),
  body.legacy-remaster main:has(.cp-history-window){
    max-width:1560px!important;
    padding-left:22px!important;
    padding-right:22px!important;
  }
}
.cp-history-window .cp-history-content{padding:12px 14px!important}
.cp-history-window .cp-flat-history-entry{
  margin-bottom:12px!important;border:1px solid #c7c0b6!important;border-radius:4px!important;background:#fff!important
}
.cp-history-window .cp-flat-history-entry .legacy-segment-date{padding:9px 12px!important;background:#eef1f4!important}
.cp-history-window .cp-flat-history-entry .legacy-segment-date>strong{font-size:16px!important;color:#123f72!important}
.cp-history-window .cp-flat-history-entry .legacy-segment-date time{font-size:13px!important}
.cp-history-window .cp-flat-history-entry>small{display:block!important;padding:7px 12px 0!important;font-size:12.5px!important;font-weight:700!important;color:#575d63!important}
.cp-history-window .cp-flat-history-entry .legacy-segment-body,
.cp-history-window .cp-flat-history-entry .cp-note-body,
.cp-history-window .cp-flat-history-entry .previous-record-text{
  padding:10px 12px 13px!important;font-size:16px!important;line-height:1.58!important;font-weight:700!important;color:#111923!important
}
.cp-remaster-app .previous-panel{min-width:0!important}
.cp-remaster-app .previous-scroll.clean-reference{padding:8px!important;background:#f7f3ed!important}
.cp-remaster-app .previous-record-list{display:flex!important;flex-direction:column!important;gap:10px!important}
.cp-remaster-app .previous-record-flat{display:block!important;border:1px solid #c7c0b6!important;border-radius:4px!important;background:#fff!important;overflow:hidden!important}
.cp-remaster-app .previous-record-flat-head{
  display:grid!important;grid-template-columns:118px minmax(0,1fr)!important;gap:10px!important;align-items:center!important;padding:8px 10px!important;background:#eef1f4!important;border-bottom:1px solid #ccd1d6!important
}
.cp-remaster-app .previous-record-flat .previous-record-date b{font-size:15px!important;color:#123f72!important}
.cp-remaster-app .previous-record-flat .previous-record-date time{font-size:12px!important}
.cp-remaster-app .previous-record-flat .previous-record-summary strong{font-size:14px!important;line-height:1.35!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
.cp-remaster-app .previous-record-flat .previous-record-summary small{font-size:11.5px!important}
.cp-remaster-app .previous-record-flat .previous-record-body{display:block!important;padding:10px 11px 12px!important;font-size:15px!important;line-height:1.56!important;font-weight:700!important;color:#111923!important;background:#fff!important}
.cp-remaster-app .previous-record-flat .previous-record-text,
.cp-remaster-app .previous-record-flat .legacy-segment-body,
.cp-remaster-app .previous-record-flat .cp-note-body{font-size:15px!important;line-height:1.56!important;font-weight:700!important}
@media (min-width:1200px){
  .cp-remaster-app .comparison-layout{grid-template-columns:minmax(0,1.18fr) minmax(500px,.82fr)!important;gap:12px!important}
}
@media (max-width:900px){.cp-remaster-app .previous-record-flat-head{grid-template-columns:1fr!important}}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + addition + '\n', encoding='utf-8')

          version_path.write_text(json.dumps({'version':'1.3.79'}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          for key in ('version','app_version','runtime_version'):
              manifest[key] = '1.3.79'
          notes = manifest.setdefault('notes', {})
          notes['purpose'] = 'Amplía la lectura del historial clínico y usa una lista plana por fecha también durante la consulta.'
          notes['previous_version'] = '1.3.78'
          notes['functional_changes'] = False
          notes['ui_only_release'] = True
          notes['clinical_data_changes'] = False
          notes['cloud_logic_changes'] = False
          notes['printing_changes'] = False
          notes['database_schema_changes'] = False
          notes['patient_history_wide_reading'] = True
          notes['patient_history_large_clinical_text'] = True
          notes['consult_previous_history_flat_list'] = True
          notes['consult_previous_history_dropdown_removed'] = True
          notes['consult_previous_history_full_text_visible'] = True
          notes['history_order_newest_first_preserved'] = True
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Validate candidate
        shell: bash
        run: |
          python -m py_compile historia-clinica/app/app.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('historia-clinica/app')
          app=(root/'app.py').read_text(encoding='utf-8')
          css=(root/'static/style.css').read_text(encoding='utf-8')
          v=json.loads((root/'historia-version.json').read_text())['version']
          m=json.loads((root/'update_manifest.json').read_text())
          assert v == '1.3.79'
          assert m['version'] == m['app_version'] == m['runtime_version'] == '1.3.79'
          assert "<section class='previous-record previous-record-flat'>" in app
          assert "<details class='previous-record'" not in app
          assert 'v1.3.79 · historial amplio y referencia plana durante consulta' in css
          print('Historia 1.3.79 candidate OK')
          PY
      - name: Commit candidate
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/app.py historia-clinica/app/static/style.css historia-clinica/app/historia-version.json historia-clinica/app/update_manifest.json
          git commit -m "Historia 1.3.79: historial amplio y lectura plana en consulta"
          git push
