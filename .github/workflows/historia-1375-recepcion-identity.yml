name: Historia 1.3.75 Reception Identity

on:
  push:
    branches:
      - historia-1.3.75-recepcion-identidad
    paths:
      - .github/workflows/historia-1375-recepcion-identity.yml
      - tools/apply_historia_1375_reception_identity.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historia-1.3.75-recepcion-identidad
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate
        run: python tools/apply_historia_1375_reception_identity.py
      - name: Compile candidate
        run: python -m py_compile historia-clinica/app/app.py tools/apply_historia_1375_reception_identity.py
      - name: Verify candidate
        run: python tools/apply_historia_1375_reception_identity.py
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/app.py historia-clinica/app/historia-version.json historia-clinica/app/update_manifest.json
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Historia 1.3.75: identidad resuelta desde Recepción"
          git push origin HEAD:historia-1.3.75-recepcion-identidad
