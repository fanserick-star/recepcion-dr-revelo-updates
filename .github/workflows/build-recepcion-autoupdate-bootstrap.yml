name: Build Recepcion auto-update bootstrap

on:
  push:
    paths:
      - "repair-tools/ACTIVAR_AUTOUPDATE_RECEPCION.c"
      - ".github/workflows/build-recepcion-autoupdate-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\\VC\\Auxiliary\\Build\\vcvars64.bat"
          cl /nologo /O2 /DUNICODE /D_UNICODE /MT /Fe:ACTIVAR_ACTUALIZACIONES_AUTOMATICAS_RECEPCION.exe repair-tools\\ACTIVAR_AUTOUPDATE_RECEPCION.c user32.lib shell32.lib ole32.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: activar-autoupdate-recepcion
          path: ACTIVAR_ACTUALIZACIONES_AUTOMATICAS_RECEPCION.exe
          if-no-files-found: error
          retention-days: 7
