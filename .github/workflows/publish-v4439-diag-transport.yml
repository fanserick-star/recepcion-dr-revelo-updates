name: Publicar v4.4.39 transporte diagnóstico

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4439-diag-transport.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar pg8000
        run: python -m pip install --disable-pip-version-check 'pg8000==1.31.2'
      - name: Reconstruir candidato exacto
        run: python build/v4439_diag_transport/build_v4439.py
      - name: Repetir transporte privacidad cola updater puertos y selftests
        run: python build/v4439_diag_transport/validate_v4439.py
      - name: Publicar payload verificar Raw y recién entonces mover canal
        run: python build/v4439_diag_transport/publish_v4439.py
