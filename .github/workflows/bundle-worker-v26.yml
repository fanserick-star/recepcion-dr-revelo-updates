name: Build + Deploy WhatsApp Worker v2.6.3

on:
  push:
    branches: [main]
    paths:
      - 'build/whatsapp_v26/**'
      - 'cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js'
      - 'cloudflare/whatsapp_inbound_responses_schema.sql'
      - 'cloudflare/wrangler.whatsapp.jsonc'
      - '.github/workflows/bundle-worker-v26.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-deploy-whatsapp-worker-v26
  cancel-in-progress: false

jobs:
  bundle-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar Worker v2.6.3
        run: |
          python build/whatsapp_v26/build_worker.py
          python build/whatsapp_v26/post_build.py
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/whatsapp_worker_v2_6_responses.js')
          s=p.read_text(encoding='utf-8-sig')

          old='''    if(origin && origin.templateName && origin.templateName!=="recordatorio_cita"){
                await saveInboundRow(client,{messageId,phone,messageType:type,rawText,transcription,mediaId,mediaMimeType,interpretation:"REVISAR",confidence:100,target:origin,applyResult:"INFO_ONLY",resolved:true,resolution:"ASISTENTE_AUTOMATICO",rawPayload:{message,audio_error:audioError,intent_reason:"plantilla_solo_informativa",template_name:origin.templateName}});
                directReply=automaticAssistantNotice(env);
                return;
              }
              const target=await findInboundTarget(client,message,phone);'''
          new='''    if(origin && origin.templateName && origin.templateName!=="recordatorio_cita"){
                directReply=automaticAssistantNotice(env);
                return;
              }
              const directTarget=await findInboundTarget(client,message,phone);
              const target=directTarget || (origin && origin.templateName==="recordatorio_cita" ? origin : null);
              if(!target){
                directReply=automaticAssistantNotice(env);
                return;
              }'''
          if old not in s:
              raise SystemExit('No encontré la rama de vinculación esperada')
          s=s.replace(old,new,1)

          s=s.replace('2.6.1','2.6.3')
          old_health='inbound_policy:"recordatorio_cita_only",automation:'
          if old_health not in s:
              raise SystemExit('No encontré política de health')
          s=s.replace(old_health,'inbound_policy:"recordatorio_cita_only",inbound_queue:"confirmation_only",inbound_target:"origin_fallback",automation:',1)

          for marker in [
              'worker_version:"2.6.3"',
              'inbound_queue:"confirmation_only"',
              'inbound_target:"origin_fallback"',
              'const directTarget=await findInboundTarget',
              'const target=directTarget || (origin && origin.templateName==="recordatorio_cita" ? origin : null)',
              'if(!target){'
          ]:
              if marker not in s:
                  raise SystemExit(f'Falta marcador v2.6.3: {marker}')
          p.write_text(s,encoding='utf-8',newline='\n')
          print('WHATSAPP_V263_TARGET_FALLBACK_OK')
          PY

      - name: Instalar bundler y dependencia
        run: npm install --no-save esbuild @neondatabase/serverless

      - name: Probar botones, IA y política de plantillas
        run: |
          node --check cloudflare/whatsapp_worker_v2_6_responses.js
          node --input-type=module <<'NODE'
          const m=await import('./cloudflare/whatsapp_worker_v2_6_responses.js');
          const cases=[
            ['sí doctor ahí estaré','CONFIRMADO'],
            ['confirmado doctor','CONFIRMADO'],
            ['Confirmo, muchas gracias','CONFIRMADO'],
            ['Pensaba que era mañana pero ya revisé y sí puedo asistir el miércoles','CONFIRMADO'],
            ['No puedo asistir mañana','NO_ASISTIRA'],
            ['No voy a asistir','NO_ASISTIRA'],
            ['No voy a poder ir','NO_ASISTIRA'],
            ['Quiero cambiar la cita para el jueves','NO_ASISTIRA'],
            ['¿Puede cambiarme la hora?','NO_ASISTIRA'],
            ['Quisiera reagendar para otro día','NO_ASISTIRA'],
            ['No sé si podré asistir','REVISAR'],
            ['Tal vez pueda ir','REVISAR'],
            ['Sí voy pero no sé si podré','REVISAR'],
            ['Sí, pero no puedo confirmar todavía','REVISAR'],
            ['Buenas tardes doctor, quería hacer una consulta','REVISAR'],
          ];
          for(const [text,expected] of cases){
            const got=m.classifyInboundText(text).interpretation;
            if(got!==expected)throw new Error(`${text} => ${got}, esperado ${expected}`);
          }
          const payload=m.parseActionPayload('CONFIRMAR|appointment|12|2026-09-03|08:00');
          if(!payload||payload.action!=='CONFIRMAR'||payload.sourceId!==12)throw new Error('Se rompió la respuesta por botón');
          if(!m.acknowledgementText('CANCELAR',{}).includes('no podrá asistir'))throw new Error('Se rompió acuse No');
          if(!m.acknowledgementText('CONFIRMAR',{}).includes('asistencia ha quedado registrada'))throw new Error('Se rompió acuse Sí');
          console.log('WHATSAPP_V263_RULES_OK');
          NODE

      - name: Validar vinculación y filtro de bandeja
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare/whatsapp_worker_v2_6_responses.js').read_text(encoding='utf-8')
          for marker in [
            'whatsapp_cloud.inbound_responses','solicita_reagendar','@cf/openai/whisper-large-v3-turbo',
            'env.AI.run','audio_too_large','ON CONFLICT(message_id)','worker_version:"2.6.3"',
            'automaticAssistantNotice','origin.templateName!=="recordatorio_cita"',
            'únicamente para confirmaciones de citas','DOCTOR_CONTACT_PHONE',
            'inbound_policy:"recordatorio_cita_only"','inbound_queue:"confirmation_only"',
            'inbound_target:"origin_fallback"','const directTarget=await findInboundTarget',
            'const target=directTarget || (origin && origin.templateName==="recordatorio_cita" ? origin : null)'
          ]:
              assert marker in s, marker
          branch=s[s.index('if(origin && origin.templateName'):s.index('const directTarget=await findInboundTarget')]
          assert 'saveInboundRow' not in branch
          fallback=s[s.index('const directTarget=await findInboundTarget'):s.index('let interpretation=intent.interpretation')]
          assert 'origin.templateName==="recordatorio_cita"' in fallback
          assert 'automaticAssistantNotice' in fallback
          # Un recordatorio identificado nunca debe caer a 35% solo porque la segunda búsqueda falló.
          assert 'const target=directTarget ||' in fallback
          insert=s[s.index('async function saveInboundRow'):s.index('async function handleFreeformInbound')]
          assert 'buffer' not in insert.lower()
          print('WHATSAPP_V263_TARGET_AND_QUEUE_OK')
          PY

      - name: Generar standalone
        run: |
          npx esbuild cloudflare/whatsapp_worker_v2_6_responses.js --bundle --format=esm --platform=browser --target=es2022 --outfile=cloudflare/whatsapp_worker_v2_6_STANDALONE.js --banner:js='// Dr. Revelo WhatsApp Cloud Worker v2.6.3 — confirmación con vínculo robusto'
          cp cloudflare/whatsapp_worker_v2_6_STANDALONE.js cloudflare/WHATSAPP_WORKER_v2_6_STANDALONE.txt
          node --check cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          grep -Eq 'worker_version[[:space:]]*:[[:space:]]*"2\.6\.3"' cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          grep -q 'origin_fallback' cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          grep -q 'confirmation_only' cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          grep -q 'automaticAssistantNotice' cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          grep -q 'whisper-large-v3-turbo' cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          grep -q 'NO_ASISTIRA' cloudflare/whatsapp_worker_v2_6_STANDALONE.js
          cmp cloudflare/whatsapp_worker_v2_6_STANDALONE.js cloudflare/WHATSAPP_WORKER_v2_6_STANDALONE.txt

      - name: Desplegar automáticamente en Cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.whatsapp.jsonc --keep-vars

      - name: Verificar parche exacto en producción
        run: |
          set -euo pipefail
          URL='https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev/health'
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "$URL?ci=$(date +%s%N)" || true)"
            if BODY="$BODY" node - <<'NODE'
          try {
            const d=JSON.parse(process.env.BODY||'{}');
            if(d.ok===true && d.worker_version==='2.6.3' && d.inbound_policy==='recordatorio_cita_only' && d.inbound_queue==='confirmation_only' && d.inbound_target==='origin_fallback') process.exit(0);
          } catch {}
          process.exit(1);
          NODE
            then
              echo 'WHATSAPP_WORKER_V263_LIVE_OK'
              printf '%s\n' "$BODY"
              exit 0
            fi
            sleep 2
          done
          echo 'Cloudflare no confirmó v2.6.3 con la vinculación esperada.'
          exit 1

      - name: Guardar fuente y bundle validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/whatsapp_worker_v2_6_responses.js cloudflare/whatsapp_worker_v2_6_STANDALONE.js cloudflare/WHATSAPP_WORKER_v2_6_STANDALONE.txt cloudflare/whatsapp_inbound_responses_schema.sql
          if git diff --cached --quiet; then
            echo 'Worker v2.6.3 ya estaba actualizado.'
          else
            git commit -m 'build: WhatsApp Worker v2.6.3 vinculado y desplegado'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
