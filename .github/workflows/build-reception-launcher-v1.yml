name: Build Reception Launcher v1 Package

on:
  push:
    paths:
      - "launcher-v1/RecepcionLauncher/**"
      - "launcher-v1/LauncherUpdater/**"
      - "launcher-v1/Uninstaller/**"
      - "launcher-v1/installer/**"
      - ".github/workflows/build-reception-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate distinct Reception icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeIconReception {
              [DllImport("user32.dll", SetLastError=true)]
              public static extern bool DestroyIcon(IntPtr hIcon);
          }
          "@
          function Add-RoundedRect([System.Drawing.Drawing2D.GraphicsPath]$path,[float]$x,[float]$y,[float]$w,[float]$h,[float]$r) {
            $d = $r * 2
            $path.AddArc($x,$y,$d,$d,180,90)
            $path.AddArc($x+$w-$d,$y,$d,$d,270,90)
            $path.AddArc($x+$w-$d,$y+$h-$d,$d,$d,0,90)
            $path.AddArc($x,$y+$h-$d,$d,$d,90,90)
            $path.CloseFigure()
          }
          $bmp = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $bgPath = New-Object System.Drawing.Drawing2D.GraphicsPath
          Add-RoundedRect $bgPath 2 2 60 60 14
          $bg = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(18,145,160))
          $g.FillPath($bg,$bgPath)
          $cardPath = New-Object System.Drawing.Drawing2D.GraphicsPath
          Add-RoundedRect $cardPath 11 10 42 44 8
          $card = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(250,253,253))
          $g.FillPath($card,$cardPath)
          $font = New-Object System.Drawing.Font("Segoe UI",26,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $letter = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(13,93,105))
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = [System.Drawing.StringAlignment]::Center
          $fmt.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString("R",$font,$letter,[System.Drawing.RectangleF]::new(11,9,42,42),$fmt)
          $badge = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(7,111,123))
          $g.FillEllipse($badge,39,39,21,21)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White,3.2)
          $pen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $pen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawLines($pen,[System.Drawing.PointF[]]@([System.Drawing.PointF]::new(44,49),[System.Drawing.PointF]::new(48,53),[System.Drawing.PointF]::new(56,45)))
          New-Item -ItemType Directory -Force "launcher-v1/installer/build" | Out-Null
          $h = $bmp.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($h)
          foreach($dst in @("launcher-v1/RecepcionLauncher/doctor_icon.ico","launcher-v1/Uninstaller/doctor_icon.ico","launcher-v1/installer/build/doctor_icon.ico")) {
            $fs=[IO.File]::Create($dst); try { $ico.Save($fs) } finally { $fs.Dispose() }
          }
          $ico.Dispose(); [NativeIconReception]::DestroyIcon($h) | Out-Null
          $pen.Dispose(); $badge.Dispose(); $fmt.Dispose(); $letter.Dispose(); $font.Dispose(); $card.Dispose(); $cardPath.Dispose(); $bg.Dispose(); $bgPath.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Publish clean launcher
        shell: pwsh
        run: |
          dotnet publish "launcher-v1/RecepcionLauncher/RecepcionLauncher.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish full uninstaller
        shell: pwsh
        run: |
          dotnet publish "launcher-v1/Uninstaller/Uninstaller.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish hidden launcher updater
        shell: pwsh
        run: |
          dotnet publish "launcher-v1/LauncherUpdater/LauncherUpdater.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect binaries
        shell: pwsh
        run: |
          $launcher = Get-Item "launcher-v1/RecepcionLauncher/bin/Release/net8.0-windows/win-x64/publish/RecepcionLauncher.exe"
          $uninstaller = Get-Item "launcher-v1/Uninstaller/bin/Release/net8.0-windows/win-x64/publish/Desinstalar_Recepcion_Dr_Revelo.exe"
          $updater = Get-Item "launcher-v1/LauncherUpdater/bin/Release/net8.0-windows/win-x64/publish/LauncherUpdater.exe"
          if (-not $launcher -or -not $uninstaller -or -not $updater) { throw "No se generaron los binarios esperados." }
          Copy-Item $launcher.FullName "launcher-v1/installer/build/RecepcionLauncher.exe" -Force
          Copy-Item $uninstaller.FullName "launcher-v1/installer/build/Desinstalar_Recepcion_Dr_Revelo.exe" -Force
          Copy-Item $updater.FullName "launcher-v1/installer/build/LauncherUpdater.exe" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build migration installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe no encontrado." }
          & $iscc "launcher-v1/installer/LauncherV1.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build final package
        shell: pwsh
        run: |
          $out = "launcher-v1/package"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "launcher-v1/installer/output/INSTALAR_LAUNCHER_RECEPCION_DR_REVELO_V1_0_12.exe" $out -Force
          Copy-Item "launcher-v1/installer/build/RecepcionLauncher.exe" $out -Force
          Copy-Item "launcher-v1/installer/build/Desinstalar_Recepcion_Dr_Revelo.exe" $out -Force
          Copy-Item "launcher-v1/installer/build/LauncherUpdater.exe" $out -Force
          Copy-Item "launcher-v1/README.txt" $out -Force
          $hashLines = @()
          Get-ChildItem $out -File | Where-Object { $_.Extension -eq ".exe" } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$h  $($_.Name)"
          }
          $hashLines | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$out/*" -DestinationPath "LAUNCHER_RECEPCION_DR_REVELO_V1_0_12_COMPLETO.zip" -Force
          Write-Host "=== PACKAGE CONTENTS ==="
          Get-ChildItem $out | Format-Table Name,Length
          Get-Content "$out/SHA256SUMS.txt"

      - name: Publish permanent launcher release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "launcher-v1.0.12"
          $installer = "launcher-v1/package/INSTALAR_LAUNCHER_RECEPCION_DR_REVELO_V1_0_12.exe"
          $zip = "LAUNCHER_RECEPCION_DR_REVELO_V1_0_12_COMPLETO.zip"
          $launcher = "launcher-v1/package/RecepcionLauncher.exe"
          $uninstaller = "launcher-v1/package/Desinstalar_Recepcion_Dr_Revelo.exe"
          $updater = "launcher-v1/package/LauncherUpdater.exe"
          $sums = "launcher-v1/package/SHA256SUMS.txt"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Launcher Recepción v1.0.12" --notes "Launcher nativo v1.0.12: ventana WebView2 propia con icono del consultorio, instancia única y autoactualización segura."
          }
          gh release upload $tag $installer $zip $launcher $uninstaller $updater $sums --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-recepcion-v1-completo
          path: |
            LAUNCHER_RECEPCION_DR_REVELO_V1_0_12_COMPLETO.zip
            launcher-v1/package/INSTALAR_LAUNCHER_RECEPCION_DR_REVELO_V1_0_12.exe
            launcher-v1/package/RecepcionLauncher.exe
            launcher-v1/package/Desinstalar_Recepcion_Dr_Revelo.exe
            launcher-v1/package/LauncherUpdater.exe
            launcher-v1/package/README.txt
            launcher-v1/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
