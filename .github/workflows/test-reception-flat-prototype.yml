name: Test Reception Flat Prototype
# definitive refactor: validate and materialize the verified flat candidate on the isolated branch

on:
  push:
    branches:
      - refactor/reception-definitive-runtime
    paths:
      - tools/build_reception_flat_prototype.py
      - tools/remove_reception_legacy_layer_chain.py
      - tools/materialize_reception_predecessor_getattrs.py
      - tools/test_reception_no_legacy_chains.py
      - tools/finalize_reception_flat_candidate.py
      - tools/test_reception_flat_prototype.py
      - tools/test_reception_runtime_bindings.py
      - tools/test_reception_flat_packaged_staging.py
      - tools/test_reception_flat_update_cycle.py
      - tools/validate_reception_runtime_layout.py
      - tools/diagnose_reception_flat_overlay.py
      - .github/workflows/test-reception-flat-prototype.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flat-equivalence:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet fastapi uvicorn sqlalchemy python-dotenv pg8000 python-multipart requests openpyxl

      - name: Validate current production runtime layout
        shell: pwsh
        run: >-
          python tools/validate_reception_runtime_layout.py
          updates/v4_6_6_fast_attention_save
          --baseline-app updates/v4_6_0_consolidated_runtime/app.py

      - name: Build flat prototype
        shell: pwsh
        run: python tools/build_reception_flat_prototype.py

      - name: Remove historical release-layer chain
        shell: pwsh
        run: python tools/remove_reception_legacy_layer_chain.py

      - name: Materialize predecessor getattr references
        shell: pwsh
        run: python tools/materialize_reception_predecessor_getattrs.py

      - name: Enforce semantic runtime with no legacy chains
        shell: pwsh
        run: python tools/test_reception_no_legacy_chains.py

      - name: Finalize candidate packaging contract
        shell: pwsh
        run: python tools/finalize_reception_flat_candidate.py

      - name: Validate flat candidate runtime layout
        shell: pwsh
        run: python tools/validate_reception_runtime_layout.py refactor_build/reception_flat_466

      - name: Diagnose final overlay equivalence
        shell: pwsh
        run: python tools/diagnose_reception_flat_overlay.py

      - name: Compare exact runtime contracts and functional flow
        shell: pwsh
        run: python tools/test_reception_flat_prototype.py

      - name: Verify billing, print renderer and version bindings
        shell: pwsh
        run: python tools/test_reception_runtime_bindings.py

      - name: Import candidate from manifest-only staging
        shell: pwsh
        run: python tools/test_reception_flat_packaged_staging.py

      - name: Simulate update and rollback from production 4.6.6
        shell: pwsh
        run: python tools/test_reception_flat_update_cycle.py

      - name: Materialize verified candidate on refactor branch
        shell: pwsh
        run: |
          $candidate = "refactor_build/reception_flat_466"
          Get-ChildItem -Path $candidate -Recurse -Directory -Filter __pycache__ -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $candidate -Recurse -File -Filter *.pyc -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          # Import probes can initialize an empty bridge outbox. Never commit
          # test databases or local configuration as program artifacts.
          Remove-Item -Recurse -Force "$candidate/data" -ErrorAction SilentlyContinue
          if (Get-ChildItem -Path $candidate -Recurse -File | Where-Object { $_.Extension -in '.db','.sqlite','.sqlite3','.xlsx','.xls','.mdb' -or $_.Name -eq '.env' }) {
            throw "Candidate contains local data or configuration"
          }

          $verification = [ordered]@{
            source_commit = "${{ github.sha }}"
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_number = "${{ github.run_number }}"
            verified_utc = (Get-Date).ToUniversalTime().ToString("o")
            contract = "Recepcion 4.6.6 semantic runtime + no legacy release chain + bindings + equivalence + layout + OpenAPI + packaged staging + update/rollback + historical protection"
          } | ConvertTo-Json
          Set-Content -Path "$candidate/VERIFICATION.json" -Value $verification -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $candidate
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Verified candidate already materialized; nothing to commit."
            exit 0
          }
          git commit -m "refactor: materializar runtime semantico verificado"
          git push origin HEAD:refactor/reception-definitive-runtime
