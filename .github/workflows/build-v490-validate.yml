name: Validar y publicar v4.3.90
on:
  push:
    branches: [main]
    paths:
      - 'build/v490/**'
      - '.github/workflows/build-v490-validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir paquete candidato
        run: python build/v490/build_v490.py
      - name: Validar Python, JS y remaster Nueva atención
        run: |
          cat updates/v490/app.part* > _ci_app.py
          cat updates/v490/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
          python _ci_launcher.py --self-test-core
          python - <<'PY'
          import ast,json,hashlib
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src);js=css=None
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  names=[t.id for t in node.targets if isinstance(t,ast.Name)]
                  if 'V490_ATTENTION_JS' in names: js=ast.literal_eval(node.value)
                  if 'V490_ATTENTION_CSS' in names: css=ast.literal_eval(node.value)
          assert js and css
          for token in ['v490-attention-bar','v490-save-btn','Guardar atención','selectionText','findOriginalSave']:
              assert token in js or token in css,token
          assert 'position:sticky' in css
          assert 'MutationObserver' not in js
          for token in ['historical_matches=_historical_review_matches(current,per_patient=24)','V488_HOME_CSS','v488-home-action-svg','V487_ICON_JS','Revisando AZUR','V486_FIX_JS','v486OpenAzur','V485_FIX_JS','Emitir por lotes']:
              assert token in src,token
          assert 'APP_VERSION = "4.3.90"' in src
          Path('_ci_v490.js').write_text(js,encoding='utf-8')
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.90'
          ai=next(x for x in latest['files'] if x['path']=='app.py')
          li=next(x for x in latest['files'] if x['path']=='ABRIR_RECEPCION.py')
          assert hashlib.sha256(Path('_ci_app.py').read_bytes()).hexdigest()==ai['sha256']
          assert hashlib.sha256(Path('_ci_launcher.py').read_bytes()).hexdigest()==li['sha256']
          print('VALIDACION V4.3.90 OK')
          PY
          node --check _ci_v490.js
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v490 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.90 remaster Nueva atencion'
          git pull --rebase origin main
          git push
