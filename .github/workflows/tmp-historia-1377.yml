name: TEMP Historia 1.3.77 Candidate

on:
  push:
    branches: [historia-1.3.77-ready]

permissions:
  contents: write

jobs:
  build-candidate:
    if: ${{ !contains(github.event.head_commit.message, '[1377-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historia-1.3.77-ready
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply canonical recovery patch and version
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('historia-clinica/app')
          app = root/'app.py'
          text = app.read_text(encoding='utf-8')
          old1 = 'FROM historia.encounters e\n            JOIN historia.patients p ON p.id=e.patient_id'
          new1 = 'FROM public.encounters e\n            JOIN public.patients p ON p.id=e.patient_id'
          count = text.count(old1)
          assert count == 1, f'expected one legacy recovery query, got {count}'
          text = text.replace(old1, new1, 1)
          app.write_text(text, encoding='utf-8')

          version_path = root/'historia-version.json'
          version_path.write_text(json.dumps({'version':'1.3.77'}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          manifest_path = root/'update_manifest.json'
          m = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          m['version'] = m['app_version'] = m['runtime_version'] = '1.3.77'
          notes = m.setdefault('notes', {})
          notes.update({
              'purpose': 'Consolidación canónica de Historia: recuperación de borradores, sincronización y vínculos usan public.*; contrato waiting_queue alineado entre LAN y Neon sin tocar historias firmadas.',
              'previous_version': '1.3.76',
              'database_schema_changes': True,
              'database_schema_changes_additive_only': True,
              'patient_data_destructive_changes': False,
              'signed_history_protected': True,
              'public_schema_canonical': True,
              'legacy_historia_schema_operational': False,
              'recovery_public_schema_canonical': True,
              'waiting_queue_patient_status_cloud': True,
              'waiting_queue_reception_turn_cloud': True,
              'lan_cloud_queue_contract_aligned': True,
              'reception_identity_authority': True,
              'doctor_manual_link_normal_flow': False,
              'doctor_manual_link_emergency_fallback': True,
              'unlinked_subsequent_doctor_action_disabled': True,
              'next_patient_skips_unlinked_subsequent': True,
              'clinical_data_changes': False,
              'cloud_logic_changes': True,
              'printing_changes': False,
          })
          manifest_path.write_text(json.dumps(m, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Compile and validate candidate
        run: |
          python -m py_compile historia-clinica/app/app.py historia-clinica/app/cloud_sync.py historia-clinica/app/lan_bridge.py historia-clinica/app/documentos_clinicos.py
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('historia-clinica/app')
          app=(root/'app.py').read_text(encoding='utf-8')
          assert 'FROM historia.encounters e' not in app
          assert 'JOIN historia.patients p ON p.id=e.patient_id' not in app
          assert 'FROM public.encounters e' in app
          assert 'Esperando Recepción' in app
          assert 'eligible_queue' in app
          v=json.loads((root/'historia-version.json').read_text(encoding='utf-8-sig'))
          assert v['version']=='1.3.77'
          m=json.loads((root/'update_manifest.json').read_text(encoding='utf-8-sig'))
          assert m['version']=='1.3.77'
          assert m['notes']['legacy_historia_schema_operational'] is False
          assert m['notes']['signed_history_protected'] is True
          PY
          python tools/test_historia_canonical_source.py
          python tools/validate_historia_runtime.py historia-clinica/app

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/app.py historia-clinica/app/historia-version.json historia-clinica/app/update_manifest.json
          git commit -m "Prepare Historia 1.3.77 canonical identity [1377-applied]"
          git push origin HEAD:historia-1.3.77-ready
