name: Verify Reception 4.6.7 Release

on:
  push:
    branches:
      - release/reception-4.6.7-consolidated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet fastapi uvicorn sqlalchemy python-dotenv pg8000 python-multipart requests openpyxl

      - name: Validate consolidated runtime layout
        shell: pwsh
        run: >-
          python tools/validate_reception_runtime_layout.py
          updates/v4_6_7_consolidated_runtime
          --baseline-app updates/v4_6_0_consolidated_runtime/app.py

      - name: Verify source mapping closes over manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          src=json.loads(Path('launcher-v1/app-channel-source.json').read_text(encoding='utf-8-sig'))
          manifest=json.loads(Path('updates/v4_6_7_consolidated_runtime/update_manifest.json').read_text(encoding='utf-8-sig'))
          targets=[str(x['path']).replace('\\','/') for x in src['files']]
          expected=[str(x).replace('\\','/') for x in manifest['copy']]
          assert src['appVersion']=='4.6.7'
          assert len(targets)==len(set(targets))
          assert set(targets)==set(expected),(sorted(set(expected)-set(targets)),sorted(set(targets)-set(expected)))
          assert all(str(x['sourcePath']).startswith('updates/v4_6_7_consolidated_runtime/') for x in src['files'])
          print('CHANNEL SOURCE CLOSURE OK',len(targets))

      - name: Verify 4.6.6 to 4.6.7 release and rollback
        shell: pwsh
        run: python tools/verify_reception_467_release_v2.py
