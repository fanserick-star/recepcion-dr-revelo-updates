name: Validar y publicar v4.4.33 pantalla blanca

on:
  push:
    branches: [main]
    paths:
      - 'build/v4433_ui_fix/**'
      - '.github/workflows/validate-publish-v4433-ui-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1 - Construir candidato mínimo 4.4.33
        shell: pwsh
        run: python build/v4433_ui_fix/build_v4433.py

      - name: 2 - Contrato estático y alcance mínimo
        shell: pwsh
        run: |
          @'
          import json, pathlib, re
          root=pathlib.Path('.')
          src=(root/'updates/v4_4_31_startup_guard/app.py').read_text(encoding='utf-8')
          app=(root/'updates/v4_4_33_ui_fix/app.py').read_text(encoding='utf-8')
          inner=json.loads((root/'updates/v4_4_33_ui_fix/update_manifest.json').read_text(encoding='utf-8'))
          latest=json.loads((root/'updates/v4_4_33_ui_fix/candidate_latest.json').read_text(encoding='utf-8'))
          compile(app,'app.py','exec')
          assert 'APP_VERSION = "4.4.33"' in app
          assert 'import app_base_4428 as core' in app
          assert 'PAYMENT_SENTINELS' in app
          assert '"EFECTIVO": "01"' in app and '"TRANSFERENCIA": "20"' in app
          assert '/api/billing/payment-method' in app
          assert 'Antes de emitir, marca Efectivo o Transferencia en la ficha.' in app
          assert 'core._azur_payload_for_group = _azur_payload_for_group_v4431' in app
          assert 'window.__v4431BillingPayment' in app
          assert 'const observer=new MutationObserver(()=>{\n    hookBilling();decorate();fixVersionLabels();' not in app
          assert 'function fixVersionLabels()' not in app
          assert "_overlay_version_marker = \"const VERSION='4.4.28';\"" in app
          assert "\"const VERSION='4.4.33';\"" in app
          assert inner['version']=='4.4.33' and inner['app_version']=='4.4.33'
          assert inner['copy']==['app.py','update_manifest.json']
          paths=[x['path'] for x in latest['files']]
          assert paths==['app.py','update_manifest.json'], paths
          forbidden={'ABRIR_RECEPCION.py','.env','static/app.js','static/index.html','static/style.css','app_base_4428.py'}
          assert not (forbidden & set(paths)), paths
          assert not any(p.startswith('data/') or p.startswith('.venv/') for p in paths)
          # El cambio debe ser pequeño: no se permite eliminar endpoints ni la protección de AZUR.
          for marker in ['PAYMENT_SENTINELS','set_billing_payment_method','_azur_payload_for_group_v4431','PAYMENT_CSS','PAYMENT_JS']:
              assert marker in src and marker in app, marker
          print('STATIC_SCOPE_OK',paths)
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\v4433_static.py
          python $env:RUNNER_TEMP\v4433_static.py

      - name: 3 - Reconstruir launcher dinámico 4.4.32 y repetir self-tests
        shell: pwsh
        run: |
          $parts=Get-ChildItem updates/v4_4_32_launcher_port_patch/ABRIR_RECEPCION.part* | Sort-Object { [int]($_.Name -replace '^ABRIR_RECEPCION\.part','') }
          if($parts.Count -lt 2){ throw 'Faltan partes del launcher 4.4.32' }
          $bytes=New-Object System.Collections.Generic.List[byte]
          foreach($p in $parts){$bytes.AddRange([IO.File]::ReadAllBytes($p.FullName))}
          $launcher=Join-Path $env:RUNNER_TEMP 'ABRIR_RECEPCION_4432.py'
          [IO.File]::WriteAllBytes($launcher,$bytes.ToArray())
          python -m py_compile $launcher
          $text=Get-Content $launcher -Raw
          foreach($needle in @('_choose_app_port','local_port.txt','RP_PORT','_running_version','_can_bind_port')){
            if(-not $text.Contains($needle)){throw "Launcher perdió $needle"}
          }
          python $launcher --self-test-core
          "LAUNCHER_PATH=$launcher" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 4 - Crear runtime real + Chromium
        shell: pwsh
        run: |
          python -m venv .release-venv
          .\.release-venv\Scripts\python.exe -m pip install --disable-pip-version-check `
            'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20' `
            'playwright==1.55.0'
          .\.release-venv\Scripts\python.exe -m playwright install chromium
          .\.release-venv\Scripts\python.exe -c "import fastapi,pydantic,uvicorn,sqlalchemy,pg8000,dotenv,multipart; print('RUNTIME_OK')"

      - name: 5 - Preparar instalación completa como la PC del consultorio
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'Recepcion-v4433-smoke'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          New-Item -ItemType Directory -Force $root | Out-Null
          $base=Join-Path $env:RUNNER_TEMP 'rp-v4433-base'
          if(Test-Path $base){Remove-Item $base -Recurse -Force}
          Expand-Archive installer_clean/base/clean_base_resources.zip -DestinationPath $base -Force
          foreach($name in @('azur_client.py','whatsapp_client.py','remote_agenda.py')){
            $src=Get-ChildItem $base -Recurse -File -Filter $name | Select-Object -First 1
            if(-not $src){throw "Falta $name en base limpia"}
            Copy-Item $src.FullName (Join-Path $root $name)
          }
          $baseStatic=Get-ChildItem $base -Recurse -Directory -Filter static | Select-Object -First 1
          if(-not $baseStatic){throw 'Falta static en base limpia'}
          Copy-Item $baseStatic.FullName (Join-Path $root 'static') -Recurse
          $mobile=Get-ChildItem $base -Recurse -Directory -Filter mobile | Select-Object -First 1
          if($mobile){Copy-Item $mobile.FullName (Join-Path $root 'mobile') -Recurse}
          New-Item -ItemType Directory -Force (Join-Path $root 'data') | Out-Null
          # Recursos que ya existen en la instalación real 4.4.31/4.4.32.
          Copy-Item updates/v4_4_28_overlay_hotfix/app.py (Join-Path $root 'app_base_4428.py') -Force
          Copy-Item updates/v4_4_28_overlay_hotfix/static/app.js (Join-Path $root 'static/app.js') -Force
          Copy-Item updates/v4_4_28_overlay_hotfix/static/index.html (Join-Path $root 'static/index.html') -Force
          Copy-Item updates/v4_4_33_ui_fix/app.py (Join-Path $root 'app.py') -Force
          Copy-Item updates/v4_4_33_ui_fix/update_manifest.json (Join-Path $root 'update_manifest.json') -Force
          "SMOKE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 6 - Navegador real + 8000 ocupado + verificación de overlay
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, socket, subprocess, time, urllib.request
          from playwright.sync_api import sync_playwright

          root=pathlib.Path(os.environ['SMOKE_ROOT'])
          py=pathlib.Path.cwd()/'.release-venv'/'Scripts'/'python.exe'
          env=os.environ.copy()
          env.update(RP_FORCE_OFFLINE='1',RP_DATA_DIR=str(root/'data'),RP_PORT='18766',DISABLE_SQLALCHEMY_CEXT_RUNTIME='1')
          diag=pathlib.Path(os.environ['RUNNER_TEMP'])/'v4433-browser'
          diag.mkdir(parents=True,exist_ok=True)
          log=(diag/'backend.log').open('w',encoding='utf-8')

          # Reproduce el caso que antes falló: 8000 está ocupado por otra cosa.
          blocker=socket.socket(socket.AF_INET,socket.SOCK_STREAM)
          blocker.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,0)
          blocker.bind(('127.0.0.1',8000)); blocker.listen(1)

          def get(path,timeout=5):
              with urllib.request.urlopen('http://127.0.0.1:18766'+path,timeout=timeout) as r:
                  return r.status,r.read()

          proc=subprocess.Popen([str(py),str(root/'app.py')],cwd=str(root),env=env,stdout=log,stderr=log)
          try:
              deadline=time.time()+35
              while time.time()<deadline:
                  if proc.poll() is not None: raise SystemExit(f'BACKEND_EXIT_{proc.returncode}')
                  try:
                      status,raw=get('/api/version',1)
                      if status==200 and json.loads(raw).get('version')=='4.4.33': break
                  except Exception: time.sleep(.20)
              else: raise SystemExit('BACKEND_VERSION_TIMEOUT')

              assets=['/','/static/style.css?v=4.3.34','/static/app.js?v=4.4.28','/v458/settings.css?v=4.3.58','/v458/settings.js?v=4.3.58','/v459/settings.css?v=4.3.59','/v459/settings.js?v=4.3.59','/v460/overlay.css?v=4.3.72','/v460/overlay.js?v=4.3.72']
              for path in assets:
                  t=time.perf_counter();status,body=get(path,8);elapsed=time.perf_counter()-t
                  print('ASSET',path,status,len(body),round(elapsed,3),flush=True)
                  if status!=200 or not body: raise SystemExit('ASSET_INVALID_'+path)

              _,overlay_raw=get('/v460/overlay.js?v=4.3.72',8)
              overlay=overlay_raw.decode('utf-8')
              assert "const VERSION='4.4.33';" in overlay
              assert "const VERSION='4.4.28';" not in overlay
              assert 'window.__v4431BillingPayment' in overlay
              assert 'fixVersionLabels' not in overlay

              console=[];page_errors=[];failed=[]
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  page=browser.new_page(viewport={'width':1360,'height':840})
                  page.on('console',lambda m:console.append({'type':m.type,'text':m.text}))
                  page.on('pageerror',lambda e:page_errors.append(str(e)))
                  page.on('requestfailed',lambda r:failed.append({'url':r.url,'failure':str(r.failure)}))
                  response=page.goto('http://127.0.0.1:18766/?release=v4433',wait_until='domcontentloaded',timeout=10000)
                  page.wait_for_timeout(1400)
                  title=page.title()
                  body_text=page.locator('body').inner_text(timeout=5000)
                  payment_flag=page.evaluate('() => window.__v4431BillingPayment === true')
                  ready=page.evaluate('() => document.readyState')
                  badge=page.evaluate("() => document.querySelector('#connectionBadge .v460-version')?.textContent || document.querySelector('#currentVersionBadge')?.textContent || ''")
                  report={'status':response.status if response else None,'title':title,'ready':ready,'body_len':len(body_text),'body_start':body_text[:800],'payment_flag':payment_flag,'badge':badge,'page_errors':page_errors,'failed':failed,'console_errors':[x for x in console if x['type']=='error']}
                  print('BROWSER_REPORT',json.dumps(report,ensure_ascii=False),flush=True)
                  page.screenshot(path=str(diag/'screen.png'),full_page=True)
                  browser.close()
              assert response and response.status==200
              assert title=='Recepción de Pacientes', title
              assert ready in ('interactive','complete'), ready
              assert len(body_text)>200, len(body_text)
              assert payment_flag is True
              assert not page_errors, page_errors
              assert not failed, failed
              assert badge=='v4.4.33', badge
              if proc.poll() is not None: raise SystemExit(f'BACKEND_DIED_{proc.returncode}')
              print('REAL_BROWSER_UI_OK')
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try: proc.wait(timeout=5)
                  except Exception: proc.kill()
              blocker.close();log.close()
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\v4433_browser.py
          .\.release-venv\Scripts\python.exe $env:RUNNER_TEMP\v4433_browser.py

      - name: 7 - Probar actualización real 4.4.32 -> 4.4.33 y rollback
        shell: pwsh
        run: |
          @'
          import hashlib, http.server, importlib.util, json, os, pathlib, shutil, tempfile, threading

          repo=pathlib.Path.cwd()
          launcher_path=pathlib.Path(os.environ['LAUNCHER_PATH'])
          spec=importlib.util.spec_from_file_location('rp_launcher_4432',launcher_path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          cand_dir=repo/'updates/v4_4_33_ui_fix'
          app_new=(cand_dir/'app.py').read_bytes();man_new=(cand_dir/'update_manifest.json').read_bytes()
          candidate=json.loads((cand_dir/'candidate_latest.json').read_text(encoding='utf-8'))

          class Handler(http.server.BaseHTTPRequestHandler):
              files={}
              def do_GET(self):
                  path=self.path.split('?',1)[0]
                  body=self.files.get(path)
                  if body is None:self.send_response(404);self.end_headers();return
                  self.send_response(200);self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
              def log_message(self,*a):pass
          srv=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler)
          base=f'http://127.0.0.1:{srv.server_address[1]}'
          remote=dict(candidate)
          remote['files']=[
              {'path':'app.py','url':base+'/app.py','sha256':hashlib.sha256(app_new).hexdigest(),'encoding':'utf-8'},
              {'path':'update_manifest.json','url':base+'/update_manifest.json','sha256':hashlib.sha256(man_new).hexdigest(),'encoding':'utf-8'},
          ]
          Handler.files={'/latest.json':json.dumps(remote).encode(),'/app.py':app_new}
          # Correct keys after literal construction.
          Handler.files={'/latest.json':json.dumps(remote).encode(),'/app.py':app_new,'/update_manifest.json':man_new}
          th=threading.Thread(target=srv.serve_forever,daemon=True);th.start()

          def seed(root:pathlib.Path):
              root.mkdir(parents=True,exist_ok=True);(root/'data').mkdir(exist_ok=True);(root/'static').mkdir(exist_ok=True)
              shutil.copy2(repo/'updates/v4_4_31_startup_guard/app.py',root/'app.py')
              shutil.copy2(repo/'updates/v4_4_32_launcher_port_patch/update_manifest.json',root/'update_manifest.json')
              (root/'.env').write_text('SECRET_KEEP=1\n',encoding='utf-8')
              (root/'data'/'keep.txt').write_text('DATA_KEEP',encoding='utf-8')
              (root/'static'/'keep.txt').write_text('STATIC_KEEP',encoding='utf-8')
          try:
              with tempfile.TemporaryDirectory() as td:
                  root=pathlib.Path(td)/'install';seed(root)
                  before_env=(root/'.env').read_bytes();before_data=(root/'data'/'keep.txt').read_bytes();before_static=(root/'static'/'keep.txt').read_bytes()
                  result=mod.check_and_apply_update(root,base+'/latest.json',attempts=1,timeout=3,allow_test_sources=True)
                  assert result['ok'] and result['updated'],result
                  assert mod._local_package_version(root)=='4.4.33'
                  assert mod._installed_app_version(root)=='4.4.33'
                  assert (root/'.env').read_bytes()==before_env
                  assert (root/'data'/'keep.txt').read_bytes()==before_data
                  assert (root/'static'/'keep.txt').read_bytes()==before_static
                  second=mod.check_and_apply_update(root,base+'/latest.json',attempts=1,timeout=3,allow_test_sources=True)
                  assert second['ok'] and not second['updated'],second
                  print('UPDATE_4432_TO_4433_OK')
              with tempfile.TemporaryDirectory() as td:
                  root=pathlib.Path(td)/'rollback';seed(root)
                  old_app=(root/'app.py').read_bytes();old_manifest=(root/'update_manifest.json').read_bytes()
                  try:
                      mod._apply_remote(remote,root,attempts=1,timeout=3,test_fail_after=1,allow_test_sources=True)
                      raise AssertionError('rollback no simuló fallo')
                  except RuntimeError as e:
                      assert 'Fallo simulado' in str(e),e
                  assert (root/'app.py').read_bytes()==old_app
                  assert (root/'update_manifest.json').read_bytes()==old_manifest
                  print('ROLLBACK_4433_OK')
          finally:
              srv.shutdown();srv.server_close()
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\v4433_update_test.py
          python $env:RUNNER_TEMP\v4433_update_test.py

      - name: 8 - Guardar payload validado SIN mover canal
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v4_4_33_ui_fix
          if(-not (git diff --cached --quiet)){
            git commit -m 'payload: v4.4.33 pantalla blanca validada en navegador real'
            git pull --rebase origin main
            git push
          }

      - name: 9 - Verificar bytes REALES de GitHub Raw y SHA
        shell: pwsh
        run: |
          git pull --rebase origin main
          @'
          import hashlib,json,pathlib,time,urllib.request
          base='https://raw.githubusercontent.com/fanserick-star/recepcion-dr-revelo-updates/main/updates/v4_4_33_ui_fix/'
          local=json.loads(pathlib.Path('updates/v4_4_33_ui_fix/candidate_latest.json').read_text(encoding='utf-8'))
          def get(name):
              url=base+name+'?rp_ts='+str(time.time_ns())
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Recepcion-release-check'})
              with urllib.request.urlopen(req,timeout=10) as r:return r.read()
          last=None
          for _ in range(40):
              try:
                  app=get('app.py');inner=get('update_manifest.json')
                  if hashlib.sha256(app).hexdigest()!=local['files'][0]['sha256']:raise RuntimeError('SHA app remoto aún no coincide')
                  if hashlib.sha256(inner).hexdigest()!=local['files'][1]['sha256']:raise RuntimeError('SHA manifest remoto aún no coincide')
                  text=app.decode('utf-8-sig');compile(text,'app.py','exec')
                  if 'APP_VERSION = "4.4.33"' not in text:raise RuntimeError('versión remota incorrecta')
                  if 'function fixVersionLabels()' in text:raise RuntimeError('observer regresivo remoto')
                  print('REMOTE_PAYLOAD_SHA_OK');break
              except Exception as e:
                  last=e;time.sleep(1)
          else:raise SystemExit(f'GitHub Raw no propagó candidato válido: {last}')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\v4433_remote.py
          python $env:RUNNER_TEMP\v4433_remote.py

      - name: 10 - Mover canal oficial SOLO después de todas las pruebas verdes
        shell: pwsh
        run: |
          @'
          import json,pathlib
          p=pathlib.Path('latest-v3.json')
          current=json.loads(p.read_text(encoding='utf-8'))
          if current.get('version') not in ('4.4.32','4.4.33'):
              raise SystemExit('El canal cambió durante las pruebas: '+str(current.get('version')))
          candidate=(pathlib.Path('updates/v4_4_33_ui_fix/candidate_latest.json').read_text(encoding='utf-8'))
          d=json.loads(candidate)
          assert d['version']=='4.4.33'
          assert [x['path'] for x in d['files']]==['app.py','update_manifest.json']
          pathlib.Path('latest-v3.json').write_text(candidate,encoding='utf-8')
          pathlib.Path('latest.json').write_text(candidate,encoding='utf-8')
          print('CHANNEL_FILES_PREPARED')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\v4433_channel.py
          python $env:RUNNER_TEMP\v4433_channel.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-v3.json latest.json
          if(-not (git diff --cached --quiet)){
            git commit -m 'release: publicar v4.4.33 tras smoke de navegador real'
            git pull --rebase origin main
            git push
          }

      - name: 11 - Confirmar propagación final del canal 4.4.33
        shell: pwsh
        run: |
          @'
          import json,time,urllib.request
          url='https://raw.githubusercontent.com/fanserick-star/recepcion-dr-revelo-updates/main/latest-v3.json'
          last=None
          for _ in range(50):
              try:
                  req=urllib.request.Request(url+'?rp_ts='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Recepcion-release-check'})
                  with urllib.request.urlopen(req,timeout=8) as r:d=json.loads(r.read().decode('utf-8-sig'))
                  paths=[x.get('path') for x in d.get('files',[])]
                  if d.get('version')=='4.4.33' and d.get('app_version')=='4.4.33' and paths==['app.py','update_manifest.json']:
                      print('CHANNEL_PROPAGATED_4433');break
                  last=(d.get('version'),paths)
              except Exception as e:last=e
              time.sleep(1)
          else:raise SystemExit(f'Canal 4.4.33 no propagó: {last}')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\v4433_wait.py
          python $env:RUNNER_TEMP\v4433_wait.py
