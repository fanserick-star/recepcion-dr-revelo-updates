name: Publish v4.4.43 daily emitted and WhatsApp schedule

on:
  push:
    paths:
      - "build/v4443_daily_emitted_whatsapp_schedule/publish_v4443.py"
      - ".github/workflows/publish-v4443-daily-emitted-whatsapp.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and Chromium
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "fastapi==0.115.6" "pydantic==1.10.15" "uvicorn==0.34.0" "SQLAlchemy==2.0.36" "pg8000==1.31.2" "python-dotenv==1.0.1" "python-multipart==0.0.20" "playwright==1.55.0" "pywebview==5.4"
          python -m playwright install chromium
      - name: Rebuild, revalidate, Raw-check and publish
        shell: pwsh
        run: |
          python build/v4443_daily_emitted_whatsapp_schedule/publish_v4443.py
