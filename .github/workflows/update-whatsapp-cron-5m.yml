name: Update WhatsApp scheduler to 5 minutes
# repair-trigger-2026-09-29-247

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-whatsapp-cron-5m.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-cron:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: dr-revelo-whatsapp-cloud
    steps:
      - name: Run WhatsApp scheduler every 5 minutes 24/7
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          BODY='[{"cron":"*/5 * * * *"}]'
          curl -fsS --max-time 20 \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" \
            -o /tmp/update.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/update.json','r',encoding='utf-8'))
          assert d.get('success') is True, d
          crons=sorted(x.get('cron') for x in d.get('result',{}).get('schedules',[]))
          expected=['*/5 * * * *']
          assert crons == expected, (crons, expected)
          print('WHATSAPP_CRON_5M_247_OK')
          print(json.dumps({'schedules':crons}, ensure_ascii=False))
          PY
