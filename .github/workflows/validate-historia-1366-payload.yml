name: Validate Historia 1.3.66 self-contained payload

on:
  push:
    branches: ["repair/historia-1.3.66"]
    paths:
      - "historia-clinica/launcher-v1/app-channel-source.json"
      - ".github/workflows/validate-historia-1366-payload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate source payload closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, ast, re

          root=Path('.')
          source=json.loads((root/'historia-clinica/launcher-v1/app-channel-source.json').read_text(encoding='utf-8'))
          assert source['product']=='historia-clinica-dr-revelo'
          assert source['appVersion']=='1.3.66'
          assert source['mandatory'] is True
          assert source['minimumLauncher']=='1.0.6'

          rows=source['files']
          targets=[r['path'].replace('\\','/') for r in rows]
          assert len(targets)==len(set(targets)),targets
          expected={
            'app.py','cloud_sync.py','cloud_presence_patch.py','lan_bridge.py',
            'documentos_clinicos.py','requirements.txt','static/style.css',
            'static/doctor_icon.b64','historia-version.json','update_manifest.json'
          }
          assert set(targets)==expected,(set(targets),expected)
          for row in rows:
            assert 'sourcePath' in row and 'sourcePaths' not in row,row
            p=root/row['sourcePath']
            assert p.is_file(),p

          manifest_row=next(r for r in rows if r['path']=='update_manifest.json')
          manifest=json.loads((root/manifest_row['sourcePath']).read_text(encoding='utf-8'))
          assert set(manifest['required_dependencies']) <= set(targets)
          assert manifest['version']=='1.3.66'
          assert manifest['app_version']=='1.3.66'
          assert manifest['runtime_version']=='1.3.66'
          assert manifest['notes']['runtime_consolidated'] is True
          assert manifest['notes']['self_contained_update'] is True
          assert manifest['notes']['external_historical_parts_required'] is False

          version_row=next(r for r in rows if r['path']=='historia-version.json')
          version=json.loads((root/version_row['sourcePath']).read_text(encoding='utf-8'))['version']
          assert version==source['appVersion']==manifest['version']

          for row in rows:
            if row['path'].endswith('.py'):
              text=(root/row['sourcePath']).read_text(encoding='utf-8-sig')
              compile(text,row['path'],'exec')

          app_row=next(r for r in rows if r['path']=='app.py')
          cloud_row=next(r for r in rows if r['path']=='cloud_sync.py')
          app=(root/app_row['sourcePath']).read_text(encoding='utf-8-sig')
          cloud=(root/cloud_row['sourcePath']).read_text(encoding='utf-8-sig')
          assert 'VERSION_PATH = ROOT / "historia-version.json"' in app
          assert 'HISTORIA_NEON_ENDPOINT_ID = "ep-sweet-mud-arlsk7qa"' in cloud
          assert 'CLOUD_SCHEMA = "public"' in cloud

          forbidden_prefix=('data/','backups/','update_backups/')
          forbidden_exact={'.env','historiaclinicalauncher.exe','historialauncherupdater.exe','desinstalar_historia_clinica_dr_revelo.exe'}
          forbidden_suffix=('.db','.sqlite','.sqlite3','.mdb','.accdb','.xls','.xlsx')
          for target in targets:
            low=target.lower()
            assert target and not target.startswith('/') and '..' not in target.split('/'),target
            assert not low.startswith(forbidden_prefix),target
            assert low not in forbidden_exact,target
            assert not low.endswith(forbidden_suffix),target

          print('PAYLOAD_OK',len(targets),'files')
          print('VERSION_OK',version)
          print('PROTECTED_PATHS_OK')
          PY

      - name: Install exact candidate requirements
        run: python -m pip install --disable-pip-version-check -r historia-clinica/updates/v1_3_66_consolidated_runtime/requirements.txt

      - name: Build clean folder using payload only and import runtime
        shell: bash
        env:
          HC_PREFLIGHT: "1"
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('.')
          src=json.loads((root/'historia-clinica/launcher-v1/app-channel-source.json').read_text(encoding='utf-8'))
          dst=Path('/tmp/historia1366-clean')
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir(parents=True)
          for row in src['files']:
            target=dst/row['path']
            target.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(root/row['sourcePath'],target)
          (dst/'data').mkdir()
          print(dst)
          PY
          cd /tmp/historia1366-clean
          python - <<'PY'
          import app
          from collections import Counter
          assert app.APP_VERSION=='1.3.66'
          pairs=[]
          for route in app.app.router.routes:
            path=getattr(route,'path',None)
            for method in (getattr(route,'methods',set()) or set()):
              if path: pairs.append((method,path))
          dup=[k for k,v in Counter(pairs).items() if v>1]
          assert not dup,dup
          print('CLEAN_IMPORT_OK',app.APP_VERSION)
          print('ACTIVE_ROUTES',len(pairs))
          PY
