name: Bundle WhatsApp Worker v2.5

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js'
      - '.github/workflows/bundle-worker-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar bundler y dependencia
        run: npm install --no-save esbuild @neondatabase/serverless
      - name: Generar Worker standalone
        run: |
          npx esbuild cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=cloudflare/whatsapp_worker_v2_5_STANDALONE.js \
            --banner:js='// Dr. Revelo WhatsApp Cloud Worker v2.5 — standalone bundle'
      - name: Validar bundle
        run: |
          node --check cloudflare/whatsapp_worker_v2_5_STANDALONE.js
          grep -q 'worker_version' cloudflare/whatsapp_worker_v2_5_STANDALONE.js
          grep -q 'mobile:whatsapp-cloud-test:' cloudflare/whatsapp_worker_v2_5_STANDALONE.js
          if grep -q 'from "@neondatabase/serverless"' cloudflare/whatsapp_worker_v2_5_STANDALONE.js; then
            echo 'ERROR: dependency import was not bundled'
            exit 1
          fi
      - name: Guardar bundle en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/whatsapp_worker_v2_5_STANDALONE.js
          if git diff --cached --quiet; then
            echo 'Bundle ya estaba actualizado.'
          else
            git commit -m 'Build standalone WhatsApp worker v2.5'
            git push
          fi
