name: Inspeccionar paquetes bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-bootstrap-zips.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar componentes base en todos los ZIP
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import zipfile
          wanted=('static/index.html','mobile/index.html','azur_client.py','whatsapp_client.py','remote_agenda.py','HISTORICO_PACIENTES_2020_2025.csv')
          roots=[Path('updates'),Path('releases')]
          found=[]
          for base in roots:
              if not base.exists(): continue
              for z in sorted(base.rglob('*.zip')):
                  try:
                      with zipfile.ZipFile(z) as f:
                          names=f.namelist()
                          hits=[]
                          for n in names:
                              low=n.replace('\\','/').lower()
                              for w in wanted:
                                  if low.endswith(w.lower()): hits.append((w,n,f.getinfo(n).file_size))
                          if hits:
                              print('===== '+str(z)+' =====')
                              for h in hits: print(f'{h[0]} => {h[1]} ({h[2]} bytes)')
                              found.extend((str(z),*h) for h in hits)
                  except Exception:
                      pass
          print('TOTAL_HITS',len(found))
          if not found: raise SystemExit('No se encontró ningún componente base')
          '@ | python -
