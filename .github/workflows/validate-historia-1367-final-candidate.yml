name: Validate Historia 1.3.67 final candidate

on:
  push:
    branches: ["repair/historia-1.3.66"]
    paths:
      - ".github/workflows/validate-historia-1367-final-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate exact 1.3.67 source payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast,json,re,shutil
          root=Path('.')
          channel=json.loads((root/'historia-clinica/launcher-v1/app-channel-source.json').read_text(encoding='utf-8'))
          assert channel['product']=='historia-clinica-dr-revelo'
          assert channel['appVersion']=='1.3.67',channel['appVersion']
          assert channel['mandatory'] is True
          rows=channel['files']; targets=[r['path'].replace('\\','/') for r in rows]
          expected={'app.py','cloud_sync.py','cloud_presence_patch.py','lan_bridge.py','documentos_clinicos.py','requirements.txt','static/style.css','static/doctor_icon.b64','historia-version.json','update_manifest.json'}
          assert set(targets)==expected,(set(targets),expected)
          assert len(targets)==len(set(targets))
          assert all('sourcePath' in r and not r.get('sourcePaths') for r in rows)
          trial=Path('/tmp/historia1367-final')
          if trial.exists(): shutil.rmtree(trial)
          trial.mkdir(parents=True)
          for row in rows:
              src=root/row['sourcePath']; assert src.is_file(),src
              dst=trial/row['path'];dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          (trial/'data').mkdir()
          version=json.loads((trial/'historia-version.json').read_text(encoding='utf-8'))['version']
          manifest=json.loads((trial/'update_manifest.json').read_text(encoding='utf-8'))
          assert version=='1.3.67'
          for k in ('version','app_version','runtime_version'): assert manifest[k]==version,(k,manifest[k])
          assert set(manifest['required_dependencies']) <= expected
          notes=manifest['notes']
          assert notes['runtime_consolidated'] is True
          assert notes['self_contained_update'] is True
          assert notes['external_historical_parts_required'] is False
          assert notes['optional_cloud_backfill'] is True
          assert set(notes['optional_cloud_backfill_tables'])=={'prescriptions','certificates','clinic_settings'}
          assert notes['optional_cloud_backfill_only_missing_remote_keys'] is True
          assert notes['optional_cloud_backfill_idempotent'] is True
          assert notes['patient_data_destructive_changes'] is False
          for rel in expected:
              if rel.endswith('.py'): compile((trial/rel).read_text(encoding='utf-8-sig'),rel,'exec')
          cloud=(trial/'cloud_sync.py').read_text(encoding='utf-8-sig')
          assert 'HISTORIA_NEON_ENDPOINT_ID = "ep-sweet-mud-arlsk7qa"' in cloud
          assert 'CLOUD_SCHEMA = "public"' in cloud
          assert 'def _queue_missing_optional_rows' in cloud
          assert 'optional_cloud_backfill_v1' in cloud
          loader=cloud.split('def _load_env',1)[1].split('\ndef ',1)[0]
          forbidden=['values.get("DATABASE_URL")',"values.get('DATABASE_URL')",'os.environ.get("DATABASE_URL")',"os.environ.get('DATABASE_URL')"]
          assert not any(x in loader for x in forbidden)
          app=(trial/'app.py').read_text(encoding='utf-8-sig')
          assert 'VERSION_PATH = ROOT / "historia-version.json"' in app
          assert '/api/encounters/save' in app and '/api/encounters/{encounter_id}/sign' in app
          print('SOURCE_PAYLOAD_OK',len(targets),'files')
          print('VERSION_OK',version)
          print('NEON_GUARDS_OK')
          PY

      - name: Install exact requirements
        run: python -m pip install --disable-pip-version-check -r /tmp/historia1367-final/requirements.txt

      - name: Import clean payload and audit real routes
        shell: bash
        env:
          HC_PREFLIGHT: "1"
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd /tmp/historia1367-final
          python - <<'PY'
          import app
          from collections import Counter
          assert app.APP_VERSION=='1.3.67',app.APP_VERSION
          pairs=[(m,r.path) for r in app.app.router.routes for m in (getattr(r,'methods',set()) or set())]
          dup=[k for k,v in Counter(pairs).items() if v>1]
          assert not dup,dup
          have=set(pairs)
          for pair in [('POST','/api/encounters/save'),('POST','/api/encounters/{encounter_id}/sign'),('GET','/api/version')]: assert pair in have,pair
          print('CLEAN_IMPORT_OK',app.APP_VERSION,'ROUTES',len(pairs))
          PY

      - name: Start Uvicorn and probe version
        shell: bash
        env:
          HC_PREFLIGHT: "1"
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cd /tmp/historia1367-final
          python - <<'PY'
          import json,threading,time,urllib.request,uvicorn,app
          cfg=uvicorn.Config(app.app,host='127.0.0.1',port=18789,access_log=False,log_level='warning')
          server=uvicorn.Server(cfg);t=threading.Thread(target=server.run,daemon=True);t.start()
          deadline=time.time()+20;d=None
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18789/api/version',timeout=1) as r:d=json.loads(r.read().decode())
                  break
              except Exception:time.sleep(.25)
          assert d,d
          assert d['product']=='historia-clinica-dr-revelo',d
          assert d['version']=='1.3.67',d
          server.should_exit=True;t.join(timeout=5)
          print('UVICORN_OK',d['version'])
          PY

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build clean Windows payload and import
        shell: pwsh
        env:
          HC_PREFLIGHT: "1"
          HISTORIA_DATABASE_URL: ""
          DATABASE_URL: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference="Stop"
          $src=Get-Content "historia-clinica/launcher-v1/app-channel-source.json" -Raw | ConvertFrom-Json
          if($src.appVersion -ne "1.3.67"){throw "Versión inesperada $($src.appVersion)"}
          $trial=Join-Path $env:RUNNER_TEMP "historia1367final"
          Remove-Item $trial -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $trial | Out-Null
          foreach($item in $src.files){
            $from=Join-Path (Get-Location) $item.sourcePath
            $to=Join-Path $trial ($item.path -replace '/','\')
            $parent=Split-Path -Parent $to;if($parent){New-Item -ItemType Directory -Force $parent | Out-Null}
            Copy-Item $from $to -Force
          }
          New-Item -ItemType Directory -Force "$trial\data" | Out-Null
          python -m pip install --disable-pip-version-check -r "$trial\requirements.txt"
          Push-Location $trial
          python -c "import app; assert app.APP_VERSION=='1.3.67'; print('WINDOWS_IMPORT_OK',app.APP_VERSION)"
          Pop-Location
