name: Audit general Reception 4.6.29 candidate

on:
  push:
    branches:
      - audit-general-reception-4629
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RP_FORCE_OFFLINE: "1"
      DATABASE_URL: ""
      HISTORIA_DATABASE_URL: ""
      WHATSAPP_CLOUD_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal Reception runtime dependencies for audit
        run: >-
          python -m pip install
          fastapi uvicorn sqlalchemy pg8000 python-dotenv python-multipart
      - name: Validate canonical source
        run: python tools/test_reception_canonical_source.py
      - name: Validate runtime layout
        run: python tools/validate_reception_runtime_layout.py recepcion/app
      - name: Run permanent report regression test
        shell: bash
        run: |
          if [ -f tools/test_reception_reports.py ]; then
            python tools/test_reception_reports.py
          elif [ -f tools/test_reception_report_runtime.py ]; then
            python tools/test_reception_report_runtime.py
          else
            echo "No standalone report regression test found; canonical validator remains authoritative."
          fi
      - name: Measure full Reception import
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, time, threading
          from collections import Counter
          sys.path.insert(0, os.path.abspath('recepcion/app'))
          started=time.perf_counter()
          import app as reception_app
          elapsed=time.perf_counter()-started
          import core_runtime, features_runtime
          api=core_runtime.app
          route_keys=[]
          for route in api.router.routes:
              path=getattr(route,'path',None)
              methods=sorted(getattr(route,'methods',None) or [])
              for method in methods or ['']:
                  route_keys.append((path, method))
          counts=Counter(route_keys)
          duplicates=[(key,count) for key,count in counts.items() if key[0] and count>1]
          print(f'IMPORT_SECONDS={elapsed:.3f}')
          print(f'FEATURE_MODULES={len(features_runtime.FEATURE_MODULES)}')
          print(f'ROUTE_METHODS={len(route_keys)} UNIQUE={len(counts)} DUPLICATES={len(duplicates)}')
          for key,count in sorted(duplicates)[:80]:
              print('DUPLICATE_ROUTE', key, count)
          print(f'OVERLAY_JS_BYTES={len((core_runtime.V460_OVERLAY_JS or "").encode("utf-8"))}')
          print(f'OVERLAY_CSS_BYTES={len((core_runtime.V460_OVERLAY_CSS or "").encode("utf-8"))}')
          print('THREADS', sorted(t.name for t in threading.enumerate()))
          open('/tmp/reception-overlay.js','w',encoding='utf-8').write(core_runtime.V460_OVERLAY_JS or '')
          PY
      - name: Validate final generated overlay JavaScript
        run: node --check /tmp/reception-overlay.js
      - name: Reject generated bytecode
        shell: bash
        run: |
          if find recepcion/app -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) | grep -q .; then
            find recepcion/app -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -print
            exit 1
          fi
# rerun after first conservative runtime cleanup
