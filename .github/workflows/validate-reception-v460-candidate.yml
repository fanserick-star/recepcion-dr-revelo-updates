name: Validate Reception v4.6.0 Candidate

on:
  push:
    branches:
      - "audit/recepcion-v4.6.0-stabilization"
    paths:
      - "updates/v4_6_0_stabilization/**"
      - "tools/recepcion_v460/**"
      - "launcher-v1/RecepcionLauncher/**"
      - "launcher-v1/installer/**"
      - ".github/workflows/validate-reception-v460-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recepcion-v460-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: windows-latest
    env:
      CANDIDATE_DIR: updates/v4_6_0_stabilization
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/recepcion-v4.6.0-stabilization
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build atomic candidate
        shell: pwsh
        run: |
          python tools/recepcion_v460/build_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install candidate Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r "$env:CANDIDATE_DIR/requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate AZUR client and physical resources
        shell: pwsh
        run: |
          @'
          import importlib
          import sys
          import zipfile
          from pathlib import Path

          candidate = Path("updates/v4_6_0_stabilization").resolve()
          runtime = candidate / "recepcion_legacy_runtime.zip"
          assert runtime.is_file()

          sys.path.insert(0, str(runtime))
          azur = importlib.import_module("azur_client")
          assert hasattr(azur, "query_comprobante")
          assert hasattr(azur, "emit_invoice")
          assert hasattr(azur, "test_connection")

          azur._endpoint_candidates = lambda base, resource: ["https://demo.azur.com.ec/plataforma/api/v2/consulta/comprobante"]

          def run_case(payload, expected):
              azur._post_json = lambda url, body, timeout=15, api_key="": azur.AzurResponse(
                  status=200, data=payload, text="", url=url
              )
              result = azur.query_comprobante(
                  "https://demo.azur.com.ec", "test-key", "1" * 49, timeout=1
              )
              assert result["estado"] == expected, result

          run_case(
              {"estado": "AUTORIZADO", "numero_autorizacion": "12345"},
              "AUTORIZADA",
          )
          run_case(
              {"estado": "NO AUTORIZADO", "mensajes": ["rechazado por SRI"]},
              "RECHAZADA",
          )
          run_case({"estado": "PROCESANDO"}, "EN_PROCESO")

          required_assets = [
              "static/app.js",
              "static/index.html",
              "static/style.css",
              "static/doctor_full_logo.png",
              "static/doctor_isotype.png",
              "static/doctor_icon.ico",
              "static/azur_mark.svg",
              "static/whatsapp_mark.svg",
              "mobile/index.html",
              "mobile/app.js",
              "mobile/sw.js",
          ]
          for rel in required_assets:
              p = candidate / rel
              assert p.is_file() and p.stat().st_size > 0, rel

          print("AZUR interface and physical resources: OK")
          '@ | Set-Content "$env:RUNNER_TEMP\validate_azur_resources.py" -Encoding utf8
          python "$env:RUNNER_TEMP\validate_azur_resources.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate isolated import and route cleanup
        shell: pwsh
        run: |
          @'
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          candidate = Path("updates/v4_6_0_stabilization").resolve()
          data = Path(tempfile.mkdtemp(prefix="rp460_ci_"))
          os.environ["RP_DATA_DIR"] = str(data)
          os.environ["RP_FORCE_OFFLINE"] = "1"
          os.environ["RP_DESKTOP_LAUNCH"] = "1"
          os.environ["WHATSAPP_ENABLED"] = "0"
          os.environ["WHATSAPP_CLOUD_MODE"] = "1"
          os.environ["DATABASE_URL"] = ""
          os.environ["NEON_DATABASE_URL"] = ""
          os.environ["HISTORIA_DATABASE_URL"] = ""
          os.environ["RP_DATAPHONE_API_ENABLED"] = "0"

          sys.path.insert(0, str(candidate))
          os.chdir(candidate)
          import app

          assert app.APP_VERSION == "4.6.0", app.APP_VERSION
          assert Path(app.core.BASE_DIR).resolve() == candidate, app.core.BASE_DIR
          assert "recepcion_legacy_runtime.zip" in str(app.previous.__file__), app.previous.__file__

          pairs = {}
          for route in app.app.router.routes:
              path = getattr(route, "path", None)
              methods = frozenset(
                  str(x).upper()
                  for x in (getattr(route, "methods", set()) or set())
                  if str(x).upper() not in {"HEAD", "OPTIONS"}
              )
              if not path or not methods:
                  continue
              key = (path, tuple(sorted(methods)))
              pairs.setdefault(key, []).append(getattr(route, "name", ""))

          duplicates = {str(k): v for k, v in pairs.items() if len(v) > 1}
          assert not duplicates, duplicates

          paths = {getattr(r, "path", "") for r in app.app.router.routes}
          for retired in (
              "/api/mobile/remote/status",
              "/api/mobile/remote/quick/start",
              "/api/mobile/remote/stable/restart",
              "/api/mobile/remote/stop",
              "/api/v4506/dataphone/config",
              "/api/v4506/dataphone/validate",
              "/api/v4506/dataphone/test",
              "/api/v4506/dataphone/payment-preview",
          ):
              assert retired not in paths, retired

          for required in (
              "/api/system/health",
              "/api/system/data-audit",
              "/api/update/info",
              "/api/update/apply",
              "/api/patients",
              "/api/visits/batch-payment",
          ):
              assert required in paths, required

          assert not [
              p for p in paths
              if p.startswith("/api/v") and p.endswith("/health") and "{" not in p
          ]

          manifest = json.loads((candidate / "update_manifest.json").read_text(encoding="utf-8"))
          for rel in manifest["required_dependencies"]:
              assert (candidate / rel).is_file(), rel

          runtime = json.loads((candidate / "runtime_manifest.json").read_text(encoding="utf-8"))
          assert runtime["version"] == "4.6.0"
          assert runtime["member_count"] >= 50
          assert runtime["runtime_zip_size"] > 100_000
          assert (candidate / "static/style.css").stat().st_size > 100_000
          assert (candidate / "static/doctor_full_logo.png").stat().st_size > 100_000
          assert (candidate / "mobile/app.js").stat().st_size > 5_000

          print(json.dumps({
              "version": app.APP_VERSION,
              "routes": len(app.app.router.routes),
              "runtime_members": runtime["member_count"],
              "runtime_zip_size": runtime["runtime_zip_size"],
              "duplicate_routes": 0,
          }, indent=2))
          '@ | Set-Content "$env:RUNNER_TEMP\validate_candidate.py" -Encoding utf8
          python "$env:RUNNER_TEMP\validate_candidate.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run functional patient/history/payment smoke test
        shell: pwsh
        run: |
          python tools/recepcion_v460/smoke_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert stable channel remains untouched
        shell: pwsh
        run: |
          $stable = Get-Content "launcher-v1/app-channel.json" -Raw | ConvertFrom-Json
          if ($stable.appVersion -ne "4.5.44") {
            throw "La rama candidata intentó cambiar el canal estable: $($stable.appVersion)"
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare Launcher icon from candidate resources
        shell: pwsh
        run: |
          $src = Join-Path $env:CANDIDATE_DIR "static/doctor_icon.ico"
          $dst = "launcher-v1/RecepcionLauncher/doctor_icon.ico"
          if (-not (Test-Path $src -PathType Leaf)) { throw "Falta doctor_icon.ico en la candidata" }
          Copy-Item $src $dst -Force

      - name: Compile Launcher 1.0.13 candidate
        shell: pwsh
        run: |
          dotnet build "launcher-v1/RecepcionLauncher/RecepcionLauncher.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: recepcion-v4.6.0-candidate
          path: |
            updates/v4_6_0_stabilization/app.py
            updates/v4_6_0_stabilization/recepcion_legacy_runtime.zip
            updates/v4_6_0_stabilization/runtime_manifest.json
            updates/v4_6_0_stabilization/historia_bridge.py
            updates/v4_6_0_stabilization/historia_lan_transport.py
            updates/v4_6_0_stabilization/static/app.js
            updates/v4_6_0_stabilization/static/index.html
            updates/v4_6_0_stabilization/static/style.css
            updates/v4_6_0_stabilization/static/doctor_full_logo.png
            updates/v4_6_0_stabilization/static/doctor_isotype.png
            updates/v4_6_0_stabilization/static/doctor_icon.ico
            updates/v4_6_0_stabilization/static/azur_mark.svg
            updates/v4_6_0_stabilization/static/whatsapp_mark.svg
            updates/v4_6_0_stabilization/mobile/index.html
            updates/v4_6_0_stabilization/mobile/app.js
            updates/v4_6_0_stabilization/mobile/sw.js
            updates/v4_6_0_stabilization/recepcion-version.json
            updates/v4_6_0_stabilization/update_manifest.json
            updates/v4_6_0_stabilization/requirements.txt
          if-no-files-found: error
          retention-days: 14
