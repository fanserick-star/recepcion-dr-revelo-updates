name: Validate Historia Launcher v1

on:
  push:
    branches: [main]
    paths:
      - "historia-clinica/launcher-v1/**"
      - ".github/workflows/validate-historia-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate launcher and channels dynamically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          base=root/'historia-clinica/launcher-v1'
          source=(base/'HistoriaLauncher/Program.cs').read_text(encoding='utf-8')
          launcher_channel=json.loads((base/'launcher-channel.json').read_text(encoding='utf-8'))
          app_source=json.loads((base/'app-channel-source.json').read_text(encoding='utf-8'))

          m=re.search(r'LauncherVersion\s*=\s*"([^"]+)"',source)
          assert m,'No se encontró LauncherVersion'
          launcher_version=m.group(1)
          assert launcher_channel['latestVersion']==launcher_version,(launcher_channel['latestVersion'],launcher_version)
          assert launcher_channel['mandatory'] is True
          assert re.fullmatch(r'[0-9a-f]{64}',str(launcher_channel['installerSha256']))
          assert re.fullmatch(r'[0-9a-f]{64}',str(launcher_channel['updaterSha256']))

          required=[
            'const int Port = 8787',
            '"DrArmandoRevelo.HistoriaClinica"',
            '"historia-version.json"',
            'HistoriaLauncherUpdater.exe',
            'ProbeVersionAsync',
            'BackupSqliteAsync',
            'PrecheckCandidateAsync',
            'RollbackAsync',
            'EnsureSafeUpdatePath',
            'WebView2',
            '_launcher_precheck_server.py',
          ]
          for item in required: assert item in source,item
          for item in ('ABRIR_RECEPCION','C:\\Recepcion Dr Revelo','const int Port = 8000'):
            assert item not in source,item

          assert app_source['product']=='historia-clinica-dr-revelo'
          assert app_source['mandatory'] is True
          assert str(app_source['minimumLauncher']) <= launcher_version

          targets=[x['path'].replace('\\','/') for x in app_source['files']]
          assert len(targets)==len(set(targets))
          protected_prefixes=('data/','backups/','update_backups/')
          protected_exact={'.env','historiaclinicalauncher.exe','historialauncherupdater.exe','desinstalar_historia_clinica_dr_revelo.exe'}
          protected_suffixes=('.db','.sqlite','.sqlite3','.mdb','.accdb','.xls','.xlsx')
          for p in targets:
            low=p.lower()
            assert p and not p.startswith('/') and '..' not in p.split('/'),p
            assert not low.startswith(protected_prefixes),p
            assert low not in protected_exact,p
            assert not low.endswith(protected_suffixes),p

          iss=(base/'installer/LauncherV1.iss').read_text(encoding='utf-8')
          im=re.search(r'#define\s+MyAppVersion\s+"([^"]+)"',iss)
          assert im and im.group(1)==launcher_version,(im.group(1) if im else None,launcher_version)

          print('LAUNCHER_OK',launcher_version)
          print('APP_SOURCE',app_source['appVersion'])
          print('PROTECTED_PAYLOAD_OK',len(targets),'files')
          PY
