name: Validate Historia Launcher v1 Migration

on:
  push:
    paths:
      - "historia-clinica/updates/v1_3_5_launcher_v1_migration/**"
      - "historia-clinica/launcher-v1/**"
      - ".github/workflows/validate-historia-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Historia 1.3.5 migration
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, py_compile

          root = pathlib.Path(".")
          old = root / "historia-clinica/updates/v1_3_4_fresh_install_repair"
          new = root / "historia-clinica/updates/v1_3_5_launcher_v1_migration"
          p131 = root / "historia-clinica/updates/v1_3_1_new_patient_turn"

          version = json.loads((new / "historia-version.json").read_text(encoding="utf-8"))["version"]
          assert version == "1.3.5"

          manifest = json.loads((new / "update_manifest.json").read_text(encoding="utf-8"))
          for key in ("version","app_version","runtime_version"):
              assert manifest[key] == version, (key, manifest[key])
          assert manifest["version_source"] == "historia-version.json"
          assert manifest["compatibility_version_aliases"] is True
          assert manifest["mandatory"] is True
          assert manifest["copy"] == ["app.py","historia-version.json","update_manifest.json"]
          assert manifest["notes"]["database_schema_changes"] is False
          assert manifest["notes"]["clinical_changes"] is False
          assert manifest["notes"]["patient_data_changes"] is False

          old1 = (old / "app.py.part01").read_text(encoding="utf-8")
          new1 = (new / "app.py.part01").read_text(encoding="utf-8")
          old5 = (old / "app.py.part05").read_text(encoding="utf-8")
          new5 = (new / "app.py.part05").read_text(encoding="utf-8")

          # Desde la base de datos hacia abajo, part01 conserva la lógica clínica.
          assert old1[old1.index("def db():"):] == new1[new1.index("def db():"):]
          # Desde los wrappers clínicos v1.3.2, part05 también es idéntico.
          marker = "_v132_base_original = base"
          assert old5[old5.index(marker):] == new5[new5.index(marker):]

          assert 'VERSION_PATH = ROOT / "historia-version.json"' in new1
          assert 'ROOT / "HistoriaClinicaLauncher.exe"' in new1
          assert 'HistoriaClinica_Dr_Revelo.exe.b64' not in new1[:new1.index("def db():")]

          parts = [
              new / "app.py.part01",
              p131 / "app.py.part02",
              p131 / "app.py.part03",
              p131 / "app.py.part04",
              new / "app.py.part05",
          ]
          assembled = pathlib.Path("/tmp/historia_app_135.py")
          assembled.write_bytes(b"".join(p.read_bytes() for p in parts))
          py_compile.compile(str(assembled), doraise=True)
          digest = hashlib.sha256(assembled.read_bytes()).hexdigest()

          print("OK Historia canonical version:", version)
          print("OK clinical logic unchanged from v1.3.4")
          print("OK new native shortcut target")
          print("OK assembled app.py syntax")
          print("APP_SHA256=" + digest)
          PY

      - name: Validate launcher source invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("historia-clinica/launcher-v1/HistoriaLauncher/Program.cs")
          s = p.read_text(encoding="utf-8")
          required = [
              'const string LauncherVersion = "1.0.2"',
              'const int Port = 8787',
              '"DrArmandoRevelo.HistoriaClinica"',
              '"historia-version.json"',
              'HistoriaLauncherUpdater.exe',
              'ProbeVersionAsync',
              'BackupSqliteAsync',
              'f.Parts',
              'WebView2',
              '_launcher_precheck_import.py',
              '_launcher_precheck_server.py',
              'new ProcessStartInfo(python, QuoteArg(script))',
              'new ProcessStartInfo(python, QuoteArg(serverScript))',
              'new ProcessStartInfo(python, QuoteArg(backendScript))',
          ]
          for item in required:
              assert item in s, item
          forbidden = [
              'ABRIR_RECEPCION',
              'C:\\Recepcion Dr Revelo',
              'const int Port = 8000',
          ]
          for item in forbidden:
              assert item not in s, item
          # El fallo visto en Windows venía de construir bloques try/except dentro de python -c.
          precheck = s[s.index("async Task PrecheckCandidateAsync"):s.index("async Task BackupSqliteAsync")]
          backend = s[s.index("async Task<bool> StartBackendAsync"):s.index("async Task<(string product, string version)?> ProbeVersionAsync")]
          assert 'ProcessStartInfo(python, "-c "' not in precheck
          assert 'ProcessStartInfo(python, "-c "' not in backend
          assert '_launcher_precheck_import.py' in precheck
          assert '_launcher_precheck_server.py' in precheck
          assert 'backend_" + Guid.NewGuid()' in backend
          print("OK Historia launcher invariants")
          print("OK isolated precheck and real backend use temporary .py scripts")
          PY


      - name: Validate channels and protected payload
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re

          root = pathlib.Path(".")
          base = root / "historia-clinica"
          new = base / "updates/v1_3_5_launcher_v1_migration"
          p131 = base / "updates/v1_3_1_new_patient_turn"

          version = json.loads((new / "historia-version.json").read_text(encoding="utf-8"))["version"]
          app_channel = json.loads((base / "launcher-v1/app-channel.json").read_text(encoding="utf-8"))
          launcher_channel = json.loads((base / "launcher-v1/launcher-channel.json").read_text(encoding="utf-8"))
          manifest = json.loads((new / "update_manifest.json").read_text(encoding="utf-8"))

          assert version == "1.3.5"
          assert manifest["launcher_minimum"] == "1.0.2"
          if app_channel.get("status") == "hold":
              assert app_channel["appVersion"] == "1.3.4"
              assert app_channel["mandatory"] is False
              assert app_channel["minimumLauncher"] == "1.0.2"
              assert app_channel["files"] == []
          else:
              assert app_channel["appVersion"] == version
              assert app_channel["mandatory"] is True
              assert app_channel["minimumLauncher"] == "1.0.2"

          source = (base / "launcher-v1/HistoriaLauncher/Program.cs").read_text(encoding="utf-8")
          m = re.search(r'LauncherVersion\s*=\s*"([^"]+)"', source)
          assert m and m.group(1) == "1.0.2"
          assert launcher_channel["latestVersion"] == "1.0.2"
          assert launcher_channel["mandatory"] is True
          assert re.fullmatch(r"[0-9a-f]{64}", launcher_channel["installerSha256"])
          assert re.fullmatch(r"[0-9a-f]{64}", launcher_channel["updaterSha256"])

          if app_channel.get("status") != "hold":
              allowed = {"app.py", "historia-version.json", "update_manifest.json"}
              paths = {item["path"] for item in app_channel["files"]}
              assert paths == allowed, paths
              for path in paths:
                  low = path.lower()
                  assert not low.startswith("data/")
                  assert low != ".env"
                  assert not low.endswith((".db",".sqlite",".sqlite3",".mdb",".accdb",".xls",".xlsx"))
          else:
              paths = set()

          parts = [
              new / "app.py.part01",
              p131 / "app.py.part02",
              p131 / "app.py.part03",
              p131 / "app.py.part04",
              new / "app.py.part05",
          ]
          app_bytes = b"".join(p.read_bytes() for p in parts)
          expected = {
              "app.py": hashlib.sha256(app_bytes).hexdigest(),
              "historia-version.json": hashlib.sha256((new / "historia-version.json").read_bytes()).hexdigest(),
              "update_manifest.json": hashlib.sha256((new / "update_manifest.json").read_bytes()).hexdigest(),
          }
          print("EXPECTED_HASHES=" + json.dumps(expected, sort_keys=True))
          if app_channel.get("status") != "hold":
              for item in app_channel["files"]:
                  assert item["sha256"] == expected[item["path"]], (item["path"], item["sha256"], expected[item["path"]])

          print("OK app channel:", app_channel["appVersion"], app_channel.get("status", "active"))
          print("OK launcher channel: 1.0.2")
          print("OK payload hashes and protected paths")
          PY
