name: Validate Active Historia Stack

on:
  push:
    branches: [main]
    paths:
      - "historia-clinica/launcher-v1/**"
      - "historia-clinica/updates/v1_3_5_launcher_v1_migration/**"
      - ".github/workflows/validate-active-historia-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Historia launcher v1 architecture
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path(".")
          base=root/"historia-clinica"
          appch=json.loads((base/"launcher-v1/app-channel.json").read_text(encoding="utf-8"))
          lch=json.loads((base/"launcher-v1/launcher-channel.json").read_text(encoding="utf-8"))
          ver=json.loads((base/"updates/v1_3_5_launcher_v1_migration/historia-version.json").read_text(encoding="utf-8"))["version"]
          manifest=json.loads((base/"updates/v1_3_5_launcher_v1_migration/update_manifest.json").read_text(encoding="utf-8"))
          assert appch["appVersion"]==ver=="1.3.5"
          assert appch["mandatory"] is True
          for k in ("version","app_version","runtime_version"):
              assert manifest[k]==ver,(k,manifest[k],ver)
          assert manifest["version_source"]=="historia-version.json"
          forbidden=("data/",".env",".db",".sqlite",".sqlite3",".mdb",".accdb",".xlsx",".xls")
          for f in appch["files"]:
              p=f["path"].lower()
              assert not any(p==x or p.startswith(x) or p.endswith(x) for x in forbidden),p
              assert p not in ("abrir_historia_clinica.py","iniciar.bat")
          src=(base/"launcher-v1/HistoriaLauncher/Program.cs").read_text(encoding="utf-8")
          m=re.search(r'LauncherVersion\s*=\s*"([^"]+)"',src)
          assert m and m.group(1)==lch["latestVersion"]=="1.0.0"
          assert "const int Port = 8787;" in src
          assert "historia-clinica-dr-revelo" in src
          assert "ABRIR_HISTORIA_CLINICA.py" in src  # only cleanup/compatibility reference
          assert "historia-version.json" in src
          assert lch["mandatory"] is True
          assert lch["installerSha256"] and lch["updaterSha256"]
          print("OK Historia",ver,"Launcher",m.group(1))
          PY
