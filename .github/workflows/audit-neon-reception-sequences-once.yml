name: Audit Neon Reception sequences once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-neon-reception-sequences-once.yml"

permissions:
  contents: write

concurrency:
  group: audit-neon-reception-sequences-once
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: dr-revelo-whatsapp-cloud
      WORKER_URL: https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare temporary read-only audit endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$(python - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          printf 'AUDIT_PATH=/__rp_seq_audit_%s\n' "$TOKEN" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path
          import os

          src = Path("cloudflare/WHATSAPP_WORKER_v2_6_15_DIAGNOSTICS_STANDALONE.js")
          text = src.read_text(encoding="utf-8")
          marker = "var whatsapp_worker_v2_6_responses_default = {"
          assert marker in text, "No se encontró el punto de inserción del Worker"

          fn = r'''
          function _rpAuditIdent(value) {
            return '"' + String(value || '').replaceAll('"', '""') + '"';
          }

          async function _rpSequenceAudit(env) {
            if (!env.DATABASE_URL) {
              return new Response(JSON.stringify({ok:false,error:"missing_database_url"}), {
                status:503, headers:{"content-type":"application/json","cache-control":"no-store"}
              });
            }
            return await withClient(env, async (client) => {
              await client.query("BEGIN READ ONLY");
              try {
                const meta = await client.query(`
                  SELECT
                    tn.nspname AS table_schema,
                    t.relname AS table_name,
                    a.attname AS column_name,
                    sn.nspname AS sequence_schema,
                    s.relname AS sequence_name,
                    COALESCE(ps.increment_by, 1)::bigint AS increment_by,
                    COALESCE(ps.start_value, 1)::bigint AS start_value,
                    a.attidentity AS identity_kind
                  FROM pg_class s
                  JOIN pg_namespace sn ON sn.oid=s.relnamespace
                  JOIN pg_depend d
                    ON d.objid=s.oid
                   AND d.classid='pg_class'::regclass
                   AND d.refclassid='pg_class'::regclass
                   AND d.deptype IN ('a','i')
                  JOIN pg_class t ON t.oid=d.refobjid
                  JOIN pg_namespace tn ON tn.oid=t.relnamespace
                  JOIN pg_attribute a
                    ON a.attrelid=t.oid
                   AND a.attnum=d.refobjsubid
                  LEFT JOIN pg_sequences ps
                    ON ps.schemaname=sn.nspname
                   AND ps.sequencename=s.relname
                  WHERE s.relkind='S'
                    AND t.relkind IN ('r','p')
                    AND tn.nspname NOT IN ('pg_catalog','information_schema')
                    AND sn.nspname NOT IN ('pg_catalog','information_schema')
                  ORDER BY tn.nspname,t.relname,a.attname,sn.nspname,s.relname
                `);

                const allSeq = await client.query(`
                  SELECT schemaname, sequencename
                  FROM pg_sequences
                  WHERE schemaname NOT IN ('pg_catalog','information_schema')
                  ORDER BY schemaname,sequencename
                `);

                const rows = [];
                const owned = new Set();

                for (const m of (meta.rows || [])) {
                  const ts = String(m.table_schema);
                  const tn = String(m.table_name);
                  const cn = String(m.column_name);
                  const ss = String(m.sequence_schema);
                  const sn = String(m.sequence_name);
                  const inc = Number(m.increment_by || 1);
                  owned.add(ss + "." + sn);

                  const qTable = _rpAuditIdent(ts) + "." + _rpAuditIdent(tn);
                  const qCol = _rpAuditIdent(cn);
                  const qSeq = _rpAuditIdent(ss) + "." + _rpAuditIdent(sn);

                  const mm = await client.query(
                    `SELECT min(${qCol})::bigint AS min_id, max(${qCol})::bigint AS max_id, count(*)::bigint AS row_count FROM ${qTable}`
                  );
                  const sv = await client.query(
                    `SELECT last_value::bigint AS last_value, is_called FROM ${qSeq}`
                  );

                  const stat = mm.rows?.[0] || {};
                  const seq = sv.rows?.[0] || {};
                  const minId = stat.min_id == null ? null : Number(stat.min_id);
                  const maxId = stat.max_id == null ? null : Number(stat.max_id);
                  const rowCount = Number(stat.row_count || 0);
                  const lastValue = Number(seq.last_value);
                  const isCalled = Boolean(seq.is_called);
                  const nextValue = isCalled ? lastValue + inc : lastValue;

                  let safe = true;
                  let status = "SAFE";
                  if (rowCount === 0) {
                    status = "EMPTY_TABLE";
                  } else if (inc > 0) {
                    safe = nextValue > maxId;
                    status = safe ? "SAFE" : "BEHIND_OR_COLLISION";
                  } else if (inc < 0) {
                    safe = nextValue < minId;
                    status = safe ? "SAFE_DESCENDING" : "BEHIND_OR_COLLISION";
                  } else {
                    safe = false;
                    status = "INVALID_INCREMENT";
                  }

                  rows.push({
                    table_schema: ts,
                    table_name: tn,
                    column_name: cn,
                    sequence_schema: ss,
                    sequence_name: sn,
                    identity_kind: String(m.identity_kind || ""),
                    increment_by: inc,
                    row_count: rowCount,
                    min_id: minId,
                    max_id: maxId,
                    last_value: lastValue,
                    is_called: isCalled,
                    next_value: nextValue,
                    safe,
                    status
                  });
                }

                const unowned = (allSeq.rows || [])
                  .map(x => ({sequence_schema:String(x.schemaname), sequence_name:String(x.sequencename)}))
                  .filter(x => !owned.has(x.sequence_schema + "." + x.sequence_name));

                await client.query("ROLLBACK");

                const problems = rows.filter(x => !x.safe);
                return new Response(JSON.stringify({
                  ok: true,
                  database: "reception",
                  checked_at: new Date().toISOString(),
                  owned_sequence_count: rows.length,
                  problem_count: problems.length,
                  all_owned_sequences_safe: problems.length === 0,
                  rows,
                  unowned_sequences: unowned
                }), {
                  status:200,
                  headers:{"content-type":"application/json; charset=utf-8","cache-control":"no-store"}
                });
              } catch (e) {
                try { await client.query("ROLLBACK"); } catch {}
                return new Response(JSON.stringify({
                  ok:false,
                  error:String(e?.message || e).slice(0,500)
                }), {
                  status:500,
                  headers:{"content-type":"application/json; charset=utf-8","cache-control":"no-store"}
                });
              }
            });
          }

          '''

          route = f'''    if (u.pathname === {os.environ["AUDIT_PATH"]!r}) return _rpSequenceAudit(env);\n'''
          text = text.replace(marker, fn + "\n" + marker, 1)
          fetch_marker = '    const u = new URL(request.url);\n'
          assert fetch_marker in text, "No se encontró el inicio de fetch"
          text = text.replace(fetch_marker, fetch_marker + route, 1)
          Path("/tmp/rp-sequence-audit-worker.js").write_text(text, encoding="utf-8")
          PY

          node --check /tmp/rp-sequence-audit-worker.js

      - name: Deploy temporary audit endpoint
        id: deploy_audit
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy /tmp/rp-sequence-audit-worker.js \
            --name "$WORKER_NAME" \
            --compatibility-date 2026-09-01 \
            --keep-vars > /tmp/rp_audit_deploy.log 2>&1

      - name: Read Neon sequences through Reception connection
        id: query
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "$WORKER_URL$AUDIT_PATH" \
              -o /tmp/neon-reception-sequences.json; then
              if python - <<'PY'
          import json
          p="/tmp/neon-reception-sequences.json"
          d=json.load(open(p,"r",encoding="utf-8"))
          assert d.get("ok") is True, d
          assert isinstance(d.get("rows"), list)
          assert isinstance(d.get("unowned_sequences"), list)
          print("SEQUENCE_AUDIT_OK", d.get("owned_sequence_count"), d.get("problem_count"))
          PY
              then OK=1; break; fi
            fi
            sleep 3
          done
          test "$OK" = "1"
          mv /tmp/neon-reception-sequences.json diagnostics/neon-reception-sequences.json

      - name: Restore production Worker
        id: restore
        if: always() && steps.deploy_audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy cloudflare/WHATSAPP_WORKER_v2_6_15_DIAGNOSTICS_STANDALONE.js \
            --name "$WORKER_NAME" \
            --compatibility-date 2026-09-01 \
            --keep-vars > /tmp/rp_audit_restore.log 2>&1

          for i in $(seq 1 20); do
            BODY="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$WORKER_URL/health?audit_restore=$(date +%s%N)" || true)"
            if BODY="$BODY" node - <<'NODE'
          try {
            const d=JSON.parse(process.env.BODY||'{}');
            if(d.ok===true && d.worker_version==='2.6.15') process.exit(0);
          } catch {}
          process.exit(1);
          NODE
            then
              echo "PRODUCTION_WORKER_RESTORED"
              exit 0
            fi
            sleep 3
          done
          echo "No se pudo confirmar la restauración del Worker" >&2
          exit 50

      - name: Validate sanitized report
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("diagnostics/neon-reception-sequences.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          allowed_top={
            "ok","database","checked_at","owned_sequence_count","problem_count",
            "all_owned_sequences_safe","rows","unowned_sequences"
          }
          assert set(d) <= allowed_top
          allowed_row={
            "table_schema","table_name","column_name","sequence_schema","sequence_name",
            "identity_kind","increment_by","row_count","min_id","max_id","last_value",
            "is_called","next_value","safe","status"
          }
          for r in d["rows"]:
            assert set(r) <= allowed_row
          for r in d["unowned_sequences"]:
            assert set(r) <= {"sequence_schema","sequence_name"}
          raw=p.read_text(encoding="utf-8")
          assert "postgresql://" not in raw.lower()
          assert "password" not in raw.lower()
          assert "patient_name" not in raw.lower()
          print("SANITIZED_REPORT_OK")
          PY

      - name: Commit sanitized sequence audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add diagnostics/neon-reception-sequences.json
          if git diff --cached --quiet; then
            echo "Sequence audit unchanged."
          else
            git commit -m "Audit Neon Reception sequences"
            git push origin HEAD:main
          fi
