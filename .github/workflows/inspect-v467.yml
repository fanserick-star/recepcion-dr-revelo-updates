name: Diagnosticar layout v4.3.67
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-v467.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar Agenda y Configuración
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          parts=sorted((Path('updates/v466')).glob('app.part*'), key=lambda p:int(p.name.split('part')[-1]))
          s=b''.join(p.read_bytes() for p in parts).decode('utf-8')
          t=ast.parse(s)
          vals={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  name=n.targets[0].id
                  if name in {'V458_SETTINGS_JS','V459_SETTINGS_JS','V460_OVERLAY_JS','V460_OVERLAY_CSS'}:
                      try: vals[name]=ast.literal_eval(n.value)
                      except: pass
          for name in ('V459_SETTINGS_JS','V458_SETTINGS_JS','V460_OVERLAY_CSS','V460_OVERLAY_JS'):
              v=vals.get(name,'')
              print('\n==========',name,'==========')
              for term in ['openLinkedAgendaDetail','openUnlinkedAgendaDetail','config-title-row','#config','.config-','v458-','settings','tab','native-appointment-detail','v459-whatsapp-timeline']:
                  pos=v.find(term)
                  if pos>=0:
                      print('\n---',term,'@',pos,'---')
                      print(v[max(0,pos-1800):min(len(v),pos+5000)])
          PY
