name: Verify Reception Canonical Source

on:
  push:
    branches: [main, cleanup/reception-canonical-source]
    paths:
      - "recepcion/app/**"
      - "launcher-v1/app-channel-source.json"
      - "tools/build_reception_app_channel.py"
      - "tools/test_reception_canonical_source.py"
      - "tools/validate_reception_runtime_layout.py"
      - "updates/**"
      - "releases/reception/**"
      - ".github/workflows/publish-reception-app-channel.yml"
      - ".github/workflows/audit-active-reception-channel-bytes.yml"
      - ".github/workflows/verify-reception-canonical-source.yml"
  pull_request:
    branches: [main]
    paths:
      - "recepcion/app/**"
      - "launcher-v1/app-channel-source.json"
      - "tools/**reception**"
      - "updates/**"
      - "releases/reception/**"
      - ".github/workflows/*reception*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical source contract
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python -m py_compile recepcion/app/core_runtime.py recepcion/app/reception_history_cancellation.py recepcion/app/reception_deleted_visit_guard.py recepcion/app/app.py
          PYTHONPATH=recepcion/app python -c "import reception_tv_http, reception_tv_service; print('RECEPTION TV IMPORTS OK')"
          python - <<'PY'
          from pathlib import Path

          bridge = Path('recepcion/app/reception_history_bridge.py').read_text(encoding='utf-8')
          cancellation = Path('recepcion/app/reception_history_cancellation.py').read_text(encoding='utf-8')
          assert 'import reception_history_cancellation as _dep_history_cancellation' in bridge
          assert 'historia_lan_transport.install(historia_bridge)' in cancellation
          assert 'delete_visit_and_cancel_historia_safe' in cancellation
          assert 'delete_visit_and_cancel_historia_direct' in cancellation
          assert 'reconcile_recent_deleted_handoffs' in cancellation
          assert 'core.APP_VERSION =' not in cancellation
          guard = Path('recepcion/app/reception_deleted_visit_guard.py').read_text(encoding='utf-8')
          runtime = Path('recepcion/app/core_runtime.py').read_text(encoding='utf-8')
          app_py = Path('recepcion/app/app.py').read_text(encoding='utf-8')
          assert 'AND cancelled=0' in cancellation
          assert 'active_deleted_visit_ids' in guard
          assert 'emitted_invoice_preserved' in guard
          assert 'Borrado detenido: hay varias atenciones remotas parecidas' in guard
          assert 'refreshed = refresh_local_cache' in runtime
          assert 'if refreshed:' in runtime
          assert 'cloud_visit_id' in runtime and 'patient_cedula' in runtime
          assert "WHERE created_at>=? AND cancelled=0 ORDER BY created_at" in app_py
          assert 'reception_deleted_visit_guard as _deleted_visit_guard' in app_py
          assert '_cloud_cancelled_specs' in guard
          assert "status='cancelled'" in guard
          assert 'reception_patient_id,attention_type,queued_at' in guard
          assert 'historia_cloud_cancel_tombstones' in guard
          assert '_REMOTE_CACHE_SECONDS = 90.0' in guard
          assert '_same_moment_reception_historia' in guard
          assert '5 * 60 * 60' in guard
          assert 'tolerance_minutes=20' in guard
          assert '_reception_turn_for_visit' in Path('recepcion/app/reception_history_bridge.py').read_text(encoding='utf-8')
          assert 'reception_turn=reception_turn' in Path('recepcion/app/reception_history_bridge.py').read_text(encoding='utf-8')
          assert 'repair_today_handoff_turns' in guard
          assert 'billed_visit_clinical_remove' in guard
          assert 'fiscal_preserved' in guard
          assert 'invoice_deleted' in guard
          print('RECEPTION -> HISTORIA DELETE SYNC GUARD OK')
          PY
          PYTHONPATH=recepcion/app python - <<'PY'
          from reception_tv_service import TVTurnService

          def payload(current=None, waiting=None, recent=None):
              return {
                  'host': '127.0.0.1',
                  'current': current,
                  'waiting': waiting or [],
                  'recent': recent or [],
              }

          service = TVTurnService()
          q6 = {'queue_id': 'q6', 'turn': 6, 'status': 'waiting'}
          service.apply_history(payload(waiting=[q6]))
          snap = service.live_snapshot()
          assert snap['mode'] == 'idle'
          assert snap['waiting_count'] == 1
          assert snap['next_waiting_turn'] == 6

          current6 = {'queue_id': 'q6', 'turn': 6, 'status': 'in_consultation'}
          service.apply_history(payload(current=current6))
          snap = service.live_snapshot()
          assert snap['mode'] == 'calling', snap
          assert snap['turn'] == 6

          service.live['calling_started_epoch'] -= 6
          service.apply_history(payload(current=current6))
          snap = service.live_snapshot()
          assert snap['mode'] == 'attending', snap

          q7 = {'queue_id': 'q7', 'turn': 7, 'status': 'waiting'}
          service.apply_history(payload(
              waiting=[q7],
              recent=[{'queue_id': 'q6', 'status': 'completed'}],
          ))
          snap = service.live_snapshot()
          assert snap['mode'] == 'calling', snap
          assert snap['turn'] == 7

          cancelled = TVTurnService()
          cancelled.apply_history(payload(waiting=[q6]))
          cancelled.apply_history(payload(current=current6))
          cancelled.live['calling_started_epoch'] -= 6
          cancelled.apply_history(payload(current=current6))
          cancelled.apply_history(payload(
              waiting=[q7],
              recent=[{'queue_id': 'q6', 'status': 'cancelled'}],
          ))
          snap = cancelled.live_snapshot()
          assert snap['mode'] == 'idle', snap
          assert snap['turn'] is None
          assert snap['next_waiting_turn'] == 7

          service.config['display_mode'] = 'test'
          assert service.display_snapshot()['display_mode'] == 'test'
          service.config['display_mode'] = 'live'
          assert service.display_snapshot()['display_mode'] == 'live'
          print('RECEPTION TV STATE MACHINE OK')
          PY

      - name: Block new versioned Reception folders under updates
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          sha = os.environ.get('GITHUB_SHA', 'HEAD')
          if event == 'pull_request':
              base = os.environ.get('PR_BASE_SHA', '').strip()
          else:
              base = os.environ.get('BEFORE_SHA', '').strip()
          if not base or set(base) == {'0'}:
              print('No comparable base SHA; static canonical checks already passed.')
              raise SystemExit(0)

          result = subprocess.run(
              ['git','diff','--name-status',base,sha,'--','updates/'],
              check=True, text=True, capture_output=True
          ).stdout.splitlines()
          forbidden = []
          for line in result:
              parts = line.split('\t')
              if not parts:
                  continue
              status = parts[0]
              path = parts[-1].replace('\\','/')
              if status.startswith('A') and path != 'updates/README.md':
                  forbidden.append(path)
          assert not forbidden, (
              'No se permiten nuevas versiones de Recepción bajo updates/: ' + ', '.join(forbidden)
          )
          print('No new Reception version folders were added under updates/.')
          PY
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Dry-run canonical channel build
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python tools/build_reception_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$REPOSITORY" \
            --output /tmp/canonical-channel.json
          python - <<'PY'
          import json, pathlib

          generated = json.loads(pathlib.Path('/tmp/canonical-channel.json').read_text(encoding='utf-8'))
          version = str(generated.get('appVersion') or '').strip()
          assert version

          if version == '4.6.7':
              current = json.loads(pathlib.Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
              assert str(current.get('appVersion') or '').strip() == version
              assert current.get('minimumLauncher') == generated.get('minimumLauncher')
              got = {x['path']: x['sha256'] for x in generated.get('files', [])}
              old = {x['path']: x['sha256'] for x in current.get('files', [])}
              assert got == old, 'La fuente canónica 4.6.7 no coincide byte por byte con el canal estable'
              print('Canonical 4.6.7 byte identity OK')
          else:
              print('Canonical dry-run OK for future version', version)
          PY
