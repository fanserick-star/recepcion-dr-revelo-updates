name: Verify Reception Canonical Source

on:
  push:
    branches: [main, cleanup/reception-canonical-source]
    paths:
      - "recepcion/app/**"
      - "launcher-v1/app-channel-source.json"
      - "tools/build_reception_app_channel.py"
      - "tools/test_reception_canonical_source.py"
      - "tools/test_reception_history_identity_search.py"
      - "tools/test_reception_exam_review_turn.py"
      - "tools/test_reception_only_link_authority.py"
      - "tools/test_reception_auto_clinical_chart.py"
      - "tools/test_tv_display_javascript.mjs"
      - "tools/test_reception_history_tv_contract.py"
      - "tools/validate_reception_runtime_layout.py"
      - "updates/**"
      - "releases/reception/**"
      - ".github/workflows/publish-reception-app-channel.yml"
      - ".github/workflows/audit-active-reception-channel-bytes.yml"
      - ".github/workflows/verify-reception-canonical-source.yml"
  pull_request:
    branches: [main]
    paths:
      - "recepcion/app/**"
      - "launcher-v1/app-channel-source.json"
      - "tools/**reception**"
      - "updates/**"
      - "releases/reception/**"
      - ".github/workflows/*reception*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical source contract
        run: |
          python tools/test_reception_canonical_source.py
          python tools/test_reception_reports.py
          python tools/test_reception_neon_efficiency.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python tools/test_reception_history_tv_contract.py
          python tools/test_reception_history_identity_search.py
          python tools/test_reception_exam_review_turn.py
          python tools/test_reception_only_link_authority.py
          python tools/test_reception_auto_clinical_chart.py
          node --check recepcion/app/static/app.js
          node tools/test_tv_display_javascript.mjs
          node tools/test_whatsapp_event_alarms.mjs
          node tools/test_whatsapp_admin_alarm_integration.mjs
          python -m py_compile recepcion/app/core_runtime.py recepcion/app/reception_history_cancellation.py recepcion/app/historia_lan_transport.py recepcion/app/reception_history_bridge.py recepcion/app/reception_billing_history.py recepcion/app/app.py
          PYTHONPATH=recepcion/app python -c "import reception_tv_http, reception_tv_service; print('RECEPTION TV IMPORTS OK')"
          python - <<'PY'
          from pathlib import Path

          bridge = Path('recepcion/app/reception_history_bridge.py').read_text(encoding='utf-8')
          cancellation = Path('recepcion/app/reception_history_cancellation.py').read_text(encoding='utf-8')
          runtime = Path('recepcion/app/core_runtime.py').read_text(encoding='utf-8')
          lan = Path('recepcion/app/historia_lan_transport.py').read_text(encoding='utf-8')
          billing = Path('recepcion/app/reception_billing_history.py').read_text(encoding='utf-8')
          app_py = Path('recepcion/app/app.py').read_text(encoding='utf-8')
          manifest = Path('recepcion/app/update_manifest.json').read_text(encoding='utf-8')

          assert 'estado: Mapped[str]' in runtime
          assert 'cancelled_at: Mapped[Optional[datetime]]' in runtime
          assert 'cancelled_by: Mapped[Optional[str]]' in runtime
          assert '_ensure_visit_state_schema(local_engine)' in runtime
          assert 'cloud_schema_ready_v4_7_0_attention_state_' in runtime
          assert 'with_loader_criteria' in runtime
          assert 'include_cancelled_visits' in runtime
          assert 'q.operation in {"visit.cancel", "visit.delete"}' in runtime
          assert 'v.estado = "CANCELADA"' in runtime
          assert 'db.delete(v)' not in runtime[runtime.index('@app.delete("/api/visits/{visit_id}")'):runtime.index('@app.get("/api/dashboard")')]
          assert '"fiscal_preserved": True' in runtime

          assert 'historia_lan_transport.install(historia_bridge)' in cancellation
          assert 'startup_reconcile' in cancellation
          assert '@app.on_event("startup")' not in cancellation
          assert 'reconcile_recent_deleted_handoffs' not in cancellation
          assert 'restore_recent_live_handoffs' not in cancellation
          assert 'cancel_requires_patient_and_visit' in cancellation

          assert 'if wanted_visit and wanted_patient:' in lan
          assert 'matches = same_visit and same_patient' in lan
          assert 'Idempotente: si el mismo event_id perteneció antes' not in lan
          assert 'Siempre mandamos restore después del handoff' not in lan

          assert '_reception_turn_for_visit' in bridge
          assert 'reception_turn=reception_turn' in bridge
          assert 'Esta atención ya tiene una factura emitida y no se puede borrar' not in billing
          assert "include_cancelled_visits=True" in billing

          assert 'reception_deleted_visit_guard as _deleted_visit_guard' not in app_py
          assert 'active_deleted_visit_ids' not in app_py
          assert 'reception_deleted_visit_guard.py' not in manifest
          print('RECEPTION 4.7 ATTENTION STATE CONTRACT OK')
          PY
          PYTHONPATH=recepcion/app python - <<'PY'
          from reception_tv_service import TVTurnService

          def payload(current=None, waiting=None, recent=None):
              return {
                  'host': '127.0.0.1',
                  'current': current,
                  'waiting': waiting or [],
                  'recent': recent or [],
              }

          service = TVTurnService()
          q6 = {'queue_id': 'q6', 'turn': 6, 'status': 'waiting'}
          service.apply_history(payload(waiting=[q6]))
          snap = service.live_snapshot()
          assert snap['mode'] == 'idle'
          assert snap['waiting_count'] == 1
          assert snap['next_waiting_turn'] == 6

          current6 = {'queue_id': 'q6', 'turn': 6, 'status': 'in_consultation'}
          service.apply_history(payload(current=current6))
          snap = service.live_snapshot()
          assert snap['mode'] == 'calling', snap
          assert snap['turn'] == 6

          service.live['calling_started_epoch'] -= 6
          service.apply_history(payload(current=current6))
          snap = service.live_snapshot()
          assert snap['mode'] == 'attending', snap

          q7 = {'queue_id': 'q7', 'turn': 7, 'status': 'waiting'}
          service.apply_history(payload(
              waiting=[q7],
              recent=[{'queue_id': 'q6', 'status': 'completed'}],
          ))
          snap = service.live_snapshot()
          assert snap['mode'] == 'calling', snap
          assert snap['turn'] == 7

          cancelled = TVTurnService()
          cancelled.apply_history(payload(waiting=[q6]))
          cancelled.apply_history(payload(current=current6))
          cancelled.live['calling_started_epoch'] -= 6
          cancelled.apply_history(payload(current=current6))
          cancelled.apply_history(payload(
              waiting=[q7],
              recent=[{'queue_id': 'q6', 'status': 'cancelled'}],
          ))
          snap = cancelled.live_snapshot()
          assert snap['mode'] == 'idle', snap
          assert snap['turn'] is None
          assert snap['next_waiting_turn'] == 7

          service.config['display_mode'] = 'test'
          assert service.display_snapshot()['display_mode'] == 'test'
          service.config['display_mode'] = 'live'
          assert service.display_snapshot()['display_mode'] == 'live'
          print('RECEPTION TV STATE MACHINE OK')
          PY

      - name: Verify emitted invoice pagination with real SQLite queries
        run: |
          python -m pip install --disable-pip-version-check 'SQLAlchemy>=2.0,<3'
          python tools/test_reception_billing_issued_paging_sql.py

      - name: Block new versioned Reception folders under updates
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          sha = os.environ.get('GITHUB_SHA', 'HEAD')
          if event == 'pull_request':
              base = os.environ.get('PR_BASE_SHA', '').strip()
          else:
              base = os.environ.get('BEFORE_SHA', '').strip()
          if not base or set(base) == {'0'}:
              print('No comparable base SHA; static canonical checks already passed.')
              raise SystemExit(0)

          result = subprocess.run(
              ['git','diff','--name-status',base,sha,'--','updates/'],
              check=True, text=True, capture_output=True
          ).stdout.splitlines()
          forbidden = []
          for line in result:
              parts = line.split('\t')
              if not parts:
                  continue
              status = parts[0]
              path = parts[-1].replace('\\','/')
              if status.startswith('A') and path != 'updates/README.md':
                  forbidden.append(path)
          assert not forbidden, (
              'No se permiten nuevas versiones de Recepción bajo updates/: ' + ', '.join(forbidden)
          )
          print('No new Reception version folders were added under updates/.')
          PY
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Dry-run canonical channel build
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python tools/build_reception_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$REPOSITORY" \
            --output /tmp/canonical-channel.json
          python - <<'PY'
          import json, pathlib

          generated = json.loads(pathlib.Path('/tmp/canonical-channel.json').read_text(encoding='utf-8'))
          version = str(generated.get('appVersion') or '').strip()
          assert version

          if version == '4.6.7':
              current = json.loads(pathlib.Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
              assert str(current.get('appVersion') or '').strip() == version
              assert current.get('minimumLauncher') == generated.get('minimumLauncher')
              got = {x['path']: x['sha256'] for x in generated.get('files', [])}
              old = {x['path']: x['sha256'] for x in current.get('files', [])}
              assert got == old, 'La fuente canónica 4.6.7 no coincide byte por byte con el canal estable'
              print('Canonical 4.6.7 byte identity OK')
          else:
              print('Canonical dry-run OK for future version', version)
          PY
