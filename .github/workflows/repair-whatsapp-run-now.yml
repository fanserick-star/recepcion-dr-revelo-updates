name: Repair WhatsApp scheduler and run now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-whatsapp-run-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: dr-revelo-whatsapp-cloud
      WORKER_URL: https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rotate private scheduler token without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx --yes wrangler@latest secret put ADMIN_TOKEN --name "$WORKER_NAME" >/tmp/secret-put.log 2>&1
          sed -E 's/[A-Fa-f0-9]{32,}/***masked***/g' /tmp/secret-put.log | tail -n 20
          printf '%s' "$TOKEN" > /tmp/admin-token
          chmod 600 /tmp/admin-token

      - name: Run production scheduler immediately after secret propagation
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/admin-token)"
          OK=0
          for i in $(seq 1 12); do
            code="$(curl -sS --max-time 30 \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -o /tmp/run.json \
              -w '%{http_code}' \
              "$WORKER_URL/run" || true)"
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then OK=1; break; fi
            if [ -s /tmp/run.json ]; then head -c 300 /tmp/run.json | tr '\n' ' '; echo; fi
            sleep 5
          done
          test "$OK" = "1"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/run.json','r',encoding='utf-8'))
          print(json.dumps(d, indent=2, ensure_ascii=False, sort_keys=True))
          assert d.get('ok') is True, d
          PY
