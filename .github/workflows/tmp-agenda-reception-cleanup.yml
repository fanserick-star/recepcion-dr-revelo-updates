name: TEMP Consolidate Agenda and Reception

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-agenda-reception-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consolidar Agenda y limpiar runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, json, re

          root=Path('.')
          module_path=root/'recepcion/app/reception_payments_and_agenda.py'
          app_path=root/'recepcion/app/static/app.js'
          style_path=root/'recepcion/app/static/style.css'
          core_path=root/'recepcion/app/core_runtime.py'
          agenda_path=root/'agenda/index.html'
          public_path=root/'agenda/agendar.html'
          version_path=root/'recepcion/app/recepcion-version.json'
          manifest_path=root/'recepcion/app/update_manifest.json'

          module=module_path.read_text(encoding='utf-8')
          tree=ast.parse(module)
          extracted={}
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in {'V4449_AGENDA_FLOW_JS','V4449_AGENDA_FLOW_CSS'}:
                          extracted[target.id]=ast.literal_eval(node.value)
          assert set(extracted)=={'V4449_AGENDA_FLOW_JS','V4449_AGENDA_FLOW_CSS'}, extracted.keys()

          agenda_js=extracted['V4449_AGENDA_FLOW_JS']
          agenda_css=extracted['V4449_AGENDA_FLOW_CSS']
          replacements={
              '__v4449AgendaFlowSpeed':'__agendaCanonicalFlow',
              'v4449SaveExistingAndAttend':'saveExistingAndAttendFromAgenda',
              '__v4449AgendaTest':'__agendaCanonicalTest',
              'v4449-existing-attend':'agenda-existing-attend',
              'v4449-existing-note':'agenda-existing-note',
          }
          for old,new in replacements.items():
              agenda_js=agenda_js.replace(old,new)
              agenda_css=agenda_css.replace(old,new)

          app=app_path.read_text(encoding='utf-8')
          assert '__agendaCanonicalFlow' not in app
          old_time="function fmtTime(v){const m=String(v||'').match(/^(\\d{1,2}):(\\d{2})/);if(!m)return esc(v);let h=Number(m[1]),min=m[2];const ap=h>=12?'p. m.':'a. m.';h=h%12||12;return `${h}:${min} ${ap}`}\nfunction fmtTimeCompact(v){const m=String(v||'').match(/^(\\d{1,2}):(\\d{2})/);if(!m)return esc(v);let h=Number(m[1]),min=m[2];h=h%12||12;return `${h}:${min}`}"
          new_time="function fmtTime(v){const m=String(v||'').match(/^(\\d{1,2}):(\\d{2})/);if(!m)return esc(v);return `${pad(Number(m[1]))}:${m[2]}`}\nfunction fmtTimeCompact(v){const m=String(v||'').match(/^(\\d{1,2}):(\\d{2})/);if(!m)return esc(v);return `${pad(Number(m[1]))}:${m[2]}`}"
          assert old_time in app
          app=app.replace(old_time,new_time,1)
          app += '\n\n// Agenda canónica: flujo consolidado desde el antiguo overlay histórico.\n' + agenda_js.strip() + '\n'
          app_path.write_text(app,encoding='utf-8')

          style=style_path.read_text(encoding='utf-8')
          assert '.agenda-existing-note' not in style
          style += '\n\n/* Agenda canónica: estilo de actualización de paciente existente. */\n' + agenda_css.strip() + '\n'
          style_path.write_text(style,encoding='utf-8')

          start=module.index('    V4449_AGENDA_FLOW_JS = ')
          end=module.index('    _v4450_stable_mirror_patient =',start)
          module=module[:start] + '    # La interfaz de Agenda vive ahora en static/app.js y static/style.css.\n' + module[end:]
          assert 'V4449_AGENDA_FLOW_JS' not in module
          assert 'V4449_AGENDA_FLOW_CSS' not in module
          module_path.write_text(module,encoding='utf-8')

          core=core_path.read_text(encoding='utf-8')
          old_import='''from remote_agenda import (\n    normalize_public_base_url as remote_normalize_base_url,\n    start_quick_tunnel as remote_start_quick_tunnel,\n    start_named_tunnel as remote_start_named_tunnel,\n    start_named_tunnel_background as remote_start_named_tunnel_background,\n    stop_managed_tunnel as remote_stop_tunnel,\n    tunnel_status as remote_tunnel_status,\n)'''
          assert old_import in core
          core=core.replace(old_import,'from remote_agenda import stop_managed_tunnel as remote_stop_tunnel',1)

          old_remote='''# Agenda remota por HTTPS. El token del túnel se lee únicamente del .env local.\nREMOTE_AGENDA_BASE_URL = (os.getenv("REMOTE_AGENDA_BASE_URL") or "").strip().rstrip("/")\nREMOTE_AGENDA_TUNNEL_TOKEN = (os.getenv("REMOTE_AGENDA_TUNNEL_TOKEN") or "").strip()\nREMOTE_AGENDA_AUTOSTART = (os.getenv("REMOTE_AGENDA_AUTOSTART") or "1").strip() != "0"\n'''
          assert old_remote in core
          core=core.replace(old_remote,'',1)

          remote_start=core.index('\ndef _mobile_remote_payload(')
          remote_end=core.index('\n@app.post("/api/mobile/links/rotate")',remote_start)
          core=core[:remote_start]+'\n'+core[remote_end:]

          cleanup_start=core.index('\nWA_TEST_CLEANUP_PHONE_V4424 =')
          first_route=core.index('\n@app.',cleanup_start+1)
          cleanup_end=core.index('\n@app.',first_route+1)
          core=core[:cleanup_start]+'\n'+core[cleanup_end:]

          stale='''# Activación por plantilla: solo recordatorio_cita está aprobado hoy. Aunque\n# WHATSAPP_ENABLED llegue a 1, las otras dos no se intentan hasta aprobarlas.'''
          fresh='''# Activación local por plantilla. En la arquitectura actual Cloudflare es la autoridad\n# de envío 24/7; estas banderas solo gobiernan el fallback local si Cloud se desactiva.'''
          assert stale in core
          core=core.replace(stale,fresh,1)

          assert '/api/whatsapp-responses/cleanup-old-tests' not in core
          assert '/api/mobile/remote/' not in core
          assert 'REMOTE_AGENDA_TUNNEL_TOKEN' not in core
          assert 'remote_start_quick_tunnel' not in core
          assert 'remote_start_named_tunnel' not in core
          assert 'remote_tunnel_status' not in core
          assert 'remote_stop_tunnel(DATA_DIR)' in core
          core_path.write_text(core,encoding='utf-8')

          agenda=agenda_path.read_text(encoding='utf-8')
          header='<div class="top-actions"><button class="mode-switch" id="modeSwitch" type="button"></button><button class="icon" id="refresh" aria-label="Actualizar">↻</button></div>'
          new_header='<div class="top-actions"><button class="mode-switch" id="modeSwitch" type="button"></button><button class="mode-switch show" id="forgetDevice" type="button" title="Borrar acceso y copia local de este dispositivo">SALIR</button><button class="icon" id="refresh" aria-label="Actualizar">↻</button></div>'
          assert agenda.count(header)==1
          agenda=agenda.replace(header,new_header,1)

          old_tp="function tp(s){const [h,m]=s.split(':').map(Number);return {t:`${h%12||12}:${pad(m)}`,p:h>=12?'PM':'AM'}}"
          new_tp="function tp(s){const [h,m]=s.split(':').map(Number);return {t:`${pad(h)}:${pad(m)}`,p:''}}"
          assert agenda.count(old_tp)==1
          agenda=agenda.replace(old_tp,new_tp,1)
          agenda=agenda.replace("<b>12:30</b><small>PM</small>","<b>12:30</b><small></small>",1)
          agenda=agenda.replace("ALMUERZO · 12:30 PM – 2:00 PM","ALMUERZO · 12:30 – 14:00",1)

          role_fn="function rememberRoleKey(){if(state.role==='doctor')localStorage.setItem('revelo_agenda_doctor_key',state.key);if(state.role==='reception')localStorage.setItem('revelo_agenda_reception_key',state.key)}"
          assert agenda.count(role_fn)==1
          cache_code=r'''function rememberRoleKey(){if(state.role==='doctor')localStorage.setItem('revelo_agenda_doctor_key',state.key);if(state.role==='reception')localStorage.setItem('revelo_agenda_reception_key',state.key)}
const AGENDA_CACHE_TTL_MS=24*60*60*1000;
function purgeAgendaCaches(){for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(!k||!k.startsWith('revelo_cloud_'))continue;try{const d=JSON.parse(localStorage.getItem(k)||'null');if(!d||!Array.isArray(d.rows)||Date.now()-Number(d.saved_at||0)>AGENDA_CACHE_TTL_MS)localStorage.removeItem(k)}catch{localStorage.removeItem(k)}}}
function saveWeekCache(key,rows){try{localStorage.setItem(key,JSON.stringify({saved_at:Date.now(),rows}))}catch{}}
function loadWeekCache(key){try{const d=JSON.parse(localStorage.getItem(key)||'null');if(!d||!Array.isArray(d.rows)||Date.now()-Number(d.saved_at||0)>AGENDA_CACHE_TTL_MS){localStorage.removeItem(key);return null}return d.rows}catch{localStorage.removeItem(key);return null}}
function forgetDevice(){if(!confirm('¿Borrar de este dispositivo los accesos guardados y la copia local de la agenda?'))return;['revelo_agenda_cloud_key','revelo_agenda_doctor_key','revelo_agenda_reception_key'].forEach(k=>localStorage.removeItem(k));for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k?.startsWith('revelo_cloud_'))localStorage.removeItem(k)}history.replaceState({},'',location.pathname+location.search);state.key='';state.role='';state.rows=[];state.jwt='';state.exp=0;location.reload()}
purgeAgendaCaches();'''
          agenda=agenda.replace(role_fn,cache_code,1)

          old_save="localStorage.setItem(`revelo_cloud_${iso(state.mon)}`,JSON.stringify(state.rows));"
          assert agenda.count(old_save)==1
          agenda=agenda.replace(old_save,"saveWeekCache(`revelo_cloud_${iso(state.mon)}`,state.rows);",1)
          old_fallback="const c=localStorage.getItem(`revelo_cloud_${iso(state.mon)}`);if(c){state.rows=JSON.parse(c);render();online('Sin conexión · mostrando copia guardada',false)}else fatal(e.message)"
          new_fallback="const c=loadWeekCache(`revelo_cloud_${iso(state.mon)}`);if(c){state.rows=c;render();online('Sin conexión · mostrando copia guardada reciente',false)}else fatal(e.message)"
          assert agenda.count(old_fallback)==1
          agenda=agenda.replace(old_fallback,new_fallback,1)
          old_handlers="$('#modeSwitch').onclick=switchMode;boot();"
          assert agenda.count(old_handlers)==1
          agenda=agenda.replace(old_handlers,"$('#modeSwitch').onclick=switchMode;$('#forgetDevice').onclick=forgetDevice;boot();",1)
          agenda_path.write_text(agenda,encoding='utf-8')

          public=public_path.read_text(encoding='utf-8')
          old_fmt="const fmtTime=v=>{const [hh,mm]=String(v).split(':').map(Number);return `${hh%12||12}:${pad(mm)} ${hh>=12?'p. m.':'a. m.'}`};"
          new_fmt="const fmtTime=v=>{const [hh,mm]=String(v).split(':').map(Number);return `${pad(hh)}:${pad(mm)}`};"
          assert public.count(old_fmt)==1
          public=public.replace(old_fmt,new_fmt,1)
          public_path.write_text(public,encoding='utf-8')

          version={'version':'4.6.26'}
          version_path.write_text(json.dumps(version,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version']=manifest['app_version']=manifest['runtime_version']='4.6.26'
          notes=manifest.setdefault('notes',{})
          notes.update({
            'purpose':'Consolida Agenda y WhatsApp: UI de Agenda pasa a fuente canónica, elimina controles de túnel legado y residuos de pruebas, y unifica horario 24 h.',
            'previous_version':'4.6.25',
            'candidate_only':False,
            'agenda_ui_canonical':True,
            'agenda_historical_overlay_removed':True,
            'agenda_24h_format':True,
            'agenda_cloud_conflict_logic_preserved':True,
            'agenda_offline_cache_logic_preserved':True,
            'legacy_remote_tunnel_start_controls_removed':True,
            'legacy_remote_tunnel_startup_cleanup_preserved':True,
            'whatsapp_old_test_cleanup_endpoint_removed':True,
            'whatsapp_cloud_mode_preserved':True,
            'whatsapp_logic_changes':False,
            'billing_logic_changes':False,
            'database_schema_changes':False,
            'patient_data_changes':False,
            'production_status':'stable',
            'rollback_safe':True,
          })
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AGENDA_RECEPTION_CONSOLIDATION_PATCHED')
          PY

      - name: Validar sintaxis y contratos
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile recepcion/app/core_runtime.py recepcion/app/reception_payments_and_agenda.py recepcion/app/features_runtime.py
          node --check recepcion/app/static/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          for src,out in [('agenda/index.html','/tmp/agenda.js'),('agenda/agendar.html','/tmp/agendar.js')]:
              s=Path(src).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
              assert scripts, src
              Path(out).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/agenda.js
          node --check /tmp/agendar.js
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py
          python - <<'PY'
          from pathlib import Path
          app=Path('recepcion/app/static/app.js').read_text(encoding='utf-8')
          mod=Path('recepcion/app/reception_payments_and_agenda.py').read_text(encoding='utf-8')
          core=Path('recepcion/app/core_runtime.py').read_text(encoding='utf-8')
          agenda=Path('agenda/index.html').read_text(encoding='utf-8')
          public=Path('agenda/agendar.html').read_text(encoding='utf-8')
          assert '__agendaCanonicalFlow' in app
          assert 'V4449_AGENDA_FLOW_JS' not in mod
          assert '/api/whatsapp-responses/cleanup-old-tests' not in core
          assert '/api/mobile/remote/' not in core
          assert 'remote_stop_tunnel(DATA_DIR)' in core
          assert 'AGENDA_CACHE_TTL_MS=24*60*60*1000' in agenda
          assert 'id="forgetDevice"' in agenda
          assert 'ALMUERZO · 12:30 – 14:00' in agenda
          assert "p. m." not in public and "a. m." not in public
          assert '4.6.26' in Path('recepcion/app/recepcion-version.json').read_text()
          print('AGENDA_RECEPTION_CONSOLIDATION_OK')
          PY

      - name: Guardar consolidación
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda/index.html agenda/agendar.html recepcion/app/core_runtime.py recepcion/app/reception_payments_and_agenda.py recepcion/app/static/app.js recepcion/app/static/style.css recepcion/app/recepcion-version.json recepcion/app/update_manifest.json
          git diff --cached --check
          git commit -m 'refactor: consolidate Agenda runtime and privacy'
          git pull --rebase origin main
          git push origin HEAD:main
