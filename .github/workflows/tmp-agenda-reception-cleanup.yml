name: TEMP Consolidate Agenda and Reception

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-agenda-reception-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Consolidar Agenda y limpiar runtime
        run: python tools/tmp_agenda_cleanup.py

      - name: Validar sintaxis y contratos
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile recepcion/app/core_runtime.py recepcion/app/reception_payments_and_agenda.py recepcion/app/features_runtime.py
          node --check recepcion/app/static/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          for src,out in [('agenda/index.html','/tmp/agenda.js'),('agenda/agendar.html','/tmp/agendar.js')]:
              s=Path(src).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
              assert scripts, src
              Path(out).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/agenda.js
          node --check /tmp/agendar.js
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python - <<'PY'
          from pathlib import Path
          app=Path('recepcion/app/static/app.js').read_text(encoding='utf-8')
          mod=Path('recepcion/app/reception_payments_and_agenda.py').read_text(encoding='utf-8')
          core=Path('recepcion/app/core_runtime.py').read_text(encoding='utf-8')
          agenda=Path('agenda/index.html').read_text(encoding='utf-8')
          public=Path('agenda/agendar.html').read_text(encoding='utf-8')
          assert '__agendaCanonicalFlow' in app
          assert 'V4449_AGENDA_FLOW_JS' not in mod
          assert '/api/whatsapp-responses/cleanup-old-tests' not in core
          assert '/api/mobile/remote/' not in core
          assert 'remote_stop_tunnel(DATA_DIR)' in core
          assert 'AGENDA_CACHE_TTL_MS=24*60*60*1000' in agenda
          assert 'id="forgetDevice"' in agenda
          assert 'ALMUERZO · 12:30 – 14:00' in agenda
          assert "p. m." not in public and "a. m." not in public
          assert '4.6.26' in Path('recepcion/app/recepcion-version.json').read_text(encoding='utf-8')
          print('AGENDA_RECEPTION_CONSOLIDATION_OK')
          PY

      - name: Guardar consolidación
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agenda/index.html agenda/agendar.html recepcion/app/core_runtime.py recepcion/app/reception_payments_and_agenda.py recepcion/app/static/app.js recepcion/app/static/style.css recepcion/app/recepcion-version.json recepcion/app/update_manifest.json
          git diff --cached --check
          git commit -m 'refactor: consolidate Agenda runtime and privacy'
          git pull --rebase origin main
          git push origin HEAD:main
