name: Validate unified consultorio installer

on:
  push:
    branches:
      - installer-maestro-v1
    paths:
      - "unified_installer/**"
      - ".github/workflows/validate-unified-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell builder
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'unified_installer\build_private_master.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "PowerShell builder contains syntax errors"
          }
          Write-Host "POWERSHELL_PARSE_OK"

      - name: Create safe dummy payload
        shell: powershell
        run: |
          $p='unified_installer\payload'
          New-Item -ItemType Directory -Force "$p\recepcion\.venv\Scripts","$p\recepcion\static","$p\historia\.venv\Scripts","$p\historia\static" | Out-Null
          'print("recepcion")' | Set-Content "$p\recepcion\ABRIR_RECEPCION.py" -Encoding utf8
          'print("historia")' | Set-Content "$p\historia\ABRIR_HISTORIA_CLINICA.py" -Encoding utf8
          [IO.File]::WriteAllBytes("$p\recepcion\.venv\Scripts\pythonw.exe",[byte[]](77,90,0,0))
          [IO.File]::WriteAllBytes("$p\historia\.venv\Scripts\pythonw.exe",[byte[]](77,90,0,0))
          [IO.File]::WriteAllBytes("$p\MicrosoftEdgeWebView2Setup.exe",[byte[]](77,90,0,0))
          'DATABASE_URL=postgresql://dummy:dummy@localhost/dummy' | Set-Content "$p\recepcion_config.env" -Encoding utf8
          @('HISTORIA_DATABASE_URL=postgresql://dummy:dummy@localhost/dummy','HISTORIA_SYNC_ENABLED=1') | Set-Content "$p\historia_config.env" -Encoding utf8
          'dummy' | Set-Content "$p\recepcion\static\doctor_icon.ico" -Encoding ascii
          'dummy' | Set-Content "$p\historia\static\doctor_icon.ico" -Encoding ascii

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Compile master installer definition
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'unified_installer\ConsultorioDrRevelo.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe='unified_installer\output\INSTALAR_CONSULTORIO_DR_REVELO_MAESTRO.exe'
          if (-not (Test-Path $exe)) { throw "Expected EXE was not produced" }
          Write-Host "INNO_COMPILE_OK"


  full-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare fake stable Reception
        shell: powershell
        run: |
          $r = Join-Path $env:RUNNER_TEMP 'Recepcion Dr Revelo Test'
          New-Item -ItemType Directory -Force "$r\.venv\Scripts","$r\static","$r\data" | Out-Null
          'print("dummy reception")' | Set-Content "$r\ABRIR_RECEPCION.py" -Encoding utf8
          'print("dummy app")' | Set-Content "$r\app.py" -Encoding utf8
          [IO.File]::WriteAllBytes("$r\.venv\Scripts\pythonw.exe",[byte[]](77,90,0,0))
          'dummy icon' | Set-Content "$r\static\doctor_icon.ico" -Encoding ascii
          @(
            'DATABASE_URL=postgresql://dummy:dummy@127.0.0.1:5432/dummy?sslmode=require',
            'RP_DATA_DIR=data',
            'AZUR_BASE_URL=https://example.invalid',
            'AZUR_API_KEY=TEST_ONLY',
            'WHATSAPP_CLOUD_MODE=1',
            'WHATSAPP_ENABLED=0'
          ) | Set-Content "$r\.env" -Encoding utf8
          '{"version":"4.5.23"}' | Set-Content "$r\update_manifest.json" -Encoding utf8
          "RECEPTION_ROOT=$r" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MASTER_OUT=$env:RUNNER_TEMP\master-output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run real private master builder end to end
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:MASTER_OUT | Out-Null
          & .\unified_installer\build_private_master.ps1 -ReceptionRoot $env:RECEPTION_ROOT -OutputDir $env:MASTER_OUT
          if ($LASTEXITCODE -ne 0) { throw "Builder returned $LASTEXITCODE" }
          $exe = Join-Path $env:MASTER_OUT 'INSTALAR_CONSULTORIO_DR_REVELO_MAESTRO.exe'
          $sha = Join-Path $env:MASTER_OUT 'INSTALAR_CONSULTORIO_DR_REVELO_MAESTRO_SHA256.txt'
          if (-not (Test-Path $exe)) { throw 'Master EXE was not produced' }
          if (-not (Test-Path $sha)) { throw 'SHA256 file was not produced' }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Master EXE is unexpectedly small' }
          Write-Host "FULL_MASTER_BUILD_OK size=$((Get-Item $exe).Length)"

      - name: Verify output privacy
        shell: powershell
        run: |
          $bad = @(Get-ChildItem $env:MASTER_OUT -Recurse -Include *.db,*.sqlite,*.sqlite3 -ErrorAction SilentlyContinue)
          if ($bad.Count -gt 0) { throw 'Clinical database found in output' }
          Write-Host 'PRIVACY_OUTPUT_OK'
