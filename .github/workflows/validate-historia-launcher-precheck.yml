name: Validate Historia Launcher Precheck

on:
  workflow_dispatch:
  push:
    paths:
      - "historia-clinica/launcher-v1/HistoriaLauncher/**"
      - "historia-clinica/updates/v1_3_5_launcher_v1_migration/**"
      - ".github/workflows/validate-historia-launcher-precheck.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Historia runtime deps
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r "historia-clinica/updates/v1_1_10_full_webview/requirements.txt"

      - name: Reproduce isolated precheck
        shell: pwsh
        run: |
          $trial = Join-Path $env:RUNNER_TEMP "historia_trial"
          New-Item -ItemType Directory -Force $trial | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $trial "data") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $trial "static") | Out-Null

          $parts = @(
            "historia-clinica/updates/v1_3_5_launcher_v1_migration/app.py.part01",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part02",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part03",
            "historia-clinica/updates/v1_3_1_new_patient_turn/app.py.part04",
            "historia-clinica/updates/v1_3_5_launcher_v1_migration/app.py.part05"
          )
          $dest = Join-Path $trial "app.py"
          $out = [IO.File]::Open($dest,[IO.FileMode]::Create)
          try {
            foreach($part in $parts) {
              $bytes = [IO.File]::ReadAllBytes((Resolve-Path $part))
              $out.Write($bytes,0,$bytes.Length)
            }
          } finally {
            $out.Dispose()
          }

          $cloudParts = @(
            "historia-clinica/updates/v1_1_3_live_sync/cloud_sync.py.part01",
            "historia-clinica/updates/v1_1_3_live_sync/cloud_sync.py.part02"
          )
          $cloudDest = Join-Path $trial "cloud_sync.py"
          $cloud = [IO.File]::Open($cloudDest,[IO.FileMode]::Create)
          try {
            foreach($part in $cloudParts) {
              $bytes = [IO.File]::ReadAllBytes((Resolve-Path $part))
              $cloud.Write($bytes,0,$bytes.Length)
            }
          } finally {
            $cloud.Dispose()
          }

          Copy-Item "historia-clinica/updates/v1_3_2_new_patient_confirm/cloud_presence_patch.py" "$trial/cloud_presence_patch.py"
          Copy-Item "historia-clinica/updates/v1_3_2_new_patient_confirm/lan_bridge.py" "$trial/lan_bridge.py"
          Copy-Item "historia-clinica/updates/v1_3_1_new_patient_turn/style.css" "$trial/static/style.css"
          Copy-Item "historia-clinica/updates/v1_1_10_full_webview/requirements.txt" "$trial/requirements.txt"
          Copy-Item "historia-clinica/updates/v1_3_5_launcher_v1_migration/historia-version.json" "$trial/historia-version.json"
          Copy-Item "historia-clinica/updates/v1_3_5_launcher_v1_migration/update_manifest.json" "$trial/update_manifest.json"

          @'
          import os, sys, pathlib, traceback
          trial = pathlib.Path(os.environ["HC_TRIAL"])
          os.chdir(trial)
          sys.path.insert(0, str(trial))
          print("TRIAL_APP=", (trial / "app.py").is_file())
          for name in ("cloud_sync.py","cloud_presence_patch.py","lan_bridge.py"):
              print(name, (trial / name).is_file())
          try:
              import app
              print("APP_VERSION=", getattr(app, "APP_VERSION", ""))
              assert getattr(app, "APP_VERSION", "") == "1.3.5"
          except Exception:
              traceback.print_exc()
              raise
          '@ | Set-Content "$trial/precheck.py" -Encoding utf8

          $env:HC_TRIAL = $trial
          $env:HC_PREFLIGHT = "1"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:HISTORIA_DATABASE_URL = ""
          $env:DATABASE_URL = ""
          python "$trial/precheck.py"
