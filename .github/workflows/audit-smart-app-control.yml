name: Auditar compatibilidad Smart App Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-smart-app-control.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Probar runtime puro compatible con Smart App Control
        shell: powershell
        run: |
          $pure = Join-Path $env:RUNNER_TEMP 'sac-pure-runtime'
          New-Item -ItemType Directory -Force $pure | Out-Null

          python -m pip install --disable-pip-version-check --no-compile --target $pure `
            'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' `
            'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20'
          if($LASTEXITCODE -ne 0){ throw 'No se pudo preparar runtime puro' }

          # Pydantic 1 trae los módulos .py además de aceleradores C. Quitamos los .pyd.
          Get-ChildItem (Join-Path $pure 'pydantic') -Recurse -Filter '*.pyd' -ErrorAction SilentlyContinue | Remove-Item -Force
          # SQLAlchemy funciona en modo síncrono sin sus aceleradores C ni greenlet.
          Get-ChildItem (Join-Path $pure 'sqlalchemy\cyextension') -Recurse -Filter '*.pyd' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $pure -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'greenlet' -or $_.Name -like 'greenlet-*.dist-info' } | Remove-Item -Recurse -Force

          $native = @(Get-ChildItem $pure -Recurse -File | Where-Object { $_.Extension -in @('.pyd','.dll') })
          foreach($f in $native){
            $sig = Get-AuthenticodeSignature $f.FullName
            $rel = $f.FullName.Substring($pure.Length).TrimStart('\')
            $subject = if($sig.SignerCertificate){ $sig.SignerCertificate.Subject } else { '[sin firma]' }
            Write-Host ("NATIVE|PURE|{0}|{1}|{2}" -f $rel,$sig.Status,$subject)
          }
          if($native.Count -ne 0){ throw "El runtime puro todavía contiene $($native.Count) binario(s) nativo(s) de terceros" }

          $env:PYTHONPATH=$pure
          $env:DISABLE_SQLALCHEMY_CEXT_RUNTIME='1'
          python -S -c "import pydantic,fastapi,sqlalchemy,pg8000; from sqlalchemy import create_engine,text; e=create_engine('sqlite:///:memory:'); print(e.connect().execute(text('select 1')).scalar()); p=create_engine('postgresql+pg8000://user:pass@127.0.0.1:5432/db', connect_args={'timeout':1}); print('PURE_RUNTIME_OK', pydantic.VERSION, fastapi.__version__, sqlalchemy.__version__, pg8000.__version__, p.dialect.name, p.dialect.driver)"
          if($LASTEXITCODE -ne 0){ throw 'El runtime puro no importa o SQLAlchemy no carga pg8000' }
