name: Validar y publicar v4.3.88
on:
  push:
    branches: [main]
    paths:
      - 'build/v488/**'
      - '.github/workflows/build-v488-validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir paquete candidato
        run: python build/v488/build_v488.py
      - name: Validar Python, JS, históricos 75 e iconos Inicio
        run: |
          cat updates/v488/app.part* > _ci_app.py
          cat updates/v488/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
          python _ci_launcher.py --self-test-core
          python - <<'PY'
          import ast,json,hashlib,re
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src);js=css=None
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  names=[t.id for t in node.targets if isinstance(t,ast.Name)]
                  if 'V488_REVIEW_JS' in names: js=ast.literal_eval(node.value)
                  if 'V488_HOME_CSS' in names: css=ast.literal_eval(node.value)
          assert js and css
          assert 'historical_matches=_historical_review_matches' in src
          assert 'link_historical_to_patient' in src
          assert 'historical_linked' in src
          assert 'score < 0.75' in src
          hm=re.search(r'function homeActionIcon\(kind\).*?function remasterHomeTable',src,re.S)
          assert hm
          for token in ['v488-home-action-svg','Ver recibo','Reimprimir','Borrar','receipt','print','trash']:
              assert token in hm.group(0) or token in css,token
          assert 'Las coincidencias de 75% o más' in js
          for token in ['V487_ICON_JS','v487-azur-loading','Revisando AZUR','V486_FIX_JS','v486OpenAzur','V485_FIX_JS','Emitir por lotes']:
              assert token in src,token
          assert 'APP_VERSION = "4.3.88"' in src
          assert 'MutationObserver' not in js
          Path('_ci_v488.js').write_text(js,encoding='utf-8')
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.88'
          ai=next(x for x in latest['files'] if x['path']=='app.py')
          li=next(x for x in latest['files'] if x['path']=='ABRIR_RECEPCION.py')
          assert hashlib.sha256(Path('_ci_app.py').read_bytes()).hexdigest()==ai['sha256']
          assert hashlib.sha256(Path('_ci_launcher.py').read_bytes()).hexdigest()==li['sha256']
          print('VALIDACION V4.3.88 OK')
          PY
          node --check _ci_v488.js
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v488 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.88 historicos 75 e iconos Inicio'
          git pull --rebase origin main
          git push
