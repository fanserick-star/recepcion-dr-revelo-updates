name: Debug v449 delta
on:
  push:
    paths:
      - '.github/workflows/debug-v449-delta.yml'
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dump v449 app delta
        run: |
          python - <<'PY'
          import importlib.util, json
          p='updates/v449/bootstrap_app.py'
          spec=importlib.util.spec_from_file_location('v449',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          print(json.dumps(m.edits(m.APP_DELTA), ensure_ascii=False, indent=2))
          PY
