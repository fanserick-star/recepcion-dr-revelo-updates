name: Finalizar agenda miércoles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wednesday-schedule.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wednesday-schedule-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alinear descanso 12:30-14:00 en WhatsApp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/whatsapp_worker.js')
          s=p.read_text(encoding='utf-8')
          old='if (m2 >= 750 && m2 < 840) continue;'
          new='if (m2 < 840 && m2 + 20 > 750) continue;'
          if s.count(old) != 1:
              raise SystemExit(f'Esperaba una regla antigua de almuerzo; encontré {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          cp cloudflare/whatsapp_worker.js /tmp/whatsapp_worker.mjs
          node --check /tmp/whatsapp_worker.mjs
          grep -q 'if (m2 < 840 && m2 + 20 > 750) continue;' cloudflare/whatsapp_worker.js

      - name: Publicar corrección canónica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/whatsapp_worker.js
          git commit -m 'WhatsApp: respetar descanso 12:30-14:00'
          git push origin HEAD:main
