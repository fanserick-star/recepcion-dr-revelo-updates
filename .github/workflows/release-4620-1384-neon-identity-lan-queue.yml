name: Release Reception 4.6.20 and Historia 1.3.84

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-4620-1384-neon-identity-lan-queue.yml"

permissions:
  contents: write

concurrency:
  group: release-4620-1384-neon-identity-lan-queue
  cancel-in-progress: false

jobs:
  patch-validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused architecture patch
        run: python tools/patch_4620_1384_neon_identity_lan_queue.py

      - name: Validate canonical runtimes
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python tools/test_historia_canonical_source.py
          python tools/validate_historia_runtime.py historia-clinica/app
          python -m py_compile \
            recepcion/app/reception_history_identity_consolidated.py \
            recepcion/app/historia_lan_transport.py \
            historia-clinica/app/lan_bridge.py
          git diff --check

      - name: Validate exact transport split
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          ident = Path('recepcion/app/reception_history_identity_consolidated.py').read_text(encoding='utf-8-sig')
          lan = Path('recepcion/app/historia_lan_transport.py').read_text(encoding='utf-8-sig')
          hlan = Path('historia-clinica/app/lan_bridge.py').read_text(encoding='utf-8-sig')

          assert 'import historia_lan_transport as historia_lan' not in ident
          assert 'historia_lan.identity_' not in ident
          assert "typeof currentDetectedStatus==='function'&&norm(currentDetectedStatus())==='S'" in ident
          assert 'UPDATE public.waiting_queue' not in ast.get_source_segment(ident, next(n for n in ast.parse(ident).body if isinstance(n, ast.FunctionDef) and n.name == '_upsert_link'))

          ltree = ast.parse(lan)
          funcs = {n.name: n for n in ltree.body if isinstance(n, ast.FunctionDef)}
          for old in ('_identity_request','identity_status','identity_prepare','identity_search','identity_link'):
              assert old not in funcs, old
          queue_src = ast.get_source_segment(lan, funcs['hybrid_queue_attention']) or ''
          assert '_ORIGINAL_QUEUE' not in queue_src
          assert '_lan_outbox_put' in queue_src
          assert 'send_lan(payload)' in queue_src
          assert '_cloud_link_id' in queue_src
          assert 'waiting_queue_transport": "lan_only"' in (ast.get_source_segment(lan, funcs['hybrid_bridge_status']) or '')

          for path in ('/identity/status','/identity/prepare','/identity/search','/identity/link'):
              assert path not in hlan, path
          assert 'payload.get("clinical_patient_id")' in hlan
          assert '/handoff' in hlan and '/cancel' in hlan and '/restore' in hlan

          rv = json.loads(Path('recepcion/app/recepcion-version.json').read_text(encoding='utf-8-sig'))['version']
          hv = json.loads(Path('historia-clinica/app/historia-version.json').read_text(encoding='utf-8-sig'))['version']
          assert rv == '4.6.20', rv
          assert hv == '1.3.84', hv
          print('ARCHITECTURE_OK: Neon identity only; LAN waiting queue only')
          PY

      - name: Validate Reception identity JavaScript
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('recepcion/app/reception_history_identity_consolidated.py').read_text(encoding='utf-8-sig')
          tree = ast.parse(src)
          js = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'V4613_JS' for t in node.targets):
                  js = ast.literal_eval(node.value)
                  break
          assert js
          Path('/tmp/identity.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/identity.js

      - name: Commit canonical release sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            recepcion/app/reception_history_identity_consolidated.py \
            recepcion/app/historia_lan_transport.py \
            recepcion/app/recepcion-version.json \
            recepcion/app/update_manifest.json \
            historia-clinica/app/lan_bridge.py \
            historia-clinica/app/historia-version.json \
            historia-clinica/app/update_manifest.json
          git rm tools/patch_4620_1384_neon_identity_lan_queue.py
          git rm .github/workflows/release-4620-1384-neon-identity-lan-queue.yml
          git commit -m "Neon identity and LAN-only waiting queue"
          git push origin HEAD:main
