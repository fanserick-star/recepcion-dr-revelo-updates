name: Publish Validated Reception App Channel

on:
  push:
    branches: [main]
    paths:
      - "recepcion/app/recepcion-version.json"
      - "launcher-v1/app-channel-source.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce canonical Reception source
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          python tools/test_reception_reports.py
          python tools/test_reception_neon_efficiency.py
          python tools/test_reception_history_tv_contract.py
          python tools/test_reception_history_identity_search.py
          python tools/test_reception_exam_review_turn.py
          python tools/test_reception_only_link_authority.py
          python tools/test_reception_auto_clinical_chart.py
          node --check recepcion/app/static/app.js
          node tools/test_tv_display_javascript.mjs

      - name: Validate real issued-invoice pagination before publication
        run: |
          python -m pip install --disable-pip-version-check 'SQLAlchemy>=2.0,<3'
          python tools/test_reception_billing_issued_paging_sql.py

      - name: Generate channel from exact canonical Git blobs
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python tools/build_reception_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$REPOSITORY"

      - name: Re-download generated channel and verify exact Raw bytes
        env:
          VERIFY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, urllib.request

          channel = json.loads(pathlib.Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          out = pathlib.Path('channel_verify')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          nonce = os.environ.get('VERIFY_NONCE', 'verify')

          for item in channel['files']:
              rel = str(item['path']).replace('\\', '/')
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              url = item['url'] + ('&' if '?' in item['url'] else '?') + 'verify=' + nonce
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
              got = hashlib.sha256(payload).hexdigest()
              assert got == item['sha256'], (rel, got, item['sha256'])
              dest.write_bytes(payload)
              print('RAW OK', rel, got)
          PY
          python tools/validate_reception_runtime_layout.py channel_verify

      - name: Publish only after all validation passed
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- launcher-v1/app-channel.json; then
            echo "Channel already matches generated output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-v1/app-channel.json
          git commit -m "Publish validated Reception app channel"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Could not publish Reception channel after retries." >&2
          exit 1
