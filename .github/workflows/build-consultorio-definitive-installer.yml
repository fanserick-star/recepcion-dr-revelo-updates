name: Build Definitive Consultorio Installer

on:
  push:
    branches: [build/definitive-private-installer]
    paths:
      - "master-installer/definitive/**"
      - ".github/workflows/build-consultorio-definitive-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse bootstrap PowerShell
        shell: pwsh
        run: |
          $text = Get-Content "master-installer/definitive/bootstrap.ps1" -Raw
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "bootstrap.ps1 contiene errores de sintaxis."
          }
          Write-Host "BOOTSTRAP_PARSE_OK"

      - name: Stage canonical runtimes
        shell: pwsh
        run: |
          $build = "master-installer/definitive/build"
          New-Item -ItemType Directory -Force "$build/payload/recepcion", "$build/payload/historia", "$build/wheelhouse" | Out-Null
          Copy-Item "recepcion/app/*" "$build/payload/recepcion" -Recurse -Force
          Copy-Item "historia-clinica/app/*" "$build/payload/historia" -Recurse -Force
          Copy-Item "historia-clinica/app/requirements.txt" "$build/requirements-historia.txt" -Force

          if (Test-Path "$build/payload/recepcion/data") { throw "El payload de Recepción no puede contener data/." }
          if (Test-Path "$build/payload/historia/data") { throw "El payload de Historia no puede contener data/." }
          if (Test-Path "$build/payload/recepcion/.env") { throw "El payload de Recepción no puede contener .env." }
          if (Test-Path "$build/payload/historia/.env") { throw "El payload de Historia no puede contener .env." }

      - name: Download and verify Python 3.11 runtime installer
        shell: pwsh
        run: |
          $dst = "master-installer/definitive/build/python-3.11.9-amd64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe" -OutFile $dst
          $sig = Get-AuthenticodeSignature $dst
          if ($sig.Status -ne 'Valid') { throw "Firma Authenticode de Python inválida: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
            throw "El instalador de Python no está firmado por Python Software Foundation."
          }
          Write-Host "PYTHON_INSTALLER_SIGNATURE_OK"

      - name: Build offline wheelhouse
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip wheel
          python -m pip wheel --disable-pip-version-check `
            --wheel-dir "master-installer/definitive/build/wheelhouse" `
            -r "master-installer/definitive/requirements-recepcion.txt" `
            -r "historia-clinica/app/requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $count = (Get-ChildItem "master-installer/definitive/build/wheelhouse" -File).Count
          if ($count -lt 6) { throw "Wheelhouse inesperadamente pequeño: $count" }
          Write-Host "WHEELHOUSE_OK files=$count"

      - name: Download verified launchers
        shell: pwsh
        run: |
          $build = "master-installer/definitive/build"
          $items = @(
            @{
              Url = "https://github.com/fanserick-star/recepcion-dr-revelo-updates/releases/download/launcher-v1.0.12/INSTALAR_LAUNCHER_RECEPCION_DR_REVELO_V1_0_12.exe"
              File = "$build/INSTALAR_LAUNCHER_RECEPCION_DR_REVELO_V1_0_12.exe"
              Sha = "9bd537cc74fe94167698edb1ede18b111cbe68d2d1af2b0cc12bf4b20e4bbef0"
            },
            @{
              Url = "https://github.com/fanserick-star/recepcion-dr-revelo-updates/releases/download/historia-launcher-v1.0.8/INSTALAR_LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_8.exe"
              File = "$build/INSTALAR_LAUNCHER_HISTORIA_CLINICA_DR_REVELO_V1_0_8.exe"
              Sha = "7dad1d2429a50c781868f092fc7c3e873aec8d788e4e19e5b65a0a04c13a2cc6"
            }
          )
          foreach ($item in $items) {
            Invoke-WebRequest -UseBasicParsing -Uri $item.Url -OutFile $item.File
            $got = (Get-FileHash $item.File -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $item.Sha) { throw "SHA-256 no coincide para $($item.File): $got" }
          }
          Write-Host "LAUNCHERS_SHA256_OK"

      - name: Generate consultorio icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(27,61,91))
          $font = New-Object System.Drawing.Font("Segoe UI",22,[System.Drawing.FontStyle]::Bold,[System.Drawing.GraphicsUnit]::Pixel)
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = [System.Drawing.StringAlignment]::Center
          $fmt.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString("DR",$font,$brush,[System.Drawing.RectangleF]::new(0,0,64,64),$fmt)
          $h = $bmp.GetHicon()
          $ico = [System.Drawing.Icon]::FromHandle($h)
          $fs = [IO.File]::Create("master-installer/definitive/build/consultorio_icon.ico")
          try { $ico.Save($fs) } finally { $fs.Dispose() }
          $ico.Dispose(); $fmt.Dispose(); $brush.Dispose(); $font.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build generic definitive EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe no encontrado." }
          & $iscc "master-installer/definitive/ConsultorioDrReveloDefinitivo.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_BASE.exe"
          if (-not (Test-Path $base)) { throw "No se generó el EXE base." }
          $allBytes = [IO.File]::ReadAllBytes($base)
          $tailStart = [Math]::Max(0, $allBytes.Length - 1000)
          $tailLength = $allBytes.Length - $tailStart
          $tail = [Text.Encoding]::ASCII.GetString($allBytes, $tailStart, $tailLength)
          if ($tail -match 'DRREVELO_PRIVATE_CONFIG_V1') { throw "El EXE base contiene configuración privada inesperada." }
          $hash = (Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  INSTALAR_CONSULTORIO_DR_REVELO_BASE.exe" | Set-Content "master-installer/definitive/output/SHA256SUMS.txt" -Encoding ascii
          Write-Host "GENERIC_INSTALLER_OK sha256=$hash"

      - name: Confirm generic EXE refuses unsealed installation
        shell: pwsh
        run: |
          Remove-Item 'C:\Recepcion Dr Revelo','C:\Historia Clinica Dr Revelo' -Recurse -Force -ErrorAction SilentlyContinue
          $base = (Resolve-Path "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_BASE.exe").Path
          $p = Start-Process -FilePath $base -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS="recepcion,historia"' -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "El EXE sin sellar no debió completar la instalación." }
          if ((Test-Path 'C:\Recepcion Dr Revelo\app.py') -or (Test-Path 'C:\Historia Clinica Dr Revelo\app.py')) {
            throw "El EXE sin sellar modificó una instalación."
          }
          Write-Host "UNSEALED_INSTALL_BLOCKED_OK code=$($p.ExitCode)"

      - name: Seal test copy with dummy private config
        shell: pwsh
        run: |
          $dummy = Join-Path $env:RUNNER_TEMP 'consultorio-test.env'
          @'
          DATABASE_URL=postgresql://dummy:dummy@127.0.0.1:5432/dummy
          HISTORIA_DATABASE_URL=postgresql://dummy:dummy@127.0.0.1:5432/dummy
          MOBILE_DOCTOR_TOKEN=dummy-doctor-token
          MOBILE_RECEPTION_TOKEN=dummy-reception-token
          AZUR_API_KEY=dummy-azur-key
          '@ | Set-Content $dummy -Encoding utf8
          python "master-installer/definitive/seal-private-installer.py" `
            --base "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_BASE.exe" `
            --config $dummy `
            --output "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_TEST.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test clean install of both programs
        shell: pwsh
        run: |
          $exe = (Resolve-Path "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_TEST.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS="recepcion,historia"' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Get-ChildItem 'C:\ProgramData\ConsultorioDrRevelo\InstallerLogs' -Filter 'install-*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) {
              Write-Host '===== BOOTSTRAP LOG ====='
              Get-Content -LiteralPath $log.FullName | ForEach-Object { Write-Host $_ }
              Write-Host '===== END BOOTSTRAP LOG ====='
            }
            throw "Instalación limpia falló con código $($p.ExitCode)."
          }
          $required = @(
            'C:\Recepcion Dr Revelo\app.py',
            'C:\Recepcion Dr Revelo\.venv\Scripts\pythonw.exe',
            'C:\Recepcion Dr Revelo\RecepcionLauncher.exe',
            'C:\Recepcion Dr Revelo\.env',
            'C:\Historia Clinica Dr Revelo\app.py',
            'C:\Historia Clinica Dr Revelo\.venv\Scripts\pythonw.exe',
            'C:\Historia Clinica Dr Revelo\HistoriaClinicaLauncher.exe',
            'C:\Historia Clinica Dr Revelo\.env'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Falta $path" } }
          if ((Get-ChildItem 'C:\Recepcion Dr Revelo' -Recurse -Filter 'app_patch_*.py' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Recepción reintrodujo app_patch.' }
          if ((Get-ChildItem 'C:\Historia Clinica Dr Revelo' -Recurse -Filter 'app_patch_*.py' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Historia reintrodujo app_patch.' }
          Write-Host "CLEAN_INSTALL_BOTH_OK"

      - name: Test repair preserves data and private config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\Recepcion Dr Revelo\data','C:\Historia Clinica Dr Revelo\data' | Out-Null
          'KEEP_RECEPTION_DATA' | Set-Content 'C:\Recepcion Dr Revelo\data\installer-preserve.txt'
          'KEEP_HISTORIA_DATA' | Set-Content 'C:\Historia Clinica Dr Revelo\data\installer-preserve.txt'
          Add-Content 'C:\Recepcion Dr Revelo\.env' "`nPRESERVE_SENTINEL=recepcion"
          Add-Content 'C:\Historia Clinica Dr Revelo\.env' "`nPRESERVE_SENTINEL=historia"
          $rHash = (Get-FileHash 'C:\Recepcion Dr Revelo\.env' -Algorithm SHA256).Hash
          $hHash = (Get-FileHash 'C:\Historia Clinica Dr Revelo\.env' -Algorithm SHA256).Hash

          $exe = (Resolve-Path "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_TEST.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS="recepcion,historia"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Reparación falló con código $($p.ExitCode)." }

          if ((Get-Content 'C:\Recepcion Dr Revelo\data\installer-preserve.txt' -Raw).Trim() -ne 'KEEP_RECEPTION_DATA') { throw 'No se conservó data de Recepción.' }
          if ((Get-Content 'C:\Historia Clinica Dr Revelo\data\installer-preserve.txt' -Raw).Trim() -ne 'KEEP_HISTORIA_DATA') { throw 'No se conservó data de Historia.' }
          if ((Get-FileHash 'C:\Recepcion Dr Revelo\.env' -Algorithm SHA256).Hash -ne $rHash) { throw 'Se reemplazó .env de Recepción.' }
          if ((Get-FileHash 'C:\Historia Clinica Dr Revelo\.env' -Algorithm SHA256).Hash -ne $hHash) { throw 'Se reemplazó .env de Historia.' }
          Write-Host "REPAIR_PRESERVES_STATE_OK"

      - name: Test component selection independently
        shell: pwsh
        run: |
          $exe = (Resolve-Path "master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_TEST.exe").Path
          Remove-Item 'C:\Recepcion Dr Revelo','C:\Historia Clinica Dr Revelo' -Recurse -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS="recepcion"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Solo Recepción falló: $($p.ExitCode)" }
          if (-not (Test-Path 'C:\Recepcion Dr Revelo\app.py')) { throw 'Recepción no se instaló.' }
          if (Test-Path 'C:\Historia Clinica Dr Revelo\app.py') { throw 'Historia se instaló sin ser seleccionada.' }

          Remove-Item 'C:\Recepcion Dr Revelo' -Recurse -Force
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS="historia"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Solo Historia falló: $($p.ExitCode)" }
          if (-not (Test-Path 'C:\Historia Clinica Dr Revelo\app.py')) { throw 'Historia no se instaló.' }
          if (Test-Path 'C:\Recepcion Dr Revelo\app.py') { throw 'Recepción se instaló sin ser seleccionada.' }
          Write-Host "COMPONENT_SELECTION_OK"

      - name: Upload public-safe base artifact
        uses: actions/upload-artifact@v4
        with:
          name: instalador-definitivo-base-sin-secretos
          path: |
            master-installer/definitive/output/INSTALAR_CONSULTORIO_DR_REVELO_BASE.exe
            master-installer/definitive/output/SHA256SUMS.txt
            master-installer/definitive/seal-private-installer.py
          if-no-files-found: error
          retention-days: 7