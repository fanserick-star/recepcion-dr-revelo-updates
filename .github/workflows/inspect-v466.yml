name: Diagnosticar confirmaciones v4.3.66
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v466.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer handlers de confirmación de JS incrustado
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          root=Path('.')
          parts=sorted((root/'updates'/'v465').glob('app.part*'), key=lambda p:int(p.name.split('part')[-1]))
          s=b''.join(p.read_bytes() for p in parts).decode('utf-8')
          tree=ast.parse(s)
          vals={}
          for n in tree.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  name=n.targets[0].id
                  if name in {'V458_SETTINGS_JS','V459_SETTINGS_JS','V460_OVERLAY_JS'}:
                      vals[name]=ast.literal_eval(n.value)
          for name,val in vals.items():
              print('\n================',name,'================')
              low=val.lower()
              for term in ['confirm','sri','ambiente','producción','produccion','correo es opcional','revisa nombre','factura real','aprobar','billing/approve','azur/emit']:
                  start=0; occ=0
                  while True:
                      pos=low.find(term.lower(),start)
                      if pos<0: break
                      occ+=1
                      print(f'\n--- {term} #{occ} @ {pos} ---')
                      print(val[max(0,pos-1200):min(len(val),pos+2600)])
                      start=pos+max(1,len(term))
          PY
