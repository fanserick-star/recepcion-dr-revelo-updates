name: Apply Historia Legacy Effective Date Fix

on:
  push:
    branches: [fix/historia-legacy-effective-date]
    paths:
      - "tools/apply_historia_legacy_effective_date_fix.py"
      - ".github/workflows/apply-historia-legacy-effective-date-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historia-legacy-effective-date
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded source transformation
        run: python tools/apply_historia_legacy_effective_date_fix.py

      - name: Syntax check
        run: python -m py_compile historia-clinica/app/app.py

      - name: Install Historia runtime dependencies
        run: python -m pip install --disable-pip-version-check -r historia-clinica/app/requirements.txt

      - name: Regression test - Libertad legacy chronology
        env:
          HC_PREFLIGHT: "1"
          DATABASE_URL: ""
          HISTORIA_DATABASE_URL: ""
          HISTORIA_SYNC_ENABLED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd historia-clinica/app
          python - <<'PY'
          import app

          sample = '''CONSULTA X ESCITANCIA, CHORRO DEBIL CON SENSACION VACIA\n22/08/2026\nREFIERE EN OCASIONES ARDOR MICCIONAL\n18/07/2026\nEN OCASIONES DOLOR MICCIONAL'''
          legacy = {
              'id': 'libertad-regression',
              'clinical_note': sample,
              'encounter_date': '2018-11-22',
              'encounter_time': '17:32:00',
              'note_status': 'legacy',
              'is_legacy_locked': 1,
              'legacy_history_id': 1,
              'updated_at': '2018-11-22T17:32:00',
          }
          signed = {
              'id': 'signed-control',
              'clinical_note': 'CONTROL 2025',
              'encounter_date': '2025-12-01',
              'encounter_time': '10:00:00',
              'note_status': 'signed',
              'is_legacy_locked': 0,
              'legacy_history_id': None,
              'updated_at': '2025-12-01T10:00:00',
          }

          assert app.APP_VERSION == '1.3.73', app.APP_VERSION
          assert app.legacy_effective_date(sample, '2018-11-22') == '2026-08-22'
          assert app.history_effective_date(legacy) == '2026-08-22'
          ordered = sorted([signed, legacy], key=app.history_sort_key, reverse=True)
          assert ordered[0]['id'] == 'libertad-regression', ordered

          html = app.render_history_card(legacy, [], open_by_default=True)
          header = html.split('<div class="history-content', 1)[0]
          assert 'Último control:' in header
          assert '22/08/2026' in header
          assert 'registro original 22/11/2018' in header
          assert '17:32' not in header
          assert '22/08/2026' in html and '18/07/2026' in html
          print('LIBERTAD_REGRESSION_OK')
          PY

      - name: Ensure no release metadata changed
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('historia-clinica/app')
          version=json.loads((root/'historia-version.json').read_text(encoding='utf-8-sig'))['version']
          manifest=json.loads((root/'update_manifest.json').read_text(encoding='utf-8-sig'))
          assert version == '1.3.73'
          for key in ('version','app_version','runtime_version'):
              assert str(manifest[key]) == '1.3.73'
          print('NO_RELEASE_CHANGE_OK')
          PY

      - name: Commit tested app.py only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/app/app.py
          git commit -m "fix(historia): ordenar legacy por fecha clinica efectiva"
          git push origin HEAD:fix/historia-legacy-effective-date
