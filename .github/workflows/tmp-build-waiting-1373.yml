name: TEMP Waiting Room Builder

on:
  push:
    branches:
      - feat/waiting-room-1373-procedure-names
    paths:
      - tools/tmp_build_waiting_1373.py
      - .github/workflows/tmp-build-waiting-1373.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate candidates
        run: python tools/tmp_build_waiting_1373.py
      - name: Commit candidates
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/updates/v1_3_73_waiting_room_remaster historia-clinica/launcher-v1/app-channel-source.json updates/v4_6_5_historia_procedure_names launcher-v1/app-channel-source.json
          if (git diff --cached --quiet) { Write-Host "No changes"; exit 0 }
          git commit -m "build: candidatos Historia 1.3.73 y Recepción 4.6.5"
          git push
