name: Verify Reception Semantic Runtime

on:
  push:
    branches:
      - refactor/reception-definitive-runtime
    paths:
      - "refactor_build/reception_flat_466/**"
      - "tools/test_reception_no_legacy_chains.py"
      - "tools/test_reception_flat_prototype.py"
      - "tools/test_reception_runtime_bindings.py"
      - "tools/test_reception_flat_packaged_staging.py"
      - "tools/test_reception_flat_update_cycle.py"
      - "tools/validate_reception_runtime_layout.py"
      - ".github/workflows/verify-reception-semantic-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-semantic-runtime:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet fastapi uvicorn sqlalchemy python-dotenv pg8000 python-multipart requests openpyxl

      - name: Enforce no historical release chain
        shell: pwsh
        run: python tools/test_reception_no_legacy_chains.py

      - name: Validate semantic runtime layout
        shell: pwsh
        run: >-
          python tools/validate_reception_runtime_layout.py
          refactor_build/reception_flat_466
          --baseline-app updates/v4_6_0_consolidated_runtime/app.py

      - name: Compare exact 4.6.6 runtime contracts and functional flow
        shell: pwsh
        run: python tools/test_reception_flat_prototype.py

      - name: Verify billing, print renderer and version bindings
        shell: pwsh
        run: python tools/test_reception_runtime_bindings.py

      - name: Verify manifest-only packaged staging
        shell: pwsh
        run: python tools/test_reception_flat_packaged_staging.py

      - name: Simulate update and rollback from production 4.6.6
        shell: pwsh
        run: python tools/test_reception_flat_update_cycle.py
