name: Publish v4.4.50 patient cache identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4450-patient-cache-identity.yml"

permissions:
  contents: write

concurrency:
  group: publish-v4450-patient-cache-identity
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and publish v4.4.50
        shell: pwsh
        run: |
          python build/v4450_patient_cache_identity/publish_v4450.py
