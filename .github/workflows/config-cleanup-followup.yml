name: Reception configuration cleanup follow-up

on:
  push:
    branches:
      - audit-config-cleanup-4628
    paths:
      - tools/patch_config_cleanup_4628_followup.py

permissions:
  contents: write

jobs:
  polish-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: audit-config-cleanup-4628
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply follow-up polish
        run: python tools/patch_config_cleanup_4628_followup.py

      - name: Syntax checks
        run: |
          python -m py_compile recepcion/app/core_runtime.py recepcion/app/features_runtime.py
          node --check recepcion/app/static/app.js
          node --check recepcion/app/static/configuration.js

      - name: Canonical and runtime validation
        run: |
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          if [ -f tools/test_reception_reports.py ]; then python tools/test_reception_reports.py; fi

      - name: Final configuration assertions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root=Path('recepcion/app')
          feat=(root/'features_runtime.py').read_text(encoding='utf-8-sig')
          core=(root/'core_runtime.py').read_text(encoding='utf-8-sig')
          cfg=(root/'static/configuration.js').read_text(encoding='utf-8-sig')
          assert "html = re.sub(r'(/static/app\\.js\\?v=)[^\"\\']+'" in feat
          m=re.search(r'def _auto_login_enabled\(\) -> bool:\n(.*?)(?=\n\ndef )',core,re.S)
          assert m and 'return True' in m.group(1)
          assert '/api/data-protection/backup' not in core
          assert 'window.openAzurConfig=function' in cfg
          assert 'window.openDataphoneConfig=function' in cfg
          assert 'configValidateDataphone' in cfg
          print('FINAL CONFIGURATION ASSERTIONS OK')
          PY

      - name: Commit polished candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recepcion/app
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Polish consolidated Reception configuration'
            git push origin HEAD:audit-config-cleanup-4628
          fi
