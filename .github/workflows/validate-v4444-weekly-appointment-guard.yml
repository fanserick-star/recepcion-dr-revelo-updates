name: Validate v4.4.44 weekly appointment guard

on:
  push:
    branches: [main]
    paths:
      - "build/v4444_weekly_appointment_guard/**"
      - ".github/workflows/validate-v4444-weekly-appointment-guard.yml"

permissions:
  contents: read

concurrency:
  group: validate-v4444-weekly-appointment-guard
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and Chromium
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "fastapi==0.115.6" "pydantic==1.10.15" "uvicorn==0.34.0" "SQLAlchemy==2.0.36" "pg8000==1.31.2" "python-dotenv==1.0.1" "python-multipart==0.0.20" "playwright==1.55.0" "pywebview==5.4"
          python -m playwright install chromium
      - name: Validate weekly guard and inherited updater
        shell: pwsh
        run: |
          python build/v4444_weekly_appointment_guard/validate_v4444.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4444-weekly-appointment-guard
          path: updates/v4_4_44_weekly_appointment_guard
