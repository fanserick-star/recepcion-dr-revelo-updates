name: Publicar v4.4.22 audio WhatsApp Blob

on:
  push:
    branches: [main]
    paths:
      - 'build/v4422_whatsapp_audio_blob/**'
      - '.github/workflows/publish-v4422-whatsapp-audio-blob.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v4422-whatsapp-audio-blob
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construir v4.4.22 desde v4.4.21
        shell: pwsh
        run: |
          git pull --rebase origin main
          python build/v4422_whatsapp_audio_blob/build_release.py
          python -m py_compile updates/v4_4_22_whatsapp_audio_blob/app.py
          node --check updates/v4_4_22_whatsapp_audio_blob/static/app.js

      - name: Validar audio Blob y alcance
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          root=Path('updates/v4_4_22_whatsapp_audio_blob')
          app=(root/'app.py').read_text(encoding='utf-8-sig')
          js=(root/'static/app.js').read_text(encoding='utf-8-sig')
          html=(root/'static/index.html').read_text(encoding='utf-8-sig')
          channel=json.loads(Path('build/v4422_whatsapp_audio_blob/candidate_latest.json').read_text(encoding='utf-8-sig'))
          for m in ['APP_VERSION = "4.4.22"','?message_id=','len(message_id) <= 500','Cloudflare no pudo entregar el audio']:
              assert m in app,m
          for m in ['loadWhatsappAudioBlob','audio/ogg; codecs=opus','Cargando audio…','r.arrayBuffer()']:
              assert m in js,m
          assert '/static/app.js?v=4.4.22' in html
          assert channel['version']=='4.4.22'
          assert all('/main/' in f['url'] for f in channel['files'])
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.csv','.xlsx','.xls','.db','.sqlite'}:
                  raise AssertionError(f'Dato no permitido en payload: {p}')
          print('V4422_SCOPE_AND_AUDIO_OK')
          '@ | python -

      - name: Publicar payload
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch updates/v4_4_22_whatsapp_audio_blob/__pycache__
          git add updates/v4_4_22_whatsapp_audio_blob
          if(-not (git diff --cached --quiet)){git commit -m 'payload: v4.4.22 audio WhatsApp Blob'}
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verificar payload remoto
        shell: pwsh
        run: python tools/remote_payload_guard.py --manifest build/v4422_whatsapp_audio_blob/candidate_latest.json

      - name: Mover canal a v4.4.22
        shell: pwsh
        run: |
          Copy-Item build/v4422_whatsapp_audio_blob/candidate_latest.json latest-v3.json -Force
          Copy-Item build/v4422_whatsapp_audio_blob/candidate_latest.json latest.json -Force
          git add latest-v3.json latest.json
          if(-not (git diff --cached --quiet)){git commit -m 'release: publicar v4.4.22 audio WhatsApp Blob'}
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Confirmar canal final
        shell: pwsh
        run: |
          @'
          import json,time,urllib.request,pathlib,os
          url='https://raw.githubusercontent.com/fanserick-star/recepcion-dr-revelo-updates/main/latest-v3.json'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'latest-v4422-remote.json'
          last=''
          for _ in range(45):
              try:
                  req=urllib.request.Request(url+'?rp_ts='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'RP-v4422-guard'})
                  with urllib.request.urlopen(req,timeout=10) as r: raw=r.read()
                  d=json.loads(raw.decode('utf-8-sig'))
                  if str(d.get('version'))=='4.4.22':
                      out.write_bytes(raw);print('CHANNEL_4422_VISIBLE');break
                  last=str(d.get('version'))
              except Exception as e:last=repr(e)
              time.sleep(1)
          else: raise SystemExit('Canal no propagó 4.4.22; último='+last)
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\wait4422.py
          python $env:RUNNER_TEMP\wait4422.py
          python tools/remote_payload_guard.py --manifest $env:RUNNER_TEMP\latest-v4422-remote.json
          Write-Host 'V4422_PUBLISHED_AND_VERIFIED'
