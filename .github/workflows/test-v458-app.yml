name: Validar app v4.3.58

on:
  push:
    branches: [main]
    paths:
      - 'updates/v458/**'
      - '.github/workflows/test-v458-app.yml'
      - 'latest.json'
      - 'latest-v3.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias mínimas para importar app.py
        run: python -m pip install --disable-pip-version-check fastapi sqlalchemy python-dotenv python-multipart
      - name: Reconstruir, verificar SHA y compilar app publicada
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('updates/v458')
          parts=sorted(root.glob('app.part*'), key=lambda p:int(p.name.split('part')[-1]))
          if len(parts) != 6:
              raise SystemExit(f'Se esperaban 6 partes de app.py y hay {len(parts)}')
          raw=b''.join(p.read_bytes() for p in parts)
          if len(raw) != 423484:
              raise SystemExit(f'Tamaño app.py inválido: {len(raw)}')
          got=hashlib.sha256(raw).hexdigest()
          want='f6a95f3058afe93feb5b386d514d6ef79313595c37138c1189276e69f642781f'
          if got != want:
              raise SystemExit(f'SHA app.py inválido: {got} != {want}')
          Path('_ci_app.py').write_bytes(raw)
          print('app.py reconstruido y verificado:',len(raw),'bytes',got)
          PY
          python -m py_compile _ci_app.py
      - name: Validar JavaScript incrustado
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          t=ast.parse(Path('_ci_app.py').read_text(encoding='utf-8'))
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id=='V458_SETTINGS_JS':
                  Path('_ci_settings.js').write_text(ast.literal_eval(n.value),encoding='utf-8'); break
          else: raise SystemExit('No se encontró V458_SETTINGS_JS')
          PY
          node --check _ci_settings.js
      - name: Pruebas de comportamiento aisladas
        run: python updates/v458/test_v458.py
