name: Build Recepcion repair tool

on:
  push:
    paths:
      - "repair-tools/REPARAR_RECEPCION_459.c"
      - "repair-tools/REPARAR_RECEPCION_459.py"
      - ".github/workflows/build-recepcion-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /DUNICODE /D_UNICODE /MT /Fe:REPARAR_RECEPCION_v4.5.9.exe repair-tools\REPARAR_RECEPCION_459.c user32.lib shell32.lib urlmon.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: reparar-recepcion-v459
          path: REPARAR_RECEPCION_v4.5.9.exe
          if-no-files-found: error
          retention-days: 7
