name: Publish Validated Historia App Channel

on:
  push:
    branches: [main]
    paths:
      - "historia-clinica/app/historia-version.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce canonical Historia source
        run: |
          python tools/test_historia_canonical_source.py
          python tools/validate_historia_runtime.py historia-clinica/app

      - name: Generate channel from exact canonical Git blobs
        env:
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python tools/build_historia_app_channel.py \
            --commit "$RELEASE_SHA" \
            --repository "$REPOSITORY"

      - name: Re-download generated channel and verify exact Raw bytes
        env:
          VERIFY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, urllib.request

          channel = json.loads(pathlib.Path('historia-clinica/launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          out = pathlib.Path('channel_verify_historia')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          nonce = os.environ.get('VERIFY_NONCE', 'verify')

          for item in channel['files']:
              rel = str(item['path']).replace('\\', '/')
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              url = item['url'] + ('&' if '?' in item['url'] else '?') + 'verify=' + nonce
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
              got = hashlib.sha256(payload).hexdigest()
              assert got == item['sha256'], (rel, got, item['sha256'])
              dest.write_bytes(payload)
              print('RAW OK', rel, got)
          PY
          python tools/validate_historia_runtime.py channel_verify_historia

      - name: Publish only after all validation passed
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- historia-clinica/launcher-v1/app-channel.json; then
            echo "Channel already matches generated output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historia-clinica/launcher-v1/app-channel.json
          git commit -m "Publish validated Historia app channel"
          git push origin HEAD:main
