name: Probe Historia mobile secret

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-historia-mobile-secret.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HISTORIA_DATABASE_URL: ${{ secrets.HISTORIA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write sanitized result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ -n "${HISTORIA_DATABASE_URL:-}" ]; then
            printf '%s\n' '{"historia_database_url_secret":"present"}' > diagnostics/historia-mobile-secret.json
          else
            printf '%s\n' '{"historia_database_url_secret":"missing"}' > diagnostics/historia-mobile-secret.json
          fi
      - name: Publish sanitized result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/historia-mobile-secret.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe Historia mobile secret availability"
          git push origin HEAD:main
