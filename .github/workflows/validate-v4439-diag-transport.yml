name: Validar v4.4.39 transporte diagnóstico

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v4439-diag-transport.yml'
      - 'build/v4439_diag_transport/build_v4439.py'
      - 'build/v4439_diag_transport/validate_v4439.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar pg8000 para prueba real de transporte
        run: python -m pip install --disable-pip-version-check 'pg8000==1.31.2'
      - name: Construir candidato fijado sobre v4.4.38
        run: python build/v4439_diag_transport/build_v4439.py
      - name: Probar Neon URLs cola INC privacidad puertos updater y selftests
        run: python build/v4439_diag_transport/validate_v4439.py
      - name: Preparar runtime completo y Chromium
        shell: pwsh
        run: |
          python -m venv .release-venv
          .\.release-venv\Scripts\python.exe -m pip install --disable-pip-version-check 'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' 'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20' 'playwright==1.55.0'
          .\.release-venv\Scripts\python.exe -m playwright install chromium
      - name: Repetir pruebas funcionales reales de app v4.4.36
        run: .\.release-venv\Scripts\python.exe build/v4436_default_cash/validate_candidate.py
      - name: Verificar que app base y static siguen exactos
        shell: pwsh
        run: |
          python -c "import hashlib,pathlib; p=pathlib.Path('updates/v4_4_39_diag_transport'); checks={'app.py':'2d8c6bac37a603c911b9fca6848e839b00b6b7975cf13fd9c3088c4542e4508e','app_base_4428.py':'e5d3d96b9289169aa52524e8cc2f5f0ec9567c8da5e11d482151b12fc8ff85ba','static/app.js':'0657c3b76721df2e28ec812856a2fc25944d2908382b13fbf3f115dad3e18d90','static/index.html':'16d30060a0be19215e612c4ba897e801873dd359712e90d4dc14e32513b25728'}; [(lambda got,exp,name: (_ for _ in ()).throw(AssertionError(name)) if got!=exp else None)(hashlib.sha256((p/name).read_bytes()).hexdigest(),exp,name) for name,exp in checks.items()]; print('FUNCTIONAL_BYTES_V4439_OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: v4439-validated-payload
          path: updates/v4_4_39_diag_transport
          if-no-files-found: error
