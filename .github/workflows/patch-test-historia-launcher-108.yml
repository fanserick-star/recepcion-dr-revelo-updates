name: Patch and Test Historia Launcher 1.0.8

on:
  push:
    branches:
      - feature/historia-launcher-108-native-print
    paths:
      - tools/patch_historia_launcher_108.py
      - .github/workflows/patch-test-historia-launcher-108.yml

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/historia-launcher-108-native-print
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply guarded patch
        shell: pwsh
        run: python tools/patch_historia_launcher_108.py

      - name: Static contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('historia-clinica/launcher-v1/HistoriaLauncher/Program.cs').read_text(encoding='utf-8')
          assert 'LauncherVersion = "1.0.8"' in p
          assert 'historia-print-url' in p
          assert 'PrintAsync(settings)' in p
          assert 'CoreWebView2PrintStatus.Succeeded' in p
          assert 'string.Equals(e.Uri, "about:blank"' in p
          iss=Path('historia-clinica/launcher-v1/installer/LauncherV1.iss').read_text(encoding='utf-8')
          assert '1.0.8' in iss and 'V1_0_8' in iss
          wf=Path('.github/workflows/build-historia-launcher-v1.yml').read_text(encoding='utf-8')
          assert 'historia-launcher-v1.0.8' in wf
          assert 'Publish launcher channel 1.0.8' in wf
          print('Launcher 1.0.8 static contract OK')
          '@ | python -

      - name: Build native launcher
        shell: pwsh
        run: dotnet build historia-clinica/launcher-v1/HistoriaLauncher/HistoriaLauncher.csproj -c Release

      - name: Commit generated launcher source
        shell: pwsh
        run: |
          git config user.name "fanserick-star"
          git config user.email "fanserick@hotmail.com"
          git add historia-clinica/launcher-v1/HistoriaLauncher/Program.cs historia-clinica/launcher-v1/installer/LauncherV1.iss .github/workflows/build-historia-launcher-v1.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Historia Launcher 1.0.8 impresión nativa"
            git push origin HEAD:feature/historia-launcher-108-native-print
          }
