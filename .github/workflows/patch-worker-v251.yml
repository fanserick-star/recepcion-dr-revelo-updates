name: Preparar WhatsApp Worker v2.5.1
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_worker_v251.py'
      - '.github/workflows/patch-worker-v251.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Aplicar parche aislado
        run: python tools/patch_worker_v251.py
      - name: Validar fuente
        run: |
          node --check cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js
          grep -q 'worker_version:"2.5.1"' cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js
          grep -q 'error_data?.details' cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js
          if grep -q 'r.is_test?"TEST_CONFIRMAR"' cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js; then exit 1; fi
      - name: Guardar fuente v2.5.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/whatsapp_worker_v2_5_reglas_y_pruebas.js
          if git diff --cached --quiet; then echo 'Fuente ya corregida.'; else git commit -m 'WhatsApp Worker v2.5.1: prueba compatible y diagnóstico Meta'; git pull --rebase origin main; git push origin HEAD:main; fi
