name: Validar y publicar v4.3.102
on:
  push:
    branches: [main]
    paths:
      - 'build/v43102/**'
      - '.github/workflows/build-v43102-validate.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir candidato
        run: python build/v43102/build_v43102.py
      - name: Reconstruir archivos
        run: |
          cat updates/v43102/app.part* > _ci_app.py
          cat updates/v43102/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
      - name: Validar estructura estática
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          app=Path('_ci_app.py').read_text(encoding='utf-8')
          for token in [
              'APP_VERSION = "4.3.102"','v43102-consult-section','v43102-consult-slot',
              'Procedimientos y servicios',"'$40.00'",'grid-template-columns:repeat(3,minmax(0,1fr))',
              'overflow-x:hidden',"const slot=box.querySelector('.v43102-consult-slot')",
              'V497_ATTENTION_JS','Revisando AZUR','Emitir por lotes','LOCAL_HTTP_PORT'
          ]:
              assert token in app, token
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.102'
          ai=next(x for x in latest['files'] if x['path']=='app.py')
          li=next(x for x in latest['files'] if x['path']=='ABRIR_RECEPCION.py')
          assert hashlib.sha256(Path('_ci_app.py').read_bytes()).hexdigest()==ai['sha256']
          assert hashlib.sha256(Path('_ci_launcher.py').read_bytes()).hexdigest()==li['sha256']
          print('STATIC_V43102_OK')
          PY
      - name: Extraer JS de atención
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src)
          wanted={'V492_ATTENTION_JS':'_v492.js','V497_ATTENTION_JS':'_v497.js'}
          found={}
          for node in tree.body:
              if not isinstance(node,ast.Assign): continue
              for target in node.targets:
                  if isinstance(target,ast.Name) and target.id in wanted:
                      found[target.id]=ast.literal_eval(node.value)
          for name,path in wanted.items():
              assert name in found,name
              Path(path).write_text(found[name],encoding='utf-8')
          print('EXTRACT_ATTENTION_JS_OK')
          PY
      - name: Probar layout real de Consulta aislada
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@26 >/dev/null 2>&1
          cat > _dom_test.mjs <<'JS'
          import fs from 'node:fs';
          import {JSDOM} from 'jsdom';
          const procedures=['FULGURACION','CISTOSCOPIA','DILATACION','CIRCUNSICION','INSTILACION','LAVADO','CAMBIO DE SONDA','CISTO Y DILATACION','SERVICIO DE UROLOGIA'];
          const procButtons=procedures.map((n,i)=>`<button type="button" class="service-card procedure-card" data-service="${n}"><span class="service-icon">▣</span><strong>${n}</strong><span class="service-price">${i===4?'$80.00':'Valor editable'}</span><span class="service-check">✓</span></button>`).join('');
          const html=`<!doctype html><html><head></head><body><div id="modal"><div class="modalbox"><div class="modal-form-heading"><h2>Nueva atención</h2><p>Confirma el paciente y registra la atención realizada.</p></div><section class="v492-clinical-head"></section><div class="patient-warning">⚠ Atención al registro del paciente</div><div class="service-title enhanced"><div><b>Selecciona la atención</b></div><span>0 seleccionadas</span></div><div class="service-groups"><div class="service-section consultation-service-section"><div class="service-group-heading"><div><b>Consulta</b><span>Atención médica</span></div></div><div class="service-grid consultation-grid"><button type="button" class="service-card consultation-card" data-service="CONSULTA"><span class="service-icon">✚</span><strong>CONSULTA</strong><span class="service-price">$40 fijo</span><span class="service-check">✓</span></button></div></div><div class="service-section procedures-service-section"><div class="service-group-heading"><div><b>Procedimientos</b></div></div><div class="service-grid">${procButtons}</div></div></div><div id="procedureValuesBox"></div><div class="actions form-actions"><button>Cancelar</button><button>Guardar atención</button></div></div></div></body></html>`;
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,url:'http://127.0.0.1:8765'});
          const {window}=dom;
          window.eval(fs.readFileSync('_v492.js','utf8'));
          window.eval(fs.readFileSync('_v497.js','utf8'));
          window.document.dispatchEvent(new window.Event('DOMContentLoaded',{bubbles:true}));
          window.document.dispatchEvent(new window.MouseEvent('click',{bubbles:true}));
          await new Promise(r=>setTimeout(r,420));
          const box=window.document.querySelector('#modal .modalbox');
          const section=box.querySelector('.v43102-consult-section');
          if(!section) throw new Error('No existe bloque aislado de Consulta');
          const consulta=section.querySelector('.v43102-consult-slot > button.service-card[data-service="CONSULTA"]');
          if(!consulta) throw new Error('CONSULTA no está dentro de su bloque aislado');
          if(consulta.textContent.toLowerCase().includes('fijo')) throw new Error('CONSULTA todavía muestra fijo');
          if(!consulta.textContent.includes('$40.00')) throw new Error('CONSULTA no muestra $40.00');
          const grid=box.querySelector('.v492-services-grid');
          const cards=[...grid.querySelectorAll(':scope > button.service-card[data-service]')];
          if(cards.length!==9) throw new Error(`La grilla debe tener 9 procedimientos y tiene ${cards.length}`);
          if(cards.some(x=>x.dataset.service==='CONSULTA')) throw new Error('CONSULTA volvió a la grilla');
          const heading=box.querySelector('.v43102-procedure-head h3');
          if(!heading||heading.textContent.trim()!=='Procedimientos y servicios') throw new Error('Falta título Procedimientos y servicios');
          const groups=box.querySelector('.service-groups');
          if(!groups.classList.contains('v492-empty-source')) throw new Error('Contenedor nativo viejo no quedó oculto');
          // Dispara de nuevo el reparador v497: CONSULTA debe seguir aislada.
          window.document.dispatchEvent(new window.MouseEvent('click',{bubbles:true}));
          await new Promise(r=>setTimeout(r,340));
          if(consulta.parentElement!==section.querySelector('.v43102-consult-slot')) throw new Error('v497 volvió a mover CONSULTA');
          if(grid.contains(consulta)) throw new Error('CONSULTA terminó otra vez en la grilla');
          console.log('DOM_V43102_PROFESSIONAL_OK');
          JS
          node _dom_test.mjs
      - name: Probar backend portable
        run: |
          python -m pip install --disable-pip-version-check 'fastapi==0.115.6' 'pydantic==1.10.15' 'uvicorn==0.34.0' 'SQLAlchemy==2.0.36' 'pg8000==1.31.2' 'python-dotenv==1.0.1' 'python-multipart==0.0.20'
          rm -rf _smoke_root _smoke_data
          mkdir -p _smoke_root _smoke_data
          unzip -q installer_clean/base/clean_base_resources.zip -d _smoke_root
          cp _ci_app.py _smoke_root/app.py
          cp updates/v43102/static/index.html _smoke_root/static/index.html
          (cd _smoke_root && RP_FORCE_OFFLINE=1 RP_PORT=8765 RP_DATA_DIR="$PWD/../_smoke_data" DISABLE_SQLALCHEMY_CEXT_RUNTIME=1 python app.py > ../_smoke.log 2>&1 & echo $! > ../_smoke.pid)
          python - <<'PY'
          import json,time,urllib.request
          ok=False
          for _ in range(100):
              time.sleep(.25)
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/api/version',timeout=1) as r:d=json.loads(r.read().decode())
                  if d.get('version')=='4.3.102':ok=True;break
              except Exception: pass
          if not ok:
              print(open('_smoke.log',encoding='utf-8',errors='replace').read())
              raise SystemExit('backend portable no arrancó')
          print('PORTABLE_BACKEND_V43102_OK')
          PY
          kill "$(cat _smoke.pid)" || true
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v43102 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.102 consulta aislada profesional'
          git pull --rebase origin main
          git push
