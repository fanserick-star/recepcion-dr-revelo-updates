name: Patch Flat Builder Dynamic Lookups

on:
  push:
    branches:
      - refactor/reception-definitive-runtime
    paths:
      - tools/patch_flat_builder_dynamic_lookups.py
      - .github/workflows/patch-flat-builder-dynamic-lookups.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch builder
        run: python tools/patch_flat_builder_dynamic_lookups.py
      - name: Commit patched builder
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_reception_flat_prototype.py
          git commit -m "refactor: resolver lookups históricos sin sys.modules"
          git push origin HEAD:refactor/reception-definitive-runtime
