name: Fix Definitive Installer Python Target

on:
  push:
    branches: [build/definitive-private-installer]
    paths:
      - ".github/workflows/fix-definitive-installer-python-target.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/definitive-private-installer
          fetch-depth: 0
      - name: Make Python install target explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/definitive-installer/installer.ps1')
          s=p.read_text(encoding='utf-8')
          old="$args = @('/quiet','InstallAllUsers=1',(\"TargetDir=$PythonRoot\"),'Include_launcher=0','InstallLauncherAllUsers=0','PrependPath=0','Shortcuts=0','Include_doc=0','Include_test=0','Include_tcltk=0','Include_pip=1','Include_dev=0','Include_debug=0','Include_symbols=0','SimpleInstall=1')"
          new="$args = @('/quiet','InstallAllUsers=0',(\"TargetDir=$PythonRoot\"),'Include_exe=1','Include_lib=1','Include_launcher=0','InstallLauncherAllUsers=0','PrependPath=0','Shortcuts=0','AssociateFiles=0','Include_doc=0','Include_test=0','Include_tcltk=0','Include_pip=1','Include_dev=0','Include_debug=0','Include_symbols=0')"
          if old not in s:
              raise SystemExit('Python args block not found exactly once')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/definitive-installer/installer.ps1
          git commit -m "fix(installer): fijar runtime Python privado"
          git push origin HEAD:build/definitive-private-installer
