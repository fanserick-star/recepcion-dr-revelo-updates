name: Deploy WhatsApp Worker v2.6.17 autoagenda por reenvio

on:
  push:
    branches: [main]
    paths:
      - 'build/whatsapp_v2617_forward_autoagenda/**'
      - '.github/workflows/deploy-whatsapp-v2617-forward-autoagenda.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-whatsapp-v2617-forward-autoagenda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: dr-revelo-whatsapp-cloud
      WORKER_URL: https://dr-revelo-whatsapp-cloud.drrevelo.workers.dev
      AUTOAGENDA_AUTHORIZED_PHONES_SECRET: ${{ secrets.AUTOAGENDA_AUTHORIZED_PHONES }}
      WHATSAPP_TEST_PHONE_SECRET: ${{ secrets.WHATSAPP_TEST_PHONE }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir y validar Worker v2.6.17
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python build/whatsapp_v2617_forward_autoagenda/build_worker_v2617.py
          cp cloudflare/WHATSAPP_WORKER_v2_6_17_FORWARD_AUTOAGENDA_STANDALONE.js /tmp/worker-v2617.js
          python - <<'PY'
          import os, pathlib, re
          p=pathlib.Path('/tmp/worker-v2617.js')
          s=p.read_text(encoding='utf-8')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          assert re.fullmatch(r'[0-9a-fA-F]{32}', account), 'account id inválido'
          assert s.count('__CF_ACCOUNT_ID__') == 1
          s=s.replace('__CF_ACCOUNT_ID__', account)
          p.write_text(s, encoding='utf-8')
          checks=[
            'worker_version: "2.6.17"',
            'autoagenda_forward: "authorized_v1"',
            'AUTOAGENDA_SOURCE_PREFIX',
            'handleAutoagendaForward',
            'CITA YA REGISTRADA',
            'diagnostics_export: "cf_token_aesgcm_v1"',
            'pg_advisory_xact_lock'
          ]
          for x in checks: assert x in s, x
          print('WORKER_V2617_PATCHED_OK')
          PY
          cp /tmp/worker-v2617.js /tmp/worker-v2617.mjs
          node --check /tmp/worker-v2617.mjs

      - name: Dry-run v2.6.17
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy /tmp/worker-v2617.js --name "$WORKER_NAME" --compatibility-date 2026-09-01 --keep-vars --dry-run --outdir /tmp/cf-v2617-dry
          test -n "$(find /tmp/cf-v2617-dry -type f -print -quit)"

      - name: Configurar número autorizado si existe secreto de GitHub
        shell: bash
        run: |
          set -euo pipefail
          PHONES="$AUTOAGENDA_AUTHORIZED_PHONES_SECRET"
          if [ -z "$PHONES" ] && [ -n "$WHATSAPP_TEST_PHONE_SECRET" ]; then
            PHONES="$WHATSAPP_TEST_PHONE_SECRET"
          fi
          if [ -n "$PHONES" ]; then
            printf '%s' "$PHONES" | npx --yes wrangler@latest secret put AUTOAGENDA_AUTHORIZED_PHONES --name "$WORKER_NAME"
            echo 'AUTOAGENDA_AUTH_SECRET_SET=1'
          else
            echo 'AUTOAGENDA_AUTH_SECRET_SET=0 (se conservarán variables ya existentes)'
          fi

      - name: Desplegar v2.6.17 preservando variables
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy /tmp/worker-v2617.js --name "$WORKER_NAME" --compatibility-date 2026-09-01 --keep-vars

      - name: Verificar producción
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$WORKER_URL/health?ci=$(date +%s%N)" -o /tmp/health.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json','r',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('worker_version') == '2.6.17', d
          assert d.get('autoagenda_forward') == 'authorized_v1', d
          assert d.get('diagnostics_read') == 'capability_v1', d
          assert d.get('diagnostics_export') == 'cf_token_aesgcm_v1', d
          print('HEALTH_V2617_OK autoagenda_configured=', d.get('autoagenda_configured'))
          PY
              then OK=1; break; fi
            fi
            sleep 3
          done
          test "$OK" = "1"
          cat /tmp/health.json
