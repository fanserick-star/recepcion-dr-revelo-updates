name: Inspect static v497
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-static-v497.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract base frontend
        run: |
          mkdir -p _inspect
          python - <<'PY'
          import zipfile
          from pathlib import Path
          z=Path('installer_clean/base/clean_base_resources.zip')
          with zipfile.ZipFile(z) as f:
              for src,dst in [('static/index.html','index.html'),('static/app.js','app.js'),('static/style.css','style.css')]:
                  Path('_inspect',dst).write_bytes(f.read(src))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v497-static-index
          path: _inspect/
          if-no-files-found: error
