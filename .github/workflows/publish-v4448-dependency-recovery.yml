name: Publish v4.4.48 dependency recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4448-dependency-recovery.yml"

permissions:
  contents: write

concurrency:
  group: publish-v4448-dependency-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate legacy updater and publish v4.4.48
        shell: pwsh
        run: |
          python build/v4448_dependency_recovery/publish_v4448.py
          # Run 2: local CRLF is isolated; Raw SHA and legacy 4.4.43 remain mandatory gates.
