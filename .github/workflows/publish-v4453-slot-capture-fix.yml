name: Publish v4.4.53 slot capture fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4453-slot-capture-fix.yml"

permissions:
  contents: write

concurrency:
  group: publish-v4453-slot-capture-fix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and publish v4.4.53
        shell: pwsh
        run: |
          python build/v4453_slot_capture_fix/publish_v4453.py
