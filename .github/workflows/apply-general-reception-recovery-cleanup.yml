name: Apply safe Reception recovery cleanup

on:
  push:
    branches:
      - audit-general-reception-4629
    paths:
      - ".github/workflows/apply-general-reception-recovery-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-general-reception-4629
          fetch-depth: 0
      - name: Remove superseded interface recovery shim
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('recepcion/app')

          p=root/'reception_printing_queue.py'
          text=p.read_text(encoding='utf-8')
          old='import reception_interface_recovery as _dep_interface_recovery\n'
          new='import reception_attention_identity as _dep_attention_identity\n'
          if old not in text:
              raise SystemExit('printing queue recovery dependency not found')
          text=text.replace(old,new,1)
          text=text.replace('core = _dep_interface_recovery.core\napp = _dep_interface_recovery.app\n','core = _dep_attention_identity.core\napp = _dep_attention_identity.app\n',1)
          p.write_text(text,encoding='utf-8')

          features=root/'features_runtime.py'
          text=features.read_text(encoding='utf-8')
          text=text.replace('import reception_interface_recovery\n','')
          text=text.replace('    reception_interface_recovery,\n','')
          features.write_text(text,encoding='utf-8')

          manifest_path=root/'update_manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          for key in ('required_dependencies','copy'):
              manifest[key]=[x for x in manifest.get(key,[]) if x!='reception_interface_recovery.py']
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          obsolete=root/'reception_interface_recovery.py'
          if obsolete.exists(): obsolete.unlink()
          Path('.github/workflows/apply-general-reception-recovery-cleanup.yml').unlink()
          PY
          if grep -R --include='*.py' -n 'reception_interface_recovery' recepcion/app; then
            echo 'Remaining reference to reception_interface_recovery' >&2
            exit 1
          fi
          python tools/test_reception_canonical_source.py
          python tools/validate_reception_runtime_layout.py recepcion/app
          git diff --check
      - name: Commit recovery shim removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete Reception recovery shim"
          git push origin HEAD:audit-general-reception-4629
