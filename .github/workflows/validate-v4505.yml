name: Validate v4.5.5 release

on:
  push:
    branches: [ main ]
    paths:
      - 'updates/v4_5_05_dataphone_visual/**'
      - '.github/workflows/validate-v4505.yml'
  pull_request:
    paths:
      - 'updates/v4_5_05_dataphone_visual/**'
      - '.github/workflows/validate-v4505.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile v4.5.5
        run: |
          python -m py_compile updates/v4_5_05_dataphone_visual/app_patch_4505.py
          python -m py_compile updates/v4_5_05_dataphone_visual/app.py
      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('updates/v4_5_05_dataphone_visual/app_patch_4505.py')
          s=p.read_text(encoding='utf-8')
          checks={
            'version':'APP_VERSION = "4.5.5"' in s,
            'card_manual_off':'manual_card_entry": False' in s,
            'no_schema':'database_schema_changes": False' in s,
            'no_neon':'neon_writes_added": False' in s,
            'no_azur':'azur_contract_changes": False' in s,
            'receipt':'receipt_layout_version": "4.4.69"' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
            raise SystemExit('Missing checks: '+', '.join(bad))
          print('v4.5.5 checks OK')
          PY
