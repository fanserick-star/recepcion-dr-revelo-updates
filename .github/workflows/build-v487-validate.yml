name: Validar y publicar v4.3.87
on:
  push:
    branches: [main]
    paths:
      - 'build/v487/**'
      - '.github/workflows/build-v487-validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar huellas no relacionadas
        run: |
          git rev-parse HEAD:agenda > _agenda_before.txt
          git rev-parse HEAD:cloudflare > _cloudflare_before.txt
      - name: Construir paquete candidato
        run: python build/v487/build_v487.py
      - name: Validar Python, JS, umbral 75 e iconos
        run: |
          cat updates/v487/app.part* > _ci_app.py
          cat updates/v487/ABRIR_RECEPCION.part* > _ci_launcher.py
          python -m py_compile _ci_app.py _ci_launcher.py
          python _ci_launcher.py --self-test-core
          python - <<'PY'
          import ast,json,hashlib
          from pathlib import Path
          src=Path('_ci_app.py').read_text(encoding='utf-8')
          tree=ast.parse(src);js=css=None
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  names=[t.id for t in node.targets if isinstance(t,ast.Name)]
                  if 'V487_ICON_JS' in names: js=ast.literal_eval(node.value)
                  if 'V487_ICON_CSS' in names: css=ast.literal_eval(node.value)
          assert js and css
          for token in ['v487-section-svg','v487-identity-icon','v487-contact-icon','v487-place-label-icon']:
              assert token in js or token in css,token
          assert 'float(score or 0) < 0.75' in src
          assert 'merge_patient_confirmed' in src
          assert 'lc and rc and lc != rc' in src
          assert 'visit_counts' in src and 'appointment_counts' in src
          assert 'V486_FIX_JS' in src and 'v486OpenAzur' in src
          assert 'v486-place-in-contact' in src
          assert 'Ver recibo' in src and 'Reimprimir' in src
          assert 'V485_FIX_JS' in src and 'Emitir por lotes' in src
          assert 'APP_VERSION = "4.3.87"' in src
          assert 'MutationObserver' not in js
          Path('_ci_v487.js').write_text(js,encoding='utf-8')
          latest=json.loads(Path('latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='4.3.87'
          ai=next(x for x in latest['files'] if x['path']=='app.py')
          li=next(x for x in latest['files'] if x['path']=='ABRIR_RECEPCION.py')
          assert hashlib.sha256(Path('_ci_app.py').read_bytes()).hexdigest()==ai['sha256']
          assert hashlib.sha256(Path('_ci_launcher.py').read_bytes()).hexdigest()==li['sha256']
          print('VALIDACION V4.3.87 OK')
          PY
          node --check _ci_v487.js
      - name: Confirmar aislamiento
        run: |
          test "$(cat _agenda_before.txt)" = "$(git rev-parse HEAD:agenda)"
          test "$(cat _cloudflare_before.txt)" = "$(git rev-parse HEAD:cloudflare)"
          git diff --exit-code -- agenda cloudflare
      - name: Publicar canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v487 latest.json latest-v3.json
          git commit -m 'release: publicar v4.3.87 duplicados 75 e iconos'
          git pull --rebase origin main
          git push
