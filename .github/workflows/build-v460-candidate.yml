name: Construir candidata v4.3.60
on:
  push:
    branches: [main]
    paths:
      - 'build/v460/**'
      - '.github/workflows/build-v460-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Construir candidata exacta
        run: python build/v460/build_v460.py
      - name: Compilar y validar JavaScript
        run: |
          cat updates/v460/app.part* > _ci_app.py
          python -m py_compile _ci_app.py
          python - <<'PY'
          import ast
          from pathlib import Path
          t=ast.parse(Path('_ci_app.py').read_text(encoding='utf-8'))
          for n in t.body:
              if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id=='V460_OVERLAY_JS':
                  Path('_ci_overlay.js').write_text(ast.literal_eval(n.value),encoding='utf-8');break
          else: raise SystemExit('No V460_OVERLAY_JS')
          PY
          node --check _ci_overlay.js
      - name: Pruebas funcionales base
        run: |
          python -m pip install --disable-pip-version-check fastapi sqlalchemy python-dotenv python-multipart
          python updates/v460/test_v460.py
      - name: Publicar candidata sin mover canal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v460
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'candidate: construir v4.3.60 verificada'; git push; fi
