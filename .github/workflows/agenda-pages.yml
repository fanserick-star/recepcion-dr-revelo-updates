name: Publicar Agenda 24-7

on:
  push:
    branches: [main]
    paths:
      - 'agenda/**'
      - '.github/workflows/agenda-pages.yml'
      - 'tools/test_historia_mobile_safe_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar agenda de miércoles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          doctor=Path('agenda/index.html').read_text(encoding='utf-8')
          public=Path('agenda/agendar.html').read_text(encoding='utf-8')
          assert "['MIÉRCOLES','JUEVES','VIERNES','SÁBADO']" in doctor
          assert "function slotAllowed(d,t){const dow=new Date(d+'T12:00:00').getDay();return [3,4,5,6].includes(dow)}" in doctor
          assert 'for(let m=480;m<=1020;m+=20){if(m<840&&m+20>750)continue;' in doctor
          assert "dow!==3||String(t)>='10:00'" not in doctor
          assert 'ALMUERZO · 12:30 – 14:00' in doctor
          assert 'function overlaps(a,durA,b,durB=20)' in doctor
          assert 'const blocking=overlappingRow(d,time)' in doctor
          assert "special?'CITA':''" in doctor
          assert 'Cita ${z.t}' in doctor
          assert '[3,4,5,6].includes(day)' in public
          assert 'timesForDate' in public
          assert 'Desde las 8:00 a. m.' in public
          assert 'Los miércoles desde las 10:00' not in public
          assert 'if(Array.isArray(specific))return specific' in public
          assert "HISTORY_API='https://ep-sweet-mud-arlsk7qa.apirest.c-4.us-west-2.aws.neon.tech/neondb/rest/v1'" in doctor
          assert "historyRpc('search'" in doctor
          assert "historyRpc('patient'" in doctor
          assert 'id="tabHistory"' in doctor
          assert 'Ver historia clínica' in doctor
          assert 'HISTORIA CLÍNICA · SOLO LECTURA' in doctor
          assert 'La historia se consulta en vivo. No se guarda una copia clínica en este teléfono.' in doctor
          verify=Path('agenda/verificar.html').read_text(encoding='utf-8')
          assert 'ARMANDO ARTURO REVELO CASTILLO' in verify
          assert 'VÁLIDO HASTA' in verify
          assert "validStamp=v=>/^\\d{8}T\\d{6}$/.test(v)" in verify
          assert "if(!validCode||!validStamp(signed))" in verify
          assert 'VIGENCIA NO DISPONIBLE EN ESTE QR' in verify
          assert 'FirmaEC' in verify
          assert 'datos del paciente' in verify
          assert 'diagnóstico' not in verify.lower()
          assert 'medicamento' not in verify.lower()
          assert 'revelo_historia_' not in doctor
          print('AGENDA_AND_DIRECT_HISTORIA_SOURCE_OK')
          PY

      - name: Verificar JWKS de Agenda
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/historia-jwks.json -w '%{http_code}' --max-time 20 'https://ep-shiny-scene-a66ta52d.neonauth.us-west-2.aws.neon.tech/neondb/auth/.well-known/jwks.json')"
          python - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/historia-jwks.json',encoding='utf-8'))
          print('HISTORIA_JWKS',sys.argv[1],len(d.get('keys') or []))
          if sys.argv[1] != '200' or not d.get('keys'):
              raise SystemExit(1)
          PY

      - name: Validar canal seguro de Historia
        run: python tools/test_historia_mobile_safe_probe.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Agenda
        uses: actions/upload-pages-artifact@v4
        with:
          path: agenda
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirmar artefacto disponible para Pages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name==\"$ARTIFACT_NAME\" and .expired==false) | .id" | grep -q '[0-9]'; then
              echo 'PAGES_ARTIFACT_VISIBLE'
              exit 0
            fi
            sleep 5
          done
          echo "::error::El artefacto de Pages no está visible"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verificar HTML público después de publicar
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/index.html?_agenda_refresh=$(date +%s%N)" -o /tmp/agenda-live.html &&
              grep -Fq "function slotAllowed(d,t){const dow=new Date(d+'T12:00:00').getDay();return [3,4,5,6].includes(dow)}" /tmp/agenda-live.html &&
              grep -Fq 'function refreshAgendaDocument()' /tmp/agenda-live.html; then
              echo 'AGENDA_PUBLIC_HTML_WEDNESDAY_0800_REFRESH_OK'
              exit 0
            fi
            sleep 5
          done
          echo "::error::La agenda pública todavía no entrega el HTML actualizado"
          exit 1
