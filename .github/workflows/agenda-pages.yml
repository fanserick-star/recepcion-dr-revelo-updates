name: Publicar Agenda 24-7

on:
  push:
    branches: [main]
    paths:
      - 'agenda/**'
      - '.github/workflows/agenda-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Agenda
        uses: actions/upload-pages-artifact@v4
        with:
          path: agenda
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
