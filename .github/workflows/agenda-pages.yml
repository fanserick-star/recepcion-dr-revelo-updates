name: Publicar Agenda 24-7

on:
  push:
    branches: [main]
    paths:
      - 'agenda/**'
      - '.github/workflows/agenda-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar agenda de miércoles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          doctor=Path('agenda/index.html').read_text(encoding='utf-8')
          public=Path('agenda/agendar.html').read_text(encoding='utf-8')
          assert "['MIÉRCOLES','JUEVES','VIERNES','SÁBADO']" in doctor
          assert "dow!==3||String(t)>='10:00'" in doctor
          assert 'ALMUERZO · 12:30 – 14:00' in doctor
          assert '[3,4,5,6].includes(day)' in public
          assert 'timesForDate' in public
          assert 'Los miércoles desde las 10:00' in public
          assert "HISTORY_API='https://ep-sweet-mud-arlsk7qa.apirest.c-4.us-west-2.aws.neon.tech/neondb/rest/v1'" in doctor
          assert "historyRpc('search'" in doctor
          assert "historyRpc('patient'" in doctor
          assert 'id="tabHistory"' in doctor
          assert 'Ver historia clínica' in doctor
          assert 'HISTORIA CLÍNICA · SOLO LECTURA' in doctor
          assert 'La historia se consulta en vivo. No se guarda una copia clínica en este teléfono.' in doctor
          assert 'revelo_historia_' not in doctor
          print('AGENDA_AND_DIRECT_HISTORIA_SOURCE_OK')
          PY

      - name: Validar lectura directa de Historia
        run: python tools/test_historia_mobile_api_v2.py

      - name: Mostrar diagnóstico sanitizado de Historia
        if: always()
        shell: bash
        run: |
          if [ -f diagnostics/historia-data-api-probe.json ]; then
            cat diagnostics/historia-data-api-probe.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Agenda
        uses: actions/upload-pages-artifact@v4
        with:
          path: agenda
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
