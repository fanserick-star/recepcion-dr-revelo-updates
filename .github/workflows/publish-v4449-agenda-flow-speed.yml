name: Publish v4.4.49 agenda flow speed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4449-agenda-flow-speed.yml"

permissions:
  contents: write

concurrency:
  group: publish-v4449-agenda-flow-speed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and publish v4.4.49
        shell: pwsh
        run: |
          python build/v4449_agenda_flow_speed/publish_v4449.py
