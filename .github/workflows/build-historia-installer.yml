name: Build Historia Clinica installer bootstrap

on:
  push:
    paths:
      - "historia-clinica/installer/bootstrap.c"
      - "historia-clinica/installer/link_reception.c"
      - "historia-clinica/installer/repair_launcher.c"
      - ".github/workflows/build-historia-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native tools
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /DUNICODE /D_UNICODE /MT /Fe:Historia_Clinica_Dr_Revelo_Setup_Bootstrap.exe historia-clinica\installer\bootstrap.c user32.lib shell32.lib ole32.lib
          cl /nologo /O2 /DUNICODE /D_UNICODE /MT /Fe:Vincular_Recepcion_Historia_Bootstrap.exe historia-clinica\installer\link_reception.c user32.lib shell32.lib /link /MANIFESTUAC:"level='requireAdministrator' uiAccess='false'"
          cl /nologo /O2 /DUNICODE /D_UNICODE /MT /Fe:REPARAR_HISTORIA_CLINICA.exe historia-clinica\installer\repair_launcher.c user32.lib shell32.lib ole32.lib

      - name: Upload bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: historia-clinica-native-tools
          path: |
            Historia_Clinica_Dr_Revelo_Setup_Bootstrap.exe
            Vincular_Recepcion_Historia_Bootstrap.exe
            REPARAR_HISTORIA_CLINICA.exe
          if-no-files-found: error
          retention-days: 7
