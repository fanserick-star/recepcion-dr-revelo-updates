name: Audit Active Reception Channel
# audit refresh: Reception 4.6.3 final-helper-contract
# audit refresh: Reception 4.6.2
# audit refresh: Reception 4.6.1

on:
  push:
    paths:
      - "launcher-v1/app-channel.json"
      - ".github/workflows/audit-active-reception-channel-bytes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact channel payload and verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $channel = Get-Content "launcher-v1/app-channel.json" -Raw | ConvertFrom-Json
          Remove-Item "audit_reception" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "audit_reception" | Out-Null

          $mismatches = @()
          foreach ($item in $channel.files) {
            $rel = [string]$item.path
            $dest = Join-Path "audit_reception" ($rel -replace '/', '\')
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force $parent | Out-Null }

            if ($item.parts -and $item.parts.Count -gt 0) {
              $stream = [IO.File]::Open($dest,[IO.FileMode]::Create)
              try {
                $n = 0
                foreach ($url in $item.parts) {
                  $n++
                  $part = Join-Path $env:TEMP ("rp_audit_" + [guid]::NewGuid().ToString("N") + "_" + $n + ".bin")
                  try {
                    Invoke-WebRequest -Uri ($url + "?audit=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -OutFile $part -Headers @{"Cache-Control"="no-cache"}
                    $bytes = [IO.File]::ReadAllBytes($part)
                    $stream.Write($bytes,0,$bytes.Length)
                  } finally {
                    Remove-Item $part -Force -ErrorAction SilentlyContinue
                  }
                }
              } finally {
                $stream.Dispose()
              }
            } else {
              Invoke-WebRequest -Uri ($item.url + "?audit=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -OutFile $dest -Headers @{"Cache-Control"="no-cache"}
            }

            $got = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "AUDIT $rel EXPECTED=$($item.sha256) GOT=$got SIZE=$((Get-Item $dest).Length)"
            if ($got -ne $item.sha256) {
              $mismatches += "$rel expected=$($item.sha256) got=$got"
            }
          }

          if ($mismatches.Count -gt 0) {
            $mismatches | ForEach-Object { Write-Host $_ }
            throw "El canal de Recepción tiene SHA-256 distintos a los bytes reales."
          }

      - name: Audit runtime closure, versions and protected paths
        shell: python
        run: |
          import ast
          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path("audit_reception")
          channel = json.loads(pathlib.Path("launcher-v1/app-channel.json").read_text(encoding="utf-8-sig"))
          files = [str(x["path"]).replace("\\", "/") for x in channel.get("files", [])]
          file_set = set(files)

          assert channel.get("product") == "recepcion-dr-revelo", channel.get("product")
          version = str(channel.get("appVersion") or "").strip()
          assert version
          assert channel.get("mandatory") is True
          assert len(files) == len(file_set), "Hay rutas duplicadas en el canal"

          protected_prefixes = ("data/", "backups/", "update_backups/")
          protected_suffixes = (".db", ".sqlite", ".sqlite3", ".mdb", ".accdb", ".xls", ".xlsx")
          protected_exact = {
              ".env", "recepcionlauncher.exe", "launcherupdater.exe",
              "desinstalar_recepcion_dr_revelo.exe",
              "abrir_recepcion.py", "abrir_recepcion.pyw",
              "autoactualizar.py", "iniciar.bat",
          }
          for path in files:
              low = path.lower()
              assert path and not path.startswith("/") and ".." not in path.split("/"), path
              assert not low.startswith(protected_prefixes), path
              assert low not in protected_exact, path
              assert not low.endswith(protected_suffixes), path

          forbidden_runtime_module_patterns = (
              re.compile(r"^app_patch_\d+\.py$"),
              re.compile(r"^app_prev_\d+\.py$"),
              re.compile(r"^app_base_\d+\.py$"),
          )
          forbidden_runtime_files = [
              p for p in files
              if any(rx.match(pathlib.Path(p).name) for rx in forbidden_runtime_module_patterns)
          ]
          assert not forbidden_runtime_files, (
              "El canal reintrodujo runtime encadenado prohibido: "
              + ", ".join(sorted(forbidden_runtime_files))
          )

          for required in ("app.py", "recepcion-version.json", "update_manifest.json"):
              assert required in file_set, required
              assert (root / required).is_file(), required

          canonical = json.loads((root / "recepcion-version.json").read_text(encoding="utf-8-sig"))
          assert str(canonical.get("version") or "").strip() == version

          manifest = json.loads((root / "update_manifest.json").read_text(encoding="utf-8-sig"))
          for key in ("version", "app_version", "runtime_version"):
              assert str(manifest.get(key) or "").strip() == version, (key, manifest.get(key), version)
          assert manifest.get("mandatory") is True
          assert manifest.get("version_source") == "recepcion-version.json"
          assert manifest.get("compatibility_version_aliases") is True

          missing = [x for x in manifest.get("required_dependencies", []) if x not in file_set]
          assert not missing, "Dependencias declaradas ausentes del canal: " + ", ".join(missing)

          py_paths = [root / p for p in files if p.endswith(".py")]
          for path in py_paths:
              source = path.read_text(encoding="utf-8-sig")
              compile(source, str(path), "exec")

          local_module_patterns = (
              re.compile(r"^app_patch_\d+$"),
              re.compile(r"^app_prev_\d+$"),
              re.compile(r"^app_base_\d+$"),
          )
          explicit_local = {"historia_bridge", "historia_lan_transport"}
          declared_modules = {pathlib.Path(p).stem for p in files if p.endswith(".py")}

          app_text = (root / "app.py").read_text(encoding="utf-8-sig")
          app_tree = ast.parse(app_text, filename=str(root / "app.py"))

          def embedded_module_names(parsed_tree):
              for node in parsed_tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if (
                              isinstance(target, ast.Name)
                              and target.id == "_EMBEDDED_RUNTIME_SOURCES"
                          ):
                              value = ast.literal_eval(node.value)
                              assert isinstance(value, dict)
                              return set(value)
              return set()

          embedded_modules = embedded_module_names(app_tree)
          current_historical = {
              name for name in embedded_modules
              if any(rx.match(name) for rx in local_module_patterns)
          }

          baseline_path = pathlib.Path("updates/v4_6_0_consolidated_runtime/app.py")
          baseline_tree = ast.parse(
              baseline_path.read_text(encoding="utf-8-sig"),
              filename=str(baseline_path),
          )
          baseline_historical = {
              name for name in embedded_module_names(baseline_tree)
              if any(rx.match(name) for rx in local_module_patterns)
          }
          unexpected_historical = current_historical - baseline_historical
          assert not unexpected_historical, (
              "Se añadieron nuevas capas históricas embebidas: "
              + ", ".join(sorted(unexpected_historical))
          )

          missing_imports = []
          for path in py_paths:
              tree = ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module.split(".")[0]]
                  for name in names:
                      if any(rx.match(name) for rx in local_module_patterns):
                          if path.name != "app.py" or name not in embedded_modules:
                              missing_imports.append(
                                  f"{path.name} -> {name}.py (histórico externo)"
                              )
                          continue
                      if name == "remote_agenda":
                          if path.name != "app.py" or name not in embedded_modules:
                              missing_imports.append(
                                  f"{path.name} -> remote_agenda.py (legacy externo)"
                              )
                          continue
                      is_local = name in explicit_local
                      if is_local and name not in declared_modules:
                          missing_imports.append(f"{path.name} -> {name}.py")
          assert not missing_imports, (
              "Importaciones locales fuera del payload/embebido: "
              + "; ".join(sorted(set(missing_imports)))
          )

          inactive = {"app_patch_4513.py", "app_patch_4514.py", "app_patch_4515.py", "app_patch_4516.py"}
          assert not (inactive & file_set), "Se reintrodujeron módulos inactivos externos: " + ", ".join(sorted(inactive & file_set))

          assert 'Path(__file__).with_name("recepcion-version.json")' in app_text

          def ver_tuple(value):
              parts = re.findall(r"\d+", str(value))
              return tuple(int(x) for x in (parts + ["0","0","0"])[:3])

          if ver_tuple(version) >= (4, 6, 2):
              required_embedded_helpers = {
                  "remote_agenda",
                  "azur_client",
                  "whatsapp_client",
              }
              missing_helpers = required_embedded_helpers - embedded_modules
              assert not missing_helpers, (
                  "Faltan helpers embebidos obligatorios: "
                  + ", ".join(sorted(missing_helpers))
              )

              # Verifica no solo que existan, sino que AZUR y WhatsApp sean
              # exactamente las implementaciones auditadas que originaron 4.6.2.
              embedded_source_map = {}
              for node in app_tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if (
                              isinstance(target, ast.Name)
                              and target.id == "_EMBEDDED_RUNTIME_SOURCES"
                          ):
                              embedded_source_map = ast.literal_eval(node.value)
              assert isinstance(embedded_source_map, dict)

              helper_hash_contract = {
                  "azur_client": str(
                      manifest.get("notes", {}).get("azur_source_sha256") or ""
                  ).strip().lower(),
                  "whatsapp_client": str(
                      manifest.get("notes", {}).get("whatsapp_source_sha256") or ""
                  ).strip().lower(),
              }
              for helper_name, expected_hash in helper_hash_contract.items():
                  assert len(expected_hash) == 64, (
                      f"Falta hash contractual de {helper_name}"
                  )
                  source = embedded_source_map[helper_name]
                  got_hash = hashlib.sha256(source.encode("utf-8")).hexdigest()
                  assert got_hash == expected_hash, (
                      f"{helper_name} embebido no coincide con el helper auditado: "
                      f"{got_hash} != {expected_hash}"
                  )

              prereq = {
                  str(x).strip().lower()
                  for x in manifest.get("installation_prerequisites", [])
              }
              forbidden_external = {
                  "remote_agenda.py",
                  "azur_client.py",
                  "whatsapp_client.py",
              } & prereq
              assert not forbidden_external, (
                  "El canal volvió a declarar helpers externos: "
                  + ", ".join(sorted(forbidden_external))
              )

          print(f"OK Recepción {version}: {len(files)} archivos, {len(py_paths)} módulos Python.")
          print(f"Dependencias activas declaradas: {len(manifest.get('required_dependencies', []))}.")
          print(f"Capas históricas embebidas heredadas: {len(current_historical)}; nuevas: 0.")
          print("No hay rutas protegidas ni dependencias históricas externas.")

      - name: Publish audit summary
        shell: pwsh
        run: |
          $channel = Get-Content "launcher-v1/app-channel.json" -Raw | ConvertFrom-Json
          $manifest = Get-Content "audit_reception/update_manifest.json" -Raw | ConvertFrom-Json
          @"
          ## Auditoría automática de Recepción
          - Versión: **$($channel.appVersion)**
          - Archivos verificados byte por byte: **$($channel.files.Count)**
          - Dependencias activas declaradas: **$($manifest.required_dependencies.Count)**
          - SHA-256: **OK**
          - Cierre de imports del runtime: **OK**
          - Rutas protegidas: **OK**
          - Fuente única de versión: **OK**
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
