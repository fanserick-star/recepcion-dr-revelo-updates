name: Audit Active Reception Channel

on:
  push:
    branches:
      - audit/consolidated-runtime-460
    paths:
      - "updates/v4_6_0_consolidated_candidate/**"
      - ".github/workflows/audit-active-reception-channel-bytes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidated_candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reception dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check fastapi uvicorn sqlalchemy pydantic python-dotenv pg8000 "psycopg[binary]" python-multipart openpyxl

      - name: Compare stable 4.5.48 with consolidated 4.6.0
        shell: pwsh
        run: python updates/v4_6_0_consolidated_candidate/test_candidate.py
