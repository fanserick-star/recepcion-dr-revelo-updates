name: Audit Active Reception Channel
# Validates both legacy embedded runtime and definitive physical runtime.

on:
  push:
    paths:
      - "launcher-v1/app-channel.json"
      - ".github/workflows/audit-active-reception-channel-bytes.yml"
      - "tools/validate_reception_runtime_layout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact channel payload and verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $channel = Get-Content "launcher-v1/app-channel.json" -Raw | ConvertFrom-Json
          Remove-Item "audit_reception" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "audit_reception" | Out-Null
          $mismatches = @()
          foreach ($item in $channel.files) {
            $rel = [string]$item.path
            $dest = Join-Path "audit_reception" ($rel -replace '/', '\')
            $parent = Split-Path -Parent $dest
            if ($parent) { New-Item -ItemType Directory -Force $parent | Out-Null }
            if ($item.parts -and $item.parts.Count -gt 0) {
              $stream = [IO.File]::Open($dest,[IO.FileMode]::Create)
              try {
                foreach ($url in $item.parts) {
                  $part = Join-Path $env:TEMP ("rp_audit_" + [guid]::NewGuid().ToString("N") + ".bin")
                  try {
                    Invoke-WebRequest -Uri ($url + "?audit=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -OutFile $part -Headers @{"Cache-Control"="no-cache"}
                    $bytes = [IO.File]::ReadAllBytes($part)
                    $stream.Write($bytes,0,$bytes.Length)
                  } finally { Remove-Item $part -Force -ErrorAction SilentlyContinue }
                }
              } finally { $stream.Dispose() }
            } else {
              Invoke-WebRequest -Uri ($item.url + "?audit=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -OutFile $dest -Headers @{"Cache-Control"="no-cache"}
            }
            $got = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "AUDIT $rel EXPECTED=$($item.sha256) GOT=$got SIZE=$((Get-Item $dest).Length)"
            if ($got -ne $item.sha256) { $mismatches += "$rel expected=$($item.sha256) got=$got" }
          }
          if ($mismatches.Count -gt 0) {
            $mismatches | ForEach-Object { Write-Host $_ }
            throw "El canal de Recepción tiene SHA-256 distintos a los bytes reales."
          }

      - name: Audit channel metadata and manifest closure
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path('audit_reception')
          channel = json.loads(pathlib.Path('launcher-v1/app-channel.json').read_text(encoding='utf-8-sig'))
          files = [str(x['path']).replace('\\','/') for x in channel.get('files', [])]
          file_set = set(files)
          assert channel.get('product') == 'recepcion-dr-revelo'
          version = str(channel.get('appVersion') or '').strip()
          assert version and channel.get('mandatory') is True
          assert len(files) == len(file_set), 'Hay rutas duplicadas en el canal'

          protected_prefixes = ('data/', 'backups/', 'update_backups/')
          protected_suffixes = ('.db','.sqlite','.sqlite3','.mdb','.accdb','.xls','.xlsx')
          protected_exact = {
              '.env','recepcionlauncher.exe','launcherupdater.exe',
              'desinstalar_recepcion_dr_revelo.exe','abrir_recepcion.py',
              'abrir_recepcion.pyw','autoactualizar.py','iniciar.bat',
          }
          for path in files:
              low = path.lower()
              assert path and not path.startswith('/') and '..' not in path.split('/'), path
              assert not low.startswith(protected_prefixes), path
              assert low not in protected_exact, path
              assert not low.endswith(protected_suffixes), path
              assert (root / path).is_file(), path

          canonical = json.loads((root/'recepcion-version.json').read_text(encoding='utf-8-sig'))
          assert str(canonical.get('version') or '').strip() == version
          manifest = json.loads((root/'update_manifest.json').read_text(encoding='utf-8-sig'))
          for key in ('version','app_version','runtime_version'):
              assert str(manifest.get(key) or '').strip() == version, (key, manifest.get(key), version)
          assert manifest.get('mandatory') is True
          assert manifest.get('version_source') == 'recepcion-version.json'
          assert manifest.get('compatibility_version_aliases') is True
          manifest_copy = {str(x).replace('\\','/') for x in manifest.get('copy', [])}
          assert manifest_copy == file_set, (
              'Canal != manifest.copy', sorted(manifest_copy-file_set), sorted(file_set-manifest_copy)
          )
          missing = {str(x).replace('\\','/') for x in manifest.get('required_dependencies', [])} - file_set
          assert not missing, 'Dependencias ausentes: ' + ', '.join(sorted(missing))
          print('CHANNEL MANIFEST CLOSURE OK', version, len(files))

      - name: Audit runtime layout in downloaded payload
        shell: pwsh
        run: |
          python tools/validate_reception_runtime_layout.py audit_reception --baseline-app updates/v4_6_0_consolidated_runtime/app.py

      - name: Audit helper hash contract and Historia LAN uniqueness
        shell: python
        run: |
          import ast, hashlib, json, pathlib, re
          root = pathlib.Path('audit_reception')
          manifest = json.loads((root/'update_manifest.json').read_text(encoding='utf-8-sig'))
          version = str(manifest.get('version') or '').strip()
          app_text = (root/'app.py').read_text(encoding='utf-8-sig')
          app_tree = ast.parse(app_text)

          embedded = {}
          for node in app_tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == '_EMBEDDED_RUNTIME_SOURCES'
                  for t in node.targets
              ):
                  embedded = ast.literal_eval(node.value)
                  break
          assert isinstance(embedded, dict)

          notes = manifest.get('notes') or {}
          contracts = {
              'azur_client': str(notes.get('azur_source_sha256') or '').strip().lower(),
              'whatsapp_client': str(notes.get('whatsapp_source_sha256') or '').strip().lower(),
          }
          for helper, expected in contracts.items():
              assert len(expected) == 64, f'Falta hash contractual de {helper}'
              if embedded:
                  source = embedded.get(helper)
                  assert isinstance(source, str) and source, helper
                  got = hashlib.sha256(source.lstrip('\ufeff').encode('utf-8')).hexdigest()
              else:
                  path = root / f'{helper}.py'
                  assert path.is_file(), path
                  got = hashlib.sha256(path.read_bytes()).hexdigest()
              assert got == expected, f'{helper}: {got} != {expected}'

          def ver_tuple(value):
              parts = re.findall(r'\d+', str(value))
              return tuple(int(x) for x in (parts + ['0','0','0'])[:3])
          if ver_tuple(version) >= (4,6,4):
              lan = root/'historia_lan_transport.py'
              assert lan.is_file(), lan
              tree = ast.parse(lan.read_text(encoding='utf-8-sig'))
              defs = [n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
              for name in ('_payload','hybrid_queue_attention'):
                  assert defs.count(name) == 1, f'{name}: definiciones={defs.count(name)}'
          print('HELPER HASH + LAN CONTRACT OK', 'embedded' if embedded else 'physical')

      - name: Publish audit summary
        shell: pwsh
        run: |
          $channel = Get-Content "launcher-v1/app-channel.json" -Raw | ConvertFrom-Json
          $manifest = Get-Content "audit_reception/update_manifest.json" -Raw | ConvertFrom-Json
          @"
          ## Auditoría automática de Recepción
          - Versión: **$($channel.appVersion)**
          - Archivos verificados byte por byte: **$($channel.files.Count)**
          - Dependencias activas declaradas: **$($manifest.required_dependencies.Count)**
          - SHA-256: **OK**
          - Cierre del payload/manifiesto: **OK**
          - Runtime embebido o físico: **OK**
          - Hash de helpers críticos: **OK**
          - Rutas protegidas: **OK**
          - Fuente única de versión: **OK**
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
