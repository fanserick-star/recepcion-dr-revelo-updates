name: Inspect v4.3.65 targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v465.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer snippets finales
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          parts=sorted((root/'updates'/'v464').glob('app.part*'), key=lambda p:int(p.name.split('part')[-1]))
          s=b''.join(p.read_bytes() for p in parts).decode('utf-8')
          terms=['historical_last_visit_date','historical_last_year','ultima_atencion','Histórico 2020','Historial 2020','Cola de fact','cola de fact','/api/billing/next','/api/billing/queue','billingNext','loadBilling','renderBilling','/api/agenda/week','loadAgendaWeek','renderAgendaWeek','function loadAgenda','function renderAgenda']
          for term in terms:
            print('\n### TERM',term)
            low=s.lower(); t=term.lower(); start=0; count=0
            while True:
              pos=low.find(t,start)
              if pos<0: break
              count+=1
              a=max(0,pos-1200);b=min(len(s),pos+2600)
              print(f'--- OCC {count} POS {pos} ---')
              print(s[a:b])
              start=pos+len(t)
            print('COUNT',count)
          PY
