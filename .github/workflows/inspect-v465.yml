name: Inspect v4.3.65 targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v465.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir v4.3.64 y localizar bloques
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          root=Path('.')
          parts=sorted((root/'updates'/'v464').glob('app.part*'), key=lambda p:int(p.name.split('part')[-1]))
          s=b''.join(p.read_bytes() for p in parts).decode('utf-8')
          lines=s.splitlines()
          print('APP_LINES',len(lines),'APP_BYTES',len(s.encode('utf-8')))

          def show(a,b,title):
            print('\n===',title,'===')
            for j in range(a-1,min(len(lines),b)): print(f'{j+1}: {lines[j]}')
          show(810,885,'HISTORICAL SUMMARY')
          show(4815,4855,'PATIENT DETAIL / ATENDER')
          show(6200,6275,'AGENDA RECENT + LIST')
          show(6400,6615,'AGENDA DETAIL/WEEK/DASHBOARD/SLOTS')
          show(7900,8160,'BILLING BACKEND')

          print('\n=== STRING ASSIGNMENTS / UI SNIPPETS ===')
          tree=ast.parse(s)
          terms=['cola de fact','facturaci','atender','última cita','ultima cita','última atención','ultima atencion','agenda','/api/agenda/week','/api/agenda/appointments']
          for node in tree.body:
            if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name):
              try: val=ast.literal_eval(node.value)
              except Exception: continue
              if not isinstance(val,str): continue
              low=val.lower()
              hits=[]
              for term in terms:
                pos=low.find(term.lower())
                if pos>=0: hits.append((term,pos))
              if not hits: continue
              print(f'ASSIGN {node.targets[0].id} LEN {len(val)}')
              for term,pos in hits:
                a=max(0,pos-900); b=min(len(val),pos+1800)
                print(f'--- {term} @ {pos} ---')
                print(val[a:b].replace('\r',''))
          PY
