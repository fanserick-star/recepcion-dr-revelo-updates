name: Inspect v4.3.65 targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v465.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar UI facturación y shell
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          parts=sorted((root/'updates'/'v464').glob('app.part*'), key=lambda p:int(p.name.split('part')[-1]))
          s=b''.join(p.read_bytes() for p in parts).decode('utf-8')
          low=s.lower()
          terms=['/api/billing','facturación','facturacion','pending-count','billing/next','siguiente','cola','id="billing','id=\'billing','data-section="billing','htmlresponse','staticfiles','index.html','frontend','web/index']
          for term in terms:
            print('\n### TERM',term)
            t=term.lower();start=0;count=0
            while True:
              pos=low.find(t,start)
              if pos<0:break
              count+=1
              print(f'--- OCC {count} POS {pos} ---')
              print(s[max(0,pos-1800):min(len(s),pos+4200)])
              start=pos+max(1,len(t))
            print('COUNT',count)
          print('\n### FILE TREE LIKELY FRONTEND')
          for p in root.rglob('*'):
            if p.is_file() and p.suffix.lower() in {'.html','.js','.css'}:
              print(p.as_posix(),p.stat().st_size)
          PY
