name: Build Consultorio Master Installer

on:
  push:
    paths:
      - "master-installer/**"
      - ".github/workflows/build-consultorio-master-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @(
            'master-installer/bootstrap.ps1',
            'master-installer/provision.ps1',
            'master-installer/build-icon.ps1',
            'master-installer/tests/test-provision.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error (('{0}: {1}' -f $script,$_.Message)) }
              exit 1
            }
          }

      - name: Validate encrypted private bundle
        shell: pwsh
        run: |
          $text = Get-Content 'master-installer/private-config.bundle.json' -Raw
          $forbidden = @(
            ('postgres' + 'ql://'),
            ('AZUR_' + 'API_KEY='),
            ('MOBILE_' + 'DOCTOR_TOKEN='),
            ('MOBILE_' + 'RECEPTION_TOKEN='),
            ('npg' + '_')
          )
          foreach ($needle in $forbidden) {
            if ($text.Contains($needle)) { throw "Se detectó material privado sin cifrar." }
          }
          $bundle = $text | ConvertFrom-Json
          if ($bundle.format -ne 'dr-revelo-config-v1') { throw 'Formato de bundle inesperado.' }
          if ([int]$bundle.iterations -lt 150000) { throw 'KDF demasiado débil.' }
          if ([string]::IsNullOrWhiteSpace([string]$bundle.hmac_sha256_b64)) { throw 'Falta HMAC.' }
          'PRIVATE_BUNDLE_STATIC_CHECK_OK'

      - name: Test encrypted provisioning on Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'master-installer/tests/test-provision.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean-install smoke test
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'master-installer/bootstrap.ps1' -Reception -Historia
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            'C:\Recepcion Dr Revelo\app.py',
            'C:\Recepcion Dr Revelo\.venv\Scripts\python.exe',
            'C:\Recepcion Dr Revelo\RecepcionLauncher.exe',
            'C:\Historia Clinica Dr Revelo\app.py',
            'C:\Historia Clinica Dr Revelo\.venv\Scripts\python.exe',
            'C:\Historia Clinica Dr Revelo\HistoriaClinicaLauncher.exe'
          )
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path)) { throw "Falta: $path" } }
          & 'C:\Recepcion Dr Revelo\.venv\Scripts\python.exe' -c "import fastapi,uvicorn,sqlalchemy,dotenv,pg8000,multipart;print('reception-deps-ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Historia Clinica Dr Revelo\.venv\Scripts\python.exe' -c "import fastapi,uvicorn,pg8000,webview;print('historia-deps-ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate master icon
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'master-installer/build-icon.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build lightweight master EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe no encontrado.' }
          & $iscc 'master-installer/ConsultorioDrRevelo.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'master-installer/output/INSTALAR_CONSULTORIO_DR_REVELO.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  INSTALAR_CONSULTORIO_DR_REVELO.exe" | Set-Content 'master-installer/output/SHA256SUMS.txt' -Encoding ascii
          $size = (Get-Item $exe).Length
          "Installer bytes: $size"
          if ($size -gt 15728640) { throw "Instalador mayor a 15 MiB: $size" }

      - name: Smoke-test compiled EXE and preservation
        shell: powershell
        run: |
          $recEnv='C:\Recepcion Dr Revelo\.env'; $histEnv='C:\Historia Clinica Dr Revelo\.env'
          $recMarker='C:\Recepcion Dr Revelo\data\installer-preserve-test.txt'; $histMarker='C:\Historia Clinica Dr Revelo\data\installer-preserve-test.txt'
          New-Item -ItemType Directory -Force (Split-Path $recMarker),(Split-Path $histMarker) | Out-Null
          'INSTALLER_PRESERVE_TEST=recepcion' | Set-Content -LiteralPath $recEnv -Encoding ascii
          'INSTALLER_PRESERVE_TEST=historia' | Set-Content -LiteralPath $histEnv -Encoding ascii
          'recepcion-data-ok' | Set-Content -LiteralPath $recMarker -Encoding ascii
          'historia-data-ok' | Set-Content -LiteralPath $histMarker -Encoding ascii
          $exe=(Resolve-Path 'master-installer/output/INSTALAR_CONSULTORIO_DR_REVELO.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS=recepcion,historia','/SKIPPROVISIONING=1') -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "EXE devolvió $($p.ExitCode)" }
          if ((Get-Content $recEnv -Raw).Trim() -ne 'INSTALLER_PRESERVE_TEST=recepcion') { throw 'Recepción modificó .env.' }
          if ((Get-Content $histEnv -Raw).Trim() -ne 'INSTALLER_PRESERVE_TEST=historia') { throw 'Historia modificó .env.' }
          if ((Get-Content $recMarker -Raw).Trim() -ne 'recepcion-data-ok') { throw 'Recepción modificó data/.' }
          if ((Get-Content $histMarker -Raw).Trim() -ne 'historia-data-ok') { throw 'Historia modificó data/.' }

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: instalador-maestro-consultorio-auto-config-${{ github.sha }}
          path: |
            master-installer/output/INSTALAR_CONSULTORIO_DR_REVELO.exe
            master-installer/output/SHA256SUMS.txt
            master-installer/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish production release only from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='consultorio-installer-v2.1.0'
          $exe='master-installer/output/INSTALAR_CONSULTORIO_DR_REVELO.exe'
          $sums='master-installer/output/SHA256SUMS.txt'
          $readme='master-installer/README.txt'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title 'Instalador Maestro Consultorio v2.1.0' --notes 'Instalador online con configuración privada automática y verificación de Neon.' }
          gh release upload $tag $exe $sums $readme --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
